scope_count: 0
note: 'Benchling defines NO OAuth scopes — confirmed twice over. The clientCredentials flow declares an
  empty `scopes: {}` object in both the v2 and the v3 OpenAPI, and the authentication docs state the model
  plainly: "anything a user has permission to do through the UI, the user''s API Key or OIDC token or
  application''s OAuth Bearer token has permission to do through the API." Authorization is membership-based,
  not scope-based.'
authorization_model:
  mechanism: organization / team / project membership
  principals:
  - user (API key or OIDC id token)
  - Benchling App (service principal, client credentials)
  default_app_access: A newly created app belongs to no organization, team or project and can access NO
    data until an admin grants it membership.
  revocation:
    suspended_user: Suspending a user in Benchling invalidates their API key. Suspending them only in
      the IdP does NOT.
    archived_app: Archiving an app blocks API access; unarchiving restores it without a new client secret.
    note: If a suspended user held an app's credentials, rotate the app client secret — apps are not tied
      to a user and are not suspended with them.
  docs: https://docs.benchling.com/docs/authentication
