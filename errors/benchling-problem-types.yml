  with the required members type, title, detail, status and instance — from a small set of shared components.responses
  reused across all 874 operations. The older v2 API returns a Benchling-proprietary envelope, {"error":
  {"message", "type", "userMessage"}}, which is what the rate-limit and authentication docs show. Clients
  that talk to both must parse both.'
