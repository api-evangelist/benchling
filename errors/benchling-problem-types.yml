      title: string|null — short, human-readable summary
      detail: string|object|null — explanation specific to this occurrence
      status: integer — HTTP status code
      instance: string — identifier for this occurrence
    variant:
      schema: InternalServerError
      note: 500 responses add an `errorId` member for support correlation.
