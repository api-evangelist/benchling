        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    DataFrameColumn:
      description: 'Defines a column within a DataFrame, including its internal system name, user-facing

        display name, and data type specification.'
      properties:
        __typename:
          type: string
        displayName:
          type: string
        systemName:
          type: string
        type:
          type: object
      type: object
    AutomationTemplateRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    GeneralError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    AutomationTemplateDataFrameVariable:
      description: 'Defines a data frame placeholder within an AutomationTemplate that users must provide when

        applying the template. Each variable specifies which AutomationStep input (replaceStep,

        replaceStepData, replaceStepDataIndex) will receive the user-provided data frame. The

        replaceDataFrameColumnsSpec field defines the expected column structure that the provided

        data must match. When users apply an automation template to create an Analysis, they provide

        bindings that map actual data frames to these variables, populating the template''s pipeline

        with real data.'
      properties:
        __typename:
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        createdAt:
          format: datetime
          type: string
        description:
          type: string
        id:
          type: string
        modifiedAt:
          format: datetime
          type: string
        name:
          type: string
        replaceDataFrameColumnsSpec:
          description: Expected column structure that the provided DataFrame must match.
          items:
            $ref: '#/components/schemas/DataFrameColumn'
          type: array
        replaceStep:
          $ref: '#/components/schemas/AutomationStepRef'
          description: The AutomationStep whose input will be replaced by the bound DataFrame.
        replaceStepData:
          $ref: '#/components/schemas/AutomationStepDataRef'
          description: The specific AutomationStepData slot on the step that receives the bound DataFrame.
        replaceStepDataIndex:
          description: The index within the step data slot where the bound DataFrame is placed.
          type: integer
        template:
          $ref: '#/components/schemas/AutomationTemplateRef'
      type: object
    AutomationStepDataRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    InternalServerError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        errorId:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    AutomationStepRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
  responses:
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsError'
      description: Too Many Requests
      headers:
        Retry-After:
          description: Minimum number of seconds to wait before retrying. Only included when the request exceeded a rate limit specific to the caller. Limits shared with other callers, such as tenant-wide limits, omit this header because the wait depends on their traffic.
          required: false
          schema:
            minimum: 1
            type: integer
    BadRequest:
