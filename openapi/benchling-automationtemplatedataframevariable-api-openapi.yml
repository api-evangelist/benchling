openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Automation Template Data Frame Variable API
  version: 2.0.0
  description: 'Defines a data frame placeholder within an AutomationTemplate that users must provide when

    applying the template. Each variable specifies which AutomationStep input (replaceStep,

    replaceStepData, replaceStepDataIndex) will receive the user-provided data frame. The

    replaceDataFrameColumnsSpec field defines the expected column structure that the provided

    data must match. When users apply an automation template to create an Analysis, they provide

    bindings that map actual data frames to these variables, populating the template''s pipeline

    with real data.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'Defines a data frame placeholder within an AutomationTemplate that users must provide when

    applying the template. Each variable specifies which AutomationStep input (replaceStep,

    replaceStepData, replaceStepDataIndex) will receive the user-provided data frame. The

    replaceDataFrameColumnsSpec field defines the expected column structure that the provided

    data must match. When users apply an automation template to create an Analysis, they provide

    bindings that map actual data frames to these variables, populating the template''s pipeline

    with real data.'
  name: AutomationTemplateDataFrameVariable
  x-bnch-organization: Benchling
  x-displayName: Automation Template Data Frame Variable
paths:
  /automation-template-data-frame-variable/{automation_template_data_frame_variable_id}:
    get:
      description: Get a single AutomationTemplateDataFrameVariable by ID.
      operationId: AutomationTemplateDataFrameVariable.Get
      parameters:
      - description: ID of the AutomationTemplateDataFrameVariable.
        in: path
        name: automation_template_data_frame_variable_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationTemplateDataFrameVariable'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get AutomationTemplateDataFrameVariable by ID
      tags:
      - AutomationTemplateDataFrameVariable
