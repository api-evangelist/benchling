openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Workflow Output Schema API
  version: 2.0.0
  description: 'Defines the structure of `WorkflowOutput` instances produced by tasks of a given

    `WorkflowTaskSchema`. Each output schema specifies `fieldDefinitions` for the data to

    be captured, an optional `prefix` for human-readable output IDs, and a `name` for

    identification. Output schemas belong to an `Organization` and are linked to their parent

    `workflowTaskSchema`. In flowcharts, output schemas can define data that flows between nodes.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'Defines the structure of `WorkflowOutput` instances produced by tasks of a given

    `WorkflowTaskSchema`. Each output schema specifies `fieldDefinitions` for the data to

    be captured, an optional `prefix` for human-readable output IDs, and a `name` for

    identification. Output schemas belong to an `Organization` and are linked to their parent

    `workflowTaskSchema`. In flowcharts, output schemas can define data that flows between nodes.'
  name: WorkflowOutputSchema
  x-bnch-organization: Benchling
  x-displayName: Workflow Output Schema
paths:
  /workflow-output-schema/items:
    get:
      description: List WorkflowOutputSchema items.
      operationId: WorkflowOutputSchema.List
      parameters:
      - $ref: '#/components/parameters/archiveReason.anyOf'
      - $ref: '#/components/parameters/archived.anyOf'
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/modifiedAt.gt'
      - $ref: '#/components/parameters/modifiedAt.gte'
      - $ref: '#/components/parameters/modifiedAt.lt'
      - $ref: '#/components/parameters/modifiedAt.lte'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/returning'
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first) and modifiedAt (modified time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is modifiedAt:desc.'
        in: query
        name: sort
        schema:
          default: modifiedAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          - modifiedAt:asc
          - modifiedAt:desc
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowOutputSchemaPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List WorkflowOutputSchema items
      tags:
      - WorkflowOutputSchema
  /workflow-output-schema/{workflow_output_schema_id}:
    get:
      description: Get a single WorkflowOutputSchema by ID.
      operationId: WorkflowOutputSchema.Get
      parameters:
      - description: ID of the WorkflowOutputSchema.
        in: path
        name: workflow_output_schema_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowOutputSchema'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get WorkflowOutputSchema by ID
      tags:
      - WorkflowOutputSchema
  /workflow-output-schema/{workflow_output_schema_id}/field-definitions/items:
    get:
      description: List SchemaFieldDefinition items.
      operationId: WorkflowOutputSchema.fieldDefinitions.List
      parameters:
      - description: ID of the WorkflowOutputSchema.
        in: path
        name: workflow_output_schema_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/archived.anyOf'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaFieldDefinitionUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List SchemaFieldDefinition items
      tags:
      - WorkflowOutputSchema
