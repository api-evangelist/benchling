openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Scratch File API
  version: 2.0.0
  description: 'A ScratchFile represents raw file content used as intermediate input or output of

    pipeline steps (see AutomationStepData). Unlike File, ScratchFiles are not surfaced

    in the Data Catalog because they typically represent transient processing artifacts

    rather than standalone valuable data. When a ScratchFile is promoted to user-visible

    status, it is linked to a File object that appears in the Data Catalog. The

    originAutomationStepData field tracks which pipeline step produced this file.


    To upload content, create a ScratchFile; it starts with uploadStatus NOT_UPLOADED and

    returns a presigned uploadUrl. PUT the file''s bytes to uploadUrl, then update the

    ScratchFile with uploadStatus SUCCEEDED to finalize the upload. Finalizing verifies the

    content was uploaded (up to 5GB) and makes it available via downloadUrl; uploadUrl is

    only returned until the upload is finalized. If the upload cannot be completed, leave the

    ScratchFile unfinalized; it remains NOT_UPLOADED. Alternatively, use the create-and-upload

    method to create and finalize a ScratchFile in one request.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'A ScratchFile represents raw file content used as intermediate input or output of

    pipeline steps (see AutomationStepData). Unlike File, ScratchFiles are not surfaced

    in the Data Catalog because they typically represent transient processing artifacts

    rather than standalone valuable data. When a ScratchFile is promoted to user-visible

    status, it is linked to a File object that appears in the Data Catalog. The

    originAutomationStepData field tracks which pipeline step produced this file.


    To upload content, create a ScratchFile; it starts with uploadStatus NOT_UPLOADED and

    returns a presigned uploadUrl. PUT the file''s bytes to uploadUrl, then update the

    ScratchFile with uploadStatus SUCCEEDED to finalize the upload. Finalizing verifies the

    content was uploaded (up to 5GB) and makes it available via downloadUrl; uploadUrl is

    only returned until the upload is finalized. If the upload cannot be completed, leave the

    ScratchFile unfinalized; it remains NOT_UPLOADED. Alternatively, use the create-and-upload

    method to create and finalize a ScratchFile in one request.'
  name: ScratchFile
  x-bnch-organization: Benchling
  x-displayName: Scratch File
paths:
  /scratch-file:
    post:
      description: Create ScratchFile.
      operationId: ScratchFile.Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScratchFileInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScratchFile'
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create ScratchFile
      tags:
      - ScratchFile
  /scratch-file/{scratch_file_id}:
    get:
      description: Get a single ScratchFile by ID.
      operationId: ScratchFile.Get
      parameters:
      - description: ID of the ScratchFile.
        in: path
        name: scratch_file_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScratchFile'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get ScratchFile by ID
      tags:
      - ScratchFile
    patch:
      description: Update ScratchFile.
      operationId: ScratchFile.Update
      parameters:
      - description: ID of the ScratchFile.
        in: path
        name: scratch_file_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScratchFileInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScratchFile'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Update ScratchFile
      tags:
      - ScratchFile
  /scratch-file:batch-create:
    post:
      description: Batch create ScratchFile synchronously in one transaction. Maximum 25 items per request.
      operationId: ScratchFile.BatchCreate
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/CreateScratchFileInput'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/ScratchFile'
                    type: array
                required:
                - items
                type: object
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch create ScratchFile
      tags:
      - ScratchFile
  /scratch-file:batch-update:
    patch:
      description: Batch update ScratchFile synchronously in one transaction. Maximum 25 items per request.
      operationId: ScratchFile.BatchUpdate
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/UpdateScratchFileInputWithPathParams'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/ScratchFile'
                    type: array
                required:
                - items
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch update ScratchFile
      tags:
      - ScratchFile
  /scratch-file:bulk-create:
    post:
      description: Bulk create ScratchFile.
      operationId: ScratchFile.BulkCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk create ScratchFile
      tags:
      - ScratchFile
  /scratch-file:bulk-update:
    patch:
      description: Bulk update ScratchFile.
      operationId: ScratchFile.BulkUpdate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk update ScratchFile
      tags:
      - ScratchFile
  /scratch-file:create-and-upload:
    post:
      description: Create a ScratchFile from either uploaded contents or an existing S3 location. Provide exactly one of `contents` (with a `filename`, up to 10 MiB of UTF-8 sent as an `application/json` body) or `s3Location` (the filename is derived from the location when omitted).
      operationId: ScratchFile.CreateAndUpload
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAndUploadScratchFileInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScratchFile'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create and upload a ScratchFile
      tags:
      - ScratchFile
components:
  responses:
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsError'
      description: Too Many Requests
      headers:
        Retry-After:
          description: Minimum number of seconds to wait before retrying. Only included when the request exceeded a rate limit specific to the caller. Limits shared with other callers, such as tenant-wide limits, omit this header because the wait depends on their traffic.
          required: false
          schema:
            minimum: 1
            type: integer
    InternalServerError:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
      description: Internal Server Error
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Not Found
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Conflict
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Bad Request
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Forbidden
  schemas:
    InternalServerError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        errorId:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    AsyncTaskLink:
      properties:
        pollingUri:
          format: uri
          type: string
        taskId:
          type: string
      type: object
    TooManyRequestsError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    UpdateScratchFileInput:
      additionalProperties: false
      properties:
        uploadStatus:
          enum:
          - SUCCEEDED
          type: string
      required:
      - uploadStatus
      type: object
    GeneralError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    AutomationStepDataRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    FileRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    CreateScratchFileInput:
      additionalProperties: false
      properties:
        filename:
          type: string
        name:
          type: string
      required:
      - filename
      type: object
    BulkImport:
      example:
        fileId: scrfile_jdf8BV24kLmN
      properties:
        fileId:
          description: The API ID of the scratch file (`scrfile_XXXXXXXX`) containing the items to import. The referenced file must be a scratch file whose upload has completed successfully.
          type: string
      required:
      - fileId
      type: object
    PrincipalRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ScratchFile:
      description: 'A ScratchFile represents raw file content used as intermediate input or output of

        pipeline steps (see AutomationStepData). Unlike File, ScratchFiles are not surfaced

        in the Data Catalog because they typically represent transient processing artifacts

        rather than standalone valuable data. When a ScratchFile is promoted to user-visible

        status, it is linked to a File object that appears in the Data Catalog. The

        originAutomationStepData field tracks which pipeline step produced this file.


        To upload content, create a ScratchFile; it starts with uploadStatus NOT_UPLOADED and

        returns a presigned uploadUrl. PUT the file''s bytes to uploadUrl, then update the

        ScratchFile with uploadStatus SUCCEEDED to finalize the upload. Finalizing verifies the

        content was uploaded (up to 5GB) and makes it available via downloadUrl; uploadUrl is

        only returned until the upload is finalized. If the upload cannot be completed, leave the

        ScratchFile unfinalized; it remains NOT_UPLOADED. Alternatively, use the create-and-upload

        method to create and finalize a ScratchFile in one request.'
      properties:
        __typename:
          type: string
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        creator:
          $ref: '#/components/schemas/PrincipalRef'
        downloadUrl:
          type:
          - 'null'
          - string
        errorMessage:
          type:
          - 'null'
          - string
        externalFileId:
          type:
          - 'null'
          - string
        file:
          oneOf:
          - $ref: '#/components/schemas/FileRef'
          - type: 'null'
        filename:
          type: string
        id:
          type: string
        mimeType:
          type:
          - 'null'
          - string
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          type: string
        originAutomationStepData:
          description: The automation step data that produced this file.
          oneOf:
          - $ref: '#/components/schemas/AutomationStepDataRef'
          - type: 'null'
        originPipelineStepData:
          deprecated: true
          description: Use originAutomationStepData instead.
          oneOf:
          - $ref: '#/components/schemas/AutomationStepDataRef'
          - type: 'null'
        size:
          type:
          - 'null'
          - integer
        uploadStatus:
          enum:
          - SUCCEEDED
          - FAILED_VALIDATION
          - IN_PROGRESS
          - NOT_UPLOADED
          type: string
        uploadUrl:
          type:
          - 'null'
          - string
      type: object
    CreateAndUploadScratchFileInput:
      additionalProperties: false
      properties:
        contents:
          type: string
        filename:
          type: string
        s3Location:
          type: string
      type: object
    UpdateScratchFileInputWithPathParams:
      additionalProperties: false
      properties:
        id:
          type: string
        uploadStatus:
          enum:
          - SUCCEEDED
          type: string
      required:
      - id
      - uploadStatus
      type: object
  parameters:
    returning:
      description: Comma-separated list of top-level fields to include in each returned item. Cannot overlap with omit.
      explode: false
      in: query
      name: returning
      schema:
        items:
          type: string
        type: array
    omit:
      description: Comma-separated list of top-level fields to omit from each returned item. Cannot overlap with returning.
      explode: false
      in: query
      name: omit
      schema:
        items:
          type: string
        type: array
  securitySchemes:
    BearerAuth:
      description: Use a short-lived V3 API Explorer token.
      scheme: bearer
      type: http
      x-fern-playground-description: Copy a short-lived V3 API Explorer token from the user's settings page
    basicApiKeyAuth:
      description: Use issued API key for standard access to the API
      scheme: basic
      type: http
    basicClientIdSecretAuth:
      description: Auth used as part of client credentials OAuth flow prior to receiving a bearer token.
      scheme: basic
      type: http
    oAuth:
      description: OAuth2 Client Credentials flow intended for service access
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: /oauth/token
      type: oauth2
