openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Unit Type API
  version: 2.0.0
  description: 'A UnitType is a dimensional category that groups inter-convertible `Unit` objects

    within Benchling''s tenant-specific unit dictionary. Examples include Volume, Mass,

    Time, Molar Concentration, and custom types like Cell Concentration. Each UnitType

    has a designated `baseUnit` that serves as the reference for conversion factors

    of all other units in the type—units within the same UnitType can be converted to

    each other, but cross-dimensional conversions are not supported. The dimensional

    composition is described by `terms` (see `UnitTypeTerm`), and derived types can

    specify their `formula` (see `FormulaUnitTerm`) to define relationships

    like Liter = decimeter³. UnitTypes can be flagged to provide concentration units

    or container quantity units for inventory features regardless of their dimensional

    terms. Historically called "Quantity" in some internal systems.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'A UnitType is a dimensional category that groups inter-convertible `Unit` objects

    within Benchling''s tenant-specific unit dictionary. Examples include Volume, Mass,

    Time, Molar Concentration, and custom types like Cell Concentration. Each UnitType

    has a designated `baseUnit` that serves as the reference for conversion factors

    of all other units in the type—units within the same UnitType can be converted to

    each other, but cross-dimensional conversions are not supported. The dimensional

    composition is described by `terms` (see `UnitTypeTerm`), and derived types can

    specify their `formula` (see `FormulaUnitTerm`) to define relationships

    like Liter = decimeter³. UnitTypes can be flagged to provide concentration units

    or container quantity units for inventory features regardless of their dimensional

    terms. Historically called "Quantity" in some internal systems.'
  name: UnitType
  x-bnch-organization: Benchling
paths:
  /unit-type:
    post:
      description: Create UnitType.
      operationId: UnitType.Create
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUnitTypeInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitType'
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create UnitType
      tags:
      - UnitType
      x-bnch-rate-limit-tier: 4
  /unit-type/items:
    get:
      description: List UnitType items.
      operationId: UnitType.List
      parameters:
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/modifiedAt.gt'
      - $ref: '#/components/parameters/modifiedAt.gte'
      - $ref: '#/components/parameters/modifiedAt.lt'
      - $ref: '#/components/parameters/modifiedAt.lte'
      - $ref: '#/components/parameters/name.anyOf'
      - $ref: '#/components/parameters/name.anyOf.caseSensitive'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/returning'
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first) and modifiedAt (modified time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is modifiedAt:desc.'
        in: query
        name: sort
        schema:
          default: modifiedAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          - modifiedAt:asc
          - modifiedAt:desc
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitTypePaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List UnitType items
      tags:
      - UnitType
      x-bnch-rate-limit-tier: 4
  /unit-type/{unit_type_id}:
    get:
      description: Get a single UnitType by ID.
      operationId: UnitType.Get
      parameters:
      - description: ID of the UnitType.
        in: path
        name: unit_type_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitType'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get UnitType by ID
      tags:
      - UnitType
      x-bnch-rate-limit-tier: 5
    patch:
      description: Update UnitType.
      operationId: UnitType.Update
      parameters:
      - description: ID of the UnitType.
        in: path
        name: unit_type_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUnitTypeInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitType'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Update UnitType
      tags:
      - UnitType
      x-bnch-rate-limit-tier: 4
  /unit-type/{unit_type_id}/units/items:
    get:
      description: List Unit items.
      operationId: UnitType.units.List
      parameters:
      - description: ID of the UnitType.
        in: path
        name: unit_type_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List Unit items
      tags:
      - UnitType
      x-bnch-rate-limit-tier: 4
  /unit-type:batch-create:
    post:
      description: Batch create UnitType synchronously in one transaction. Maximum 25 items per request.
      operationId: UnitType.BatchCreate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/CreateUnitTypeInput'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/UnitType'
                    type: array
                required:
                - items
                type: object
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch create UnitType
      tags:
      - UnitType
      x-bnch-rate-limit-tier: 3
  /unit-type:batch-update:
    patch:
      description: Batch update UnitType synchronously in one transaction. Maximum 25 items per request.
      operationId: UnitType.BatchUpdate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/UpdateUnitTypeInputWithPathParams'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/UnitType'
                    type: array
                required:
                - items
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch update UnitType
      tags:
      - UnitType
      x-bnch-rate-limit-tier: 3
  /unit-type:bulk-create:
    post:
      description: Bulk create UnitType.
      operationId: UnitType.BulkCreate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk create UnitType
      tags:
      - UnitType
      x-bnch-rate-limit-tier: 2
  /unit-type:bulk-update:
    patch:
      description: Bulk update UnitType.
      operationId: UnitType.BulkUpdate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk update UnitType
      tags:
      - UnitType
      x-bnch-rate-limit-tier: 2
components:
  schemas:
    UnitUnpaginatedList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Unit'
          type: array
      type: object
    CreateBaseUnitInput:
      additionalProperties: false
      properties:
        aliases:
          items:
            type: string
          type: array
        name:
          type: string
        symbol:
          type: string
      required:
      - name
      - symbol
      - aliases
      type: object
    CreateUnitTypeInput:
      additionalProperties: false
      properties:
        baseUnit:
          $ref: '#/components/schemas/CreateBaseUnitInput'
        formula:
          items:
            $ref: '#/components/schemas/CreateFormulaUnitTermInput'
          type: array
        name:
          type: string
        overrideIsConcentration:
          description: When true, forces this UnitType to be treated as a concentration type regardless of its terms. When false, the classification is determined by the UnitType's terms. Mutually exclusive with `overrideIsContainerQuantity`.
          type: boolean
        overrideIsContainerQuantity:
          description: When true, forces this UnitType to be treated as a container quantity type regardless of its terms. When false, the classification is determined by the UnitType's terms. Mutually exclusive with `overrideIsConcentration`.
          type: boolean
        terms:
          items:
            $ref: '#/components/schemas/CreateUnitTypeTermInput'
          type: array
      required:
      - name
      - terms
      - baseUnit
      - overrideIsConcentration
      - overrideIsContainerQuantity
      type: object
    InternalServerError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        errorId:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    UpdateUnitTypeInputWithPathParams:
      additionalProperties: false
      properties:
        archiveReason:
          type: string
        archived:
          type: boolean
        formula:
          items:
            $ref: '#/components/schemas/CreateFormulaUnitTermInput'
          type: array
        id:
          type: string
        name:
          type: string
        overrideIsConcentration:
          description: When true, forces this UnitType to be treated as a concentration type regardless of its terms. When false, the classification is determined by the UnitType's terms. Mutually exclusive with `overrideIsContainerQuantity`.
          type: boolean
        overrideIsContainerQuantity:
          description: When true, forces this UnitType to be treated as a container quantity type regardless of its terms. When false, the classification is determined by the UnitType's terms. Mutually exclusive with `overrideIsConcentration`.
          type: boolean
        terms:
          items:
            $ref: '#/components/schemas/CreateUnitTypeTermInput'
          type: array
      required:
      - id
      type: object
    CreateFormulaUnitTermInput:
      additionalProperties: false
      properties:
        exponent:
          type: integer
        value:
          type: string
      required:
      - value
      - exponent
      type: object
    AsyncTaskLink:
      properties:
        pollingUri:
          format: uri
          type: string
        taskId:
          type: string
      type: object
    BulkImport:
      example:
        fileId: scrfile_jdf8BV24kLmN
      properties:
        fileId:
          description: The API ID of the scratch file (`scrfile_XXXXXXXX`) containing the items to import. The referenced file must be a scratch file whose upload has completed successfully.
          type: string
      required:
      - fileId
      type: object
    PrincipalRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    CreateUnitTypeTermInput:
      additionalProperties: false
      properties:
        exponent:
          type: integer
        value:
          enum:
          - TIME
          - LENGTH
          - MASS
          - CURRENT
          - TEMPERATURE
          - AMOUNT
          - LUMINOUS_INTENSITY
          type: string
      required:
      - value
      - exponent
      type: object
    Unit:
      description: 'A Unit is a specific measure of a physical quantity within Benchling''s tenant-specific

        unit dictionary, used to capture and convert scientific measurements across the platform.

        Each Unit belongs to a `UnitType` (e.g., "Volume" or "Mass") and defines its relationship

        to the UnitType''s base unit through a `conversionFactor`. For example, a milliliter unit

        would have a conversionFactor of 0.001 relative to a liter base unit. Units are

        identified by a human-readable `name` (e.g., "milliliter"), a shorthand `symbol`

        (e.g., "mL"), and may have `aliases` for alternate input symbols. Units within the same

        UnitType are inter-convertible; cross-dimensional conversions are not supported. Units

        appear throughout Benchling wherever measurements are recorded, including inventory

        container quantities (see `Measurement`), result fields, and sample properties.'
      properties:
        __typename:
          type: string
        aliases:
          description: Any additional short-form labels that should be recognized in input
          items:
            type: string
          type: array
        archiveDatetime:
          format: datetime
          type:
          - 'null'
          - string
        archiveReason:
          type:
          - 'null'
          - string
        archiveUser:
          oneOf:
          - $ref: '#/components/schemas/PrincipalRef'
          - type: 'null'
        archived:
          type: boolean
        conversionFactor:
          format: decimal
          type: string
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        id:
          type: string
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          type: string
        symbol:
          type: string
        unitType:
          $ref: '#/components/schemas/UnitTypeRef'
      type: object
    UnitTypeTerm:
      description: 'A term in the dimensional formula of a `UnitType`, pairing one of the seven SI base

        dimensions (see `BaseUnitType`) with an integer exponent. Multiple terms together

        describe the dimensional composition of a UnitType. For example, a Volume UnitType

        would have a single term with value=LENGTH and exponent=3, while Acceleration would

        have [LENGTH^1, TIME^-2]. Terms are descriptive metadata and do not uniquely identify

        a UnitType—multiple UnitTypes can share the same dimensional terms.'
      properties:
        __typename:
          type: string
        exponent:
          type: integer
        value:
          enum:
          - TIME
          - LENGTH
          - MASS
          - CURRENT
          - TEMPERATURE
          - AMOUNT
          - LUMINOUS_INTENSITY
          type: string
      type: object
    UnitType:
      description: 'A UnitType is a dimensional category that groups inter-convertible `Unit` objects

        within Benchling''s tenant-specific unit dictionary. Examples include Volume, Mass,

        Time, Molar Concentration, and custom types like Cell Concentration. Each UnitType

        has a designated `baseUnit` that serves as the reference for conversion factors

        of all other units in the type—units within the same UnitType can be converted to

        each other, but cross-dimensional conversions are not supported. The dimensional

        composition is described by `terms` (see `UnitTypeTerm`), and derived types can

        specify their `formula` (see `FormulaUnitTerm`) to define relationships

        like Liter = decimeter³. UnitTypes can be flagged to provide concentration units

        or container quantity units for inventory features regardless of their dimensional

        terms. Historically called "Quantity" in some internal systems.'
      properties:
        __typename:
          type: string
        archiveDatetime:
          format: datetime
          type:
          - 'null'
          - string
        archiveReason:
          type:
          - 'null'
          - string
        archiveUser:
          oneOf:
          - $ref: '#/components/schemas/PrincipalRef'
          - type: 'null'
        archived:
          type: boolean
        baseUnit:
          oneOf:
          - $ref: '#/components/schemas/UnitRef'
          - type: 'null'
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        formula:
          oneOf:
          - items:
              $ref: '#/components/schemas/FormulaUnitTerm'
            type: array
          - type: 'null'
        id:
          type: string
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          type: string
        overrideIsConcentration:
          description: When true, forces this UnitType to be treated as a concentration type regardless of its terms. When false, the classification is determined by the UnitType's terms. Mutually exclusive with `overrideIsContainerQuantity`.
          type:
          - 'null'
          - boolean
        overrideIsContainerQuantity:
          description: When true, forces this UnitType to be treated as a container quantity type regardless of its terms. When false, the classification is determined by the UnitType's terms. Mutually exclusive with `overrideIsConcentration`.
          type:
          - 'null'
          - boolean
        terms:
          items:
            $ref: '#/components/schemas/UnitTypeTerm'
          type: array
        units:
          oneOf:
          - format: uri
            type: string
          - type: 'null'
      type: object
    UpdateUnitTypeInput:
      additionalProperties: false
      properties:
        archiveReason:
          type: string
        archived:
          type: boolean
        formula:
          items:
            $ref: '#/components/schemas/CreateFormulaUnitTermInput'
          type: array
        name:
          type: string
        overrideIsConcentration:
          description: When true, forces this UnitType to be treated as a concentration type regardless of its terms. When false, the classification is determined by the UnitType's terms. Mutually exclusive with `overrideIsContainerQuantity`.
          type: boolean
        overrideIsContainerQuantity:
          description: When true, forces this UnitType to be treated as a container quantity type regardless of its terms. When false, the classification is determined by the UnitType's terms. Mutually exclusive with `overrideIsConcentration`.
          type: boolean
        terms:
          items:
            $ref: '#/components/schemas/CreateUnitTypeTermInput'
          type: array
      type: object
    UnitRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    FormulaUnitTerm:
      description: 'A term in the original formula of a `UnitType` that references an actual `Unit`

        rather than a base dimension. This is used to define relationships between units

        across different UnitTypes, such as defining that Liter = decimeter³. Unlike

        `UnitTypeTerm` which uses abstract SI dimensions, FormulaUnitTerm references

        concrete Unit definitions and is the crucial piece for establishing mathematical

        relationships when composing derived unit types.'
      properties:
        __typename:
          type: string
        exponent:
          type: integer
        value:
          $ref: '#/components/schemas/UnitRef'
      type: object
    GeneralError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    UnitTypePaginatedList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/UnitType'
          type: array
        nextToken:
          type: string
      type: object
    UnitTypeRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
  parameters:
    pageSize:
      description: Number of results to return. Defaults to 50, maximum of 100.
      in: query
      name: pageSize
      schema:
        type: integer
    createdAt.gte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or after the specified time. e.g. >= 2017-04-30.
      in: query
      name: createdAt.gte
      schema:
        format: datetime
        type: string
    modifiedAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified after the specified time. e.g. > 2017-04-30.
      in: query
      name: modifiedAt.gt
      schema:
        format: datetime
        type: string
    modifiedAt.lte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified at or before the specified time. e.g. <= 2017-04-30.
      in: query
      name: modifiedAt.lte
      schema:
        format: datetime
        type: string
    id.anyOf:
      description: Restricts results to those matching any of the specified IDs. Comma-separated list.
      explode: false
      in: query
      name: id.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    omit:
      description: Comma-separated list of top-level fields to omit from each returned item. Cannot overlap with returning.
      explode: false
      in: query
      name: omit
      schema:
        items:
          type: string
        type: array
    modifiedAt.lt:
