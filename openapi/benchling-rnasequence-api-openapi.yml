openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Rna Sequence API
  version: 2.0.0
  description: 'Represents an RNA sequence in Benchling''s molecular biology platform. An RnaSequence stores

    the nucleotide bases (using A, C, G, U) along with annotations marking functional regions,

    translation annotations for protein-coding regions (see Translation), primer binding sites

    (see Primer), and part features linking to other registered sequences (see RnaPart). RNA

    sequences are used for modeling messenger RNAs, non-coding RNAs, CRISPR guide RNAs, and

    other RNA molecules. Sequences can be registered in the Registry with a unique

    entityRegistryId, organized in folders, and linked via schema fields to other entities.

    For modified therapeutic RNAs, see modifiedNucleotides which captures chemical modifications.

    Also known as ''Sequence'' in the Benchling interface, with IDs prefixed by ''seq''.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'Represents an RNA sequence in Benchling''s molecular biology platform. An RnaSequence stores

    the nucleotide bases (using A, C, G, U) along with annotations marking functional regions,

    translation annotations for protein-coding regions (see Translation), primer binding sites

    (see Primer), and part features linking to other registered sequences (see RnaPart). RNA

    sequences are used for modeling messenger RNAs, non-coding RNAs, CRISPR guide RNAs, and

    other RNA molecules. Sequences can be registered in the Registry with a unique

    entityRegistryId, organized in folders, and linked via schema fields to other entities.

    For modified therapeutic RNAs, see modifiedNucleotides which captures chemical modifications.

    Also known as ''Sequence'' in the Benchling interface, with IDs prefixed by ''seq''.'
  name: RnaSequence
  x-bnch-core-type: RnaSequence
  x-bnch-organization: Benchling
  x-displayName: Rna Sequence
paths:
  /rna-sequence:
    post:
      description: 'Create an RNA sequence in a folder. `name` and `folderId` are required.


        ## Sequence specification


        Provide exactly one of the following:

        - `bases` — plain nucleotide sequence

        - `helm` — HELM notation (requires the modified nucleotides feature to be enabled)

        - `customNotation` with `customNotationId` — vendor-specific notation (requires custom syntaxes to be enabled; both fields must be set together)'
      operationId: RnaSequence.Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRnaSequenceInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RnaSequence'
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create RnaSequence
      tags:
      - RnaSequence
  /rna-sequence/items:
    get:
      description: List RnaSequence items.
      operationId: RnaSequence.List
      parameters:
      - $ref: '#/components/parameters/archiveReason.anyOf'
      - $ref: '#/components/parameters/archived.anyOf'
      - $ref: '#/components/parameters/authors.anyOf'
      - $ref: '#/components/parameters/bases.anyOf'
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/creator.anyOf'
      - $ref: '#/components/parameters/entityRegistryIds.anyOf'
      - $ref: '#/components/parameters/fieldset.anyOf'
      - $ref: '#/components/parameters/folder.eq'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/mentionedIn.anyOf'
      - $ref: '#/components/parameters/modifiedAt.gt'
      - $ref: '#/components/parameters/modifiedAt.gte'
      - $ref: '#/components/parameters/modifiedAt.lt'
      - $ref: '#/components/parameters/modifiedAt.lte'
      - $ref: '#/components/parameters/name.anyOf'
      - $ref: '#/components/parameters/name.anyOf.caseSensitive'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/project.eq'
      - $ref: '#/components/parameters/registry.eq'
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/schema.anyOf'
      - $ref: '#/components/parameters/schema.eq'
      - $ref: '#/components/parameters/systemCategory.anyOf'
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first) and modifiedAt (modified time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is modifiedAt:desc.'
        in: query
        name: sort
        schema:
          default: modifiedAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          - modifiedAt:asc
          - modifiedAt:desc
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RnaSequencePaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List RnaSequence items
      tags:
      - RnaSequence
  /rna-sequence/{rna_sequence_id}:
    get:
      description: Get a single RnaSequence by ID.
      operationId: RnaSequence.Get
      parameters:
      - description: ID of the RnaSequence.
        in: path
        name: rna_sequence_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RnaSequence'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get RnaSequence by ID
      tags:
      - RnaSequence
    patch:
      description: 'Update an RNA sequence. The `id` path parameter identifies the RNA sequence to update.


        ## Sequence specification


        To replace the sequence, provide exactly one of the following. Omit all sequence fields to keep the existing sequence.

        - `bases` — plain nucleotide sequence

        - `helm` — HELM notation (requires the modified nucleotides feature to be enabled)

        - `customNotation` with `customNotationId` — vendor-specific notation (requires custom syntaxes to be enabled; both fields must be set together)


        ## Updating bases


        When replacing `bases`, include every sequence feature collection that already exists on the sequence: `annotations`, `translations`, `primers`, and `parts`. Provide the updated values or an empty array (`[]`) to clear a collection. Omitting a key that has existing data returns `400`.


        ## Chemical modifications


        When switching from HELM or custom notation to plain `bases` on a sequence with chemical modifications, include an empty `helm` or `customNotation` string to clear the existing modifications. Updating `bases` alone returns `400`.'
      operationId: RnaSequence.Update
      parameters:
      - description: ID of the RnaSequence.
        in: path
        name: rna_sequence_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRnaSequenceInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RnaSequence'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Update RnaSequence
      tags:
      - RnaSequence
  /rna-sequence/{rna_sequence_id}/annotations/items:
    get:
      description: List NucleotideAnnotation items.
      operationId: RnaSequence.annotations.List
      parameters:
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/pageSize'
      - description: ID of the RnaSequence.
        in: path
        name: rna_sequence_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NucleotideAnnotationPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List NucleotideAnnotation items
      tags:
      - RnaSequence
  /rna-sequence/{rna_sequence_id}/authors/items:
    get:
      description: List Principal items.
      operationId: RnaSequence.authors.List
      parameters:
      - description: ID of the RnaSequence.
        in: path
        name: rna_sequence_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List Principal items
      tags:
      - RnaSequence
  /rna-sequence/{rna_sequence_id}/modified-nucleotides/items:
    get:
      description: List ModifiedNucleotide items.
      operationId: RnaSequence.modifiedNucleotides.List
      parameters:
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/pageSize'
      - description: ID of the RnaSequence.
        in: path
        name: rna_sequence_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModifiedNucleotidePaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List ModifiedNucleotide items
      tags:
      - RnaSequence
  /rna-sequence/{rna_sequence_id}/nucleotide-alignments/items:
    get:
      description: List NucleotideAlignment items.
      operationId: RnaSequence.nucleotideAlignments.List
      parameters:
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/modifiedAt.gt'
      - $ref: '#/components/parameters/modifiedAt.gte'
      - $ref: '#/components/parameters/modifiedAt.lt'
      - $ref: '#/components/parameters/modifiedAt.lte'
      - $ref: '#/components/parameters/name.anyOf'
      - $ref: '#/components/parameters/name.anyOf.caseSensitive'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/sequenceIds.anyOf'
      - description: ID of the RnaSequence.
        in: path
        name: rna_sequence_id
        required: true
        schema:
          type: string
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first) and modifiedAt (modified time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is modifiedAt:desc.'
        in: query
        name: sort
        schema:
          default: modifiedAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          - modifiedAt:asc
          - modifiedAt:desc
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NucleotideAlignmentPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List NucleotideAlignment items
      tags:
      - RnaSequence
  /rna-sequence/{rna_sequence_id}/parts/items:
    get:
      description: List RnaPart items.
      operationId: RnaSequence.parts.List
      parameters:
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/pageSize'
      - description: ID of the RnaSequence.
        in: path
        name: rna_sequence_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RnaPartPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List RnaPart items
      tags:
      - RnaSequence
  /rna-sequence/{rna_sequence_id}/primers/items:
    get:
      description: List Primer items.
      operationId: RnaSequence.primers.List
      parameters:
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/pageSize'
      - description: ID of the RnaSequence.
        in: path
        name: rna_sequence_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimerPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List Primer items
      tags:
      - RnaSequence
  /rna-sequence/{rna_sequence_id}/translations/items:
    get:
      description: List Translation items.
      operationId: RnaSequence.translations.List
      parameters:
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/pageSize'
      - description: ID of the RnaSequence.
        in: path
        name: rna_sequence_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List Translation items
      tags:
      - RnaSequence
  /rna-sequence:batch-create:
    post:
      description: 'Batch create RNA sequences synchronously in one transaction. Maximum 25 items per request.


        Each item follows the same field requirements as the single-create endpoint. If any item fails validation, the transaction fails and no RNA sequences are created.'
      operationId: RnaSequence.BatchCreate
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/CreateRnaSequenceInput'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/RnaSequence'
                    type: array
                required:
                - items
                type: object
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch create RnaSequence
      tags:
      - RnaSequence
  /rna-sequence:batch-update:
    patch:
      description: 'Batch update RNA sequences synchronously in one transaction. Maximum 25 items per request.


        Each item follows the same field requirements and archive constraints as the single-update endpoint. If any item fails validation, the transaction fails and no RNA sequences are updated.'
      operationId: RnaSequence.BatchUpdate
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/UpdateRnaSequenceInputWithPathParams'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/RnaSequence'
                    type: array
                required:
                - items
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch update RnaSequence
      tags:
      - RnaSequence
  /rna-sequence:bulk-create:
    post:
      description: 'Bulk create RNA sequences asynchronously.


        Each item follows the same field requirements as the single-create endpoint. The response returns an async task; poll the task to inspect row-level successes and validation errors.


        If any item uses `customNotation`, all items in the bulk request that use `customNotation` must use the same `customNotationId`.'
      operationId: RnaSequence.BulkCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk create RnaSequence
      tags:
      - RnaSequence
  /rna-sequence:bulk-update:
    patch:
      description: 'Bulk update RNA sequences asynchronously.


        Each item follows the same field requirements and archive constraints as the single-update endpoint. The response returns an async task; poll the task to inspect row-level successes and validation errors.


        If any item uses `customNotation`, all items in the bulk request that use `customNotation` must use the same `customNotationId`.'
      operationId: RnaSequence.BulkUpdate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk update RnaSequence
      tags:
      - RnaSequence
webhooks:
  v3.rnaSequence.created:
    post:
      description: Sent to Benchling Apps subscribed to `v3.rnaSequence.created` when a RnaSequence they can access is created.
      operationId: RnaSequence.Created
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RnaSequenceCreatedWebhookEnvelopeV3'
        description: The `v3.rnaSequence.created` event.
        required: true
      responses:
        '200':
          description: Return a 200 status code to acknowledge receipt of the webhook.
      summary: RnaSequence created
      tags:
      - RnaSequence
  v3.rnaSequence.updated:
    post:
      description: Sent to Benchling Apps subscribed to `v3.rnaSequence.updated` when a RnaSequence they can access is updated. `message.properties` lists the properties that changed.
      operationId: RnaSequence.Updated
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RnaSequenceUpdatedWebhookEnvelopeV3'
        description: The `v3.rnaSequence.updated` event.
        required: true
      responses:
        '200':
          description: Return a 200 status code to acknowledge receipt of the webhook.
      summary: RnaSequence updated
      tags:
      - RnaSequence
components:
  schemas:
    LegacyAppInstallation:
      description: 'Represents a legacy (pre-App Store) Benchling App installation on a tenant. Legacy apps

        are configured directly with webhook URLs and configuration specs rather than through

        app definition versions. This type is maintained for backward compatibility with older

        app integrations. For new apps, see `AppInstallation`.'
      properties:
        __typename:
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        configurationSpecs:
          items:
            $ref: '#/components/schemas/AppConfigOption'
          type: array
        configurationValues:
          format: uri
          type: string
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        creator:
          oneOf:
          - $ref: '#/components/schemas/PrincipalRef'
          - type: 'null'
        description:
          type:
          - 'null'
          - string
        featureSpecs:
          items:
            anyOf:
            - $ref: '#/components/schemas/CanvasFeatureSpec'
            - $ref: '#/components/schemas/AssayRunFeatureSpec'
            - $ref: '#/components/schemas/AppHomepageFeatureSpec'
            description: Union of CanvasFeatureSpec, AssayRunFeatureSpec, AppHomepageFeatureSpec
            discriminator:
              mapping:
                AppHomepageFeatureSpec: '#/components/schemas/AppHomepageFeatureSpec'
                AssayRunFeatureSpec: '#/components/schemas/AssayRunFeatureSpec'
                CanvasFeatureSpec: '#/components/schemas/CanvasFeatureSpec'
              propertyName: __typename
          type: array
        featureValues:
          items:
            $ref: '#/components/schemas/AssayRunFeatureValue'
          type: array
        id:
          type: string
        messageSubscriptions:
          items:
            $ref: '#/components/schemas/AppMessageSubscription'
          type: array
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          type: string
        publicKey:
          type:
          - 'null'
          - string
        versionNumber:
          type:
          - 'null'
          - string
        webhookUrl:
          type:
          - 'null'
          - string
      type: object
    FieldValueInput:
      additionalProperties: false
      properties:
        value:
          $ref: '#/components/schemas/AnyType'
      required:
      - value
      type: object
    JsonAppConfigSpec:
      description: Specifies that an app configuration field should accept a JSON value.
      properties:
        __typename:
          type: string
        requiredConfig:
          type:
          - 'null'
          - boolean
      type: object
    Translation:
      description: 'Represents a protein-coding region (CDS) on a nucleotide sequence, showing the translated

        amino acid sequence. Translations can span a single contiguous region or multiple regions

        for spliced genes (see RegionsListItem). The aminoAcids field contains the computed protein

        sequence based on the geneticCode (see CodonTranslationTable). The translateFirstCodonToMethionine

        option forces the start codon to encode methionine regardless of the actual codon. Translations

        display as colored overlays on the sequence viewer, with the three-letter amino acid codes

        shown above the nucleotide bases.'
      properties:
        __typename:
          type: string
        aminoAcids:
          description: 'Calculated amino acid translation of the specified regions, combining codons across regions if

            necessary.'
          type: string
        color:
          description: Hex color when displaying the translation.
          type: string
        customFields:
          description: Custom fields on the translation.
          items:
            $ref: '#/components/schemas/CustomField'
          type: array
        end:
          deprecated: true
          description: '0-based exclusive end index. For ranges ending at the end of a circular sequence, this value is

            always the length of the sequence, never 0. Use regions instead for location information.'
          type:
          - 'null'
          - integer
        geneticCode:
          description: Genetic code for the translation.
          enum:
          - STANDARD
          - VERTEBRATE_MITOCHONDRIAL
          - YEAST_MITOCHONDRIAL
          - MOLD_PROTOZOAN_COELENTERATE_MITOCHONDRIAL_MYCOPLASMA_SPIROPLASMA
          - INVERTEBRATE_MITOCHONDRIAL
          - CILIATE_DASYCLADACEAN_HEXAMITA_NUCLEAR
          - ECHINODERM_FLATWORM_MITOCHONDRIAL
          - EUPLOTID_NUCLEAR
          - BACTERIAL_ARCHAEAL_PLANT_PLASTID
          - ALTERNATIVE_YEAST_NUCLEAR
          - ASCIDIAN_MITOCHONDRIAL
          - ALTERNATIVE_FLATWORM_MITOCHONDRIAL
          - CHLOROPHYCEAN_MITOCHONDRIAL
          - TREMATODE_MITOCHONDRIAL
          - SCENEDESMUS_OBLIQUUS_MITOCHONDRIAL
          - THRAUSTOCHYTRIUM_MITOCHONDRIAL
          - RHABDOPLEURIDAE_MITOCHONDRIAL
          - CANDIDATE_DIVISION_SR1_GRACILIBACTERIA
          - PACHYSOLEN_TANNOPHILUS_NUCLEAR
          - KARYORELICT_NUCLEAR
          - CONDYLOSTOMA_NUCLEAR
          - MESODINIUM_NUCLEAR
          - PERITRICH_NUCLEAR
          - BLASTOCRITHIDIA_NUCLEAR
          - CEPHALODISCIDAE_MITOCHONDRIAL_UAA_TYR
          type: string
        id:
          description: The ID of the translation.
          type: string
        name:
          description: Name of the translation.
          type: string
        notes:
          description: Text notes on the translation.
          type: string
        nucleotideSequence:
          $ref: '#/components/schemas/NucleotideSequenceRef'
          description: The nucleotide sequence that this translation belongs to.
        regions:
          description: Array of regions of the translation. For single-region translations, this is an array with one element.
          items:
            $ref: '#/components/schemas/RegionsListItem'
          type: array
        start:
          deprecated: true
          description: '0-based inclusive start index.

            Use regions instead for location information.'
          type:
          - 'null'
          - integer
        strand:
          description: 'Strand orientation for this translation: `FORWARD` or `REVERSE`.'
          enum:
          - FORWARD
          - REVERSE
          type: string
        translateFirstCodonToMethionine:
          description: Whether or not the first codon has been forced to be translated as methionine.
          type: boolean
      type: object
    RnaPartInput:
      additionalProperties: false
      properties:
        end:
          description: 0-based exclusive end index. For ranges ending at the sequence end, API responses return `sequenceLength`, never `0`. On input, `sequenceLength` or `0` may be used.
          type: integer
        sequenceId:
          description: RNA sequence this part refers to.
          type: string
        start:
          description: 0-based inclusive start index.
