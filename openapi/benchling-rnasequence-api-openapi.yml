      type: object
    NucleotideAlignment:
      description: 'Represents a multiple sequence alignment of nucleotide sequences (DNA or RNA). Nucleotide

        alignments are used to compare sequence reads against a reference template for verification

        (see AlignmentType TEMPLATE) or to align multiple sequences for consensus building (see

        AlignmentType CONSENSUS). Each alignment contains a referenceSequence (the template or

        consensus) and a collection of AlignedNucleotideSequence entries representing the individual sequences

        being compared. Alignments are commonly used in Sanger sequencing verification workflows

        to confirm that a cloned construct matches the expected design.


        NucleotideAlignments are created asynchronously via custom methods (CreateConsensusAlignment or

        CreateTemplateAlignment) and can be deleted via DeleteNucleotideAlignment. They cannot be updated

        after creation.'
      properties:
        __typename:
          type: string
        alignedNucleotideSequences:
          description: 'The individual sequence rows in the alignment, including the reference sequence and each

            aligned read or input sequence. Each row contains the gapped bases and trim boundaries that

            define the high-quality region used for alignment and pairwise identity calculations.'
          format: uri
          type: string
        alignmentType:
          description: The type of the Alignment, whether it is a consensus or template alignment.
          enum:
          - TEMPLATE
          - CONSENSUS
          type: string
        createdAt:
          description: DateTime the Alignment was created.
          format: datetime
          type: string
        id:
          description: The ID of the Alignment.
          type: string
        modifiedAt:
          description: DateTime the Alignment was last modified.
          format: datetime
          type: string
        name:
          description: The name of the Alignment.
          type: string
        referenceSequence:
          $ref: '#/components/schemas/NucleotideSequenceRef'
          description: 'The reference NucleotideSequence for the alignment. For template alignments, this is the

            template sequence that other sequences are compared against. For consensus alignments,

            this is the derived consensus sequence.'
      type: object
    PrimerInput:
