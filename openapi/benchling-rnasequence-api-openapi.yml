    CustomField:
      description: 'A name-value pair for storing additional metadata on objects that support custom fields.

        CustomFields provide a flexible way to attach arbitrary string data to entities, containers,

        datasets, and other Benchling objects without modifying their schemas. Objects that can

        have custom fields implement the HasCustomFields interface. Unlike schema-defined fields,

        custom fields are not validated against a schema and can be freely added or modified.'
      properties:
        __typename:
          type: string
        name:
          type:
          - 'null'
          - string
        value:
          type:
          - 'null'
          - string
      type: object
    AppConfigFieldDefinition:
      description: 'Defines a field within an app configuration that references schema fields. Specifies the

        field name, type, whether it accepts multiple values, and whether it is required.'
      properties:
        __typename:
          type: string
        description:
          type:
          - 'null'
          - string
        isMulti:
          description: Whether the field must be multi-valued — null means either true or false is acceptable.
          type:
          - 'null'
          - boolean
        isRequired:
          description: Whether the field must be required — null means either true or false is acceptable.
          type:
          - 'null'
          - boolean
        name:
          type: string
        requiredConfig:
          type:
          - 'null'
          - boolean
        type:
          description: Type constraint for the field — null means any type is acceptable.
          enum:
          - DNA_SEQUENCE_LINK
          - AA_SEQUENCE_LINK
          - CUSTOM_ENTITY_LINK
          - ENTITY_LINK
          - MIXTURE_LINK
          - MOLECULE_LINK
          - DROPDOWN
          - PART_LINK
          - AA_PART_LINK
          - TRANSLATION_LINK
          - BLOB_LINK
          - TEXT
          - LONG_TEXT
          - BATCH_LINK
          - STORAGE_LINK
          - ENTRY_LINK
          - ASSAY_REQUEST_LINK
          - ASSAY_RESULT_LINK
          - ASSAY_RUN_LINK
          - BOOLEAN
          - FLOAT
          - INTEGER
          - DATETIME
          - DATE
          - JSON
          - null
          type:
          - 'null'
          - string
      type: object
    ArrayValue:
      description: A type that represents a list of BenchlingValues, used for multi-value cells (e.g. alias columns).
      properties:
        __typename:
          type: string
        value:
          items:
            anyOf:
            - $ref: '#/components/schemas/BooleanValue'
            - $ref: '#/components/schemas/DateTimeValue'
            - $ref: '#/components/schemas/DateValue'
            - $ref: '#/components/schemas/DecimalValue'
            - $ref: '#/components/schemas/IntegerValue'
            - $ref: '#/components/schemas/JsonValue'
            - $ref: '#/components/schemas/ObjectLinkValue'
            - $ref: '#/components/schemas/ObjectLinkListValue'
            - $ref: '#/components/schemas/TextAndUrlValue'
            - $ref: '#/components/schemas/TextValue'
            description: Union of BooleanValue, DateTimeValue, DateValue, DecimalValue, IntegerValue, JsonValue, ObjectLinkValue, ObjectLinkListValue, TextAndUrlValue, TextValue
            discriminator:
              mapping:
                BooleanValue: '#/components/schemas/BooleanValue'
                DateTimeValue: '#/components/schemas/DateTimeValue'
                DateValue: '#/components/schemas/DateValue'
                DecimalValue: '#/components/schemas/DecimalValue'
                IntegerValue: '#/components/schemas/IntegerValue'
                JsonValue: '#/components/schemas/JsonValue'
                ObjectLinkListValue: '#/components/schemas/ObjectLinkListValue'
                ObjectLinkValue: '#/components/schemas/ObjectLinkValue'
                TextAndUrlValue: '#/components/schemas/TextAndUrlValue'
                TextValue: '#/components/schemas/TextValue'
              propertyName: __typename
          type: array
      type: object
    DocumentLikeRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    RnaPart:
      description: 'Represents a region on an RNA sequence that matches or is derived from another registered

        RNA sequence. RnaPart features enable tracking the provenance of sequence regions, such as

        identifying that a particular element in an RNA molecule originates from a specific source

        sequence. Each part specifies the referenced RnaSequence, the strand orientation (forward

        or reverse), and the position range using 0-based coordinates with an exclusive end index.

        Parts appear as visual features on the sequence viewer and support traceability.'
      properties:
        __typename:
          type: string
        containerSequence:
          $ref: '#/components/schemas/RnaSequenceRef'
          description: The RNA sequence that contains this part.
        end:
          description: 0-based exclusive end index.
          type: integer
        id:
          description: The ID of the RNA Part.
          type: string
        sequence:
          $ref: '#/components/schemas/RnaSequenceRef'
          description: RNA sequence this part refers to.
        start:
          description: 0-based inclusive start index.
          type: integer
        strand:
          description: 'Strand orientation for this part: `FORWARD` or `REVERSE`.'
          enum:
          - FORWARD
          - REVERSE
          type: string
      type: object
    IRnaSequence:
      properties:
        __typename:
          type: string
        aliases:
          description: Array of aliases
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        annotations:
          description: 'Annotations on the RNA sequence, not including translations or primers. Annotations on parts are

            not included.'
          format: uri
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        bases:
          description: Bases of the RNA sequence.
          type: string
        canonicalHelm:
          description: Normalized HELM notation for this RNA sequence.
          type: string
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        customFields:
          description: Custom fields set on the RNA sequence.
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityRegistryId:
          description: 'The registry-assigned identifier for this item (e.g. its registry ID shown in the UI),

            present only once the item has been registered. Null if the item is not registered.'
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        id:
          type: string
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        modifiedNucleotides:
          description: Modifications applied to this RNA sequence.
          format: uri
          type: string
        name:
          description: Name of the item.
          type: string
        nucleotideAlignments:
          description: 'Nucleotide alignments that use this sequence as the reference sequence. For template

            alignments, this is the template sequence; for consensus alignments, this is the derived

            consensus sequence.'
          format: uri
          type: string
        parts:
          description: Part features linking regions of this sequence to other RNA sequences.
          format: uri
          type: string
        primers:
          description: Primer bind features on the RNA sequence. Primers on parts are not included.
          format: uri
          type: string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          description: Provenance of this item's registration — where and when it was registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          description: The Registry this item belongs to, if registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          deprecated: true
          description: Use typedSchema instead, which returns the per-type schema.
          oneOf:
          - $ref: '#/components/schemas/EntitySchemaRef'
          - type: 'null'
        translations:
          description: 'Translation annotations present on the RNA sequence. Translations may be one region or split

            across multiple regions. Translations on parts are not included.'
          format: uri
          type: string
        typedSchema:
          oneOf:
          - $ref: '#/components/schemas/RnaSequenceSchemaRef'
          - type: 'null'
      type: object
    DateAppConfigSpec:
