          description: Union of BooleanAppConfigSpec, IntegerAppConfigSpec, FloatAppConfigSpec, TextAppConfigSpec, SecureTextAppConfigSpec, DateAppConfigSpec, DateTimeAppConfigSpec, JsonAppConfigSpec, ArrayAppConfigSpec, DropdownAppConfigSpec, EntitySchemaAppConfigSpec, WorkflowTaskSchemaAppConfigSpec, SchemaAppConfigSpec, ResourceAppConfigSpec
          discriminator:
            mapping:
              ArrayAppConfigSpec: '#/components/schemas/ArrayAppConfigSpec'
              BooleanAppConfigSpec: '#/components/schemas/BooleanAppConfigSpec'
              DateAppConfigSpec: '#/components/schemas/DateAppConfigSpec'
              DateTimeAppConfigSpec: '#/components/schemas/DateTimeAppConfigSpec'
              DropdownAppConfigSpec: '#/components/schemas/DropdownAppConfigSpec'
              EntitySchemaAppConfigSpec: '#/components/schemas/EntitySchemaAppConfigSpec'
              FloatAppConfigSpec: '#/components/schemas/FloatAppConfigSpec'
              IntegerAppConfigSpec: '#/components/schemas/IntegerAppConfigSpec'
              JsonAppConfigSpec: '#/components/schemas/JsonAppConfigSpec'
              ResourceAppConfigSpec: '#/components/schemas/ResourceAppConfigSpec'
              SchemaAppConfigSpec: '#/components/schemas/SchemaAppConfigSpec'
              SecureTextAppConfigSpec: '#/components/schemas/SecureTextAppConfigSpec'
              TextAppConfigSpec: '#/components/schemas/TextAppConfigSpec'
              WorkflowTaskSchemaAppConfigSpec: '#/components/schemas/WorkflowTaskSchemaAppConfigSpec'
            propertyName: __typename
        description:
          type:
          - 'null'
          - string
        name:
          type: string
      type: object
    DateTimeAppConfigSpec:
      description: Specifies that an app configuration field should accept a datetime value.
      properties:
        __typename:
          type: string
        requiredConfig:
          type:
          - 'null'
          - boolean
      type: object
    RnaAnnotationInput:
      additionalProperties: false
      properties:
        color:
          description: Hex color when displaying the annotation. A random color is assigned if omitted.
          type: string
        customFields:
          description: Custom fields on the annotation. Each field name may be at most 1024 characters and each value at most 2712 characters.
          items:
            $ref: '#/components/schemas/CustomFieldInput'
          type: array
        end:
          description: 0-based exclusive end index. For ranges ending at the sequence end, API responses return `sequenceLength`, never `0`. On input, `sequenceLength` or `0` may be used.
          type: integer
        name:
          description: Name of the annotation.
          type: string
        notes:
          description: Text notes on the annotation. Defaults to an empty string if omitted.
          type: string
        start:
          description: 0-based inclusive start index.
          type: integer
        type:
          description: Feature type of the annotation.
          type: string
      required:
      - name
      - end
      - start
      type: object
    UpdateRnaSequenceInput:
      additionalProperties: false
      example:
        annotations:
        - color: '#4ECDC4'
          end: 10
          name: Updated target region
          notes: Updated silencing target
          start: 0
          type: target
        bases: AUCGAUCGAUCGAUCGAUCGAUCG
        name: Updated CRISPR guide RNA
        parts:
        - end: 6
          sequenceId: seq_jdf8BV24
          start: 0
        primers:
        - location:
            end: 8
            locationType: start_and_end
            start: 2
          oligoId: seq_laGnl8vB
          strand: REVERSE
        schemaFields:
          application:
            value: CRISPR
          target_gene:
            value: BRCA1
        translations:
        - geneticCode: STANDARD
          name: Updated ORF fragment
          regions:
          - end: 9
            start: 1
          translateFirstCodonToMethionine: false
      properties:
        aliases:
          description: Array of aliases
          items:
            type: string
          type: array
        allowCustomFieldDeletion:
          description: When true, custom fields present on the entity but omitted from the update payload will be deleted. When false or omitted, omitting existing custom fields is an error. Defaults to false.
          type: boolean
        annotations:
          description: 'Annotations on the RNA sequence, not including translations or primers. Annotations on parts are

            not included.'
          items:
            $ref: '#/components/schemas/RnaAnnotationInput'
          type: array
        archiveReason:
          type: string
        archived:
          type: boolean
        authorIds:
          items:
            type: string
          type: array
        bases:
          description: Bases of the RNA sequence. Mutually exclusive with `helm` and `customNotation`.
          type: string
        customFields:
          additionalProperties:
            $ref: '#/components/schemas/FieldValueInput'
          description: Custom fields set on the RNA sequence.
          type: object
        customNotation:
          description: Sequence in a vendor-specific custom notation syntax. Requires custom syntaxes to be enabled. When `customNotation` is set, `customNotationId` is required. Mutually exclusive with `bases` and `helm`.
          type:
          - 'null'
          - string
        customNotationId:
          description: ID of the custom notation syntax used to interpret `customNotation`. When `customNotation` is set, `customNotationId` is required; omit both when using `bases` or `helm`.
          type:
          - 'null'
          - string
        entityRegistryId:
          description: Registry ID to assign to the entity. When registering, specifying this value sets the registry ID of the entity. When already registered, specifying this value updates the entity's registry ID. If set, naming_strategy must be unspecified.
          type: string
        folderId:
          type: string
        helm:
          description: HELM notation for the RNA sequence and chemical modifications. Requires the modified nucleotides feature to be enabled. Mutually exclusive with `bases` and `customNotation`.
          type: string
        name:
          description: Name of the item.
          type: string
        namingStrategy:
          description: Strategy to use for labeling the item in the registry if registering. If one is specified, the entity_registry_id must be unspecified.
          enum:
          - NEW_IDS
          - IDS_FROM_NAMES
          - DELETE_NAMES
          - SET_FROM_NAME_PARTS
          - REPLACE_NAMES_FROM_PARTS
          - KEEP_NAMES
