      - name
      type: object
    V3UpdateEventBase:
      allOf:
      - $ref: '#/components/schemas/V3EventBase'
      - properties:
          properties:
            description: Names of the properties that changed.
            examples:
            - - name
              - folderId
            items:
              type: string
            type: array
        required:
        - properties
        type: object
      description: Fields common to every v3 update event message.
    RnaSequence:
      allOf:
      - $ref: '#/components/schemas/IRnaSequence'
      - description: 'Represents an RNA sequence in Benchling''s molecular biology platform. An RnaSequence stores

          the nucleotide bases (using A, C, G, U) along with annotations marking functional regions,

          translation annotations for protein-coding regions (see Translation), primer binding sites

          (see Primer), and part features linking to other registered sequences (see RnaPart). RNA

          sequences are used for modeling messenger RNAs, non-coding RNAs, CRISPR guide RNAs, and

          other RNA molecules. Sequences can be registered in the Registry with a unique

          entityRegistryId, organized in folders, and linked via schema fields to other entities.

          For modified therapeutic RNAs, see modifiedNucleotides which captures chemical modifications.

          Also known as ''Sequence'' in the Benchling interface, with IDs prefixed by ''seq''.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    AppConfigDropdownOption:
      description: Defines an option within a dropdown-type app configuration field.
      properties:
        __typename:
          type: string
        description:
          type:
          - 'null'
          - string
        name:
          type: string
        requiredConfig:
          type:
          - 'null'
          - boolean
      type: object
    FolderRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ModifiedNucleotide:
      description: 'Represents a chemically modified nucleotide at a specific position in an oligonucleotide

        sequence. Each modification specifies the sugar, base, and phosphate monomers (see NucleotideMonomer)

        that replace or modify the natural nucleotide at that position. Common modifications include

        2''-O-methyl sugars for stability, phosphorothioate backbones for nuclease resistance, or

        modified bases for binding affinity. Exposed on nucleotide sequence entities to capture the

        modification pattern of therapeutic oligonucleotides.'
      properties:
        __typename:
          type: string
        baseMonomer:
          $ref: '#/components/schemas/NucleotideMonomerRef'
          description: The base monomer for the modification.
        createdAt:
          description: DateTime the modification was created.
          format: datetime
          type: string
        id:
          description: The ID of the modified nucleotide.
          type: string
        nucleotideSequence:
          $ref: '#/components/schemas/NucleotideSequenceRef'
          description: The nucleotide sequence that this modification belongs to.
        phosphateMonomer:
          description: The phosphate monomer for the modification. If empty, it represents a null phosphate at the 5' end of the sequence.
          oneOf:
          - $ref: '#/components/schemas/NucleotideMonomerRef'
          - type: 'null'
        position:
          description: 0-based index of the modification.
          type: integer
        sugarMonomer:
          $ref: '#/components/schemas/NucleotideMonomerRef'
          description: The sugar monomer for the modification.
      type: object
    RnaSequenceCreatedWebhookEnvelopeV3:
      allOf:
      - $ref: '#/components/schemas/WebhookEnvelopeBaseV0'
      - properties:
          message:
            $ref: '#/components/schemas/RnaSequenceCreatedWebhookV3'
        required:
        - message
        type: object
      description: Request body Benchling sends for a `v3.rnaSequence.created` event.
    FloatAppConfigSpec:
      description: Specifies that an app configuration field should accept a floating-point number.
      properties:
        __typename:
          type: string
        enum:
          description: Optional enum constraint — if present, the value must be one of these floats.
          oneOf:
          - items:
              type: number
            type: array
          - type: 'null'
        requiredConfig:
          type:
          - 'null'
          - boolean
      type: object
    Primer:
      description: 'Represents a primer binding site on a nucleotide sequence, indicating where an oligonucleotide primer anneals

        for PCR amplification or sequencing. The Primer links to an Oligo entity containing the actual primer sequence

        and name. Position fields define the binding region on the template (start/end), while bindPosition specifies

        the 3'' end of the binding region (critical for extension). The overhangLength indicates how many 5'' bases

        extend beyond the binding region (used for adding restriction sites or tags). Strand indicates whether the

        primer binds to the `FORWARD` or `REVERSE` strand.'
      properties:
        __typename:
          type: string
        bindPosition:
          description: 0-based index of the base at the 3' end of the binding region.
          type: integer
        end:
          description: '0-based exclusive end of the binding region. For ranges ending at the end of a circular sequence,

            this value is always the length of the sequence, never 0.'
          type: integer
        id:
          description: The ID of the primer.
          type: string
        nucleotideSequence:
          $ref: '#/components/schemas/NucleotideSequenceRef'
          description: The nucleotide sequence that this primer binds to.
        oligo:
          $ref: '#/components/schemas/OligoRef'
          description: Linked primer entity, which holds the name, bases, and color for this primer bind site.
        overhangLength:
          description: Number of 5' primer bases that are not part of the binding region.
          type: integer
        start:
          description: 0-based inclusive start of the binding region.
          type: integer
        strand:
          description: 'Strand orientation for this primer binding site: `FORWARD` or `REVERSE`.'
          enum:
          - FORWARD
          - REVERSE
          type: string
      type: object
    V3EventBase:
      description: Fields common to every v3 event message.
      properties:
        createdAt:
          description: RFC 3339 timestamp of when the event was created.
          format: date-time
          type: string
        deprecated:
          description: Whether this event type is deprecated.
          type: boolean
        id:
          description: API ID of the event.
          examples:
          - evt_1jdbvuo2740aslk
          type: string
        resourceId:
          description: API ID of the resource the event is about.
          examples:
          - seq_1jdbvuo2740aslk
          type: string
        stability:
          description: Stability of the resource type the event is about.
          enum:
          - stable
          - beta
          type: string
        type:
          description: The event type.
          examples:
          - v3.dnaSequence.created
          type: string
      required:
      - id
      - type
      - createdAt
      - resourceId
      - stability
      - deprecated
      type: object
    RnaTranslationInput:
      additionalProperties: false
      properties:
        color:
          description: Hex color when displaying the translation. Defaults to light blue (`#84B0DC`) if omitted.
          type: string
        customFields:
          description: Custom fields on the translation.
          items:
            $ref: '#/components/schemas/CustomFieldInput'
          type: array
        geneticCode:
          description: 'Genetic code for the translation. Defaults to `STANDARD` if omitted. Genetic codes with ambiguous stop codons are not supported: `BLASTOCRITHIDIA_NUCLEAR`, `CONDYLOSTOMA_NUCLEAR`, `KARYORELICT_NUCLEAR`.'
          enum:
          - STANDARD
          - VERTEBRATE_MITOCHONDRIAL
          - YEAST_MITOCHONDRIAL
          - MOLD_PROTOZOAN_COELENTERATE_MITOCHONDRIAL_MYCOPLASMA_SPIROPLASMA
          - INVERTEBRATE_MITOCHONDRIAL
          - CILIATE_DASYCLADACEAN_HEXAMITA_NUCLEAR
          - ECHINODERM_FLATWORM_MITOCHONDRIAL
          - EUPLOTID_NUCLEAR
          - BACTERIAL_ARCHAEAL_PLANT_PLASTID
          - ALTERNATIVE_YEAST_NUCLEAR
          - ASCIDIAN_MITOCHONDRIAL
          - ALTERNATIVE_FLATWORM_MITOCHONDRIAL
          - CHLOROPHYCEAN_MITOCHONDRIAL
          - TREMATODE_MITOCHONDRIAL
          - SCENEDESMUS_OBLIQUUS_MITOCHONDRIAL
          - THRAUSTOCHYTRIUM_MITOCHONDRIAL
          - RHABDOPLEURIDAE_MITOCHONDRIAL
          - CANDIDATE_DIVISION_SR1_GRACILIBACTERIA
          - PACHYSOLEN_TANNOPHILUS_NUCLEAR
          - MESODINIUM_NUCLEAR
          - PERITRICH_NUCLEAR
          - CEPHALODISCIDAE_MITOCHONDRIAL_UAA_TYR
          type: string
        name:
          description: Name of the translation.
          type: string
        notes:
          description: Text notes on the translation. Defaults to an empty string if omitted.
          type: string
        regions:
          description: Array of regions to translate. For single-region translations, provide one element.
          items:
            $ref: '#/components/schemas/TranslationRegionInput'
          maxItems: 500
          type: array
        translateFirstCodonToMethionine:
          description: Whether or not the first codon has been forced to be translated as methionine. Defaults to false if omitted.
          type: boolean
      required:
      - regions
      type: object
    ModifiedNucleotidePaginatedList:
      additionalProperties: false
