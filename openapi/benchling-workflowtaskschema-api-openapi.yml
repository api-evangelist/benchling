components:
  schemas:
    DateFieldDefinition:
      description: 'A field definition for date-only values, without a time component. Each field has a user-facing

        `name` and a `systemName` for warehouse and API access. For values that also capture a time and

        timezone, see `DateTimeFieldDefinition`.'
      properties:
        __typename:
          type: string
        archiveReason:
          description: The reason this field definition was archived, if applicable.
          type:
          - 'null'
          - string
        archived:
          description: Whether this field definition has been archived.
          type: boolean
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        derivationType:
          description: 'How this field''s value is determined: DIRECT (user-entered), COMPUTED (auto-calculated), or

            SNAPSHOT (frozen at creation).'
          enum:
          - DIRECT
          - COMPUTED
          - SNAPSHOT
          type: string
        description:
          description: An optional user-provided description of this field definition.
          type:
          - 'null'
          - string
        id:
          type: string
        isRequired:
          description: When true, a value must be provided for this field when creating or updating an entity.
          type: boolean
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          description: The user-facing display name of this field definition.
          type: string
        systemName:
          description: The machine-readable identifier used as the warehouse column name and for API access.
          type: string
      type: object
    AnyEntityLinkFieldDefinition:
      description: A schema field definition for linking to any entity type without schema or type constraints.
      properties:
        __typename:
          type: string
        archiveReason:
          description: The reason this field definition was archived, if applicable.
          type:
          - 'null'
          - string
        archived:
          description: Whether this field definition has been archived.
          type: boolean
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        derivationType:
          description: 'How this field''s value is determined: DIRECT (user-entered), COMPUTED (auto-calculated), or

            SNAPSHOT (frozen at creation).'
          enum:
          - DIRECT
          - COMPUTED
          - SNAPSHOT
          type: string
        description:
          description: An optional user-provided description of this field definition.
          type:
          - 'null'
          - string
        id:
          type: string
        isMulti:
          type: boolean
        isRequired:
          description: When true, a value must be provided for this field when creating or updating an entity.
          type: boolean
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          description: The user-facing display name of this field definition.
          type: string
        systemName:
          description: The machine-readable identifier used as the warehouse column name and for API access.
          type: string
      type: object
    WorkflowTaskSchemaSetFieldDefinitionsInput:
      additionalProperties: false
      properties:
        fieldDefinitions:
          items:
            anyOf:
            - $ref: '#/components/schemas/CreateBooleanFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateDateFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateDateTimeFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateDecimalFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateIntegerFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateLongTextFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateTextFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateAaSequenceLinkFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateProteinLinkFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateRequestLinkFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateResultLinkFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateRunLinkFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateAttachmentLinkFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateCustomEntityLinkFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateDnaOligoLinkFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateDnaSequenceLinkFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateDropdownLinkFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateAnyEntityLinkFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateEntryLinkFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateEquipmentLinkFieldDefinitionInput'
            - $ref: '#/components/schemas/CreateFieldsetLinkFieldDefinitionInput'
