          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List ValidationRule items
      tags:
      - WorkflowTaskSchema
  /workflow-task-schema/{workflow_task_schema_id}:set-field-definitions:
    post:
      operationId: WorkflowTaskSchema.SetFieldDefinitions
      parameters:
      - description: ID of the WorkflowTaskSchema.
        in: path
