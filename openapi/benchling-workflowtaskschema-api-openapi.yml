          type: boolean
        canOnlyBePartOfFlowchart:
          type: boolean
        canSetAssigneeOnTaskCreation:
          description: 'Whether or not tasks of this schema can be created with a non-null

            assignee.'
          type: boolean
        createdAt:
          format: datetime
          type: string
        defaultCreationFolder:
          description: ID of the default folder for creating workflow task groups
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        defaultEntryExecutionFolder:
          description: ID of the default folder for workflow task execution entries
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        entryTemplate:
          description: 'The ID of the template of the entries tasks of this schema will be

            executed into.'
          oneOf:
          - $ref: '#/components/schemas/EntryTemplateRef'
          - type: 'null'
        executionType:
          description: The method by which instances of this schema are executed
          enum:
          - DIRECT
          - ENTRY
          - FLOWCHART
          - PROCEDURE
          - PROCEDURE_METHOD
          - PROCEDURE_STEP
          - PIPELINE
          type: string
        fieldDefinitions:
          format: uri
          type: string
        id:
          type: string
        isPropagateWatchersEnabled:
          type: boolean
        modifiedAt:
          format: datetime
          type: string
        name:
          type: string
        organization:
          $ref: '#/components/schemas/OrganizationRef'
          description: The organization that owns the schema.
        prefix:
          description: The prefix for the displayId of tasks of this schema.
          type: string
        systemName:
