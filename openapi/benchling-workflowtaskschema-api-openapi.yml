openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Workflow Task Schema API
  version: 2.0.0
  description: 'A configuration template that defines the structure and behavior of `WorkflowTask` instances.

    Each schema specifies an `executionType` (direct, entry, or flowchart) and

    custom `fieldDefinitions` for task data. Schemas belong to an `Organization` and can optionally reference an `entryTemplate`

    for entry-based execution. The `prefix`

    and `taskGroupPrefix` fields define the human-readable ID format for tasks and task groups.

    Default folders can be configured via `defaultCreationFolder` and `defaultEntryExecutionFolder`.

    Schemas support `responsibleParties` for default assignment. The associated `workflowOutputSchema` defines the

    structure of outputs produced by tasks of this schema.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'A configuration template that defines the structure and behavior of `WorkflowTask` instances.

    Each schema specifies an `executionType` (direct, entry, or flowchart) and

    custom `fieldDefinitions` for task data. Schemas belong to an `Organization` and can optionally reference an `entryTemplate`

    for entry-based execution. The `prefix`

    and `taskGroupPrefix` fields define the human-readable ID format for tasks and task groups.

    Default folders can be configured via `defaultCreationFolder` and `defaultEntryExecutionFolder`.

    Schemas support `responsibleParties` for default assignment. The associated `workflowOutputSchema` defines the

    structure of outputs produced by tasks of this schema.'
  name: WorkflowTaskSchema
  x-bnch-organization: Benchling
  x-displayName: Workflow Task Schema
paths:
  /tasks/workflow-task-schema/set-field-definitions/{task_id}:
    get:
      description: Poll status for Set field definitions on the schema.
      operationId: WorkflowTaskSchema.SetFieldDefinitions.Get
      parameters:
      - description: ID of the asynchronous task to poll.
        in: path
        name: task_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  result:
                    oneOf:
                    - $ref: '#/components/schemas/SchemaSetFieldDefinitionsOutput'
                    - type: 'null'
                  status:
                    enum:
                    - NOT_STARTED
                    - IN_PROGRESS
                    - COMPLETED
                    - FAILED
                    type: string
                required:
                - status
                - message
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Poll async task status
      tags:
      - WorkflowTaskSchema
  /tasks/workflow-task-schema/set-output-field-definitions/{task_id}:
    get:
      description: Poll status for Set field definitions on the output schema.
      operationId: WorkflowTaskSchema.SetOutputFieldDefinitions.Get
      parameters:
      - description: ID of the asynchronous task to poll.
        in: path
        name: task_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  result:
                    oneOf:
                    - $ref: '#/components/schemas/SchemaSetFieldDefinitionsOutput'
                    - type: 'null'
                  status:
                    enum:
                    - NOT_STARTED
                    - IN_PROGRESS
                    - COMPLETED
                    - FAILED
                    type: string
                required:
                - status
                - message
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Poll async task status
      tags:
      - WorkflowTaskSchema
  /workflow-task-schema:
    post:
      description: Create WorkflowTaskSchema.
      operationId: WorkflowTaskSchema.Create
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowTaskSchemaInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTaskSchema'
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create WorkflowTaskSchema
      tags:
      - WorkflowTaskSchema
  /workflow-task-schema/items:
    get:
      description: List WorkflowTaskSchema items.
      operationId: WorkflowTaskSchema.List
      parameters:
      - $ref: '#/components/parameters/archiveReason.anyOf'
      - $ref: '#/components/parameters/archived.anyOf'
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/modifiedAt.gt'
      - $ref: '#/components/parameters/modifiedAt.gte'
      - $ref: '#/components/parameters/modifiedAt.lt'
      - $ref: '#/components/parameters/modifiedAt.lte'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/returning'
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first) and modifiedAt (modified time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is modifiedAt:desc.'
        in: query
        name: sort
        schema:
          default: modifiedAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          - modifiedAt:asc
          - modifiedAt:desc
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTaskSchemaPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List WorkflowTaskSchema items
      tags:
      - WorkflowTaskSchema
  /workflow-task-schema/{workflow_task_schema_id}:
    get:
      description: Get a single WorkflowTaskSchema by ID.
      operationId: WorkflowTaskSchema.Get
      parameters:
      - description: ID of the WorkflowTaskSchema.
        in: path
        name: workflow_task_schema_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTaskSchema'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get WorkflowTaskSchema by ID
      tags:
      - WorkflowTaskSchema
    patch:
      description: Update WorkflowTaskSchema.
      operationId: WorkflowTaskSchema.Update
      parameters:
      - description: ID of the WorkflowTaskSchema.
        in: path
        name: workflow_task_schema_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowTaskSchemaInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTaskSchema'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Update WorkflowTaskSchema
      tags:
      - WorkflowTaskSchema
  /workflow-task-schema/{workflow_task_schema_id}/field-definitions/items:
    get:
      description: List SchemaFieldDefinition items.
      operationId: WorkflowTaskSchema.fieldDefinitions.List
      parameters:
      - description: ID of the WorkflowTaskSchema.
        in: path
        name: workflow_task_schema_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/archived.anyOf'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaFieldDefinitionUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List SchemaFieldDefinition items
      tags:
      - WorkflowTaskSchema
  /workflow-task-schema/{workflow_task_schema_id}/validation-rules/items:
    get:
      description: List ValidationRule items.
      operationId: WorkflowTaskSchema.validationRules.List
      parameters:
      - description: ID of the WorkflowTaskSchema.
        in: path
        name: workflow_task_schema_id
        required: true
