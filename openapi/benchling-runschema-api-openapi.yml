      description: 'Defines the configuration for generating input files that drive laboratory automation

        instruments. An AutomationInputFileConfig specifies how to pull sample data from

        Benchling (via rowConfigs with LookupConfig), which columns to include, how to format

        and sort the data, and where to send the generated files (via destinations). The

        configuration supports data transformations (see AutomationTransformConfig) and

        customizable file naming through nameTemplateParts. Input generators using this config

        (see AutomationInputGenerator) produce files in the specified format (delimiter and

        fileExtension) that can be consumed by liquid handlers, plate readers, and other

        automated lab equipment.'
      properties:
        __typename:
          type: string
        columns:
          description: List of columns for input files generated by this configuration
          oneOf:
          - items:
