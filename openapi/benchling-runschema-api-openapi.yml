        delimiter:
          description: Delimiter to use in input files generated by this configuration
          type:
          - 'null'
          - string
        destinations:
          description: Configurations for destinations for input files generated by this configuration
          oneOf:
          - items:
              $ref: '#/components/schemas/AutomationInputFileDestinationInfo'
            type: array
          - type: 'null'
        fileExtension:
          description: Extension to use for input files generated by this configuration
          type:
          - 'null'
          - string
        id:
          type: string
        isHidden:
          description: Whether input generators for this configuration are hidden in the notebook
          type:
          - 'null'
          - boolean
        name:
          description: The name of the AutomationInputFileConfig
          type:
          - 'null'
          - string
        nameTemplateParts:
          description: Configuration for naming input files generated by this configuration
          oneOf:
          - items:
              $ref: '#/components/schemas/AutomationInputFileNamePart'
            type: array
          - type: 'null'
        rowConfigs:
          description: Configurations for the rows of the input files generated by this configuration
          oneOf:
          - items:
              $ref: '#/components/schemas/AutomationInputFileRowConfig'
            type: array
          - type: 'null'
        sortColumns:
          description: List of columns to sort input files generated by this configuration
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        transforms:
          description: Configurations for transforms for input files generated by this configuration
