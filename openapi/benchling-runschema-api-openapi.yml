    AutomationOutputFileConfig:
      description: 'Defines the configuration for processing output files from laboratory automation

        instruments and converting them into Benchling data. An AutomationOutputFileConfig

        specifies the expected file format (columns, delimiter, locale), data transformations

        to apply before processing, and what actions to take with the data: creating or

        updating registered entities (entitySchemaInfo), recording assay results (resultSchemaInfo),

        or creating inventory items (inventorySchemaInfo). Output processors using this config

        (see AutomationOutputProcessor) parse instrument output files and execute the configured

        actions, enabling automated data capture from plate readers, mass spectrometers, and

        other lab equipment.'
      properties:
        __typename:
          type: string
        allowMissingSource:
          description: Whether to allow some source values to be missing in the output file to be processed
          type:
          - 'null'
          - boolean
        automationOutputFileTableType:
          description: 'Type for the notebook table produced by processing output files with this configuration.

            GRID for one row per box/plate, SAMPLE for one row per sample.'
          enum:
          - GRID
          - SAMPLE
          - null
          type:
          - 'null'
          - string
        columns:
          description: 'List of columns for output files to be processed by this configuration.

            Either "columns" or "namedColumnTypes", but not both, must be provided.'
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        concentrationUnits:
          description: Units with which to interpret any concentration values in output files processed by this configuration.
          type:
          - 'null'
          - string
        datasetNameTemplateParts:
          description: Configuration for naming output datasets generated by this configuration
          oneOf:
          - items:
              $ref: '#/components/schemas/AutomationInputFileNamePart'
            type: array
          - type: 'null'
        delimiter:
          description: Delimiter to use in transform files generated by this configuration
          type:
          - 'null'
