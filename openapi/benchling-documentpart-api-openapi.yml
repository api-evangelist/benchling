          type:
          - 'null'
          - string
        parts:
          description: The parts of the Entry
          format: uri
          type: string
        review:
          description: 'The active review for this entry, if one exists. Returns a Review object with status,

            reviewers, review process, and review history. Null when the entry has not been sent

            for review or the review has been retracted.'
          oneOf:
          - $ref: '#/components/schemas/ReviewRef'
          - type: 'null'
        reviewSource:
          $ref: '#/components/schemas/ProjectRef'
          description: The project that this entry belongs to, used to determine which review processes apply.
        schema:
          description: Entry schema if set
          oneOf:
          - $ref: '#/components/schemas/EntrySchemaRef'
          - type: 'null'
        sections:
          description: The sections of the entry
          oneOf:
          - items:
              $ref: '#/components/schemas/EntrySection'
            type: array
          - type: 'null'
        selectors:
          description: Selectors available to table cells in this entry.
          items:
            $ref: '#/components/schemas/TableCellSelector'
          type: array
        versionMetadata:
          $ref: '#/components/schemas/DocumentLikeVersionMetadata'
          description: Version metadata for the current version of this Entry.
      type: object
    RegistryRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    IOligoConjugate:
      description: 'An oligo conjugate is a specific type of complex polymer that consists of a single short DNA/RNA strand with

        multiple attached molecules (aka conjugates).'
      properties:
        __typename:
          type: string
        aliases:
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        backbone:
          oneOf:
          - $ref: '#/components/schemas/NucleotideSimplePolymer'
          - type: 'null'
        canonicalHelm:
          type: string
        conjugates:
          oneOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/NucleotideSimplePolymer'
              - $ref: '#/components/schemas/ChemSimplePolymer'
              description: Union of NucleotideSimplePolymer, ChemSimplePolymer
              discriminator:
                propertyName: __typename
            type: array
          - type: 'null'
        createdAt:
          format: datetime
          type: string
        customFields:
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityAssociations:
          items:
            $ref: '#/components/schemas/EntityAssociation'
          type: array
        entityRegistryId:
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        id:
          type: string
        modifiedAt:
          format: datetime
          type: string
        name:
          type: string
        originalHelm:
          type:
          - 'null'
          - string
        outOfSync:
          type: boolean
        outOfSyncReason:
          type:
          - 'null'
          - string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          $ref: '#/components/schemas/EntitySchemaRef'
        structure:
          $ref: '#/components/schemas/ComplexPolymerStructure'
      type: object
    TableCellSelector:
      description: A predefined dropdown selector that can be assigned to table cells.
      properties:
        __typename:
          type: string
        name:
          type: string
        options:
          items:
            type: string
          type: array
        selectorId:
          description: Identifier for this selector within the container. Matches `TableCell.selectorId`.
          type: string
      type: object
    SchemaFieldDefinitionRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ObjectLinkListValue:
      description: A type that represents a list of links to other objects.
      properties:
        __typename:
          type: string
        value:
          description: The list of objects that this value links to. Inaccessible objects may be returned instead if the object is not found with the current permission set.
          items:
            $ref: '#/components/schemas/ObjectRef'
            description: Union of AaSequence, Box, Container, CustomEntity, DnaSequence, DropdownOption, Entry, Location, Mixture, Molecule, Plate, Result, RnaSequence, Run, DnaOligo, RnaOligo
          type: array
      type: object
    HeaderDocumentContent:
      description: 'Represents a heading block within notebook or document content.

        Headers store the heading level, rich text, and indentation used to organize document sections.'
      properties:
        __typename:
          type: string
        formats:
          items:
            $ref: '#/components/schemas/TextFormat'
          type: array
        headerType:
          enum:
          - HEADER_1
          - HEADER_2
          - SUBHEADER_1
          type: string
        indentation:
          type: integer
        links:
          items:
            $ref: '#/components/schemas/LinkSpan'
          type: array
        mentions:
          items:
            $ref: '#/components/schemas/Mention'
          type: array
        text:
          type: string
      type: object
    UnstructuredTableDocumentContentSummary:
      description: 'An unstructured (plain) table embedded within a notebook entry. Unlike structured

        tables, unstructured tables have freeform cells without typed columns. Cells can

        contain text, formulas with evaluated values, formatting, and merged regions.

        This is the summary representation and excludes row data. It is returned when

        retrieving a particular document part (e.g. from the document_part GET endpoint).

        Unstructured table mutation endpoints are currently in closed LA.'
      properties:
        __typename:
          type: string
        columnDefinitions:
          items:
            $ref: '#/components/schemas/TableColumnDefinition'
          type: array
        indentation:
          type: integer
        isEvaluated:
          type: boolean
        name:
          type: string
        rowCount:
          type: integer
      type: object
    NucleotideSequenceRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    UnresolvableEmbeddedItem:
      description: 'An embedded Benchling item that exists in the system but cannot be fetched via the V3 REST API

        (currently Protocols, Equipment, and Trial Subjects). It has no API endpoint; the `id` is

        provided for informational purposes only, so that the reference can be preserved (e.g. when a

        document part is copied between entries).'
      properties:
        __typename:
          type: string
        id:
          description: The API identifier of the embedded item.
          type: string
      type: object
    EntityAssociation:
      description: 'Every entity association maps a Benchling entity to one or more HELM references in the complex polymer.

        These HELM polymers each have the same chemical structure as the Benchling entity.


        For example, if a molecule entity maps to two CHEM polymers, it means that the molecule appears twice in the complex polymer.'
      properties:
        __typename:
          type: string
        entity:
          $ref: '#/components/schemas/ObjectRef'
          description: Union of RnaOligo, DnaOligo, RnaSequence, DnaSequence, Molecule, AaSequence
        polymerRefs:
          description: HELM polymer references identifying which polymers in the structure correspond to this entity.
          items:
            type: string
          type: array
      type: object
    AttachmentDocumentContent:
      description: 'Represents an external file attachment embedded in notebook or document content.

        Attachments expose file metadata, a temporary download URL, and indentation within the document.'
      properties:
        __typename:
          type: string
        customWidth:
          description: The custom width in pixels, if set, or null.
          type:
          - 'null'
          - integer
        downloadUrl:
          description: A presigned URL to download the attachment.
          type: string
        downloadUrlExpiresAt:
          description: When the download URL expires (ISO 8601 datetime).
          format: datetime
          type: string
        externalFileId:
          description: The external file ID for this attachment (e.g., efl_XXXXX).
          type: string
        filename:
          description: The filename of the attachment.
          type: string
        indentation:
          type: integer
        size:
          description: The file size in bytes.
          type: integer
      type: object
    RunRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    DateValue:
      description: A type that represents date values.
      properties:
        __typename:
          type: string
        value:
          description: The date value.
          format: date
          type: string
      type: object
    BooleanValue:
      description: A type that represents boolean values.
      properties:
        __typename:
          type: string
        value:
          description: The boolean value.
          type: boolean
      type: object
    PeptideSimplePolymer:
      description: 'Represents a peptide or protein chain within a complex polymer structure. Contains the amino acid residue

        sequence and connections to other polymers. The entity field links to a corresponding `AaSequence`. Used when

        protein/aa-sequence components are part of larger bioconjugate structures.'
      properties:
        __typename:
          type: string
        connections:
          items:
            $ref: '#/components/schemas/ComplexPolymerConnection'
          type: array
        entity:
          $ref: '#/components/schemas/AaSequenceRef'
        helmReference:
          type: string
        polymerType:
          type: string
        residues:
          type: string
      type: object
    ICustomEntity:
      properties:
        __typename:
          type: string
        aliases:
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        customFields:
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityRegistryId:
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        id:
          type: string
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          type:
          - 'null'
          - string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          oneOf:
          - $ref: '#/components/schemas/EntitySchemaRef'
          - type: 'null'
      type: object
    DocumentLikeRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    NucleotideMonomerRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    SectionDocumentContent:
      description: 'Represents a section divider within notebook or document content.

        Sections can include a title, date, and color to group related document parts.'
      properties:
        __typename:
          type: string
        color:
          enum:
          - DEFAULT
          - RED
          - ORANGE
          - YELLOW
          - GREEN
          - BLUE
          - INDIGO
          - VIOLET
          - CONTRAST_GREY
          - CONTRAST_RED
          - CONTRAST_ORANGE
          - CONTRAST_YELLOW
          - CONTRAST_GREEN
          - CONTRAST_BLUE
          - CONTRAST_INDIGO
          - CONTRAST_VIOLET
          - null
          type:
          - 'null'
          - string
        date:
          format: date
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
      type: object
    Entry:
      allOf:
      - $ref: '#/components/schemas/IEntry'
      - description: 'An Entry is the core document type in Benchling''s Electronic Lab Notebook (ELN), used

          by scientists to record experimental work and observations. Entries are organized into

          sections (days) containing various content types such as text, tables, file attachments,

          and structured data tables for results. Entries support rich collaboration features

          including authorship tracking, review workflows (see `Review` and `ReviewProcess`),

          access control through Projects and Folders, and can be linked to Studies. Entries may

          optionally conform to an `EntrySchema` that defines custom fields. They can be created

          from scratch or from an `EntryTemplate` to ensure consistent structure. Entry mutation

          endpoints are currently in closed LA.'
        properties:
          __typename:
            type: string
          authors:
            description: 'Array of User Resources of the authors of the entry. This defaults to

              the creator but can be manually changed.'
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            description: User Resource of the user who created the entry
            oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    NucleotideAnnotation:
      description: 'Represents a biological feature annotation on a nucleotide sequence (DNA or RNA). Annotations

        mark regions of interest such as genes, promoters, terminators, regulatory elements, or other

        functionally significant sequences. Each annotation specifies a position range (start/end),

        strand orientation, feature type classification, display color, and descriptive notes.

        Annotations appear as visual overlays on the sequence viewer and can be created manually,

        imported from standard formats like GenBank, or generated automatically using FeatureLibraries.'
      properties:
        __typename:
          type: string
        color:
          description: Hex color when displaying the annotation.
          type: string
        end:
          description: '0-based exclusive end index. For ranges ending at the end of a circular sequence, this value is

            always the length of the sequence, never 0.'
          type: integer
        name:
          description: Name of the annotation.
          type: string
        notes:
          description: Text notes on the annotation.
          type: string
        start:
          description: 0-based inclusive start index.
          type: integer
        strand:
          description: Strand for this annotation; 1 for forward strand, -1 for reverse strand, and 0 for no strand.
          type: integer
        type:
          description: Feature type of the annotation.
          type:
          - 'null'
          - string
      type: object
    TableColumnDefinition:
      description: A column definition within a table, specifying the label and optional width.
      properties:
        __typename:
          type: string
        isLocked:
          type: boolean
        name:
          type: string
        width:
          description: Column width in pixels. Default is 100.
          type:
          - 'null'
          - number
      type: object
    IntegerValue:
      description: A type that represents integer values.
      properties:
        __typename:
          type: string
        value:
          description: The integer value.
          type: integer
      type: object
    GeneralError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    DocumentPartPaginatedList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/DocumentPart'
          type: array
        nextToken:
          type: string
      type: object
    OligoDuplex:
      allOf:
      - $ref: '#/components/schemas/IOligoDuplex'
      - description: 'An oligo duplex is a therapeutic modality consisting of two complementary

          oligonucleotide strands (forward and reverse) with optional conjugate molecules

          attached to either strand. The classic example is siRNA (small interfering RNA),

          which uses double-stranded RNA for gene silencing. The forwardStrand and reverseStrand

          reference the underlying oligo entities, with hydrogen bonds automatically computed

          for base pairing. Structure is defined using HELM notation and can be edited via

          the visual structure editor. Supports versioning (see OligoDuplexVersion) to track

          changes over time.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            $ref: '#/components/schemas/PrincipalRef'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    Protein:
      allOf:
      - $ref: '#/components/schemas/IProtein'
      - description: 'A Protein is a complex biomolecule entity in Benchling representing immunoglobulins or

          related therapeutic proteins like T-cell receptors. Proteins are defined by an

          `ProteinFormat` that specifies their structural organization, with actual sequences

          provided in domains (see `ProteinDomain`) and chains (see `ProteinChain`). Proteins support versioning

          through history/fullHistory, allowing tracking of structural changes over time. As registry entities,

          proteins can have schemas with custom fields, belong to projects and folders, and be linked to studies.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            $ref: '#/components/schemas/PrincipalRef'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    RnaSequenceRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    IDnaSequence:
      properties:
        __typename:
          type: string
        aliases:
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        annotations:
          description: 'Annotations on the DNA sequence, not including translations or primers. Annotations on parts are

            not included.'
          items:
            $ref: '#/components/schemas/NucleotideAnnotation'
          type: array
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        bases:
          description: Bases of the forward strand of the DNA sequence.
          type: string
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        customFields:
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityRegistryId:
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        id:
          type: string
        isCircular:
          description: Whether the DNA sequence is circular or linear.
          type: boolean
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          type: string
        parts:
          description: Part features on the DNA sequence.
          format: uri
          type: string
        primers:
          description: Primer bind features on the DNA sequence. Primers on parts are not included.
          items:
            $ref: '#/components/schemas/Primer'
          type: array
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          oneOf:
          - $ref: '#/components/schemas/EntitySchemaRef'
          - type: 'null'
        startIndex:
          description: Starting index for the sequence residues of linear DNA sequences. Implicitly 1 for other sequence types.
          type: integer
        transcriptions:
          description: Transcriptions, derived from schema field data.
          items:
            $ref: '#/components/schemas/Transcription'
          type: array
        translations:
          description: 'Translation annotations present on the DNA sequence. Translations may be one region or split

            across multiple regions. Translations on parts are not included.'
          items:
            $ref: '#/components/schemas/Translation'
          type: array
      type: object
    IProtein:
      properties:
        __typename:
          type: string
        aliases:
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        chains:
          description: The chains and associated amino acid sequences on the protein.
          items:
            $ref: '#/components/schemas/ProteinChain'
          type: array
        createdAt:
          format: datetime
          type: string
        customFields:
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        domains:
          description: The domains and associated amino acid sequences on the protein.
          items:
            $ref: '#/components/schemas/ProteinDomain'
          type: array
        entityRegistryId:
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        format:
          $ref: '#/components/schemas/ProteinFormatRef'
          description: The protein format that defines the structure (domains, chains, interactions) for the protein.
        fullHistory:
          description: '`fullHistory` is a superset of `history` that also returns inactive versions that are not part of the

            current version history. Versions are returned in chronological order (oldest first).'
          format: uri
          type: string
        history:
          description: 'Only the currently active version lineage, in chronological order (oldest first).


            If a change was made and then undone by resetting to an earlier version, the version recording

            that change is not relevant to the current state of the entity, so it is not included in this listing.'
          format: uri
          type: string
        id:
          type: string
        modifiedAt:
          format: datetime
          type: string
        name:
          type: string
        outOfSync:
          description: Indicates if constituent domain or chain entities have changed since the protein was last updated.
          type: boolean
        outOfSyncReason:
          description: Any additional information about why the protein is out of sync.
          type:
          - 'null'
          - string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          $ref: '#/components/schemas/EntitySchemaRef'
      type: object
    EntryContent:
      description: 'Represents a single content item within an EntrySection. The `type` field indicates

        what kind of content this is (see `ContentType`). This provides a simplified view of

        entry content categorization.'
      properties:
        __typename:
          type: string
        type:
          enum:
          - TEXT
          - LIST_ITEM
          - HEADER
          - CODE_BLOCK
          - UNSTRUCTURED_TABLE
          - PLACEHOLDER
          - EXTERNAL_FILE
          - ASSAY_RUN
          - STRUCTURED_TABLE
          - OTHER
          - null
          type:
          - 'null'
          - string
      type: object
    IAaSequence:
      properties:
        __typename:
          type: string
        aliases:
          description: Array of aliases
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        aminoAcids:
          description: Amino acids of the AA sequence.
          type: string
        annotations:
          description: Array of annotation objects on the AA sequence.
          items:
            $ref: '#/components/schemas/AaAnnotation'
          type: array
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        createdAt:
          description: DateTime the AA sequence was created.
          format: datetime
          type:
          - 'null'
          - string
        customFields:
          description: Custom fields set on the AA sequence.
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityRegistryId:
          description: Registry ID of the AA sequence if registered.
          type:
          - 'null'
          - string
        folder:
          description: ID of the folder that contains the AA sequence.
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        id:
          description: ID of the AA sequence.
          type: string
        modifiedAt:
          description: DateTime the AA sequence was last modified.
          format: datetime
          type:
          - 'null'
          - string
        name:
          description: Name of the AA sequence.
          type: string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          description: Registry the AA sequence is registered in.
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          oneOf:
          - $ref: '#/components/schemas/EntitySchemaRef'
          - type: 'null'
      type: object
    NucleotideSimplePolymer:
      description: 'Represents a nucleic acid strand (DNA or RNA) within a complex polymer structure. Contains the sequence

        residues, any chemical modifications (see ModifiedNucleotide), and connections to other polymers. The entity

        field links to a corresponding DnaSequence, RnaSequence, DnaOligo, or RnaOligo. Used as the backbone component

        in OligoConjugate and as forward/reverse strands in OligoDuplex.'
      properties:
        __typename:
          type: string
        connections:
          items:
            $ref: '#/components/schemas/ComplexPolymerConnection'
          type: array
        entity:
          $ref: '#/components/schemas/NucleotideSequenceRef'
        helmReference:
          type: string
        modifications:
          description: Chemical modifications applied at specific positions on this strand.
          items:
            $ref: '#/components/schemas/ModifiedNucleotide'
          type: array
        nucleotideType:
          description: Whether this strand is DNA or RNA.
          enum:
          - DNA
          - RNA
          type: string
        polymerType:
          type: string
        residues:
          description: The nucleotide base sequence of this strand.
          type: string
      type: object
    BenchlingItemDocumentContent:
      description: Represents a Benchling item embedded in notebook or document content, identifying the referenced Benchling object.
      properties:
        __typename:
          type: string
        embeddedItem:
          description: 'The embedded item, resolved to its concrete `DocumentEmbeddable` type (e.g. `DnaSequence`,

            `CustomEntity`, `Protein`, `OligoConjugate`, `OligoDuplex`). Items that cannot be fetched via

            the V3 REST API (currently Protocols, Equipment, and Trial Subjects) resolve to

            `UnresolvableEmbeddedItem`, which exposes only the item''s id.'
          oneOf:
          - $ref: '#/components/schemas/DocumentEmbeddable'
          - type: 'null'
        indentation:
          type: integer
      type: object
    ArrayValue:
      description: A type that represents a list of BenchlingValues, used for multi-value cells (e.g. alias columns).
      properties:
        __typename:
          type: string
        value:
          items:
            anyOf:
            - $ref: '#/components/schemas/BooleanValue'
            - $ref: '#/components/schemas/DateTimeValue'
            - $ref: '#/components/schemas/DateValue'
            - $ref: '#/components/schemas/DecimalValue'
            - $ref: '#/components/schemas/IntegerValue'
            - $ref: '#/components/schemas/JsonValue'
            - $ref: '#/components/schemas/ObjectLinkValue'
            - $ref: '#/components/schemas/ObjectLinkListValue'
            - $ref: '#/components/schemas/TextAndUrlValue'
            - $ref: '#/components/schemas/TextValue'
            description: Union of BooleanValue, DateTimeValue, DateValue, DecimalValue, IntegerValue, JsonValue, ObjectLinkValue, ObjectLinkListValue, TextAndUrlValue, TextValue
            discriminator:
              propertyName: __typename
          type: array
      type: object
    TextDocumentContent:
      description: 'Represents a paragraph of formatted text content within a notebook entry or document.

        TextDocumentContent is the primary way to store narrative text in the electronic lab notebook.

        The text can include rich formatting (see `TextFormat` for bold, italic, etc.), hyperlinks

        (see `LinkSpan`), and inline mentions of other Benchling items (see `Mention`). Multiple

        `TextDocumentContent` blocks form the body of a notebook entry between section headers and

        other structured content.'
      properties:
        __typename:
          type: string
        formats:
          items:
            $ref: '#/components/schemas/TextFormat'
          type: array
        indentation:
          type: integer
        links:
          items:
            $ref: '#/components/schemas/LinkSpan'
          type: array
        mentions:
          items:
            $ref: '#/components/schemas/Mention'
          type: array
        text:
          type: string
      type: object
    MoleculeRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    TextBoxDocumentContent:
      description: 'Represents a fill-in text box within a notebook entry. Text boxes are labeled input fields

        that can be added to entry templates to capture specific pieces of information. They support

        rich text formatting including bold, italic, links, and mentions. Text boxes can optionally

        be submitted/finalized to lock their content.


        The `text` field contains the raw text with mentions represented as zero-width positions.

        All position-based fields are indices into this raw text.'
      properties:
        __typename:
          type: string
        formats:
          description: Text formatting applied to ranges within the text. Positions are indices into the raw `text` field.
          items:
            $ref: '#/components/schemas/TextFormat'
          type: array
        indentation:
          type: integer
        isSubmittable:
          description: Whether this text box can currently be submitted.
          type: boolean
        links:
          description: Hyperlinks applied to ranges within the text. Positions are indices into the raw `text` field.
          items:
            $ref: '#/components/schemas/LinkSpan'
          type: array
        mentions:
          description: Inline mentions of other Benchling items. Each mention's position is an index into the raw `text` field.
          items:
            $ref: '#/components/schemas/Mention'
          type: array
        name:
          description: The label/name of the text box.
          type: string
        submissionStatus:
          description: Whether this text box has been submitted, has unsubmitted changes, or is unsubmitted.
          enum:
          - UNSUBMITTED
          - SUBMITTED
          - HAS_UNSUBMITTED_CHANGES
          type: string
        text:
          description: The raw text content. Mentions are represented as zero-width positions; use the `mentions` field to get the referenced items and their positions.
          type: string
      type: object
    ConnectionSide:
      description: 'Represents one endpoint of a connection between polymers in a complex polymer structure.

        Identifies the specific attachment point including the polymer reference, residue position

        (for sequences), modification type (for nucleotides), and R-group number (for specific

        attachment sites on monomers). Each ComplexPolymerConnection has a source and target

        ConnectionSide defining the two endpoints of the bond.'
      properties:
        __typename:
          type: string
        modificationType:
          description: 'Benchling has no concept of monomer index like HELM does, so specifying the modification type is our way

            of telling the particular monomer for an attachment on a nucleotide polymer.


            For non-nucleotide polymers, this is always null since we would only have one monomer at a particular

            index.'
          enum:
          - SUGAR
          - BASE
          - PHOSPHATE
          - null
          type:
          - 'null'
          - string
        polymerRef:
          description: The ref of the simple polymer connected at this attachment point.
          type: string
        rGroup:
          description: 'The r-group number designates the specific attachment site on the monomer used by this connection.

            If not null, always >= 1.'
          type:
          - 'null'
          - integer
        residueIndex:
          description: 'For sequence types, the index of the residue at this attachment point.


            residueIndex is always 0 or null for CHEM polymers since we never have more than one "residue".'
          type:
          - 'null'
          - integer
      type: object
    ModifiedNucleotide:
      description: 'Represents a chemically modified nucleotide at a specific position in an oligonucleotide

        sequence. Each modification specifies the sugar, base, and phosphate monomers (see NucleotideMonomer)

        that replace or modify the natural nucleotide at that position. Common modifications include

        2''-O-methyl sugars for stability, phosphorothioate backbones for nuclease resistance, or

        modified bases for binding affinity. Used in NucleotideSimplePolymer to capture the

        modification pattern of therapeutic oligonucleotides.'
      properties:
        __typename:
          type: string
        baseMonomer:
          $ref: '#/components/schemas/NucleotideMonomerRef'
          description: The base monomer for the modification.
        createdAt:
          description: DateTime the modification was created.
          format: datetime
          type: string
        id:
          description: The ID of the modified nucleotide.
          type: string
        nucleotideSequence:
          $ref: '#/components/schemas/NucleotideSequenceRef'
          description: The nucleotide sequence that this modification belongs to.
        phosphateMonomer:
          description: The phosphate monomer for the modification. If empty, it represents a null phosphate at the 5' end of the sequence.
          oneOf:
          - $ref: '#/components/schemas/NucleotideMonomerRef'
          - type: 'null'
        position:
          description: 0-based index of the modification.
          type: integer
        sugarMonomer:
          $ref: '#/components/schemas/NucleotideMonomerRef'
          description: The sugar monomer for the modification.
      type: object
    TextFormat:
      description: 'A TextFormat applies a set of TextFormatProperties to some range within a text.


        Examples here would include font properties like bold, italic or underline as well as text color.'
      properties:
        __typename:
          type: string
        backgroundColor:
          type:
          - 'null'
          - string
        end:
          description: The index where we should stop applying a format (exclusive).
          type: integer
        foregroundColor:
          type:
          - 'null'
          - string
        properties:
          description: A span of content can have multiple TextFormatProperty specified.
          items:
            enum:
            - BOLD
            - ITALIC
            - UNDERLINE
            - STRIKETHROUGH
            - SUBSCRIPT
            - SUPERSCRIPT
            - MONOSPACE
            type: string
          type: array
        start:
          description: The index where we should start to apply a format (inclusive).
          type: integer
      type: object
    EntrySection:
      description: 'Represents a logical section within an Entry used to organize content into collapsible

        groups. While sections include a date field and were historically known as "Entry Days,"

        they are flexible groupings that users can organize however they want—chronologically,

        thematically, or by any other criteria. Each section may have a title, date, and contains a

        list of content items (see `EntryContent`) such as text blocks, tables, and attachments.

        Sections are collapsible in the UI, which helps when rendering large notebook entries.'
      properties:
        __typename:
          type: string
        contents:
          oneOf:
          - items:
              $ref: '#/components/schemas/EntryContent'
            type: array
          - type: 'null'
        date:
          type:
          - 'null'
          - string
        provenanceUuid:
          type: string
        title:
          type:
          - 'null'
          - string
      type: object
    ObjectRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    RunDocumentContent:
      description: 'Represents a run embedded in notebook or document content.

        Run content connects a document part to its run schema and, when available, the specific run.'
      properties:
        __typename:
          type: string
        indentation:
          type: integer
        run:
          oneOf:
          - $ref: '#/components/schemas/RunRef'
          - type: 'null'
        runSchema:
          $ref: '#/components/schemas/RunSchemaRef'
      type: object
    TextValue:
      description: A type that represents text (string) values.
      properties:
        __typename:
          type: string
        value:
          description: The text value. It may or may not be an empty string.
          type: string
      type: object
    IOligoDuplex:
      description: 'An oligo duplex is a specific type of complex polymer that consists of two complementary DNA/RNA strands, with

        multiple attached molecules on either strand (aka conjugates).'
      properties:
        __typename:
          type: string
        aliases:
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        canonicalHelm:
          type: string
        conjugates:
          oneOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/NucleotideSimplePolymer'
              - $ref: '#/components/schemas/ChemSimplePolymer'
              description: Union of NucleotideSimplePolymer, ChemSimplePolymer
              discriminator:
                propertyName: __typename
            type: array
          - type: 'null'
        createdAt:
          format: datetime
          type: string
        customFields:
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityAssociations:
          items:
            $ref: '#/components/schemas/EntityAssociation'
          type: array
        entityRegistryId:
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        forwardOffset:
          type:
          - 'null'
          - integer
        forwardStrand:
          oneOf:
          - $ref: '#/components/schemas/NucleotideSimplePolymer'
          - type: 'null'
        id:
          type: string
        modifiedAt:
          format: datetime
          type: string
        name:
          type: string
        originalHelm:
          type:
          - 'null'
          - string
        outOfSync:
          type: boolean
        outOfSyncReason:
          type:
          - 'null'
          - string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        reverseStrand:
          oneOf:
          - $ref: '#/components/schemas/NucleotideSimplePolymer'
          - type: 'null'
        schema:
          $ref: '#/components/schemas/EntitySchemaRef'
        structure:
          $ref: '#/components/schemas/ComplexPolymerStructure'
      type: object
  parameters:
    modifiedAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified after the specified time. e.g. > 2017-04-30.
      in: query
      name: modifiedAt.gt
      schema:
        format: datetime
        type: string
    id.anyOf:
      description: Restricts results to those matching any of the specified IDs. Comma-separated list.
      explode: false
      in: query
      name: id.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    modifiedAt.gte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified at or after the specified time. e.g. >= 2017-04-30.
      in: query
      name: modifiedAt.gte
      schema:
        format: datetime
        type: string
    omit:
      description: Comma-separated list of top-level fields to omit from each returned item. Cannot overlap with returning.
      explode: false
      in: query
      name: omit
      schema:
        items:
          type: string
        type: array
    nextToken:
      description: Token for pagination
      in: query
      name: nextToken
      schema:
        type: string
    pageSize:
      description: Number of results to return. Defaults to 50, maximum of 100.
      in: query
      name: pageSize
      schema:
        type: integer
    modifiedAt.lte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified at or before the specified time. e.g. <= 2017-04-30.
      in: query
      name: modifiedAt.lte
      schema:
        format: datetime
        type: string
    modifiedAt.lt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified before the specified time. e.g. < 2017-04-30.
      in: query
      name: modifiedAt.lt
      schema:
        format: datetime
        type: string
    returning:
      description: Comma-separated list of top-level fields to include in each returned item. Cannot overlap with omit.
      explode: false
      in: query
      name: returning
      schema:
        items:
          type: string
        type: array
  responses:
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Too Many Requests
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Bad Request
    InternalServerError:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
      description: Internal Server Error
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Not Found
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Forbidden
  securitySchemes:
    basicApiKeyAuth:
      description: Use issued API key for standard access to the API
      scheme: basic
      type: http
    basicClientIdSecretAuth:
      description: Auth used as part of client credentials OAuth flow prior to receiving a bearer token.
      scheme: basic
      type: http
    oAuth:
      description: OAuth2 Client Credentials flow intended for service access
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: /oauth/token
      type: oauth2
