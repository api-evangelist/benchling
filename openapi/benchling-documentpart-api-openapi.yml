openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Document Part API
  version: 2.0.0
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- name: DocumentPart
paths:
  /document-part-unstructured-table/{doc_part_id}:
    get:
      description: 'Inline rows and row paging on this operation are deprecated. The operation itself remains.

        Use GET /document-part-unstructured-table/{document_part_unstructured_table_id}/rows/items to list rows.

        After removal, `rows` is a link to that list instead of an inline array, the `pageSize` and `nextToken` query parameters are no longer accepted, and the response no longer includes the top-level `nextToken` and `pageSize`.


        Return the unstructured table content for a DocumentPart that is an unstructured table.

        Return 404 if the document part does not exist.

        Return 400 if the document part is not an unstructured table.


        Rows are paginated: pass `pageSize` and the `nextToken` from the previous response to page

        through rows. Each row carries its absolute `rowIndex`.'
      operationId: DocumentPartUnstructuredTable.Get
      parameters:
      - in: path
        name: doc_part_id
        required: true
        schema:
          type: string
      - deprecated: true
        description: Maximum number of table rows to return in a single page.
        in: query
        name: pageSize
        schema:
          default: 1000
          maximum: 1000
          minimum: 1
          type: integer
      - deprecated: true
        description: Page token from a previous response, used to fetch the next page of rows.
        in: query
        name: nextToken
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DocumentPartUnstructuredTableDetail'
                - properties:
                    documentParent:
                      $ref: '#/components/schemas/ObjectRef'
                    nextToken:
                      deprecated: true
                      description: 'Opaque cursor for the next page of rows. Null when there are no more rows.

                        Note: a merge anchor cell may reside on an earlier page than its child cells.

                        '
                      type:
                      - string
                      - 'null'
                    pageSize:
                      deprecated: true
                      description: The page size applied to this response.
                      type: integer
                    rows:
                      deprecated: true
                      description: Deprecated. Will become a link to the table's rows list. List rows with GET /document-part-unstructured-table/{document_part_unstructured_table_id}/rows/items.
                  type: object
                type: object
          description: Unstructured table content
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get unstructured table content for a document part
      tags:
      - DocumentPart
    patch:
      deprecated: true
      description: 'Deprecated. Use the document `partsMutation` operations instead:

        - To edit cell content, use the `update_table_cells` operation.

        - To append rows, use the `insert_table_rows` operation.

        - To change columns or merged cells, delete the table with the `delete` operation and

        re-create it with the updated data using the `insert` operation.


        Update an unstructured table''s column definitions and cell content.

        All row and column indices in this endpoint are 0-based.

        Both columnDefinitions and rows are optional; omitting either preserves the existing values.

        When provided, they fully replace the existing values with no per-field carry-forward.

        Cells in locked columns cannot be modified; lock enforcement uses the post-mutation

        column state, so unlocking a column and editing its cells can be done in a single request.

        When adding rows to a table with locked columns, the new rows'' locked-column cells must be empty.

        Requires versionId for optimistic concurrency; returns 409 on stale version.

        Returns 400 if the document part is not an unstructured table or validation fails.'
      operationId: DocumentPartUnstructuredTable.Update
      parameters:
      - in: path
        name: doc_part_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            example:
              columnDefinitions:
              - name: Sample ID
              - name: Value
              rows:
              - cells:
                - inputValue:
                    type: text_value
                    value: SMPL_001
                - format:
                    backgroundColor: '#FDC68A'
                  inputValue:
                    type: text_value
                    value: ='DataTable'!A1 * 100
              - cells:
                - format:
                    link: https://benchling.com/
                  inputValue:
                    type: text_value
                    value: SMPL_002
                - inputValue:
                    type: text_value
                    value: '124.600'
              versionId: etrver_Ax7b2kR9
            schema:
              properties:
                caption:
                  description: 'The table''s caption. Omit to preserve the existing caption. Set to null to clear the caption.

                    '
                  nullable: true
                  properties:
                    formats:
                      items:
                        properties:
                          backgroundColor:
                            nullable: true
                            type: string
                          end:
                            type: integer
                          foregroundColor:
                            nullable: true
                            type: string
                          properties:
                            items:
                              enum:
                              - BOLD
                              - ITALIC
                              - UNDERLINE
                              - STRIKETHROUGH
                              - SUBSCRIPT
                              - SUPERSCRIPT
                              - MONOSPACE
                              type: string
                            type: array
                          start:
                            type: integer
                        type: object
                      type: array
                    links:
                      items:
                        properties:
                          end:
                            type: integer
                          start:
                            type: integer
                          url:
                            type: string
                        type: object
                      type: array
                    mentions:
                      items:
                        properties:
                          itemId:
                            minLength: 1
                            type: string
                          position:
                            type: integer
                        type: object
                      type: array
                    text:
                      type: string
                  required:
                  - text
                  type: object
                columnDefinitions:
                  description: 'Column definitions for the table. Omit to preserve existing columns. When provided, fully replaces all column definitions; omitted fields on each column definition default to null (not the existing value).

                    '
                  items:
                    properties:
                      isLocked:
                        type: boolean
                      name:
                        nullable: true
                        type: string
                      width:
                        nullable: true
                        type: integer
                    type: object
                  type: array
                name:
                  description: 'Display name of the table. Must be non-empty, at most 100 characters, and unique within the document. Omit to preserve the existing name.

                    '
                  type: string
                rows:
                  description: 'Row data for the table. Omit to preserve existing rows. When provided, fully replaces all rows with no per-cell carry-forward of format, selectorId, or other fields from the existing table.

                    '
                  items:
                    properties:
                      cells:
                        items:
                          description: 'A cell is one of three variants:

                            - Value cell: inputValue object; mergeRange and mergeRangeParent both null or omitted.

                            - Anchor cell: inputValue object and mergeRange object; mergeRangeParent null or omitted. Defines the top-left of a merged region.

                            - Child cell: mergeRangeParent object; mergeRange null or omitted and inputValue empty. References the anchor cell that owns this position.

                            mergeRange and mergeRangeParent are optional; omitting either field is equivalent to sending null (clears the value).

                            '
                          properties:
                            format:
                              description: 'Cell formatting. If provided, fully replaces any existing format. Set to null, an empty object, or omit to clear all formatting.

                                '
                              nullable: true
                              properties:
                                alignment:
                                  enum:
                                  - LEFT
                                  - CENTER
                                  - RIGHT
                                  nullable: true
                                  type: string
                                backgroundColor:
                                  description: 'Hex color code (#RGB or #RRGGBB).'
                                  nullable: true
                                  type: string
                                foregroundColor:
                                  description: 'Hex color code (#RGB or #RRGGBB).'
                                  nullable: true
                                  type: string
                                link:
                                  nullable: true
                                  type: string
                                properties:
                                  items:
                                    enum:
                                    - BOLD
                                    - ITALIC
                                    - UNDERLINE
                                    - STRIKETHROUGH
                                    - IMPORTANT
                                    type: string
                                  type: array
                              type: object
                            inputValue:
                              description: The cell's input value. For unstructured tables this is always a TextValue.
                              properties:
                                type:
                                  enum:
                                  - text_value
                                  type: string
                                value:
                                  type: string
                              required:
                              - type
                              - value
                              type: object
                            mergeRange:
                              description: 'Defines this cell as the anchor of a merged region with the given row and column span. Send null to clear any existing merge anchor. Omitting is equivalent to null.

                                '
                              nullable: true
                              properties:
                                mergeColSpan:
                                  minimum: 1
                                  type: integer
                                mergeRowSpan:
                                  minimum: 1
                                  type: integer
                              required:
                              - mergeRowSpan
                              - mergeColSpan
                              type: object
                            mergeRangeParent:
                              description: 'Marks this cell as a merge child belonging to the anchor at the given (row, col). Send null to clear any existing merge parent. Omitting is equivalent to null.

                                '
                              nullable: true
                              properties:
                                col:
                                  type: integer
                                row:
                                  type: integer
                              required:
                              - row
                              - col
                              type: object
                            selectorId:
                              description: 'Id of a TableCellSelector on the parent entry or template. Set to assign a dropdown selector to this cell. Set to null or omit to clear the selector reference.

                                '
                              nullable: true
                              type: string
                          required:
                          - inputValue
                          type: object
                        type: array
                    required:
                    - cells
                    type: object
                  type: array
                versionId:
                  description: The document's current version ID from versionMetadata.versionId in the last GET response. Required for optimistic concurrency.
                  type: string
              required:
              - versionId
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DocumentPartUnstructuredTableDetail'
                - properties:
                    documentParent:
                      $ref: '#/components/schemas/ObjectRef'
                  type: object
                type: object
          description: Updated unstructured table content
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Update an unstructured table
      tags:
      - DocumentPart
components:
  schemas:
    StringCellEvaluationValue:
      description: Specifies a string evaluation value.
      properties:
        __typename:
          type: string
        value:
          description: Specifies the evaluated string value.
          type: string
      type: object
    Caption:
      description: A rich text caption attached to a piece of document content, such as a table or an attachment.
      properties:
        __typename:
          type: string
        formats:
          items:
            $ref: '#/components/schemas/TextFormat'
          type: array
        links:
          items:
            $ref: '#/components/schemas/LinkSpan'
          type: array
        mentions:
          items:
            $ref: '#/components/schemas/Mention'
          type: array
        text:
          type: string
      type: object
    InternalServerError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        errorId:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    UnsupportedCellEvaluationValue:
      description: Specifies an evaluation value for types that cannot be represented in the current API. Use the cell input value as a fallback.
      properties:
        __typename:
          type: string
        errorReason:
          description: Specifies the reason the evaluation value could not be represented.
          type: string
      type: object
    ObjectLinkValue:
      description: A type that represents links to other objects.
      properties:
        __typename:
          type: string
        value:
          $ref: '#/components/schemas/ObjectRef'
          description: The object that this value links to, or an Inaccessible object if not found with the current permission set.
      type: object
    JsonValue:
      description: A type that represents JSON values.
      properties:
        __typename:
          type: string
        value:
          description: The JSON value.
          type: object
      type: object
    TooManyRequestsError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    DateTimeCellEvaluationValue:
      description: Specifies a datetime evaluation value.
      properties:
        __typename:
          type: string
        value:
          description: Specifies the evaluated datetime value.
          format: datetime
          type: string
      type: object
    ArrayValue:
      description: A type that represents a list of BenchlingValues, used for multi-value cells (e.g. alias columns).
      properties:
        __typename:
          type: string
        value:
          items:
            anyOf:
            - $ref: '#/components/schemas/BooleanValue'
            - $ref: '#/components/schemas/DateTimeValue'
            - $ref: '#/components/schemas/DateValue'
            - $ref: '#/components/schemas/DecimalValue'
            - $ref: '#/components/schemas/IntegerValue'
            - $ref: '#/components/schemas/JsonValue'
            - $ref: '#/components/schemas/ObjectLinkValue'
            - $ref: '#/components/schemas/ObjectLinkListValue'
            - $ref: '#/components/schemas/TextAndUrlValue'
            - $ref: '#/components/schemas/TextValue'
            description: Union of BooleanValue, DateTimeValue, DateValue, DecimalValue, IntegerValue, JsonValue, ObjectLinkValue, ObjectLinkListValue, TextAndUrlValue, TextValue
            discriminator:
              mapping:
                BooleanValue: '#/components/schemas/BooleanValue'
                DateTimeValue: '#/components/schemas/DateTimeValue'
                DateValue: '#/components/schemas/DateValue'
                DecimalValue: '#/components/schemas/DecimalValue'
                IntegerValue: '#/components/schemas/IntegerValue'
                JsonValue: '#/components/schemas/JsonValue'
                ObjectLinkListValue: '#/components/schemas/ObjectLinkListValue'
                ObjectLinkValue: '#/components/schemas/ObjectLinkValue'
                TextAndUrlValue: '#/components/schemas/TextAndUrlValue'
                TextValue: '#/components/schemas/TextValue'
              propertyName: __typename
          type: array
      type: object
    TextValue:
      description: A type that represents text (string) values.
      properties:
        __typename:
          type: string
        value:
          description: The text value. It may or may not be an empty string.
          type: string
      type: object
    GeneralError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    ObjectLinkListValue:
      description: A type that represents a list of links to other objects.
      properties:
        __typename:
          type: string
        value:
          description: The list of objects that this value links to. Inaccessible objects may be returned instead if the object is not found with the current permission set.
          items:
            $ref: '#/components/schemas/ObjectRef'
            description: Union of AaSequence, Attachment, Box, Container, CustomEntity, DnaSequence, DropdownOption, Entry, Location, Mixture, Molecule, OligoConjugate, OligoDuplex, WellPlate, MatrixPlate, Protein, Result, RnaSequence, Run, DnaOligo, RnaOligo
          type: array
      type: object
    NumberCellEvaluationValue:
      description: Specifies a numeric evaluation value. Display formatting lives on TableCell.format.
      properties:
        __typename:
          type: string
        value:
          description: Specifies the evaluated numeric value, carrying the most precise representation available for the cell's typed value. Serialized as a string and never pre-formatted; use TableCell.format for display formatting.
          format: decimal
          type: string
      type: object
    BooleanCellEvaluationValue:
      description: Specifies a boolean evaluation value.
      properties:
        __typename:
          type: string
        value:
          description: Specifies the evaluated boolean value.
          type: boolean
      type: object
    DocumentPartUnstructuredTableDetail:
      description: Represents an unstructured table embedded within a notebook entry or other document, including row and cell data. Returned when a request's returning spec asks for the detail type.
      properties:
        __typename:
          type: string
        caption:
          description: Specifies the rich text caption displayed with the table. Null if the table has no caption.
          oneOf:
          - $ref: '#/components/schemas/Caption'
          - type: 'null'
        columnDefinitions:
          description: Lists column definitions for the table.
          items:
            $ref: '#/components/schemas/TableColumnDefinition'
          type: array
        createdAt:
          description: 'Timestamp inherited from the document content backing this part. For entry and

            document content, this can reflect when the containing document was created,

            not when the DocumentPart identifier was created.'
          format: datetime
          type: string
        id:
          description: Identifies the document part.
          type: string
        indentation:
          description: Specifies the indentation level for this content within the document.
          type: integer
        isEvaluated:
          description: Specifies whether formula evaluation has been applied to the table.
          type: boolean
        modifiedAt:
          description: Specifies when this document part was last modified.
          format: datetime
          type: string
        modifier:
          description: Identifies who last modified this document part.
          oneOf:
          - $ref: '#/components/schemas/PrincipalRef'
          - type: 'null'
        name:
          description: Specifies the display name of the table.
          type: string
        rowCount:
          description: Specifies the number of rows in the table.
          type: integer
        rows:
          description: Lists rows in the table, each containing an ordered array of cells.
          items:
            $ref: '#/components/schemas/TableRow'
          type: array
        versionMetadata:
          $ref: '#/components/schemas/DocumentLikeVersionMetadata'
          description: Specifies version metadata for the parent document.
      type: object
    DateCellEvaluationValue:
      description: Specifies a date evaluation value.
      properties:
        __typename:
          type: string
        value:
          description: Specifies the evaluated date value.
          format: date
          type: string
      type: object
    ObjectRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    Mention:
      description: Represents an inline mention of another Benchling item within text content.
      properties:
        __typename:
          type: string
        itemId:
          description: Identifies the referenced Benchling item.
          type: string
        position:
          description: Specifies the zero-based insertion index within the plain-text body where this mention appears. Mentions do not occupy characters in the plain-text body for purposes of format range start and end positions.
          type: integer
      type: object
    TableColumnDefinition:
      description: Specifies a column definition within an unstructured table.
      properties:
        __typename:
          type: string
        isLocked:
          description: Specifies whether the column width is locked against resizing.
          type: boolean
        name:
          description: Specifies the column display name.
          type: string
        width:
          description: Specifies the column width in pixels. Defaults to 100 when unset.
          type:
          - 'null'
          - integer
      type: object
    DateValue:
      description: A type that represents date values.
      properties:
        __typename:
          type: string
        value:
          description: The date value.
          format: date
          type: string
      type: object
    PrincipalRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    TextFormat:
      description: Specifies inline styling applied to a character range within rich text.
      properties:
        __typename:
          type: string
        backgroundColor:
          description: Specifies the background color applied to the character range, when set.
          type:
          - 'null'
          - string
        end:
          description: Specifies the exclusive end index of the character range within the plain-text body.
          type: integer
        foregroundColor:
          description: Specifies the text color applied to the character range, when set.
          type:
          - 'null'
          - string
        properties:
          description: 'Specifies the character style properties applied to the range: bold, italic, underline, strikethrough, subscript, superscript, and monospace.'
          items:
            enum:
            - BOLD
            - ITALIC
            - UNDERLINE
            - STRIKETHROUGH
            - SUBSCRIPT
            - SUPERSCRIPT
            - MONOSPACE
            type: string
          type: array
        start:
          description: Specifies the inclusive start index of the character range within the plain-text body.
          type: integer
      type: object
    TextAndUrlValue:
      description: A type that represents text (string) values with an associated URL.
      properties:
        __typename:
          type: string
        url:
          description: The URL associated with the value. Please use `TextValue` if you don't want a URL.
          type: string
        value:
          description: The text value. It may or may not be an empty string.
          type: string
      type: object
    TableRow:
      description: Specifies a row within an unstructured table.
      properties:
        __typename:
          type: string
        cells:
          description: Lists cells in the row in column order.
          items:
            $ref: '#/components/schemas/TableCell'
          type: array
        rowIndex:
          description: Specifies the row's absolute position within the table, zero-based.
          type: integer
      type: object
    DocumentLikeVersionMetadata:
      description: Version metadata for a document such as an entry, template, or subtemplate. Identifies a specific content revision and records when that revision was produced. Use this to detect changes, pin a revision, or reference a particular version without loading the full version record.
      properties:
        __typename:
          type: string
        createdAt:
          description: Specifies when this version was created. Versions are immutable; this is the time the parent document was last edited to produce this revision.
          format: datetime
          type:
          - 'null'
          - string
        versionId:
          description: Identifies this version of the document.
          type: string
      type: object
    ObjectLinkCellEvaluationValue:
      description: 'The evaluation-value counterpart of ObjectLinkValue: a flat id/name pair for any

        LinkableDomainObject a cell links to, which includes non-entity targets such as users, teams,

        studies, inventory items, attachments, and dropdown options. Resolve inputValue to get the concrete type.'
      properties:
        __typename:
          type: string
        id:
          description: Identifies the linked object.
          type: string
        name:
          description: Specifies the display name of the linked entity.
          type: string
      type: object
    TableCellFormat:
      description: Specifies formatting properties applied to an entire table cell.
      properties:
        __typename:
          type: string
        alignment:
          description: Specifies horizontal text alignment for the cell, when set.
          enum:
          - LEFT
          - CENTER
          - RIGHT
          - null
          type:
          - 'null'
          - string
        backgroundColor:
          description: Specifies the background color applied to the cell, when set.
          type:
          - 'null'
          - string
        foregroundColor:
          description: Specifies the text color applied to the cell, when set.
          type:
          - 'null'
          - string
        link:
          description: Specifies a hyperlink URL applied to the cell, when set.
          type:
          - 'null'
          - string
        precision:
          description: Specifies the decimal precision used to display a numeric cell.
          type:
          - 'null'
          - integer
        properties:
          description: Lists character style properties applied to the cell.
          items:
            enum:
            - BOLD
            - ITALIC
            - UNDERLINE
            - STRIKETHROUGH
            - IMPORTANT
            type: string
          type: array
        scientificNotation:
          description: Specifies whether a numeric cell is displayed in scientific notation.
          type:
          - 'null'
          - boolean
      type: object
    MergedCellAnchor:
      description: Specifies coordinates of the anchor cell for a cell within a merged region.
      properties:
        __typename:
          type: string
        col:
          description: Specifies the zero-based column index of the anchor cell.
          type: integer
        row:
          description: Specifies the zero-based row index of the anchor cell.
          type: integer
      type: object
    TableMergeRange:
      description: Specifies the extent of a merged cell region, set on the anchor cell.
      properties:
        __typename:
          type: string
        mergeColSpan:
          description: Specifies the number of columns in the merged region, including the anchor cell.
          type: integer
        mergeRowSpan:
          description: Specifies the number of rows in the merged region, including the anchor cell.
          type: integer
      type: object
    BooleanValue:
      description: A type that represents boolean values.
      properties:
        __typename:
          type: string
        value:
          description: The boolean value.
          type: boolean
      type: object
    IntegerValue:
      description: A type that represents integer values.
      properties:
        __typename:
          type: string
        value:
          description: The integer value.
          type: integer
      type: object
    ArrayCellEvaluationValue:
      description: Specifies an array evaluation value containing multiple cell evaluation values.
      properties:
        __typename:
          type: string
        value:
          description: Lists the evaluated values in the array.
          items:
            anyOf:
            - $ref: '#/components/schemas/StringCellEvaluationValue'
            - $ref: '#/components/schemas/NumberCellEvaluationValue'
            - $ref: '#/components/schemas/BooleanCellEvaluationValue'
            - $ref: '#/components/schemas/DateCellEvaluationValue'
            - $ref: '#/components/schemas/DateTimeCellEvaluationValue'
            - $ref: '#/components/schemas/ObjectLinkCellEvaluationValue'
            - $ref: '#/components/schemas/ArrayCellEvaluationValue'
            - $ref: '#/components/schemas/UnsupportedCellEvaluationValue'
            description: Union of StringCellEvaluationValue, NumberCellEvaluationValue, BooleanCellEvaluationValue, DateCellEvaluationValue, DateTimeCellEvaluationValue, ObjectLinkCellEvaluationValue, ArrayCellEvaluationValue, UnsupportedCellEvaluationValue
            discriminator:
              mapping:
                ArrayCellEvaluationValue: '#/components/schemas/ArrayCellEvaluationValue'
                BooleanCellEvaluationValue: '#/components/schemas/BooleanCellEvaluationValue'
                DateCellEvaluationValue: '#/components/schemas/DateCellEvaluationValue'
                DateTimeCellEvaluationValue: '#/components/schemas/DateTimeCellEvaluationValue'
                NumberCellEvaluationValue: '#/components/schemas/NumberCellEvaluationValue'
                ObjectLinkCellEvaluationValue: '#/components/schemas/ObjectLinkCellEvaluationValue'
                StringCellEvaluationValue: '#/components/schemas/StringCellEvaluationValue'
                UnsupportedCellEvaluationValue: '#/components/schemas/UnsupportedCellEvaluationValue'
              propertyName: __typename
          type: array
      type: object
    TableCell:
      description: Specifies a cell within an unstructured table row. Cells may be standalone or participate in a merged region. The anchor cell holds the merged region span; other cells in the region reference the anchor cell coordinates.
      properties:
        __typename:
          type: string
        errors:
          description: Lists evaluation and validation errors present on the cell. Inspect the error type on each error to distinguish evaluation failures from validation failures.
          items:
            $ref: '#/components/schemas/CellError'
          type: array
        evaluationValue:
          description: Specifies the evaluated value computed by formula evaluation, when present. Read-only.
          oneOf:
          - anyOf:
            - $ref: '#/components/schemas/StringCellEvaluationValue'
            - $ref: '#/components/schemas/NumberCellEvaluationValue'
            - $ref: '#/components/schemas/BooleanCellEvaluationValue'
            - $ref: '#/components/schemas/DateCellEvaluationValue'
            - $ref: '#/components/schemas/DateTimeCellEvaluationValue'
            - $ref: '#/components/schemas/ObjectLinkCellEvaluationValue'
            - $ref: '#/components/schemas/ArrayCellEvaluationValue'
            - $ref: '#/components/schemas/UnsupportedCellEvaluationValue'
            discriminator:
              mapping:
                ArrayCellEvaluationValue: '#/components/schemas/ArrayCellEvaluationValue'
                BooleanCellEvaluationValue: '#/components/schemas/BooleanCellEvaluationValue'
                DateCellEvaluationValue: '#/components/schemas/DateCellEvaluationValue'
                DateTimeCellEvaluationValue: '#/components/schemas/DateTimeCellEvaluationValue'
                NumberCellEvaluationValue: '#/components/schemas/NumberCellEvaluationValue'
                ObjectLinkCellEvaluationValue: '#/components/schemas/ObjectLinkCellEvaluationValue'
                StringCellEvaluationValue: '#/components/schemas/StringCellEvaluationValue'
                UnsupportedCellEvaluationValue: '#/components/schemas/UnsupportedCellEvaluationValue'
              propertyName: __typename
          - type: 'null'
        format:
          description: Specifies formatting properties applied to the cell. Null when the cell has no formatting.
          oneOf:
          - $ref: '#/components/schemas/TableCellFormat'
          - type: 'null'
        inputValue:
          anyOf:
          - $ref: '#/components/schemas/BooleanValue'
          - $ref: '#/components/schemas/DateTimeValue'
          - $ref: '#/components/schemas/DateValue'
          - $ref: '#/components/schemas/DecimalValue'
          - $ref: '#/components/schemas/IntegerValue'
          - $ref: '#/components/schemas/JsonValue'
          - $ref: '#/components/schemas/ObjectLinkValue'
          - $ref: '#/components/schemas/ObjectLinkListValue'
          - $ref: '#/components/schemas/TextAndUrlValue'
          - $ref: '#/components/schemas/TextValue'
          - $ref: '#/components/schemas/ArrayValue'
          description: Specifies the cell input value. For unstructured tables this is always a text value.
          discriminator:
            mapping:
              ArrayValue: '#/components/schemas/ArrayValue'
              BooleanValue: '#/components/schemas/BooleanValue'
              DateTimeValue: '#/components/schemas/DateTimeValue'
              DateValue: '#/components/schemas/DateValue'
              DecimalValue: '#/components/schemas/DecimalValue'
              IntegerValue: '#/components/schemas/IntegerValue'
              JsonValue: '#/components/schemas/JsonValue'
              ObjectLinkListValue: '#/components/schemas/ObjectLinkListValue'
              ObjectLinkValue: '#/components/schemas/ObjectLinkValue'
              TextAndUrlValue: '#/components/schemas/TextAndUrlValue'
              TextValue: '#/components/schemas/TextValue'
            propertyName: __typename
        mergeRange:
          description: Specifies the merged region span on the anchor cell. Present only on anchor cells.
          oneOf:
          - $ref: '#/components/schemas/TableMergeRange'
          - type: 'null'
        mergeRangeParent:
          description: Specifies coordinates of the anchor cell. Present on cells within a merged region that are not the anchor.
          oneOf:
          - $ref: '#/components/schemas/MergedCellAnchor'
          - type: 'null'
        selectorId:
          description: Specifies the dropdown selector identifier for this cell, when present. Match this value to selectorId on dropdown selectors defined on the document.
          type:
          - 'null'
          - string
      type: object
    DecimalValue:
      description: A type that represents decimal value as strings.
      properties:
        __typename:
          type: string
        numericValue:
          deprecated: true
          description: Deprecated. The float representation of the decimal value.
          type:
          - 'null'
          - number
        value:
          description: The decimal value in a string representation
          type:
          - 'null'
          - string
      type: object
    CellError:
      description: Specifies a single error present on a table cell. The error type field distinguishes evaluation failures from validation failures; message is the error description.
      properties:
        __typename:
          type: string
        errorType:
          description: Specifies whether the error is an evaluation failure or a validation failure.
          enum:
          - EVALUATION
          - VALIDATION
          type: string
        message:
          description: Specifies the error message.
          type: string
        type:
          description: Specifies the display name for the specific error, such as reference error or value error. Populated for evaluation errors; null for validation errors.
          type:
          - 'null'
          - string
      type: object
    LinkSpan:
      description: Specifies a hyperlink applied to a character range within rich text content.
      properties:
        __typename:
          type: string
        end:
          description: Specifies the exclusive end index of the character range within the plain-text body.
          type: integer
        start:
          description: Specifies the inclusive start index of the character range within the plain-text body.
          type: integer
        url:
          description: Specifies the URL of the hyperlink.
          type: string
      type: object
    DateTimeValue:
      description: A type that represents datetime values.
      properties:
        __typename:
          type: string
        value:
          description: The datetime value with UTC as the timezone.
          format: datetime
          type: string
      type: object
  responses:
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsError'
      description: Too Many Requests
      headers:
        Retry-After:
          description: Minimum number of seconds to wait before retrying. Only included when the request exceeded a rate limit specific to the caller. Limits shared with other callers, such as tenant-wide limits, omit this header because the wait depends on their traffic.
          required: false
          schema:
            minimum: 1
            type: integer
    InternalServerError:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
      description: Internal Server Error
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Not Found
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Conflict
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Bad Request
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Forbidden
  securitySchemes:
    BearerAuth:
      description: Use a short-lived V3 API Explorer token.
      scheme: bearer
      type: http
      x-fern-playground-description: Copy a short-lived V3 API Explorer token from the user's settings page
    basicApiKeyAuth:
      description: Use issued API key for standard access to the API
      scheme: basic
      type: http
    basicClientIdSecretAuth:
      description: Auth used as part of client credentials OAuth flow prior to receiving a bearer token.
      scheme: basic
      type: http
    oAuth:
      description: OAuth2 Client Credentials flow intended for service access
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: /oauth/token
      type: oauth2
