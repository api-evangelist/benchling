    IProtein:
      properties:
        __typename:
          type: string
        aliases:
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        chains:
          description: The chains and associated amino acid sequences on the protein.
          items:
            $ref: '#/components/schemas/ProteinChain'
          type: array
        createdAt:
