          - string
        customFields:
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityRegistryId:
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        id:
          type: string
        isCircular:
          description: Whether the DNA sequence is circular or linear.
          type: boolean
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
