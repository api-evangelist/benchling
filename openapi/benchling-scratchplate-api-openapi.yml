            $ref: '#/components/schemas/ScratchPlateMeasurementInput'
          type: array
        metadataLayers:
          items:
            $ref: '#/components/schemas/MetadataColumnInput'
          type: array
        name:
          type: string
        originDesignId:
          type: string
        parameterLayers:
          items:
            $ref: '#/components/schemas/ParameterLayerInput'
          type: array
        plateDesignTemplateId:
          type: string
        plateReaderAsm:
          $ref: '#/components/schemas/ScratchPlatePlateReaderAsmInput'
        plateSchemaId:
          type: string
        vendorFile:
          $ref: '#/components/schemas/ScratchPlateVendorFileInput'
        wells:
          items:
            $ref: '#/components/schemas/ScratchPlateWellInput'
          type: array
        width:
          type: integer
      required:
      - name
      type: object
    UnitInput:
      additionalProperties: false
      properties:
        versionNumber:
          type: integer
      type: object
    WellRoleInput:
      additionalProperties: false
      properties:
        group:
          type: string
        role:
          type: string
        subrole:
          type: string
      required:
      - role
      type: object
    ConcentrationLayerInput:
