      required:
      - name
      - concentrationUnitId
      - concentrationUnitVersionNumber
      type: object
    MetadataWellInput:
      additionalProperties: false
      properties:
        value:
          anyOf:
          - type: string
          - type: integer
          - type: number
          - type: boolean
          - type: 'null'
        wellPosition:
          type: string
      required:
      - wellPosition
      - value
      type: object
    ScratchPlatePlateReaderAsmInput:
      additionalProperties: false
      properties:
        scratchFileId:
          type: string
      required:
      - scratchFileId
      type: object
    ScratchPlateTransferInput:
      additionalProperties: false
      properties:
        direction:
          description: Well traversal order for layout-based transfers. Defaults to ACROSS_ROWS.
          enum:
          - ACROSS_ROWS
          - DOWN_COLUMNS
          type: string
        layout:
          description: 'Layout algorithm used with sourcePlateIds. Determines the fan ratio of sources to destinations: STAMP (1:1), STAMP_TO_QUADRANTS/INTERLEAVE (4:1), COLUMN_INTERLEAVE (2:1), and their REVERSE_ variants (1:4, 1:2).'
          enum:
          - COLUMN_INTERLEAVE
          - INTERLEAVE
          - REVERSE_COLUMN_INTERLEAVE
          - REVERSE_INTERLEAVE
          - REVERSE_STAMP_TO_QUADRANTS
          - STAMP
          - STAMP_TO_QUADRANTS
          type: string
        operations:
          description: Explicit well-to-well moves. Use this mode for fan-in, many-to-many, or serial dilution transfers. Mutually exclusive with sourcePlateIds + layout.
          items:
            $ref: '#/components/schemas/WellTransferInput'
          type: array
        skipEmpty:
          description: If true (default), empty source wells are skipped rather than producing empty destination wells in layout-based transfers.
          type: boolean
        sourcePlateIds:
          description: Ordered source plates for layout-based transfers. Consumed group by group according to the fan ratio of the chosen layout. Mutually exclusive with operations.
          items:
            type: string
          type: array
        transferQuantity:
          $ref: '#/components/schemas/QuantityInput'
          description: Volume to transfer per well in layout-based transfers. If omitted, the entire source well content is recorded as transferred.
      type: object
    WellTransferInput:
      additionalProperties: false
      properties:
        destinationPlateIndex:
          type: integer
        destinationWellPosition:
          type: string
        diluentEntityId:
          type: string
        diluentQuantity:
