          type: array
        name:
          type: string
        parameterLayers:
          items:
            $ref: '#/components/schemas/ParameterLayerInput'
          type: array
        plateSchemaId:
          type:
          - 'null'
          - string
        wells:
          items:
            $ref: '#/components/schemas/ScratchPlateWellInput'
          type: array
        width:
          type: integer
