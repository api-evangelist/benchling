        finalVolume:
          $ref: '#/components/schemas/QuantityInput'
        sourceDestinationPlateIndex:
          type: integer
        sourcePlateId:
          type: string
        sourceWellPosition:
          type: string
        transferQuantity:
          $ref: '#/components/schemas/QuantityInput'
      required:
      - sourceWellPosition
      - destinationPlateIndex
      - destinationWellPosition
      type: object
    PlateSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ScratchPlateTransferRequestInput:
      additionalProperties: false
      properties:
        height:
          description: Number of rows in each destination scratch plate.
          type: integer
        metadataLayers:
          description: Metadata layers to apply to each created destination scratch plate.
          items:
            $ref: '#/components/schemas/MetadataColumnInput'
          type: array
        name:
          description: Base name for destination scratch plate(s). If multiple are created, numeric suffixes are appended.
          type: string
        plateSchemaId:
          description: ID of the plate schema to apply to each destination scratch plate. If omitted, no plate schema is attached.
          type: string
        transfer:
          $ref: '#/components/schemas/ScratchPlateTransferInput'
          description: Transfer specification describing explicit operations or a layout-derived transfer.
        width:
          description: Number of columns in each destination scratch plate.
          type: integer
      required:
      - name
      - height
      - width
      - transfer
      type: object
    ParameterLayerInput:
      additionalProperties: false
      properties:
        fieldType:
          enum:
          - TEXT
          - FLOAT
          - DATETIME
          type: string
        name:
          type: string
        parameterVersionId:
          type: string
        wells:
          items:
            $ref: '#/components/schemas/ParameterWellInput'
          type: array
      required:
      - parameterVersionId
      - name
      - fieldType
      type: object
    ScratchPlateVendorFileInput:
