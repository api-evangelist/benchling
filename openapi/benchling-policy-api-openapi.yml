openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Policy API
  version: 2.0.0
  description: 'Defines a named set of permissions that can be assigned to users or groups through

    collaborations. Policies contain PolicyStatements that specify allowed actions on

    different item types. When a user is granted a collaboration with a specific policy,

    they receive all permissions defined in that policy''s statements. Common policies

    include viewer (read-only access), editor (read and write), and admin (full control).

    Policies are reusable and can be applied across many collaborations.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'Defines a named set of permissions that can be assigned to users or groups through

    collaborations. Policies contain PolicyStatements that specify allowed actions on

    different item types. When a user is granted a collaboration with a specific policy,

    they receive all permissions defined in that policy''s statements. Common policies

    include viewer (read-only access), editor (read and write), and admin (full control).

    Policies are reusable and can be applied across many collaborations.'
  name: Policy
  x-bnch-organization: Benchling
  x-displayName: Policy
paths:
  /policy/items:
    get:
      description: List Policy items.
      operationId: Policy.List
      parameters:
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/modifiedAt.gt'
      - $ref: '#/components/parameters/modifiedAt.gte'
      - $ref: '#/components/parameters/modifiedAt.lt'
      - $ref: '#/components/parameters/modifiedAt.lte'
      - $ref: '#/components/parameters/name.anyOf'
      - $ref: '#/components/parameters/name.anyOf.caseSensitive'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/returning'
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first) and modifiedAt (modified time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is modifiedAt:desc.'
        in: query
        name: sort
        schema:
          default: modifiedAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          - modifiedAt:asc
          - modifiedAt:desc
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List Policy items
      tags:
      - Policy
  /policy/{policy_id}:
    delete:
      description: 'Delete a Policy.


        ## Restrictions


        - Only data policies can be deleted; requests targeting other policy types return a 404.

        - A policy that is one of the tenant''s default policies cannot be deleted.

        - A policy that is currently used in permissions cannot be deleted.'
      operationId: Policy.Delete
      parameters:
      - description: ID of the Policy.
        in: path
        name: policy_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Delete Policy
      tags:
      - Policy
    get:
      description: Get a single Policy by ID.
      operationId: Policy.Get
      parameters:
      - description: ID of the Policy.
        in: path
        name: policy_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get Policy by ID
      tags:
      - Policy
    patch:
      description: 'Update a Policy.


        ## Restrictions


        - Only data policies can be updated; requests targeting other policy types are rejected.

        - Only `name` and `description` may be modified.

        - `name` must be unique among the tenant''s data policies.'
      operationId: Policy.Update
      parameters:
      - description: ID of the Policy.
        in: path
        name: policy_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Update Policy
      tags:
      - Policy
  /policy/{policy_id}:add-policy-statements:
    patch:
      description: 'Add policy statements to a DataPolicy. Acts as an upsert keyed on (itemType, action): for each incoming statement, any existing statement with the same item type and action is overwritten with the provided condition, and statements for other (itemType, action) pairs are left unchanged. Only DataPolicy objects can be edited.'
      operationId: Policy.AddPolicyStatements
      parameters:
      - description: ID of the Policy.
        in: path
        name: policy_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPolicyStatementsInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Add DataPolicy statements
      tags:
      - Policy
  /policy/{policy_id}:remove-policy-statements:
    patch:
      description: Remove policy statements from a DataPolicy. Each statement is matched on (itemType, action) and removed regardless of its condition; the absence of a statement means the action is not granted. Removing a statement that is not present is a no-op. Only DataPolicy objects can be edited.
      operationId: Policy.RemovePolicyStatements
      parameters:
      - description: ID of the Policy.
        in: path
        name: policy_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemovePolicyStatementsInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Remove DataPolicy statements
      tags:
      - Policy
  /policy:batch-delete:
    post:
      description: 'Batch delete Policies synchronously in one transaction. Maximum 25 items per request.


        Each item follows the same restrictions as the single-delete endpoint: only data policies can be deleted, and default or in-use policies are rejected. If any item fails validation, the transaction fails and no policies are deleted.'
      operationId: Policy.BatchDelete
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/DeletePolicyInputWithPathParams'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                      required:
                      - id
                      type: object
                    type: array
                required:
                - items
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch delete Policy
      tags:
      - Policy
  /policy:batch-update:
    patch:
      description: 'Batch update Policies synchronously in one transaction. Maximum 25 items per request.


        Each item follows the same restrictions as the single-update endpoint: only data policies can be updated, and only `name` and `description` may be modified. If any item fails validation, the transaction fails and no policies are updated.'
      operationId: Policy.BatchUpdate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/UpdatePolicyInputWithPathParams'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/Policy'
                    type: array
                required:
                - items
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch update Policy
      tags:
      - Policy
  /policy:bulk-update:
    patch:
      description: Bulk update Policy.
      operationId: Policy.BulkUpdate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk update Policy
      tags:
      - Policy
  /policy:clone:
    post:
      description: Clone a DataPolicy, copying its statements into a new DataPolicy with the given name; only DataPolicy objects can be cloned. If description is omitted, the clone is created with no description rather than copying the source's.
      operationId: Policy.Clone
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClonePolicyInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Clone a DataPolicy
      tags:
      - Policy
components:
  parameters:
    modifiedAt.lt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified before the specified time. e.g. < 2017-04-30.
      in: query
      name: modifiedAt.lt
      schema:
        format: datetime
        type: string
    pageSize:
      description: Number of results to return. Defaults to 50, maximum of 100.
      in: query
      name: pageSize
      schema:
        type: integer
    modifiedAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified after the specified time. e.g. > 2017-04-30.
      in: query
      name: modifiedAt.gt
      schema:
        format: datetime
        type: string
    modifiedAt.gte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified at or after the specified time. e.g. >= 2017-04-30.
      in: query
      name: modifiedAt.gte
      schema:
        format: datetime
        type: string
    nextToken:
      description: Token for pagination
      in: query
      name: nextToken
      schema:
        type: string
    createdAt.lte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or before the specified time. e.g. <= 2017-04-30.
      in: query
      name: createdAt.lte
      schema:
        format: datetime
        type: string
    createdAt.gte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or after the specified time. e.g. >= 2017-04-30.
      in: query
      name: createdAt.gte
      schema:
        format: datetime
        type: string
    omit:
      description: Comma-separated list of top-level fields to omit from each returned item. Cannot overlap with returning.
      explode: false
      in: query
      name: omit
      schema:
        items:
          type: string
        type: array
    returning:
      description: Comma-separated list of top-level fields to include in each returned item. Cannot overlap with omit.
      explode: false
      in: query
      name: returning
      schema:
        items:
          type: string
        type: array
    name.anyOf.caseSensitive:
      description: Restricts results to those that match any of the specified names. Case sensitive. Ensure only one name filter is used at a time. Comma-separated list.
      explode: false
      in: query
      name: name.anyOf.caseSensitive
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    id.anyOf:
      description: Restricts results to those matching any of the specified IDs. Comma-separated list.
      explode: false
      in: query
      name: id.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    modifiedAt.lte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified at or before the specified time. e.g. <= 2017-04-30.
      in: query
      name: modifiedAt.lte
      schema:
        format: datetime
        type: string
    createdAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created after the specified time. e.g. > 2017-04-30.
      in: query
      name: createdAt.gt
      schema:
        format: datetime
        type: string
    name.anyOf:
      description: Restricts results to those that match any of the specified names. Case insensitive. Warning - this filter can be non-performant due to case insensitivity. Ensure only one name filter is used at a time. Comma-separated list.
      explode: false
      in: query
      name: name.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    createdAt.lt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created before the specified time. e.g. < 2017-04-30.
      in: query
      name: createdAt.lt
      schema:
        format: datetime
        type: string
  schemas:
    ClonePolicyInput:
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          type: string
        policyId:
          type: string
      required:
      - policyId
      - name
      type: object
    InternalServerError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        errorId:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    AsyncTaskLink:
      properties:
        pollingUri:
          format: uri
          type: string
        taskId:
          type: string
      type: object
    AddPolicyStatementsInput:
      additionalProperties: false
      properties:
        statements:
          description: Policy statements to add. Any existing statement with the same item type and action is overwritten with the provided condition; other statements are left unchanged.
          items:
            $ref: '#/components/schemas/PolicyStatementInput'
          type: array
      required:
      - statements
      type: object
    PolicyStatementReferenceInput:
      additionalProperties: false
      properties:
        action:
          description: The action the statement grants.
          enum:
          - READ
          - APPEND
          - WRITE
          - ADMIN
          - ARCHIVE
          - CHANGE_ASSIGNMENT_OF_OBJECTS
          - CHANGE_REGISTRY_IDENTIFIER
          - CREATE
          - CREATE_ENTRIES_FROM_DRAFT_TEMPLATES
          - CREATE_LOCATION
          - CREATE_REQUEST
          - CREATE_RESULT
          - CREATE_SUBFOLDER
          - CREATE_TEST_ORDERS
          - EDIT_BARCODES
          - EDIT_CHEMICAL_STRUCTURE
          - EDIT_CONTAINER
          - EDIT_FIELDS_IF_PENDING_INVALID
          - EDIT_FIELDS_IF_IN_PROGRESS
          - EDIT_FIELDS_IF_TERMINAL
          - EDIT_NAMES_AND_ALIASES
          - EDIT_NAMES_AND_BARCODES
          - EDIT_POLYMER_FEATURES
          - EDIT_RESIDUES
          - EDIT_RESTRICTED_SAMPLE_USERS
          - EDIT_RESULT
          - EDIT_SCHEMA_AND_FIELDS
          - EDIT_STATUS
          - EDIT_USER_EMAIL
          - EXECUTE_REQUEST
          - LIST_DEFINITION
          - MANAGE_COLLABORATORS
          - MANAGE_CAPABILITIES
          - READ_APP_CONFIG
          - READ_APP_SESSION
          - REGISTER
          - RETRACT_REVIEW
          - RESTRICT_SAMPLES
          - REVOKE_USER_CREDENTIALS
          - SUSPEND_USER
          - UNREGISTER
          - UNRESTRICT_SAMPLES
          - WRITE_APP_CONFIG
          - WRITE_APP_SESSION
          - UNKNOWN
          type: string
        itemType:
          description: The type of item the statement applies to.
          enum:
          - AA_MONOMER
          - AGENT_MEMORY
          - AGENT_SKILL
          - AI_MODEL
          - ANALYSIS
          - SQL_DASHBOARD
          - PROTEIN_FORMAT
          - APP_DEFINITION
          - ASYNC_TASK
          - AV_SCAN_RECORD
          - BATCH
          - APP_INSTALLATION
          - APP_SESSION
          - BIOENTITY
          - BOX
          - BUSINESS_RULE
          - ASSEMBLY
          - CHAT
          - CHEMICAL_COUNTERPART
          - CONFIG_MIGRATION_HISTORY
          - CONNECTION
          - CONTAINER
          - EVENT_SUBSCRIPTION
          - EXTENSION_DEFINITION
          - FOLDER_OR_PROJECT
          - FILE
          - INSTRUMENT
          - NON_LOCATION_STORABLE
          - LEGACY_DATA_IMPORT_RUN
          - LIBRARY_PARAMETER_DEFINITION
          - LOCATION
          - MCP_SERVER_CONFIG
          - MCP_SERVER_USER_CONFIGURATION
          - MODEL_RUN
          - NUCLEOTIDE_MONOMER
          - ENTRY
          - ORGANIZATION
          - PLATE
          - PROCEDURE
          - WORKFLOW_TASK_GROUP
          - WORKFLOW_TASK
          - WORKFLOW_OUTPUT
          - PROTOCOL
          - REGISTRY
          - REVIEW_PROCESS
          - LEGACY_REQUEST
          - REQUEST_TEMPLATE
          - REQUEST
          - RESULT
          - AGENT
          - SAMPLE_TYPE
          - SCHEMA
          - STUDY
          - TEAM
          - TEMPLATE_COLLECTION
          - TENANT
          - TEST_ORDER
          - USER
          - WAREHOUSE_LOGIN
          - WAREHOUSE_CUSTOM_VIEW
          - WORKFLOW
          - WORKLIST
          - WORKSHEET
          - OTHER
          - UNIT_TYPE
          - UNKNOWN
          type: string
      required:
      - itemType
      - action
      type: object
    PolicyStatementInput:
      additionalProperties: false
      properties:
        action:
          description: The action being granted on the item type.
          enum:
          - READ
          - APPEND
          - WRITE
          - ADMIN
          - ARCHIVE
          - CHANGE_ASSIGNMENT_OF_OBJECTS
          - CHANGE_REGISTRY_IDENTIFIER
          - CREATE
          - CREATE_ENTRIES_FROM_DRAFT_TEMPLATES
          - CREATE_LOCATION
          - CREATE_REQUEST
          - CREATE_RESULT
          - CREATE_SUBFOLDER
          - CREATE_TEST_ORDERS
          - EDIT_BARCODES
          - EDIT_CHEMICAL_STRUCTURE
          - EDIT_CONTAINER
          - EDIT_FIELDS_IF_PENDING_INVALID
          - EDIT_FIELDS_IF_IN_PROGRESS
          - EDIT_FIELDS_IF_TERMINAL
          - EDIT_NAMES_AND_ALIASES
          - EDIT_NAMES_AND_BARCODES
          - EDIT_POLYMER_FEATURES
          - EDIT_RESIDUES
          - EDIT_RESTRICTED_SAMPLE_USERS
          - EDIT_RESULT
          - EDIT_SCHEMA_AND_FIELDS
          - EDIT_STATUS
          - EDIT_USER_EMAIL
          - EXECUTE_REQUEST
          - LIST_DEFINITION
          - MANAGE_COLLABORATORS
          - MANAGE_CAPABILITIES
          - READ_APP_CONFIG
          - READ_APP_SESSION
          - REGISTER
          - RETRACT_REVIEW
          - RESTRICT_SAMPLES
          - REVOKE_USER_CREDENTIALS
          - SUSPEND_USER
          - UNREGISTER
          - UNRESTRICT_SAMPLES
          - WRITE_APP_CONFIG
          - WRITE_APP_SESSION
          - UNKNOWN
          type: string
        condition:
          description: The condition under which the action is granted.
          enum:
          - ALWAYS
          - IS_AUTHOR
          - IS_ASSIGNEE
          - UNKNOWN
          type: string
        itemType:
          description: The type of item the statement applies to.
          enum:
