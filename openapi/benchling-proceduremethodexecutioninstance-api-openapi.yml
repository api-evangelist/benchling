components:
  parameters:
    templateProcedureMethodVersion.eq:
      description: ID of a procedure method definition version. Restricts results to only those that have the specified template procedure method version.
      in: query
      name: templateProcedureMethodVersion.eq
      schema:
        type: string
    pageSize:
      description: Number of results to return. Defaults to 50, maximum of 100.
      in: query
      name: pageSize
      schema:
        type: integer
    procedureRun.eq:
      description: ID of a procedure run. Restricts results to only those that are part of the specified procedure run.
      in: query
      name: procedureRun.eq
      schema:
        type: string
    procedureRunConditionReplicate.anyOf:
      description: Restricts results to only those that are part of procedure run condition-replicates matching any of the specified procedure run condition-replicate IDs. Comma-separated list.
      explode: false
      in: query
      name: procedureRunConditionReplicate.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    createdAt.gte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or after the specified time. e.g. >= 2017-04-30.
      in: query
      name: createdAt.gte
      schema:
        format: datetime
        type: string
    modifiedAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified after the specified time. e.g. > 2017-04-30.
      in: query
      name: modifiedAt.gt
      schema:
        format: datetime
        type: string
    modifiedAt.lte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified at or before the specified time. e.g. <= 2017-04-30.
      in: query
      name: modifiedAt.lte
      schema:
        format: datetime
        type: string
    id.anyOf:
      description: Restricts results to those matching any of the specified IDs. Comma-separated list.
      explode: false
      in: query
      name: id.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    modifiedAt.lt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified before the specified time. e.g. < 2017-04-30.
      in: query
      name: modifiedAt.lt
      schema:
        format: datetime
        type: string
    worksheet.anyOf:
      description: Restricts results to only those executed in worksheets matching any of the specified worksheet IDs. Comma-separated list.
      explode: false
      in: query
      name: worksheet.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    createdAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created after the specified time. e.g. > 2017-04-30.
      in: query
      name: createdAt.gt
      schema:
        format: datetime
        type: string
    modifiedAt.gte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified at or after the specified time. e.g. >= 2017-04-30.
      in: query
      name: modifiedAt.gte
      schema:
        format: datetime
        type: string
    createdAt.lt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created before the specified time. e.g. < 2017-04-30.
      in: query
      name: createdAt.lt
      schema:
        format: datetime
        type: string
    archiveReason.anyOf:
      description: Restricts items to those with any of the specified archive reasons. Use "NOT_ARCHIVED" to filter for unarchived items. Use "ANY_ARCHIVED" to filter for archived items regardless of reason. Use "ANY_ARCHIVED_OR_NOT_ARCHIVED" to return items for both archived and unarchived. Comma-separated list.
      explode: false
      in: query
      name: archiveReason.anyOf
      schema:
        items:
          type: string
        maxItems: 10
        type: array
    returning:
      description: Comma-separated list of top-level fields to include in each returned item. Cannot overlap with omit.
      explode: false
      in: query
      name: returning
      schema:
        items:
          type: string
        type: array
    archived.anyOf:
      description: If true, returns archived items. If false, returns unarchived items. If both true and false, returns archived and unarchived items. Comma-separated list.
      explode: false
      in: query
      name: archived.anyOf
      schema:
        items:
          type: boolean
        maxItems: 2
        type: array
    nextToken:
      description: Token for pagination
      in: query
      name: nextToken
      schema:
        type: string
    omit:
      description: Comma-separated list of top-level fields to omit from each returned item. Cannot overlap with returning.
      explode: false
      in: query
      name: omit
      schema:
        items:
          type: string
        type: array
    createdAt.lte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or before the specified time. e.g. <= 2017-04-30.
      in: query
      name: createdAt.lte
      schema:
        format: datetime
        type: string
  schemas:
    ProcedureStepExecutionInstanceRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ProcedureParameterPlannedValueUnpaginatedList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/ProcedureParameterPlannedValue'
          type: array
      type: object
    ProcedureParameterConfirmationValue:
      description: 'Records a scientist''s confirmation of a parameter value during procedure execution. When running

        a procedure, scientists confirm that inputs (such as materials, equipment, or data) match

        expectations before proceeding. This type captures that confirmation along with an optional

        comment and timestamp (`recordedAt`). Distinct from `ProcedureParameterPlannedValue` (the

        expected value set during procedure setup) and `ProcedureParameterMeasuredValue` (the actual

        result recorded after execution). For material input parameters, `amount` and `container`

        fields specify the confirmed quantities and storage locations. Links to the specific

        `ProcedureMethodExecutionInstance` where the confirmation occurred and the

        `ProcedureParameterVersion` defining the parameter being confirmed.'
      properties:
        __typename:
          type: string
        amount:
          type:
          - 'null'
          - object
        comment:
          type: string
        container:
          type:
          - 'null'
          - object
        createdAt:
          format: datetime
          type: string
        creator:
          $ref: '#/components/schemas/PrincipalRef'
        id:
          type: string
        methodExecutionInstance:
          $ref: '#/components/schemas/ProcedureMethodExecutionInstanceRef'
        modifiedAt:
          format: datetime
          type: string
        parameterVersion:
          $ref: '#/components/schemas/ProcedureParameterVersionRef'
        plateWellAssociations:
          items:
            $ref: '#/components/schemas/ProcedureParameterValueLinkedPlateWell'
          type: array
        recordedAt:
          format: datetime
          type:
          - 'null'
          - string
        value:
          type: object
      type: object
    ProcedureRunRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    InternalServerError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        errorId:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    ProcedureMethodExecutionInstanceRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ProcedureParameterValueLinkedPlateWell:
      description: 'Associates a parameter value with a specific well on a laboratory plate. Used within

        `ProcedureParameterPlannedValue`, `ProcedureParameterConfirmationValue`, and

        `ProcedureParameterMeasuredValue` via the `plateWellAssociations` field. Enables

        plate map integrations where parameter values correspond to individual wells. The

        `plateId` references the plate (Plate, MatrixPlate, or WellPlate), and `wellPosition`

        specifies the alphanumeric coordinate (such as "A1" or "B19").'
      properties:
        __typename:
          type: string
        plateId:
          type: string
        wellPosition:
          description: Alphanumeric position of plate well eg. A1, B19
          type: string
      type: object
    ProcedureMethodDefinitionVersionRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    PrincipalRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ProcedureParameterConfirmationValueUnpaginatedList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/ProcedureParameterConfirmationValue'
          type: array
      type: object
    ProcedureMethodExecutionInstancePaginatedList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/ProcedureMethodExecutionInstance'
          type: array
        nextToken:
          type: string
      type: object
    ProcedureParameterPlannedValue:
      description: 'Stores the expected or planned value for a parameter, set during procedure setup or run planning.

        Used to specify anticipated inputs before execution begins—for example, the target concentration

        for a reagent, the expected sample to use, or the equipment to employ. Scientists can later

        confirm these values (`ProcedureParameterConfirmationValue`) during execution or record actual

        results (`ProcedureParameterMeasuredValue`). For material inputs, `amount` and `container` fields

        specify planned quantities and storage locations. Links to `ProcedureParameterVersion` for the

        parameter definition and optionally to a `ProcedureMethodExecutionInstance` when associated with

        a specific run.'
      properties:
        __typename:
          type: string
        amount:
          type:
          - 'null'
          - object
        container:
          type:
          - 'null'
          - object
        createdAt:
          format: datetime
          type: string
        creator:
          $ref: '#/components/schemas/PrincipalRef'
        id:
          type: string
        methodExecutionInstance:
          oneOf:
          - $ref: '#/components/schemas/ProcedureMethodExecutionInstanceRef'
          - type: 'null'
        modifiedAt:
          format: datetime
          type: string
        parameterVersion:
          $ref: '#/components/schemas/ProcedureParameterVersionRef'
        plateWellAssociations:
          items:
            $ref: '#/components/schemas/ProcedureParameterValueLinkedPlateWell'
          type: array
        value:
          type: object
      type: object
    ProcedureRunConditionReplicateRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ProcedureParameterMeasuredValueUnpaginatedList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/ProcedureParameterMeasuredValue'
          type: array
      type: object
    TaskTransitionExtension:
      description: 'Records a status change event on a method task during procedure execution. Captures the

        comment provided, the human-readable status name, and the timestamp when the transition

        occurred. Used to track the history of task state changes.'
      properties:
        __typename:
          type: string
        comment:
          type: string
        statusDisplayName:
          type: string
        timestampUtcIsoformat:
          type: string
      type: object
    ProcedureParameterVersionRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    GeneralError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    ProcedureParameterMeasuredValue:
      description: 'Records the actual measured or observed value for a parameter during procedure execution.

        Scientists enter measured values after performing an experimental step—for example,

        recording a temperature reading, an absorbance measurement, or an observed result.

        Distinct from `ProcedureParameterPlannedValue` (expected values set during setup) and

        `ProcedureParameterConfirmationValue` (verification that inputs match expectations).

        Includes an optional `comment` and `recordedAt` timestamp. Links to the specific

        `ProcedureMethodExecutionInstance` and `ProcedureParameterVersion` for context.'
      properties:
        __typename:
          type: string
        amount:
          type:
          - 'null'
          - object
        comment:
          type: string
        container:
          type:
          - 'null'
          - object
        createdAt:
          format: datetime
          type: string
        creator:
          $ref: '#/components/schemas/PrincipalRef'
        id:
          type: string
        methodExecutionInstance:
          $ref: '#/components/schemas/ProcedureMethodExecutionInstanceRef'
        modifiedAt:
          format: datetime
          type: string
        parameterVersion:
          $ref: '#/components/schemas/ProcedureParameterVersionRef'
        recordedAt:
          format: datetime
          type:
          - 'null'
          - string
        value:
          type: object
      type: object
    ProcedureMethodExecutionInstance:
      description: 'An instance of a method being executed within a procedure run. When a scientist runs a

        procedure, each method in the flowchart becomes a ProcedureMethodExecutionInstance that tracks

        the actual execution: the worksheet where data is entered (`worksheet`), the associated task

        (`methodTask`), step groups with execution instances (`stepGroups`), and all parameter values

        (planned, confirmed, and measured). Links to its `ProcedureRun`, the template method it''s based

        on (`templateMethodVersion`), and the specific condition/replicate it belongs to

        (`procedureRunConditionReplicate`). Material flow between methods is tracked via

        `sourceProcedureMethodExecutionInstanceAssociations` and

        `targetProcedureMethodExecutionInstanceAssociations`.'
      properties:
        __typename:
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        createdAt:
          format: datetime
          type: string
        dataParameterActualValues:
          format: uri
          type: string
        dataParameterConfirmationValues:
          format: uri
          type: string
        dataParameterPlannedValues:
          description: Source of truth for this specific PMEI's planned data parameter values, with any condition overrides.
          format: uri
          type: string
        equipmentConfirmationValues:
          format: uri
          type: string
        equipmentPlannedValues:
          description: Source of truth for this specific PMEI's planned equipment values, with any condition overrides.
          format: uri
          type: string
        id:
          type: string
        materialInputConfirmationValues:
          format: uri
          type: string
        materialInputPlannedValues:
          description: 'Source of truth for this specific PMEI''s planned material input values, with any condition overrides.


            Note: This will not include any process intermediate values when previous methods have not yet been

            completed.'
          format: uri
          type: string
        materialOutputConfirmationValues:
          format: uri
          type: string
        modifiedAt:
          format: datetime
          type: string
        procedureRun:
          $ref: '#/components/schemas/ProcedureRunRef'
        procedureRunConditionReplicate:
          $ref: '#/components/schemas/ProcedureRunConditionReplicateRef'
        stepGroups:
          items:
            $ref: '#/components/schemas/ProcedureExecutionStepGroup'
          type: array
        taskTransitionExtensions:
          items:
            $ref: '#/components/schemas/TaskTransitionExtension'
          type: array
        templateMethodVersion:
          $ref: '#/components/schemas/ProcedureMethodDefinitionVersionRef'
          description: 'The "template" method version represents the PMDV on the procedure template that this PMEI is based on.


            In most cases this is equivalent to the planMethodVersion. They only differ on older legacy

            ProcedureRuns, where "plan" PMDVs belong to a legacy "plan" ProcedureFlowchart model and we compiled a

            dedicated ProcedureFlowchart for this run (with its own PMDVs) based on the template''s legacy ProcedureFlowchart.


            Do not directly use the parameter planned values from this PMDV. dataParameterPlannedValues, materialInputPlannedValues,

            and equipmentPlannedValues on the PMEI itself are the source of truth instead, since they account for

            experiment planning condition overrides that are not reflected on the PMDV.


            Do not use the confirmation methods from the parameter versions in this PMDV. parameterConfirmationMethods

            on the PMEI itself is the source of truth instead, since it accounts for experiment planning condition

            overrides that are not reflected on the PMDV.'
      type: object
    ProcedureExecutionStepGroup:
      description: 'Groups step execution instances by their execution phase during a procedure run. Analogous

        to `ProcedureStepGroup` but contains actual execution instances (`ProcedureStepExecutionInstance`)

        rather than step definitions. Each group''s steps are ordered by execution sequence.'
      properties:
        __typename:
          type: string
        group:
          enum:
          - PRE_RUN
          - RUN
          - POST_RUN
          type: string
        steps:
          items:
            $ref: '#/components/schemas/ProcedureStepExecutionInstanceRef'
          type: array
      type: object
  responses:
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Not Found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Too Many Requests
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Bad Request
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Forbidden
    InternalServerError:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
      description: Internal Server Error
  securitySchemes:
    basicApiKeyAuth:
      description: Use issued API key for standard access to the API
      scheme: basic
      type: http
    basicClientIdSecretAuth:
      description: Auth used as part of client credentials OAuth flow prior to receiving a bearer token.
      scheme: basic
      type: http
    oAuth:
      description: OAuth2 Client Credentials flow intended for service access
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: /oauth/token
      type: oauth2
