        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcedureMethodExecutionInstanceAssociationUpsert'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureMethodExecutionInstanceAssociation'
          description: Created
        '400':
