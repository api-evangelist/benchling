openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Procedure Method Execution Instance Association…
  version: 2.0.0
  description: 'Links two method execution instances across procedure runs to represent an intended connection within a study.

    This allows scientists to coordinate their analyses across runs, even when the flowchart structure may differ.


    ## Product mapping


    - In the Benchling UI, this represents an explicit **link/association between executed methods**

    used for unit-operation linking **across runs**.

    - For linking **within a single run** (for example, split pooling), use the

    `ProcedureRunReplicateEdge` flowchart links.

    - The association operates on runtime instances (`ProcedureMethodExecutionInstance`), not template

    method definitions.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'Links two method execution instances across procedure runs to represent an intended connection within a study.

    This allows scientists to coordinate their analyses across runs, even when the flowchart structure may differ.


    ## Product mapping


    - In the Benchling UI, this represents an explicit **link/association between executed methods**

    used for unit-operation linking **across runs**.

    - For linking **within a single run** (for example, split pooling), use the

    `ProcedureRunReplicateEdge` flowchart links.

    - The association operates on runtime instances (`ProcedureMethodExecutionInstance`), not template

    method definitions.'
  name: ProcedureMethodExecutionInstanceAssociation
  x-bnch-organization: Benchling
  x-displayName: Procedure Method Execution Instance Association
paths:
  /procedure-method-execution-instance-association:
    post:
      description: Create ProcedureMethodExecutionInstanceAssociation.
      operationId: ProcedureMethodExecutionInstanceAssociation.Create
      parameters:
      - description: Set to true to access beta operations via /api/v3.
