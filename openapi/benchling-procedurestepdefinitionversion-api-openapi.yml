openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Procedure Step Definition Version API
  version: 2.0.0
  description: 'A versioned definition of a procedure step within a procedure flowchart. Steps represent

    documentation or instructions that guide scientists through a procedure but do not collect

    data—they differ from methods (`ProcedureMethodDefinitionVersion`) which have parameters for

    data entry. The `documentVersion` field links to a `DocumentVersion` containing the step''s

    text content, which may include formatted instructions, images, or other rich content. Steps

    are immutable; updating a step creates a new version. Belongs to a procedure flowchart via

    `procedureFlowchartId`. Also known as a "text step" or "instruction step" in the Benchling UI.


    ## Product mapping


    - In the procedure editor, this maps to a **step** in a method template. The step typically

    contains instructions or operations to be performed during an experiment.

    - This is a template/versioned definition; the runtime record during execution is

    `ProcedureStepExecutionInstance`.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'A versioned definition of a procedure step within a procedure flowchart. Steps represent

    documentation or instructions that guide scientists through a procedure but do not collect

    data—they differ from methods (`ProcedureMethodDefinitionVersion`) which have parameters for

    data entry. The `documentVersion` field links to a `DocumentVersion` containing the step''s

    text content, which may include formatted instructions, images, or other rich content. Steps

    are immutable; updating a step creates a new version. Belongs to a procedure flowchart via

    `procedureFlowchartId`. Also known as a "text step" or "instruction step" in the Benchling UI.


    ## Product mapping


    - In the procedure editor, this maps to a **step** in a method template. The step typically

    contains instructions or operations to be performed during an experiment.

    - This is a template/versioned definition; the runtime record during execution is

    `ProcedureStepExecutionInstance`.'
  name: ProcedureStepDefinitionVersion
  x-bnch-organization: Benchling
  x-displayName: Procedure Step Definition Version
paths:
  /procedure-step-definition-version/items:
    get:
      description: List ProcedureStepDefinitionVersion items.
      operationId: ProcedureStepDefinitionVersion.List
      parameters:
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/name.anyOf'
      - $ref: '#/components/parameters/name.anyOf.caseSensitive'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/returning'
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is createdAt:desc.'
        in: query
        name: sort
        schema:
          default: createdAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureStepDefinitionVersionPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List ProcedureStepDefinitionVersion items
      tags:
      - ProcedureStepDefinitionVersion
  /procedure-step-definition-version/{procedure_step_definition_version_id}:
    get:
      description: Get a single ProcedureStepDefinitionVersion by ID.
      operationId: ProcedureStepDefinitionVersion.Get
      parameters:
      - description: ID of the ProcedureStepDefinitionVersion.
        in: path
        name: procedure_step_definition_version_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureStepDefinitionVersion'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get ProcedureStepDefinitionVersion by ID
      tags:
      - ProcedureStepDefinitionVersion
components:
  parameters:
    pageSize:
      description: Number of results to return. Defaults to 50, maximum of 100.
      in: query
      name: pageSize
      schema:
        type: integer
    nextToken:
      description: Token for pagination
      in: query
      name: nextToken
      schema:
        type: string
    createdAt.lte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or before the specified time. e.g. <= 2017-04-30.
      in: query
      name: createdAt.lte
      schema:
        format: datetime
        type: string
    createdAt.gte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or after the specified time. e.g. >= 2017-04-30.
      in: query
      name: createdAt.gte
      schema:
        format: datetime
        type: string
    returning:
      description: Comma-separated list of top-level fields to include in each returned item. Cannot overlap with omit.
      explode: false
      in: query
      name: returning
      schema:
        items:
          type: string
        type: array
    omit:
      description: Comma-separated list of top-level fields to omit from each returned item. Cannot overlap with returning.
      explode: false
      in: query
      name: omit
      schema:
        items:
          type: string
        type: array
    name.anyOf.caseSensitive:
      description: Restricts results to those that match any of the specified names. Case sensitive. Ensure only one name filter is used at a time. Comma-separated list.
      explode: false
      in: query
      name: name.anyOf.caseSensitive
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    id.anyOf:
      description: Restricts results to those matching any of the specified IDs. Comma-separated list.
      explode: false
      in: query
      name: id.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    createdAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created after the specified time. e.g. > 2017-04-30.
      in: query
      name: createdAt.gt
      schema:
        format: datetime
        type: string
    name.anyOf:
      description: Restricts results to those that match any of the specified names. Case insensitive. Warning - this filter can be non-performant due to case insensitivity. Ensure only one name filter is used at a time. Comma-separated list.
      explode: false
      in: query
      name: name.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    createdAt.lt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created before the specified time. e.g. < 2017-04-30.
      in: query
      name: createdAt.lt
      schema:
        format: datetime
        type: string
  responses:
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsError'
      description: Too Many Requests
      headers:
        Retry-After:
          description: Minimum number of seconds to wait before retrying. Only included when the request exceeded a rate limit specific to the caller. Limits shared with other callers, such as tenant-wide limits, omit this header because the wait depends on their traffic.
          required: false
          schema:
            minimum: 1
            type: integer
    InternalServerError:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
      description: Internal Server Error
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Not Found
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Bad Request
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Forbidden
  schemas:
    InternalServerError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        errorId:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    TooManyRequestsError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    GeneralError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    ProcedureStepDefinitionVersion:
      description: "A versioned definition of a procedure step within a procedure flowchart. Steps represent\ndocumentation or instructions that guide scientists through a procedure but do not collect\ndata—they differ from methods (`ProcedureMethodDefinitionVersion`) which have parameters for\ndata entry. The `documentVersion` field links to a `DocumentVersion` containing the step's\ntext content, which may include formatted instructions, images, or other rich content. Steps\nare immutable; updating a step creates a new version. Belongs to a procedure flowchart via\n`procedureFlowchartId`. Also known as a \"text step\" or \"instruction step\" in the Benchling UI.\n\n## Product mapping\n\n- In the procedure editor, this maps to a **step** in a method template. The step typically\n  contains instructions or operations to be performed during an experiment.\n- This is a template/versioned definition; the runtime record during execution is\n  `ProcedureStepExecutionInstance`."
      properties:
        __typename:
          type: string
        createdAt:
          format: datetime
          type: string
        id:
          type: string
        name:
          type: string
      type: object
    ProcedureStepDefinitionVersionPaginatedList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/ProcedureStepDefinitionVersion'
          type: array
        nextToken:
          type:
          - string
          - 'null'
      type: object
  securitySchemes:
    BearerAuth:
      description: Use a short-lived V3 API Explorer token.
      scheme: bearer
      type: http
      x-fern-playground-description: Copy a short-lived V3 API Explorer token from the user's settings page
    basicApiKeyAuth:
      description: Use issued API key for standard access to the API
      scheme: basic
      type: http
    basicClientIdSecretAuth:
      description: Auth used as part of client credentials OAuth flow prior to receiving a bearer token.
      scheme: basic
      type: http
    oAuth:
      description: OAuth2 Client Credentials flow intended for service access
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: /oauth/token
      type: oauth2
