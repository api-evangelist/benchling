openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Protein API
  version: 2.0.0
  description: 'A Protein is a complex biomolecule entity in Benchling representing immunoglobulins or

    related therapeutic proteins like T-cell receptors. Proteins are defined by an

    `ProteinFormat` that specifies their structural organization, with actual sequences

    provided in domains (see `ProteinDomain`) and chains (see `ProteinChain`). Proteins support versioning

    through history/fullHistory, allowing tracking of structural changes over time. As registry entities,

    proteins can have schemas with custom fields, belong to projects and folders, and be linked to studies.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'A Protein is a complex biomolecule entity in Benchling representing immunoglobulins or

    related therapeutic proteins like T-cell receptors. Proteins are defined by an

    `ProteinFormat` that specifies their structural organization, with actual sequences

    provided in domains (see `ProteinDomain`) and chains (see `ProteinChain`). Proteins support versioning

    through history/fullHistory, allowing tracking of structural changes over time. As registry entities,

    proteins can have schemas with custom fields, belong to projects and folders, and be linked to studies.'
  name: Protein
  x-bnch-core-type: Protein
  x-bnch-organization: Benchling
paths:
  /protein:
    post:
      description: Create Protein.
      operationId: Protein.Create
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProteinInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protein'
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create Protein
      tags:
      - Protein
      x-bnch-rate-limit-tier: 4
  /protein/items:
    get:
      description: List Protein items.
      operationId: Protein.List
      parameters:
      - $ref: '#/components/parameters/archiveReason.anyOf'
      - $ref: '#/components/parameters/archived.anyOf'
      - $ref: '#/components/parameters/authors.anyOf'
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/creator.anyOf'
      - $ref: '#/components/parameters/fieldset.anyOf'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/mentionedIn.anyOf'
      - $ref: '#/components/parameters/modifiedAt.gt'
      - $ref: '#/components/parameters/modifiedAt.gte'
      - $ref: '#/components/parameters/modifiedAt.lt'
      - $ref: '#/components/parameters/modifiedAt.lte'
      - $ref: '#/components/parameters/name.anyOf'
      - $ref: '#/components/parameters/name.anyOf.caseSensitive'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/project.eq'
      - $ref: '#/components/parameters/registry.eq'
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/schema.anyOf'
      - $ref: '#/components/parameters/schema.eq'
      - $ref: '#/components/parameters/systemCategory.anyOf'
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first) and modifiedAt (modified time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is modifiedAt:desc.'
        in: query
        name: sort
        schema:
          default: modifiedAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          - modifiedAt:asc
          - modifiedAt:desc
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProteinPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List Protein items
      tags:
      - Protein
      x-bnch-rate-limit-tier: 4
  /protein/{protein_id}:
    get:
      description: Get a single Protein by ID.
      operationId: Protein.Get
      parameters:
      - description: ID of the Protein.
        in: path
        name: protein_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protein'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get Protein by ID
      tags:
      - Protein
      x-bnch-rate-limit-tier: 5
    patch:
      description: Update Protein.
      operationId: Protein.Update
      parameters:
      - description: ID of the Protein.
        in: path
        name: protein_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProteinInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protein'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Update Protein
      tags:
      - Protein
      x-bnch-rate-limit-tier: 4
  /protein/{protein_id}/authors/items:
    get:
      description: List Principal items.
      operationId: Protein.authors.List
      parameters:
      - description: ID of the Protein.
        in: path
        name: protein_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List Principal items
      tags:
      - Protein
      x-bnch-rate-limit-tier: 4
  /protein/{protein_id}/full-history/items:
    get:
      description: List ProteinVersion items.
      operationId: Protein.fullHistory.List
      parameters:
      - description: ID of the Protein.
        in: path
        name: protein_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProteinVersionUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List ProteinVersion items
      tags:
      - Protein
      x-bnch-rate-limit-tier: 4
  /protein/{protein_id}/history/items:
    get:
      description: List ProteinVersion items.
      operationId: Protein.history.List
      parameters:
      - description: ID of the Protein.
        in: path
        name: protein_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProteinVersionUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List ProteinVersion items
      tags:
      - Protein
      x-bnch-rate-limit-tier: 4
  /protein:batch-create:
    post:
      description: Batch create Protein synchronously in one transaction. Maximum 25 items per request.
      operationId: Protein.BatchCreate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/CreateProteinInput'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/Protein'
                    type: array
                required:
                - items
                type: object
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch create Protein
      tags:
      - Protein
      x-bnch-rate-limit-tier: 3
  /protein:batch-update:
    patch:
      description: Batch update Protein synchronously in one transaction. Maximum 25 items per request.
      operationId: Protein.BatchUpdate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/UpdateProteinInputWithPathParams'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/Protein'
                    type: array
                required:
                - items
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch update Protein
      tags:
      - Protein
      x-bnch-rate-limit-tier: 3
  /protein:bulk-create:
    post:
      description: Bulk create Protein.
      operationId: Protein.BulkCreate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk create Protein
      tags:
      - Protein
      x-bnch-rate-limit-tier: 2
  /protein:bulk-update:
    patch:
      description: Bulk update Protein.
      operationId: Protein.BulkUpdate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk update Protein
      tags:
      - Protein
      x-bnch-rate-limit-tier: 2
  /proteins:bulk-create-and-register-proteins-and-components:
    post:
      description: Create and register proteins and their component parts (domains, chains, and variable pairs)
      operationId: ProteinsAndComponents.BulkCreate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                entryId:
                  description: 'The ID of the notebook entry into which the creation results will be embedded upon completion.

                    If omitted, no results are written to a notebook entry.

                    '
                  example: etr_8eTVGFUm2T
                  type: string
                folderId:
                  description: The ID of the folder in which the new entities should be created.
                  example: lib_lKsxK6
                  type: string
                germlineConfigs:
                  description: 'A list of germline configs indicating the germline with which to annotate each domain key.

                    This applies to all rows in the request.

                    '
                  items:
                    additionalProperties: false
                    properties:
                      domainKey:
                        additionalProperties: false
                        properties:
                          label:
                            description: The domain label (e.g., "VH", "VL").
                            example: VH
                            type: string
                        required:
                        - label
                        type: object
                      germlineId:
                        description: API ID of the germline to use for this domain.
                        example: grmln_abc123
                        type: string
                    required:
                    - domainKey
                    - germlineId
                    type: object
                  nullable: true
                  type: array
                newComponentConfig:
                  additionalProperties: false
                  description: 'Schema IDs for new component entities created during this request.

                    Applies to all rows in the request.

                    '
                  properties:
                    aaPairSchemaId:
                      description: 'Schema ID for creating Amino Acid variable pair entities for this request.

                        '
                      example: ts_aapair012
                      type: string
                    dnaChainSchemaId:
                      description: 'Schema ID for DNA chain sequences created for this request.

                        Required if there are DNA inputs.

                        '
                      example: ts_dnachain456
                      nullable: true
                      type: string
                    dnaDomainSchemaId:
                      description: 'Schema ID for DNA domain sequences created for this request.

                        Required if there are DNA inputs.

                        '
                      example: ts_dnadomain123
                      nullable: true
                      type: string
                    dnaPairSchemaId:
                      description: 'Schema ID for creating DNA variable pair entities for this request.

                        Required if there are DNA inputs.

                        '
                      example: ts_dnapair789
                      nullable: true
                      type: string
                  required:
                  - aaPairSchemaId
                  type: object
                proteinCreateInputs:
                  items:
                    additionalProperties: false
                    anyOf:
                    - required:
                      - domains
                    - required:
                      - chains
                    description: 'Describes one complete protein and optionally some of the DNA that encodes for it.


                      The input does not necessarily need to contain every domain and every chain

                      defined in the associated proteinSchema, and users of this API are welcome to leave

                      many of them out as long as they meet the following constraint:


                      For every amino acid chain type defined in the proteinSchema, either

                      a) it must occur in the chains array

                      or

                      b) each of its constituent domain types must occur in the domains array, or occur as a component

                      of one of the provided variablePairs.


                      Chains that are not provided will be derived from their constituent domains.

                      Domains that are not provided will be annotated and decomposed based on an analysis of the sequence of the

                      chains containing them.

                      '
                    properties:
                      chains:
                        items:
                          additionalProperties: false
                          anyOf:
                          - required:
                            - chainKey
                            - dnaComponent
                          - required:
                            - chainKey
                            - aaComponent
                          description: 'Defines an entity to represent the amino acid residues for one amino acid chain of the protein.

                            Optionally also defines one entity to represent the associated DNA.

                            If only dnaComponent is provided, the amino acid residues will be derived from it by translation.

                            If both dnaComponent and aaComponent are provided, the DNA bases must translate to the Amino Acid residues.

                            '
                          properties:
                            aaComponent:
                              anyOf:
                              - additionalProperties: false
                                properties:
                                  aaSequenceId:
                                    description: API ID of an existing AA sequence.
                                    example: prtn_uIKU1o
                                    type: string
                                  type:
                                    enum:
                                    - EXISTING
                                    example: EXISTING
                                    type: string
                                required:
                                - type
                                - aaSequenceId
                                type: object
                              - additionalProperties: false
                                properties:
                                  residues:
                                    description: The amino acid residues for the new sequence to be created.
                                    example: MEVQLVESGGGLVQPGGSLRLSCAASGF
                                    type: string
                                  type:
                                    enum:
                                    - NEW
                                    example: NEW
                                    type: string
                                required:
                                - type
                                - residues
                                type: object
                            chainKey:
                              additionalProperties: false
                              properties:
                                label:
                                  example: Heavy
                                  type: string
                              required:
                              - label
                              type: object
                            dnaComponent:
                              anyOf:
                              - additionalProperties: false
                                properties:
                                  dnaSequenceId:
                                    description: API ID of an existing DNA sequence.
                                    example: seq_sX1bVB
                                    type: string
                                  type:
                                    enum:
                                    - EXISTING
                                    example: EXISTING
                                    type: string
                                required:
                                - type
                                - dnaSequenceId
                                type: object
                              - additionalProperties: false
                                properties:
                                  bases:
                                    description: The DNA bases for the new sequence to be created.
                                    example: ATGCATGC
                                    type: string
                                  type:
                                    enum:
                                    - NEW
                                    example: NEW
                                    type: string
                                required:
                                - type
                                - bases
                                type: object
                          type: object
                        type: array
                      domains:
                        items:
                          additionalProperties: false
                          anyOf:
                          - required:
                            - domainKey
                            - dnaComponent
                          - required:
                            - domainKey
                            - aaComponent
                          description: 'Defines an entity to represent the amino acid residues for one domain of the protein.

                            Optionally also defines one entity to represent the associated DNA.

                            If only dnaComponent is provided, the amino acid residues will be derived from it by translation.

                            If both dnaComponent and aaComponent are provided, the DNA bases must translate to the Amino Acid residues.

                            '
                          properties:
                            aaComponent:
                              anyOf:
                              - additionalProperties: false
                                properties:
                                  aaSequenceId:
                                    description: API ID of an existing AA sequence entity.
                                    example: prtn_uIKU1o
                                    type: string
                                  type:
                                    enum:
                                    - EXISTING
                                    example: EXISTING
                                    type: string
                                required:
                                - type
                                - aaSequenceId
                                type: object
                              - additionalProperties: false
                                properties:
                                  residues:
                                    description: The amino acid residues to use for the new Amino Acid sequence entity.
                                    example: MEVQLVESGGGLVQPGGSLRLSCAASGF
                                    type: string
                                  type:
                                    enum:
                                    - NEW
                                    example: NEW
                                    type: string
                                required:
                                - type
                                - residues
                                type: object
                            dnaComponent:
                              anyOf:
                              - additionalProperties: false
                                properties:
                                  dnaSequenceId:
                                    description: API ID of an existing DNA sequence entity.
                                    example: seq_sX1bVB
                                    type: string
                                  type:
                                    enum:
                                    - EXISTING
                                    example: EXISTING
                                    type: string
                                required:
                                - type
                                - dnaSequenceId
                                type: object
                              - additionalProperties: false
                                properties:
                                  bases:
                                    description: The DNA bases to use for the new DNA sequence entity.
                                    example: ATGCATGCC
                                    type: string
                                  type:
                                    enum:
                                    - NEW
                                    example: NEW
                                    type: string
                                required:
                                - type
                                - bases
                                type: object
                            domainKey:
                              additionalProperties: false
                              properties:
                                label:
                                  description: The domain label (e.g., "VH", "CH1(Heavy)", "VLkappa").
                                  example: CH1(Heavy)
                                  type: string
                              required:
                              - label
                              type: object
                          type: object
                        type: array
                      variablePairs:
                        description: 'A list of variable domain pair inputs (e.g., VH+VL for antibodies, VA+VB for TCRs).

                          Each pair is identified by its two constituent domain keys.

                          '
                        items:
                          additionalProperties: false
                          anyOf:
                          - required:
                            - pairKey
                            - dnaPairId
                          - required:
                            - pairKey
                            - aaPairId
                          properties:
                            aaPairId:
                              description: API ID of an existing AA variable pair entity.
                              example: bfi_def456
                              type: string
                            dnaPairId:
                              description: API ID of an existing DNA variable pair entity.
                              example: bfi_abc123
                              type: string
                            pairKey:
                              additionalProperties: false
                              description: 'Identifies the variable domain pair by its two constituent domain keys.

                                ''vhVaVg'' covers VH (antibody), VA (TCR alpha/delta), or VG (TCR gamma) domains.

                                ''vlVbVd'' covers VL (antibody), VB (TCR beta), or VD (TCR delta) domains.

                                '
                              properties:
                                vhVaVg:
                                  additionalProperties: false
                                  properties:
                                    label:
                                      description: The domain label of the VH, VA, or VG domain in this pair.
                                      example: VH
                                      type: string
                                  required:
                                  - label
                                  type: object
                                vlVbVd:
                                  additionalProperties: false
                                  properties:
                                    label:
                                      description: The domain label of the VL, VB, or VD domain in this pair.
                                      example: VL
                                      type: string
                                  required:
                                  - label
                                  type: object
                              required:
                              - vhVaVg
                              - vlVbVd
                              type: object
                          type: object
                        nullable: true
                        type: array
                    type: object
                  minItems: 1
                  type: array
                proteinSchemaId:
                  description: The schema ID for the protein entity type.
                  example: ts_XEUrLw
                  type: string
                translationParameters:
                  additionalProperties: false
                  description: 'The translation parameters to use when creating AA sequences.

                    Required if the request contains DNA sequences.

                    May be omitted if the request contains only AA sequences.

                    '
                  properties:
                    geneticCode:
                      description: The codon table to use to translate DNA sequences to AA sequences.
                      enum:
                      - STANDARD
                      - VERTEBRATE_MITOCHONDRIAL
                      - YEAST_MITOCHONDRIAL
                      - MOLD_MITOCHONDRIAL
                      - INVERTEBRATE_MITOCHONDRIAL
                      - CILIATE_NUCLEAR
                      - ECHINODERM_MITOCHONDRIAL
                      - EUPLOTID_NUCLEAR
                      - BACTERIAL_ARCHAEAL
                      - ALTERNATIVE_YEAST_NUCLEAR
                      - ASCIDIAN_MITOCHONDRIAL
                      - ALTERNATIVE_FLATWORM_MITOCHONDRIAL
                      - BLEPHARISMA_NUCLEAR
                      - CHLOROPHYCEAN_MITOCHONDRIAL
                      - TREMATODE_MITOCHONDRIAL
                      - SCENEDESMUS_OBLIQUUS_MITOCHONDRIAL
                      - THRAUSTOCHYTRIUM_MITOCHONDRIAL
                      - PTEROBRANCHIA_MITOCHONDRIAL
                      - CANDIDATE_DIVISION_SR1
                      type: string
                  required:
                  - geneticCode
                  type: object
              required:
              - folderId
              - proteinSchemaId
              - newComponentConfig
              - proteinCreateInputs
              type: object
        description: 'Create and register proteins along with their component domains, chains, and variable pairs.


          Does not create plasmids.


          **Optional/Required Inputs**


          Any components that are not provided in the input will be derived

          from other input components when possible.

          For example, AA domains are not necessary if DNA domains are provided.

          See the documentation on the proteinCreateInputs parameter for more detail.

          Here are some example ways to provide the inputs:

          - provide all domains as DNA

          - provide all domains as AA

          - provide constant domains as AA and variable domains using variable pairs


          **Scale**


          A single call to this API may include up to:

          - 1,000 antibodies

          - 4,000 AA chains

          - 4,000 DNA chains

          - 14,000 AA domains

          - 14,000 DNA domains

          - 2,000 DNA pairs

          - 2,000 AA pairs


          **Large requests may take several hours to complete.**

          When results are ready, they''ll be aggregated into a Benchling.Dataset object,

          and added to the folder and entry referenced in the input.


          **Error Handling and Partial Success**


          All inputs are validated before any registrations begin.

          If any input fails validation, no proteins are registered.

          In rare cases (e.g. concurrent manual data changes during a running task),

          a partial success is possible.

          '
      responses:
        '202':
          content:
            application/json:
              schema:
                properties:
                  pollingUri:
                    description: A URL to poll for the status of the task.
                    example: https://tenant.com/api/v3/tasks/bulk-create-and-register-proteins-and-components/cprotjob:ana_fhlbqd
                    format: uri
                    type: string
                  taskId:
                    example: cprotjob:ana_fhlbqd
                    type: string
                required:
                - taskId
                - pollingUri
                type: object
          description: Job status details
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create and register proteins and components
      tags:
      - Protein
      x-bnch-rate-limit-tier: 2
  /tasks/bulk-create-and-register-proteins-and-components/{task_id}:
    get:
      description: 'Get the current status of a bulk-create-and-register-proteins-and-components task.

        When a job reaches a `COMPLETED` status, you can call the

        `GET /tasks/bulk-create-and-register-proteins-and-components/{task_id}/results`

        endpoint to fetch task results and errors.


        Task IDs for this endpoint remain queryable for 14 days after the

        job is created.

        After that TTL expires, this endpoint returns 404. Retrieve any status

        and results you need before the task ID expires.

        '
      operationId: BulkCreateAndRegisterProteinsAndComponentsTask.Get
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  result:
                    properties:
                      hasErrors:
                        example: false
                        type: boolean
                      hasSuccess:
                        example: true
                        type: boolean
                    required:
                    - hasSuccess
                    - hasErrors
                    type: object
                  status:
                    description: "The current status of the task.\n- NOT_STARTED: Task has been created but not yet started.\n- IN_PROGRESS: Task is currently running.\n- COMPLETED: Task finished. Check 'result.hasErrors' to determine if there were validation errors.\n- FAILED: Task encountered an internal error (system failure). This is distinct from user-facing validation errors,\n  which result in a COMPLETED status with hasErrors=true.\n"
                    enum:
                    - NOT_STARTED
                    - IN_PROGRESS
                    - COMPLETED
                    - FAILED
                    example: IN_PROGRESS
                    type: string
                  taskId:
                    example: cprotjob:ana_fhlbqd
                    type: string
                required:
                - taskId
                - status
                - result
                type: object
          description: Job status details
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get bulk-create-and-register-proteins-and-components task status
      tags:
      - Protein
      x-bnch-rate-limit-tier: 5
  /tasks/bulk-create-and-register-proteins-and-components/{task_id}/results:
    get:
      description: "Get the results of a completed bulk-create-and-register-proteins-and-components task.\n\nThis endpoint returns an identifier for the output dataset, plus an optional\npre-signed URL to download the errors file if any inputs failed validation.\n\nTask IDs for this endpoint remain queryable for 14 days after the\njob is created.\nAfter that TTL expires, this endpoint returns 404. Retrieve the dataset\nID and any errors file URL you need before the task ID expires.\n\n**Partial Success**: A job can complete with both successful and failed inputs. Always check\n`errorsFileUrl` even when `datasetId` is present, since some inputs may have been rejected\nwhile others were created successfully.\n\nBehavior:\n- Returns 400 unless the task has a COMPLETED status. While a task is running\n  you can poll the\n  `GET /tasks/bulk-create-and-register-proteins-and-components/{task_id}`\n  endpoint first and only call this endpoint once\n  `status == \"COMPLETED\"`. If the status becomes FAILED, this endpoint\n  will always return 400.\n- If the task is in a COMPLETED status, returns parameters you can\n  use to fetch output and error data.  See the descriptions of the output\n  parameters for more detail.\n"
      operationId: BulkCreateAndRegisterProteinsAndComponentsResults.Get
      parameters:
      - in: path
        name: task_id
        required: true
        schema:
          example: cprotjob:ana_fhlbqd
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  datasetId:
                    description: "If no proteins were registered, this parameter is absent.\nOtherwise, `datasetId` identifies a Dataset object with the results data.\n\nUse this id with the Datasets API to look up the dataset and fetch\nits rows.  This dataset will be the same one displayed in the Benchling UI\nand referenced in emails about this task.\n\nDataset Columns\n- The results dataset will have an `input` column giving the index\n  of the input protein data associated to this results row.\n- It will have a `protein` column giving the api id\n  of the protein that was registered for that input.\n- It will have a `{label}_aa` and optionally a `{label}_dna` column\n  for each domain label in the format.  The DNA column will only be\n  present if the job registered DNA sequence entities for that format.\n- It will have similar `{label}_dna` and `{label}_aa` columns for\n  chains that it registered.\n- It will also have `{label1}_{label2}_pair_dna` and\n  `{label1}_{label2}_pair_aa` columns for any registered DNA and AA pairs.\n"
                    example: dataset_abc123
                    type: string
                  errorsFileUrl:
                    description: 'If all inputs were registered successfully, this parameter is absent.

                      Otherwise, it''s a pre-signed S3 URL for downloading the errors CSV.


                      This CSV will have an `Input #` column giving the index of the input

                      to the job associated with one particular protein that failed to

                      be registered. The `Error Message` column gives a description of the

                      error.


                      This file may also contain additional columns for any sequence data

                      that the job attempted to use when it failed to register this

                      particular protein. Those columns will follow the same naming

                      scheme as described above for the Dataset output.

                      '
                    example: https://bucket.s3.amazonaws.com/atsk_123/download?X-Amz-Signature=abc123
                    format: uri
                    type: string
                  taskId:
                    example: cprotjob:ana_fhlbqd
                    type: string
                required:
                - taskId
                type: object
          description: Task results
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get bulk-create-and-register-proteins-and-components task results
      tags:
      - Protein
      x-bnch-rate-limit-tier: 5
components:
