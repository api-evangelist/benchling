        typedSchema:
          oneOf:
          - $ref: '#/components/schemas/RnaSequenceSchemaRef'
          - type: 'null'
      type: object
    OligoDuplexStructure:
      description: 'Contains the complete structural definition of an oligo duplex, including its forward and

        reverse strands, any conjugated molecules and peptides, and the connections between them.


        For each simple polymer, restricted read access on the linked entity affects `entity` only; structural fields

        on that polymer are still populated for the containing duplex.'
      properties:
        __typename:
          type: string
        connections:
          description: A list of all the connections between simple polymers in this oligo duplex.
          items:
            $ref: '#/components/schemas/MolecularConnection'
          type: array
        resolvedAttachments:
          description: A list of attachment information, providing a more detailed chemical structure for a set of connections.
          items:
            $ref: '#/components/schemas/MolecularConjugate'
          type: array
        simplePolymers:
          description: A list of all the simple polymers in this oligo duplex.
          items:
            anyOf:
            - $ref: '#/components/schemas/NucleotideSimplePolymer'
            - $ref: '#/components/schemas/ChemSimplePolymer'
            - $ref: '#/components/schemas/PeptideSimplePolymer'
            - $ref: '#/components/schemas/ProteinSimplePolymer'
            description: Union of NucleotideSimplePolymer, ChemSimplePolymer, PeptideSimplePolymer, ProteinSimplePolymer
            discriminator:
              mapping:
                ChemSimplePolymer: '#/components/schemas/ChemSimplePolymer'
                NucleotideSimplePolymer: '#/components/schemas/NucleotideSimplePolymer'
                PeptideSimplePolymer: '#/components/schemas/PeptideSimplePolymer'
                ProteinSimplePolymer: '#/components/schemas/ProteinSimplePolymer'
              propertyName: __typename
          type: array
