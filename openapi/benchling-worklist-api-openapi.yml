    NucleotideSimplePolymer:
      description: 'Represents a nucleic acid strand (DNA or RNA) within a complex polymer structure. Contains the sequence

        residues and connections to other polymers. The entity field links to a corresponding DnaSequence, RnaSequence,

        DnaOligo, or RnaOligo. Used as the backbone component in OligoConjugate and as forward/reverse strands in

        OligoDuplex.'
      properties:
        __typename:
          type: string
        connections:
          description: This polymer's connections to other polymers in the complex polymer.
          items:
            $ref: '#/components/schemas/MolecularConnection'
          type: array
        entity:
          $ref: '#/components/schemas/NucleotideSequenceRef'
          description: The Benchling entity information for this simple polymer.
        helmReference:
          description: 'The HELM reference of this polymer (e.g. RNA1). Uniquely identifies this simple polymer in the context

            of a single complex polymer.'
          type: string
        nucleotideType:
          description: Whether this strand is DNA or RNA.
          enum:
          - DNA
          - RNA
          type: string
        polymerType:
          description: 'The HELM polymer type for this strand. This is always `RNA` for nucleotide simple polymers,

            including DNA sequences. Use `nucleotideType` to distinguish DNA from RNA.'
          type: string
        residues:
          description: The nucleotide base sequence of this strand.
          type: string
      type: object
    SchemaFieldDefinitionRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    RegistrationOrigin:
      description: 'Captures the provenance of an entity''s registration into the registry. The `originEntry` links

        to the `DocumentLike` (typically an entry or notebook) from which the entity was registered,

        providing traceability back to the original experimental context. The `registeredAt` timestamp

        records when the registration occurred. This information helps scientists understand where

        registered entities came from and when they were added to the registry.'
      properties:
        __typename:
          type: string
        originEntry:
          oneOf:
          - $ref: '#/components/schemas/DocumentLikeRef'
