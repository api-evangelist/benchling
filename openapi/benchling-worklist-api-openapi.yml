    RnaSequence:
      allOf:
      - $ref: '#/components/schemas/IRnaSequence'
      - description: 'Represents an RNA sequence in Benchling''s molecular biology platform. An RnaSequence stores

          the nucleotide bases (using A, C, G, U) along with annotations marking functional regions,

          translation annotations for protein-coding regions (see Translation), primer binding sites

          (see Primer), and part features linking to other registered sequences (see RnaPart). RNA

          sequences are used for modeling messenger RNAs, non-coding RNAs, CRISPR guide RNAs, and

          other RNA molecules. Sequences can be registered in the Registry with a unique

          entityRegistryId, organized in folders, and linked via schema fields to other entities.

          For modified therapeutic RNAs, see modifiedNucleotides which captures chemical modifications.

          Also known as ''Sequence'' in the Benchling interface, with IDs prefixed by ''seq''.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    Assembly:
      description: 'Represents a molecular cloning assembly that combines multiple DNA fragments into

        complete constructs. Assemblies model the process of joining fragment sequences

        (such as genes, promoters, and terminators) using methods like Gibson Assembly,

        Golden Gate, or restriction enzyme-based cloning. The assembly tracks the input

        fragments and resulting construct sequences, enabling design-to-experiment traceability.

        Assemblies can be organized in folders and support archiving when no longer needed.'
      properties:
        __typename:
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        createdAt:
          description: DateTime the Assembly was created
          format: datetime
          type: string
        creator:
          oneOf:
          - $ref: '#/components/schemas/PrincipalRef'
          - type: 'null'
        folder:
          description: Folder that contains the Assembly.
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        id:
          description: Id of the Assembly
          type: string
        modifiedAt:
          description: DateTime the Assembly was last modified
          format: datetime
          type: string
        name:
          description: Name of the Assembly
          type: string
      type: object
    Worklist:
      description: 'A typed collection of items used to group related objects for batch operations. Unlike

        folders, items can belong to multiple worklists simultaneously, making worklists useful

        as temporary holding grounds for arbitrary groups of items. Each worklist has an `itemType`

        that restricts what kinds of objects it can contain (containers, entities, or plates).

        Common use cases include scanning containers into a worklist before adding them to a

        transfer table, or grouping entities for bulk export. Worklists have an `owner` and support

        `collaborations` for access control (see `Collaboratable` interface). The `items` field

        returns the collection of `Worklistable` objects currently in the worklist.'
      properties:
        __typename:
          type: string
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        creator:
          oneOf:
          - $ref: '#/components/schemas/PrincipalRef'
          - type: 'null'
        id:
          type: string
        itemType:
          enum:
          - CONTAINER
          - ENTITY
          - PLATE
          - null
          type:
          - 'null'
          - string
        items:
          oneOf:
          - format: uri
            type: string
          - type: 'null'
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          type:
          - 'null'
          - string
        owner:
          oneOf:
          - $ref: '#/components/schemas/OwnerRef'
          - type: 'null'
      type: object
    Container:
      allOf:
      - $ref: '#/components/schemas/IContainer'
      - description: 'A Container is a physical vessel (such as a tube, vial, or cryotube) that holds

          biological or chemical samples in Benchling''s inventory system. Containers track

          their contents (see ContainerContent), quantity, location within storage (via

          parentStorage which can be a Box, Plate, or Location), and lifecycle information

          including expiration and freeze-thaw cycles. Each container has a barcode for

          physical identification and conforms to a ContainerSchema that defines its type

          and schema fields. Containers support checkout tracking (see CheckoutRecord) and

          can be associated with Studies. Also known as "tubes" or "sample containers" in

          laboratory contexts.'
        properties:
          __typename:
            type: string
          creator:
            $ref: '#/components/schemas/PrincipalRef'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    IntegerValue:
      description: A type that represents integer values.
      properties:
        __typename:
          type: string
        value:
          description: The integer value.
          type: integer
      type: object
    GeneralError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    CheckoutRecord:
      description: 'Tracks the checkout status of an inventory item such as a Container. When laboratory

        samples need to be temporarily removed from storage (e.g., for an experiment), users

        can check them out, optionally adding a comment and assigning responsibility to a

        user or team (see Assignee). The record captures when the status was last modified.

        This enables sample tracking workflows and prevents conflicts when multiple users

        need access to the same samples.'
      properties:
        __typename:
          type: string
        assignee:
          description: Union of User, Team
          oneOf:
          - $ref: '#/components/schemas/ObjectRef'
          - type: 'null'
        comment:
          type:
          - 'null'
          - string
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        status:
          enum:
          - AVAILABLE
          - RESERVED
          - CHECKED_OUT
          - null
          type:
          - 'null'
          - string
      type: object
    WellPlate:
      allOf:
      - $ref: '#/components/schemas/IWellPlate'
      - description: 'A WellPlate is a multi-well plate in Benchling''s inventory system where wells are

          permanently fixed to the plate structure. This is the standard plate type for laboratory

          multi-well formats such as 96-well, 384-well, and 1536-well plates used in high-throughput

          screening, PCR, and other assay workflows. The plate''s grid dimensions are defined by its

          WellPlateSchema, and each well (see WellPlatePosition) can contain samples, track quantities,

          and be assigned experimental roles. WellPlates can be stored in Locations (via parentStorage),

          associated with Studies, and identified by barcode. The plateRecords field tracks the history

          of transfers and annotations performed on the plate (see PlateRecord). Unlike MatrixPlate

          where containers can be inserted or removed, WellPlate wells are integral to the plate.'
        properties:
          __typename:
            type: string
          creator:
            $ref: '#/components/schemas/PrincipalRef'
            description: The user who created the plate
          positions:
            description: The wells of the plate
            format: uri
            type: string
          schemaFields:
            description: Schema field values that belong to the plate
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    WellPlateSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    Protein:
      allOf:
      - $ref: '#/components/schemas/IProtein'
      - description: 'A Protein is a complex biomolecule entity in Benchling representing immunoglobulins or

          related therapeutic proteins like T-cell receptors. Proteins are defined by an

          `ProteinFormat` that specifies their structural organization, with actual sequences

          provided in domains (see `ProteinDomain`) and chains (see `ProteinChain`). Proteins support versioning

          through history/fullHistory, allowing tracking of structural changes over time. As registry entities,

          proteins can have schemas with custom fields, belong to projects and folders, and be linked to studies.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            $ref: '#/components/schemas/PrincipalRef'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    OligoDuplex:
      allOf:
      - $ref: '#/components/schemas/IOligoDuplex'
      - description: 'An oligo duplex is a therapeutic modality consisting of two complementary

          oligonucleotide strands (forward and reverse) with optional conjugate molecules

          attached to either strand. The classic example is siRNA (small interfering RNA),

          which uses double-stranded RNA for gene silencing. The forwardStrand and reverseStrand

          reference the underlying oligo entities, with hydrogen bonds automatically computed

          for base pairing. Structure is defined using HELM notation and can be edited via

          the visual structure editor. Supports versioning (see OligoDuplexVersion) to track

          changes over time.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            $ref: '#/components/schemas/PrincipalRef'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    OwnerRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    RnaSequenceRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    IDnaSequence:
      properties:
        __typename:
          type: string
        aliases:
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        annotations:
          description: 'Annotations on the DNA sequence, not including translations or primers. Annotations on parts are

            not included.'
          items:
            $ref: '#/components/schemas/NucleotideAnnotation'
          type: array
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        bases:
          description: Bases of the forward strand of the DNA sequence.
          type: string
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        customFields:
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityRegistryId:
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        id:
          type: string
        isCircular:
          description: Whether the DNA sequence is circular or linear.
          type: boolean
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          type: string
        parts:
          description: Part features on the DNA sequence.
          format: uri
          type: string
        primers:
          description: Primer bind features on the DNA sequence. Primers on parts are not included.
          items:
            $ref: '#/components/schemas/Primer'
          type: array
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          oneOf:
          - $ref: '#/components/schemas/EntitySchemaRef'
          - type: 'null'
        startIndex:
          description: Starting index for the sequence residues of linear DNA sequences. Implicitly 1 for other sequence types.
          type: integer
        transcriptions:
          description: Transcriptions, derived from schema field data.
          items:
            $ref: '#/components/schemas/Transcription'
          type: array
        translations:
          description: 'Translation annotations present on the DNA sequence. Translations may be one region or split

            across multiple regions. Translations on parts are not included.'
          items:
            $ref: '#/components/schemas/Translation'
          type: array
      type: object
    WellPlatePosition:
      description: 'Represents a single well within a WellPlate, functioning as a fixed container at a

        specific grid position. Each WellPlatePosition has coordinates identifying its row

        and column, can hold sample contents (see ContainerContent), and tracks quantity as

        a Measurement. Wells can be assigned an ExperimentalRole for assay organization and

        support freeze/thaw tracking (see FreezeThawInfo) and expiration tracking (see

        ExpirationInfo) when enabled on the well''s ContainerSchema. Unlike containers in a

        MatrixPlate, WellPlatePositions are permanent parts of the plate structure and cannot

        be removed or repositioned. Wells are accessed through the parent WellPlate''s positions

        field.'
      properties:
        __typename:
          type: string
        contents:
          description: Well contents of the well plate.
          items:
            $ref: '#/components/schemas/ContainerContent'
          type: array
        coordinates:
          $ref: '#/components/schemas/GridCoordinates'
          description: Coordinates of the current position within the well plate.
        createdAt:
          description: When the well plate was created.
          format: datetime
          type: string
        expirationInfo:
          $ref: '#/components/schemas/ExpirationInfo'
          description: Expiration info for the container.
        id:
          description: The ID of the container representing the well at this plate position.
          type: string
        modifiedAt:
          description: When the well plate was last modified.
          format: datetime
          type: string
        name:
          description: The name of the container representing the well at this position.
          type: string
        quantity:
          description: Quantity of a well. Supports mass, volume, and other quantities.
          oneOf:
          - $ref: '#/components/schemas/Measurement'
          - type: 'null'
        role:
          oneOf:
          - $ref: '#/components/schemas/ExperimentalRole'
          - type: 'null'
        schema:
          $ref: '#/components/schemas/ContainerSchemaRef'
          description: The container schema used by wells in the well plate.
      type: object
    DnaOligo:
      allOf:
      - $ref: '#/components/schemas/IDnaOligo'
      - description: 'Represents a short single-stranded DNA oligonucleotide in Benchling''s molecular biology

          platform. DNA oligos are typically synthetic sequences used as primers for PCR, probes

          for hybridization assays, or components in cloning workflows. Each oligo stores its

          nucleotide base sequence, annotations for features of interest, and any chemical

          modifications (see ModifiedNucleotide) such as phosphorothioate backbones or fluorescent

          labels. Oligos can be registered in the Registry with unique identifiers, organized in

          folders, and linked to other entities via schema fields. Unlike DnaSequence, oligos are

          specifically designed for shorter, synthesizable sequences. Also referred to as primers

          or probes depending on their application.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    IProtein:
      properties:
        __typename:
          type: string
        aliases:
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        chains:
          description: The chains and associated amino acid sequences on the protein.
          items:
            $ref: '#/components/schemas/ProteinChain'
          type: array
        createdAt:
          format: datetime
          type: string
        customFields:
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        domains:
          description: The domains and associated amino acid sequences on the protein.
          items:
            $ref: '#/components/schemas/ProteinDomain'
          type: array
        entityRegistryId:
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        format:
          $ref: '#/components/schemas/ProteinFormatRef'
          description: The protein format that defines the structure (domains, chains, interactions) for the protein.
        fullHistory:
          description: '`fullHistory` is a superset of `history` that also returns inactive versions that are not part of the

            current version history. Versions are returned in chronological order (oldest first).'
          format: uri
          type: string
        history:
          description: 'Only the currently active version lineage, in chronological order (oldest first).


            If a change was made and then undone by resetting to an earlier version, the version recording

            that change is not relevant to the current state of the entity, so it is not included in this listing.'
          format: uri
          type: string
        id:
          type: string
        modifiedAt:
          format: datetime
          type: string
        name:
          type: string
        outOfSync:
          description: Indicates if constituent domain or chain entities have changed since the protein was last updated.
          type: boolean
        outOfSyncReason:
          description: Any additional information about why the protein is out of sync.
          type:
          - 'null'
          - string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          $ref: '#/components/schemas/EntitySchemaRef'
      type: object
    IAaSequence:
      properties:
        __typename:
          type: string
        aliases:
          description: Array of aliases
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        aminoAcids:
          description: Amino acids of the AA sequence.
          type: string
        annotations:
          description: Array of annotation objects on the AA sequence.
          items:
            $ref: '#/components/schemas/AaAnnotation'
          type: array
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        createdAt:
          description: DateTime the AA sequence was created.
          format: datetime
          type:
          - 'null'
          - string
        customFields:
          description: Custom fields set on the AA sequence.
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityRegistryId:
          description: Registry ID of the AA sequence if registered.
          type:
          - 'null'
          - string
        folder:
          description: ID of the folder that contains the AA sequence.
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        id:
          description: ID of the AA sequence.
          type: string
        modifiedAt:
          description: DateTime the AA sequence was last modified.
          format: datetime
          type:
          - 'null'
          - string
        name:
          description: Name of the AA sequence.
          type: string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          description: Registry the AA sequence is registered in.
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          oneOf:
          - $ref: '#/components/schemas/EntitySchemaRef'
          - type: 'null'
      type: object
    NucleotideSimplePolymer:
      description: 'Represents a nucleic acid strand (DNA or RNA) within a complex polymer structure. Contains the sequence

        residues, any chemical modifications (see ModifiedNucleotide), and connections to other polymers. The entity

        field links to a corresponding DnaSequence, RnaSequence, DnaOligo, or RnaOligo. Used as the backbone component

        in OligoConjugate and as forward/reverse strands in OligoDuplex.'
      properties:
        __typename:
          type: string
        connections:
          items:
            $ref: '#/components/schemas/ComplexPolymerConnection'
          type: array
        entity:
          $ref: '#/components/schemas/NucleotideSequenceRef'
        helmReference:
          type: string
        modifications:
          description: Chemical modifications applied at specific positions on this strand.
          items:
            $ref: '#/components/schemas/ModifiedNucleotide'
          type: array
        nucleotideType:
          description: Whether this strand is DNA or RNA.
          enum:
          - DNA
          - RNA
          type: string
        polymerType:
          type: string
        residues:
          description: The nucleotide base sequence of this strand.
          type: string
      type: object
    WorklistPaginatedList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Worklist'
          type: array
        nextToken:
          type: string
      type: object
    AsyncTaskLink:
      properties:
        pollingUri:
          format: uri
          type: string
        taskId:
          type: string
      type: object
    ArrayValue:
      description: A type that represents a list of BenchlingValues, used for multi-value cells (e.g. alias columns).
      properties:
        __typename:
          type: string
        value:
          items:
            anyOf:
            - $ref: '#/components/schemas/BooleanValue'
            - $ref: '#/components/schemas/DateTimeValue'
            - $ref: '#/components/schemas/DateValue'
            - $ref: '#/components/schemas/DecimalValue'
            - $ref: '#/components/schemas/IntegerValue'
            - $ref: '#/components/schemas/JsonValue'
            - $ref: '#/components/schemas/ObjectLinkValue'
            - $ref: '#/components/schemas/ObjectLinkListValue'
            - $ref: '#/components/schemas/TextAndUrlValue'
            - $ref: '#/components/schemas/TextValue'
            description: Union of BooleanValue, DateTimeValue, DateValue, DecimalValue, IntegerValue, JsonValue, ObjectLinkValue, ObjectLinkListValue, TextAndUrlValue, TextValue
            discriminator:
              propertyName: __typename
          type: array
      type: object
    ContainerContent:
      description: 'Represents a biological or chemical entity stored within a Container or well. Each

        ContainerContent links an Entity (such as a DNA sequence, protein, or custom entity)

        to its storage location, along with an optional concentration measurement. The

        timestamps track when the entity was first placed in the container and when the

        concentration was last modified. A container can hold multiple ContainerContent

        items representing different entities or samples stored together.'
      properties:
        __typename:
          type: string
        concentration:
          description: Concentration of the entity in the container.
          oneOf:
          - $ref: '#/components/schemas/Measurement'
          - type: 'null'
        createdAt:
          description: When the container was first filled with this entity.
          format: datetime
          type: string
        entity:
          description: The entity in the container.
          oneOf:
          - $ref: '#/components/schemas/EntityRef'
          - type: 'null'
        modifiedAt:
          description: When the entity was last added to this container or the concentration was last changed.
          format: datetime
          type: string
      type: object
    MatrixPlateSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    Mixture:
      allOf:
      - $ref: '#/components/schemas/IMixture'
      - description: 'A Mixture is a formulation entity in Benchling that represents a combination of

          ingredients with specified amounts. Mixtures are commonly used for buffers, media,

          reagent preparations, and other multi-component solutions. Each mixture has a total

          amount with units (see MixtureMeasurementUnits) and contains a list of Ingredients

          specifying what goes into the mixture. Mixtures can be registered in the Registry,

          organized in folders and projects, and may have preparation instructions attached

          (see MixtureInstructions). The `allowMeasuredIngredients` setting (from the schema)

          determines whether the mixture is a thoeretical "recipe", which has target amonunts, or a physical "prep",

          with measured amounts.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
        type: object
    Measurement:
      description: 'Represents a quantity with an associated unit of measurement within Benchling''s inventory

        system. Measurements are used throughout inventory to track container volumes, sample

        masses, concentrations, and other quantitative values. Each Measurement pairs a numeric

        value with a Unit (see Unit) to provide context-aware quantity handling. For example,

        a container might have a Measurement of 500 uL for its volume. Unlike ContainerQuantity

        which provides a simpler representation, Measurement supports the full Unit system with

        dimensional conversions.'
      properties:
        __typename:
          type: string
        unit:
          oneOf:
          - $ref: '#/components/schemas/UnitRef'
          - type: 'null'
        value:
          type:
          - 'null'
          - number
      type: object
    MoleculeRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ConnectionSide:
      description: 'Represents one endpoint of a connection between polymers in a complex polymer structure.

        Identifies the specific attachment point including the polymer reference, residue position

        (for sequences), modification type (for nucleotides), and R-group number (for specific

        attachment sites on monomers). Each ComplexPolymerConnection has a source and target

        ConnectionSide defining the two endpoints of the bond.'
      properties:
        __typename:
          type: string
        modificationType:
          description: 'Benchling has no concept of monomer index like HELM does, so specifying the modification type is our way

            of telling the particular monomer for an attachment on a nucleotide polymer.


            For non-nucleotide polymers, this is always null since we would only have one monomer at a particular

            index.'
          enum:
          - SUGAR
          - BASE
          - PHOSPHATE
          - null
          type:
          - 'null'
          - string
        polymerRef:
          description: The ref of the simple polymer connected at this attachment point.
          type: string
        rGroup:
          description: 'The r-group number designates the specific attachment site on the monomer used by this connection.

            If not null, always >= 1.'
          type:
          - 'null'
          - integer
        residueIndex:
          description: 'For sequence types, the index of the residue at this attachment point.


            residueIndex is always 0 or null for CHEM polymers since we never have more than one "residue".'
          type:
          - 'null'
          - integer
      type: object
    IWellPlate:
      properties:
        __typename:
          type: string
        archiveReason:
          description: Why the plate is archived
          type:
          - 'null'
          - string
        archived:
          description: Whether the plate is archived
          type: boolean
        barcode:
          description: Barcode of the plate
          type:
          - 'null'
          - string
        createdAt:
          description: DateTime the plate was created
          format: datetime
          type: string
        id:
          description: ID of the plate
          type: string
        modifiedAt:
          description: DateTime the plate was last modified
          format: datetime
          type: string
        name:
          description: Name of the plate; defaults to barcode if name is not provided
          type: string
        parentStorage:
          description: Containing parent storage
          oneOf:
          - $ref: '#/components/schemas/LocationRef'
          - type: 'null'
        project:
          description: The project the plate is associated with
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        schema:
          $ref: '#/components/schemas/WellPlateSchemaRef'
          description: The schema of the plate
      type: object
    ModifiedNucleotide:
      description: 'Represents a chemically modified nucleotide at a specific position in an oligonucleotide

        sequence. Each modification specifies the sugar, base, and phosphate monomers (see NucleotideMonomer)

        that replace or modify the natural nucleotide at that position. Common modifications include

        2''-O-methyl sugars for stability, phosphorothioate backbones for nuclease resistance, or

        modified bases for binding affinity. Used in NucleotideSimplePolymer to capture the

        modification pattern of therapeutic oligonucleotides.'
      properties:
        __typename:
          type: string
        baseMonomer:
          $ref: '#/components/schemas/NucleotideMonomerRef'
          description: The base monomer for the modification.
        createdAt:
          description: DateTime the modification was created.
          format: datetime
          type: string
        id:
          description: The ID of the modified nucleotide.
          type: string
        nucleotideSequence:
          $ref: '#/components/schemas/NucleotideSequenceRef'
          description: The nucleotide sequence that this modification belongs to.
        phosphateMonomer:
          description: The phosphate monomer for the modification. If empty, it represents a null phosphate at the 5' end of the sequence.
          oneOf:
