        id:
          format: api_id
          type: string
      type: object
    IProtein:
      description: Specifies the shared fields of a protein entity in Benchling. A protein's `ProteinFormat` defines its domains and chains, which link to the amino acid sequences that make up the protein. `history` and `fullHistory` provide `ProteinVersion` snapshots of structural changes. `outOfSync` indicates whether a constituent domain or chain entity has changed since the protein was last updated.
      properties:
        __typename:
          type: string
        aliases:
          description: Array of aliases
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        chains:
          description: The chains and associated amino acid sequences on the protein.
          items:
            $ref: '#/components/schemas/ProteinChain'
          type: array
        createdAt:
          description: DateTime the protein was created.
          format: datetime
          type: string
        customFields:
          description: Custom fields set on the protein.
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        domains:
          description: The domains and associated amino acid sequences on the protein.
          items:
            $ref: '#/components/schemas/ProteinDomain'
          type: array
        entityRegistryId:
          description: 'The registry-assigned identifier for this item (e.g. its registry ID shown in the UI),

            present only once the item has been registered. Null if the item is not registered.'
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        format:
          $ref: '#/components/schemas/ProteinFormatRef'
          description: The protein format that defines the structure (domains, chains, interactions) for the protein.
        fullHistory:
          description: '`fullHistory` is a superset of `history` that also returns inactive versions that are not part of the

            current version history. Versions are returned in chronological order (oldest first).'
          format: uri
          type: string
        history:
          description: 'Only the currently active version lineage, in chronological order (oldest first).


            If a change was made and then undone by resetting to an earlier version, the version recording

            that change is not relevant to the current state of the entity, so it is not included in this listing.'
          format: uri
          type: string
        id:
          description: ID of the protein.
          type: string
        modifiedAt:
          description: DateTime the protein was last modified.
          format: datetime
          type: string
        name:
          description: Name of the item.
          type: string
        outOfSync:
          description: Indicates if constituent domain or chain entities have changed since the protein was last updated.
          type: boolean
        outOfSyncReason:
          description: Any additional information about why the protein is out of sync.
          type:
          - 'null'
          - string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          description: Provenance of this item's registration — where and when it was registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          description: The Registry this item belongs to, if registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          $ref: '#/components/schemas/EntitySchemaRef'
          deprecated: true
          description: Use typedSchema instead, which returns the per-type schema.
        typedSchema:
          $ref: '#/components/schemas/ProteinSchemaRef'
          description: Schema reference for this protein. Callers can retrieve the schema separately when they need its field definitions.
      type: object
    Assembly:
      description: 'Represents a molecular cloning assembly that combines multiple DNA fragments into

        complete constructs. Assemblies model the process of joining fragment sequences

        (such as genes, promoters, and terminators) using methods like Gibson Assembly,

        Golden Gate, or restriction enzyme-based cloning. The assembly tracks the input

        fragments and resulting construct sequences, enabling design-to-experiment traceability.

        Assemblies can be organized in folders and support archiving when no longer needed.'
      properties:
        __typename:
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        createdAt:
          description: DateTime the Assembly was created
          format: datetime
          type: string
        creator:
          oneOf:
          - $ref: '#/components/schemas/PrincipalRef'
          - type: 'null'
        folder:
          description: Folder that contains the Assembly.
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        id:
          description: Id of the Assembly
          type: string
        modifiedAt:
          description: DateTime the Assembly was last modified
          format: datetime
          type: string
        name:
          description: Name of the Assembly
          type: string
      type: object
    Mixture:
      allOf:
      - $ref: '#/components/schemas/IMixture'
      - description: 'A Mixture is a formulation entity in Benchling that represents a combination of

          ingredients with specified amounts. Mixtures are commonly used for buffers, media,

          reagent preparations, and other multi-component solutions. Each mixture has a total

          amount with units (see MixtureMeasurementUnits) and contains a list of Ingredients

          specifying what goes into the mixture. Mixtures can be registered in the Registry,

          organized in folders and projects, and may have preparation instructions attached

          (see MixtureInstructions). The `allowMeasuredIngredients` setting (from the schema)

          determines whether the mixture is a thoeretical "recipe", which has target amonunts, or a physical "prep",

          with measured amounts.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
        type: object
    ProteinFormatDomainPosition:
      description: 'Defines a domain position within a `ProteinFormat`, specifying the domain type and identity of each

        physical domain in the protein format. Each domain position has a unique ref identifier used

        to construct HELM notation for complex polymer structures. Domain positions are grouped into ProteinFormatDomains,

        and each group can be uniquely identified by its label, and will be a single amino acid sequence entity in proteins

        of this format.'
      properties:
        __typename:
          type: string
        optional:
          description: Whether this domain is optional in the format. If true, entities of this format may not have this domain.
          type: boolean
        ref:
          description: 'A unique identifier for a physical component (chain or domain) in a protein format.

            This is used to form a HELM reference that is used in the protein''s complex polymer structure.'
          type: integer
        type:
          description: Type of the domain
          enum:
          - VL
          - CL
          - VH
          - VHH
          - CH1
          - CH2
          - CH3
          - CH4
          - J
          - H
          - L
          - VA
          - CA
          - VB
          - CB
          - VG
          - CG
          - VD
          - CD
          - F
          - ELEMENT
          type: string
      type: object
    AaSequence:
      allOf:
      - $ref: '#/components/schemas/IAaSequence'
      - description: 'Represents an amino acid sequence in Benchling''s molecular biology platform. An AaSequence stores the

          one-letter amino acid code string along with annotations marking functional regions, domains, or other

          features of interest. `AaSequence`s can be registered in the Registry with a unique entityRegistryId,

          organized in folders, and linked via schema fields to other entities. Annotations (see `AaAnnotation`)

          mark functional regions such as signal peptides, binding domains, or engineered mutations.

          Parts (see `AaPart`) indicate regions matching other registered `AaSequence`s.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    ProteinFormatRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ObjectLinkListValue:
