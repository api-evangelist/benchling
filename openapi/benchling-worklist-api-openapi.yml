          - type: 'null'
        id:
          description: ID of the Oligo.
          type: string
        modifiedAt:
          description: DateTime the Oligo was last modified.
          format: datetime
          type:
          - 'null'
          - string
        modifiedNucleotides:
          description: Modifications applied to this oligo.
          format: uri
          type: string
        name:
          description: Name of the item.
          type: string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          description: Provenance of this item's registration — where and when it was registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          description: The Registry this item belongs to, if registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          deprecated: true
          description: Use typedSchema instead, which returns the per-type schema.
          oneOf:
          - $ref: '#/components/schemas/EntitySchemaRef'
          - type: 'null'
        typedSchema:
          oneOf:
          - $ref: '#/components/schemas/DnaOligoSchemaRef'
          - type: 'null'
      type: object
    CreateWorklistInput:
      additionalProperties: false
      properties:
        itemIds:
          items:
            type: string
