          type: string
        id:
          format: api_id
          type: string
      type: object
    RegistryRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    GeneralError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    IOligoConjugate:
      description: 'An oligo conjugate is a specific type of complex polymer that consists of a single short DNA/RNA strand with

        multiple attached molecules (aka conjugates).'
      properties:
        __typename:
          type: string
        aliases:
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        backbone:
          $ref: '#/components/schemas/NucleotideSimplePolymer'
        canonicalHelm:
          type: string
        conjugates:
          items:
            anyOf:
            - $ref: '#/components/schemas/NucleotideSimplePolymer'
            - $ref: '#/components/schemas/ChemSimplePolymer'
            description: Union of NucleotideSimplePolymer, ChemSimplePolymer
            discriminator:
              mapping:
                ChemSimplePolymer: '#/components/schemas/ChemSimplePolymer'
                NucleotideSimplePolymer: '#/components/schemas/NucleotideSimplePolymer'
              propertyName: __typename
          type: array
        createdAt:
          format: datetime
          type: string
        customFields:
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityRegistryId:
          description: 'The registry-assigned identifier for this item (e.g. its registry ID shown in the UI),

            present only once the item has been registered. Null if the item is not registered.'
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        id:
          type: string
        modifiedAt:
          format: datetime
          type: string
        name:
          description: Name of the item.
          type: string
        originalHelm:
          type:
          - 'null'
          - string
        outOfSync:
          type: boolean
        outOfSyncReason:
          type:
          - 'null'
          - string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          description: Provenance of this item's registration — where and when it was registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          description: The Registry this item belongs to, if registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          $ref: '#/components/schemas/EntitySchemaRef'
          deprecated: true
          description: Use typedSchema instead, which returns the per-type schema.
        structure:
          $ref: '#/components/schemas/OligoConjugateStructure'
        typedSchema:
          $ref: '#/components/schemas/OligoConjugateSchemaRef'
      type: object
    ExperimentalRole:
      description: 'Represents the complete experimental designation of a well or container within an assay,

        combining a primary role (see PrimaryExperimentalRole), replicate group number, and

        optional subrole. The group field identifies replicate sets: wells with the same primary

        role and group number are treated as technical replicates for statistical analysis. The

        subrole field provides additional categorization for controls (e.g., POSITIVE, NEGATIVE,

        MAXIMUM, MINIMUM); only CONTROL primary roles may have subroles. ExperimentalRole is

        used in plate-based workflows to define experimental layouts (see PlateMapPosition) and

        annotate wells in FixedPlate and Container objects.'
      properties:
        __typename:
          type: string
        group:
          description: Role group (aka replicate id)
          type: integer
        primaryRole:
          description: Primary role
          enum:
          - CONTROL
          - SAMPLE
          - BLANK
          - STANDARD
          type: string
        subrole:
          description: Subrole, used to differentiate different sub types of a role (e.g. positive control)
          type:
          - 'null'
          - string
      type: object
    Worklist:
      description: 'A typed collection of items used to group related objects for batch operations. Unlike

        folders, items can belong to multiple worklists simultaneously, making worklists useful

        as temporary holding grounds for arbitrary groups of items. Each worklist has an `itemType`

        that restricts what kinds of objects it can contain (containers, entities, or plates).

        Common use cases include scanning containers into a worklist before adding them to a

        transfer table, or grouping entities for bulk export. Worklists have an `owner` and support

        `collaborations` for access control (see `Collaboratable` interface). The `items` field

        returns the collection of `Worklistable` objects currently in the worklist.'
      properties:
        __typename:
          type: string
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        creator:
          oneOf:
          - $ref: '#/components/schemas/PrincipalRef'
          - type: 'null'
        id:
          type: string
        itemType:
          enum:
          - CONTAINER
          - ENTITY
          - PLATE
          type: string
        items:
          format: uri
          type: string
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          type:
          - 'null'
          - string
        owner:
          $ref: '#/components/schemas/OwnerRef'
      type: object
    ObjectRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    NucleotideSequenceRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    OligoConjugateStructure:
      description: 'Contains the complete structural definition of an oligo conjugate, including its

        oligonucleotide backbone, conjugated molecules and peptides, and the connections between them.


        For each simple polymer, restricted read access on the linked entity affects `entity` only; structural fields

        on that polymer are still populated for the containing conjugate.'
      properties:
        __typename:
          type: string
        connections:
          description: A list of all the connections between simple polymers in this oligo conjugate.
          items:
            $ref: '#/components/schemas/MolecularConnection'
          type: array
        resolvedAttachments:
          description: A list of attachment information, providing a more detailed chemical structure for a set of connections.
          items:
            $ref: '#/components/schemas/MolecularConjugate'
          type: array
        simplePolymers:
          description: A list of all the simple polymers in this oligo conjugate.
          items:
            anyOf:
            - $ref: '#/components/schemas/NucleotideSimplePolymer'
            - $ref: '#/components/schemas/ChemSimplePolymer'
            - $ref: '#/components/schemas/PeptideSimplePolymer'
            - $ref: '#/components/schemas/ProteinSimplePolymer'
            description: Union of NucleotideSimplePolymer, ChemSimplePolymer, PeptideSimplePolymer, ProteinSimplePolymer
            discriminator:
              mapping:
                ChemSimplePolymer: '#/components/schemas/ChemSimplePolymer'
                NucleotideSimplePolymer: '#/components/schemas/NucleotideSimplePolymer'
                PeptideSimplePolymer: '#/components/schemas/PeptideSimplePolymer'
                ProteinSimplePolymer: '#/components/schemas/ProteinSimplePolymer'
              propertyName: __typename
          type: array
      type: object
    ProteinSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    WorklistPaginatedList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/Worklist'
          type: array
        nextToken:
          type:
          - string
          - 'null'
      type: object
    DateValue:
      description: A type that represents date values.
      properties:
        __typename:
          type: string
        value:
          description: The date value.
          format: date
          type: string
      type: object
    ProteinSimplePolymer:
      description: 'Represents a protein nested by reference within a complex polymer structure, along with connections to other

        polymers. The entity field links to the corresponding `Protein`, and the nested protein''s own structure stays on

        that protein rather than being copied into the containing structure.'
      properties:
        __typename:
          type: string
        connections:
          description: This polymer's connections to other polymers in the complex polymer.
          items:
            $ref: '#/components/schemas/MolecularConnection'
          type: array
        entity:
          $ref: '#/components/schemas/ProteinRef'
          description: 'The nested protein. This always reflects the protein''s current state, which can differ from

            `nestedComplexPolymerVersion` if the protein has changed since the containing structure was written.'
        helmReference:
          description: 'The HELM reference of this polymer (e.g. PROTEIN1). Uniquely identifies this simple polymer in the context

            of a single complex polymer.'
          type: string
        nestedComplexPolymerVersion:
          description: 'The version of the nested protein that the containing structure was written against. Null when the viewer cannot

            read the nested protein.'
          oneOf:
          - $ref: '#/components/schemas/ProteinVersionRef'
          - type: 'null'
        polymerType:
          description: The HELM polymer type for this nested protein. This is always `PROTEIN` for protein simple polymers.
          type: string
      type: object
    EntitySchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    TextAndUrlValue:
      description: A type that represents text (string) values with an associated URL.
      properties:
        __typename:
          type: string
        url:
          description: The URL associated with the value. Please use `TextValue` if you don't want a URL.
          type: string
        value:
          description: The text value. It may or may not be an empty string.
          type: string
      type: object
    CustomEntity:
      allOf:
      - $ref: '#/components/schemas/ICustomEntity'
      - description: 'A flexible, user-defined entity type in Benchling''s Registry. Unlike specialized entity

          types such as DnaSequence or Molecule, CustomEntities allow organizations to model any

          kind of scientific or business object using configurable EntitySchemas (see `schema`).

          CustomEntities support customFields for storing structured data, can be organized into

          Folders and Projects, and integrate with Benchling''s collaboration, search, and audit

          systems. They are commonly used to represent cell lines, reagents, instruments, or any

          domain-specific items that don''t fit predefined entity categories.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    IOligoDuplex:
      description: 'An oligo duplex is a specific type of complex polymer that consists of two complementary DNA/RNA strands, with

        multiple attached molecules on either strand (aka conjugates).'
      properties:
        __typename:
          type: string
        aliases:
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        canonicalHelm:
          type: string
        conjugates:
          items:
            anyOf:
            - $ref: '#/components/schemas/NucleotideSimplePolymer'
            - $ref: '#/components/schemas/ChemSimplePolymer'
            description: Union of NucleotideSimplePolymer, ChemSimplePolymer
            discriminator:
              mapping:
                ChemSimplePolymer: '#/components/schemas/ChemSimplePolymer'
                NucleotideSimplePolymer: '#/components/schemas/NucleotideSimplePolymer'
              propertyName: __typename
          type: array
        createdAt:
          format: datetime
          type: string
        customFields:
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityRegistryId:
          description: 'The registry-assigned identifier for this item (e.g. its registry ID shown in the UI),

            present only once the item has been registered. Null if the item is not registered.'
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        forwardOffset:
          type:
          - 'null'
          - integer
        forwardStrand:
          $ref: '#/components/schemas/NucleotideSimplePolymer'
        id:
          type: string
        modifiedAt:
          format: datetime
          type: string
        name:
          description: Name of the item.
          type: string
        originalHelm:
          type:
          - 'null'
          - string
        outOfSync:
          type: boolean
        outOfSyncReason:
          type:
          - 'null'
          - string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          description: Provenance of this item's registration — where and when it was registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          description: The Registry this item belongs to, if registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        reverseStrand:
          $ref: '#/components/schemas/NucleotideSimplePolymer'
        schema:
          $ref: '#/components/schemas/EntitySchemaRef'
          deprecated: true
          description: Use typedSchema instead, which returns the per-type schema.
        structure:
          $ref: '#/components/schemas/OligoDuplexStructure'
        typedSchema:
          $ref: '#/components/schemas/OligoDuplexSchemaRef'
      type: object
    OligoConjugate:
      allOf:
      - $ref: '#/components/schemas/IOligoConjugate'
      - description: 'An oligo conjugate is a therapeutic modality consisting of a single-stranded

          oligonucleotide backbone with one or more attached conjugate molecules. Common

          examples include antisense oligonucleotides (ASOs) with GalNAc ligands for liver

          targeting, or siRNA strands with lipid or cholesterol conjugates. The backbone

          references the underlying oligo entity, while conjugates lists the attached molecules.

          Structure is defined using HELM notation and can be edited via the visual structure

          editor. Supports versioning (see OligoConjugateVersion) to track changes over time.


          Permissions: When a linked component entity is not readable, `entity` in `backbone`, `conjugates`, and

          `structure.simplePolymers` includes only the `id` field. `structure`, `canonicalHelm`, and polymer fields such as

          `residues` and `smiles` still reflect the structure of this oligo conjugate as returned by the API.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            $ref: '#/components/schemas/PrincipalRef'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    Measurement:
      description: 'Represents a quantity with an associated unit of measurement within Benchling''s inventory

        system. Measurements are used throughout inventory to track container volumes, sample

        masses, concentrations, and other quantitative values. Each Measurement pairs a numeric

        value with a Unit (see Unit) to provide context-aware quantity handling. For example,

        a container might have a Measurement of 500 uL for its volume. Unlike ContainerQuantity

        which provides a simpler representation, Measurement supports the full Unit system with

        dimensional conversions.'
      properties:
        __typename:
          type: string
        unit:
          oneOf:
          - $ref: '#/components/schemas/UnitRef'
          - type: 'null'
        value:
          type:
          - 'null'
          - number
      type: object
    MoleculeSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    AaSequenceRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ProjectRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
