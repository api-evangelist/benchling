      allOf:
      - $ref: '#/components/schemas/IProtein'
      - description: 'A Protein is a complex biomolecule entity in Benchling representing immunoglobulins or

          related therapeutic proteins like T-cell receptors. Proteins are defined by an

          `ProteinFormat` that specifies their structural organization, with actual sequences

          provided in domains (see `ProteinDomain`) and chains (see `ProteinChain`). Proteins support versioning

          through history/fullHistory, allowing tracking of structural changes over time. As registry entities,

          proteins can have schemas with custom fields, belong to projects and folders, and be linked to studies.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            $ref: '#/components/schemas/PrincipalRef'
          schemaFields:
            description: Values for schema-defined fields on this protein.
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    IMixture:
      properties:
        __typename:
          type: string
        aliases:
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        allowMeasuredIngredients:
          description: Derived from the mixture's schema.
          type:
          - 'null'
          - boolean
        amount:
          description: 'The positive numerical amount value of this mixture in string format

            (to preserve full precision). Pair with `units`. Supports scientific

            notation (1.23e4).'
          type:
          - 'null'
          - string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        customFields:
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityRegistryId:
          description: 'The registry-assigned identifier for this item (e.g. its registry ID shown in the UI),

            present only once the item has been registered. Null if the item is not registered.'
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        id:
          type: string
        ingredients:
          description: List of ingredients on this mixture.
          oneOf:
          - items:
              $ref: '#/components/schemas/Ingredient'
            type: array
          - type: 'null'
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          description: Name of the item.
          type:
          - 'null'
          - string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          description: Provenance of this item's registration — where and when it was registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          description: The Registry this item belongs to, if registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          deprecated: true
          description: Use typedSchema instead, which returns the per-type schema.
          oneOf:
          - $ref: '#/components/schemas/EntitySchemaRef'
          - type: 'null'
        typedSchema:
          oneOf:
          - $ref: '#/components/schemas/MixtureSchemaRef'
          - type: 'null'
        units:
          enum:
          - NL
          - UL
          - ML
          - L
          - G
          - KG
          - UNITS
          - UG
          - MG
          - null
          type:
          - 'null'
          - string
      type: object
    Worklistable:
      anyOf:
      - $ref: '#/components/schemas/AaSequence'
      - $ref: '#/components/schemas/Assembly'
      - $ref: '#/components/schemas/Container'
      - $ref: '#/components/schemas/CustomEntity'
      - $ref: '#/components/schemas/DnaOligo'
      - $ref: '#/components/schemas/DnaSequence'
      - $ref: '#/components/schemas/MatrixPlate'
      - $ref: '#/components/schemas/Mixture'
      - $ref: '#/components/schemas/Molecule'
      - $ref: '#/components/schemas/OligoConjugate'
      - $ref: '#/components/schemas/OligoDuplex'
      - $ref: '#/components/schemas/Protein'
      - $ref: '#/components/schemas/RnaOligo'
      - $ref: '#/components/schemas/RnaSequence'
      - $ref: '#/components/schemas/WellPlate'
      discriminator:
        mapping:
          AaSequence: '#/components/schemas/AaSequence'
          Assembly: '#/components/schemas/Assembly'
          Container: '#/components/schemas/Container'
          CustomEntity: '#/components/schemas/CustomEntity'
          DnaOligo: '#/components/schemas/DnaOligo'
          DnaSequence: '#/components/schemas/DnaSequence'
          MatrixPlate: '#/components/schemas/MatrixPlate'
          Mixture: '#/components/schemas/Mixture'
          Molecule: '#/components/schemas/Molecule'
          OligoConjugate: '#/components/schemas/OligoConjugate'
          OligoDuplex: '#/components/schemas/OligoDuplex'
          Protein: '#/components/schemas/Protein'
          RnaOligo: '#/components/schemas/RnaOligo'
          RnaSequence: '#/components/schemas/RnaSequence'
          WellPlate: '#/components/schemas/WellPlate'
        propertyName: __typename
      type: object
    IMolecule:
      properties:
        __typename:
          type: string
        aliases:
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        canonicalSmiles:
          description: 'The canonicalized chemical structure in SMILES format. E.g.,

            Nc1nc(=O)n([H:1])cc1C1CC1'
          type:
          - 'null'
          - string
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        customFields:
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityRegistryId:
          description: 'The registry-assigned identifier for this item (e.g. its registry ID shown in the UI),

            present only once the item has been registered. Null if the item is not registered.'
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        id:
          type: string
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          description: Name of the item.
          type:
          - 'null'
          - string
        originalSmiles:
          description: 'The original chemical structure in SMILES format. Null if the user did not originally provide SMILES. E.g.,

            Nc1nc(=O)n([H:1])cc1C1CC1'
          type:
          - 'null'
          - string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          description: Provenance of this item's registration — where and when it was registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          description: The Registry this item belongs to, if registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          deprecated: true
          description: Use typedSchema instead, which returns the per-type schema.
          oneOf:
          - $ref: '#/components/schemas/EntitySchemaRef'
          - type: 'null'
        smilesWithCounterparts:
          description: 'The full chemical structure in SMILES format, including salt and solvent counterparts as

            dot-disconnected fragments (each repeated according to its ratio). When a compound has no

            counterparts, this equals canonicalSmiles.'
          type:
          - 'null'
          - string
        typedSchema:
          oneOf:
          - $ref: '#/components/schemas/MoleculeSchemaRef'
          - type: 'null'
      type: object
    OligoConjugateSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    SchemaFieldValue:
      description: 'Represents a field value on a schematized object, pairing a `fieldDefinition` (describing the

        field''s type and constraints) with its actual `value` (a `BenchlingValue` such as text, number,

        date, or link to another object). The value may be null if no value has been set. Used within

        the `schemaFields` collection on objects that implement `HasSchema` to provide access to all

        custom field values defined by the object''s schema.'
      properties:
        __typename:
          type: string
        fieldDefinition:
          $ref: '#/components/schemas/SchemaFieldDefinitionRef'
        id:
          type: string
        linkedEntityId:
          type:
          - 'null'
          - string
        value:
          description: Union of BooleanValue, DateTimeValue, DateValue, DecimalValue, IntegerValue, JsonValue, ObjectLinkValue, ObjectLinkListValue, TextAndUrlValue, TextValue, ArrayValue
          oneOf:
          - anyOf:
            - $ref: '#/components/schemas/BooleanValue'
            - $ref: '#/components/schemas/DateTimeValue'
            - $ref: '#/components/schemas/DateValue'
            - $ref: '#/components/schemas/DecimalValue'
            - $ref: '#/components/schemas/IntegerValue'
            - $ref: '#/components/schemas/JsonValue'
            - $ref: '#/components/schemas/ObjectLinkValue'
            - $ref: '#/components/schemas/ObjectLinkListValue'
            - $ref: '#/components/schemas/TextAndUrlValue'
            - $ref: '#/components/schemas/TextValue'
            - $ref: '#/components/schemas/ArrayValue'
            discriminator:
              mapping:
                ArrayValue: '#/components/schemas/ArrayValue'
                BooleanValue: '#/components/schemas/BooleanValue'
                DateTimeValue: '#/components/schemas/DateTimeValue'
                DateValue: '#/components/schemas/DateValue'
                DecimalValue: '#/components/schemas/DecimalValue'
                IntegerValue: '#/components/schemas/IntegerValue'
                JsonValue: '#/components/schemas/JsonValue'
                ObjectLinkListValue: '#/components/schemas/ObjectLinkListValue'
                ObjectLinkValue: '#/components/schemas/ObjectLinkValue'
                TextAndUrlValue: '#/components/schemas/TextAndUrlValue'
                TextValue: '#/components/schemas/TextValue'
              propertyName: __typename
          - type: 'null'
      type: object
    DnaSequence:
      allOf:
      - $ref: '#/components/schemas/IDnaSequence'
      - description: 'Represents a DNA sequence in Benchling''s molecular biology platform. A `DnaSequence` stores the nucleotide

          bases of the forward strand along with rich annotations for biological features such as genes, promoters, and

          regulatory elements. Sequences can be linear or circular (controlled by `isCircular`) and support translation

          annotations for protein-coding regions (see `Translation`), primer binding sites (see `Primer`), and part

          features linking to other sequences (see `DnaPart`). DNA sequences can be registered in the Registry with a

          unique `entityRegistryId`, organized in folders, and linked to other entities via schema fields. Also known as

          "Sequence" in the Benchling interface, with IDs prefixed by ''seq''.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    ExpirationInfo:
      description: 'Provides expiration tracking for inventory items such as containers and their

        contents. The expirationDate may be explicitly set on the container or inherited

        from the stored entity''s properties. The isExpired flag is a computed convenience

        field that returns true if the current date is past the expiration date. Items

        without an expiration date are considered non-expiring (isExpired returns false).'
      properties:
        __typename:
          type: string
        expirationDate:
          description: Expiration date of the item, potentially inherited from the contents or overridden.
          format: datetime
          type:
          - 'null'
          - string
        isExpired:
          description: Whether the item is past its expiration date. Items without an expiration date return False.
          type: boolean
      type: object
    IWellPlate:
      properties:
        __typename:
          type: string
        archiveReason:
          description: Why the plate is archived
          type:
          - 'null'
          - string
        archived:
          description: Whether the plate is archived
          type: boolean
        barcode:
          description: Barcode of the plate
          type:
          - 'null'
          - string
        createdAt:
          description: DateTime the plate was created
          format: datetime
          type: string
        id:
          description: ID of the plate
          type: string
        modifiedAt:
          description: DateTime the plate was last modified
          format: datetime
          type: string
        name:
          description: Name of the plate; defaults to barcode if name is not provided
          type: string
        parentStorage:
          description: Containing parent storage
          oneOf:
          - $ref: '#/components/schemas/LocationRef'
          - type: 'null'
        project:
          description: The project the plate is associated with
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        schema:
          $ref: '#/components/schemas/WellPlateSchemaRef'
          description: The schema of the plate
      type: object
    RnaSequence:
      allOf:
      - $ref: '#/components/schemas/IRnaSequence'
      - description: 'Represents an RNA sequence in Benchling''s molecular biology platform. An RnaSequence stores

          the nucleotide bases (using A, C, G, U) along with annotations marking functional regions,

          translation annotations for protein-coding regions (see Translation), primer binding sites

          (see Primer), and part features linking to other registered sequences (see RnaPart). RNA

          sequences are used for modeling messenger RNAs, non-coding RNAs, CRISPR guide RNAs, and

          other RNA molecules. Sequences can be registered in the Registry with a unique

          entityRegistryId, organized in folders, and linked via schema fields to other entities.

          For modified therapeutic RNAs, see modifiedNucleotides which captures chemical modifications.

          Also known as ''Sequence'' in the Benchling interface, with IDs prefixed by ''seq''.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    MixtureSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    FolderRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ProteinDomain:
      description: 'Represents a domain within an `Protein`, containing the actual amino acid sequence for a specific label.

        Unlike `ProteinFormatDomain` which is a template, `ProteinDomain` is a concrete instance of the domain and

        links to the underlying amino acid sequence entity.'
      properties:
        __typename:
          type: string
        domainPositions:
          description: 'Each domain position of this domain in the protein. If this domain appears multiple times in the physical

            structure of the protein, each domain position will be listed here.'
          items:
            $ref: '#/components/schemas/ProteinFormatDomainPosition'
          type: array
        entity:
          $ref: '#/components/schemas/AaSequenceRef'
          description: The amino acid sequence entity associated with the domain.
        label:
          description: A human-readable label for the domain.
          type: string
        type:
          description: The type of the domain.
          enum:
          - VL
          - CL
          - VH
          - VHH
          - CH1
          - CH2
          - CH3
          - CH4
          - J
          - H
          - L
          - VA
          - CA
          - VB
          - CB
          - VG
          - CG
          - VD
          - CD
          - F
          - ELEMENT
          type: string
      type: object
    WellPlateSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ObjectLinkValue:
      description: A type that represents links to other objects.
      properties:
        __typename:
          type: string
        value:
          $ref: '#/components/schemas/ObjectRef'
          description: The object that this value links to, or an Inaccessible object if not found with the current permission set.
      type: object
    WellPlate:
      allOf:
      - $ref: '#/components/schemas/IWellPlate'
      - description: 'A WellPlate is a multi-well plate in Benchling''s inventory system. WellPlate objects can be used to

          model multi-well plates such as 96-well, 384-well, and 1536-well plates used in high-throughput

          screening, PCR, and other assay workflows. The plate''s grid dimensions are defined by its

          WellPlateSchema, and each well (see WellPlatePosition) can contain samples, track quantities,

          and be assigned experimental roles. WellPlates can be stored in Locations (via parentStorage),

          associated with Studies, and identified by barcode.

          Unlike MatrixPlate positions, in which Containers can be inserted and removed,

          WellPlate positions are permanently fixed in their plate.'
        properties:
          __typename:
            type: string
          creator:
            $ref: '#/components/schemas/PrincipalRef'
            description: The user who created the plate
          schemaFields:
            description: Schema field values that belong to the plate
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    AsyncTaskLink:
      properties:
        pollingUri:
          format: uri
          type: string
        taskId:
          type: string
      type: object
    JsonValue:
      description: A type that represents JSON values.
      properties:
        __typename:
          type: string
        value:
          description: The JSON value.
          type: object
      type: object
    UpdateWorklistInputWithPathParams:
      additionalProperties: false
      properties:
        addItemIds:
          description: Add items to the worklist (incremental)
          items:
            type: string
          type: array
        id:
          type: string
        itemIds:
          description: Set/replace all items in the worklist
          items:
            type: string
          type: array
        name:
          type: string
        removeItemIds:
          description: Remove items from the worklist by API ID (incremental)
          items:
            type: string
          type: array
      required:
      - id
      type: object
    Molecule:
      allOf:
      - $ref: '#/components/schemas/IMolecule'
      - description: 'A Molecule represents a small molecule chemical compound in Benchling that is imported either as a MolFile or

          using SMILES (Simplified Molecular Input Line Entry System) notation. Molecules are registry entities that can

          be registered, searched, and linked to other items. When present, the `canonicalSmiles` field provides a

          standardized SMILES representation for comparison, while originalSmiles preserves the user-provided SMILES and

          may be null if SMILES was not provided at creation. Molecules support custom fields via schemas and can be

          organized in folders and projects.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    TooManyRequestsError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    TextValue:
      description: A type that represents text (string) values.
      properties:
        __typename:
          type: string
        value:
          description: The text value. It may or may not be an empty string.
          type: string
      type: object
    ContainerContent:
      description: 'Represents a biological or chemical entity stored within a Container or well. Each

        ContainerContent links an Entity (such as a DNA sequence, protein, or custom entity)

        to its storage location, along with an optional concentration measurement. The

        timestamps track when the entity was first placed in the container and when the

        concentration was last modified. A container can hold multiple ContainerContent

        items representing different entities or samples stored together.'
      properties:
        __typename:
          type: string
        concentration:
          description: Concentration of the entity in the container.
          oneOf:
          - $ref: '#/components/schemas/Measurement'
          - type: 'null'
        createdAt:
          description: When the container was first filled with this entity.
          format: datetime
          type: string
        entity:
          description: The entity in the container.
          oneOf:
          - $ref: '#/components/schemas/EntityRef'
          - type: 'null'
        modifiedAt:
          description: When the entity was last added to this container or the concentration was last changed.
          format: datetime
          type: string
      type: object
    ContainerSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    IContainer:
      properties:
        __typename:
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        barcode:
          type:
          - 'null'
          - string
        checkoutRecord:
          $ref: '#/components/schemas/CheckoutRecord'
        contents:
          items:
            $ref: '#/components/schemas/ContainerContent'
          type: array
        coordinates:
          description: Coordinates of the container within its contained grid, if it is contained within a grid.
          oneOf:
          - $ref: '#/components/schemas/GridCoordinates'
          - type: 'null'
        createdAt:
          format: datetime
          type: string
        expirationInfo:
          $ref: '#/components/schemas/ExpirationInfo'
          description: Expiration info for the container.
        gridNumber:
          deprecated: true
          description: Please use coordinates.index
          type:
          - 'null'
          - number
        gridPosition:
          deprecated: true
          description: Please use coordinates.position
          type:
          - 'null'
          - string
        id:
          type: string
        modifiedAt:
          format: datetime
          type: string
        name:
          type: string
        parentStorage:
          description: Union of Box, WellPlate, MatrixPlate, Location
          oneOf:
          - $ref: '#/components/schemas/ObjectRef'
          - type: 'null'
        parentStorageSchema:
          description: Union of BoxSchema, WellPlateSchema, MatrixPlateSchema, LocationSchema
          oneOf:
          - $ref: '#/components/schemas/ObjectRef'
          - type: 'null'
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        quantity:
          description: 'Quantity of a container, well, or transfer. Supports mass, volume, and

            other quantities.'
          oneOf:
          - $ref: '#/components/schemas/Measurement'
          - type: 'null'
        role:
          oneOf:
          - $ref: '#/components/schemas/ExperimentalRole'
          - type: 'null'
        schema:
          $ref: '#/components/schemas/ContainerSchemaRef'
      type: object
    AaSequenceSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    GridCoordinates:
      description: Read model representing a fillable position in a box or plate.
      properties:
        __typename:
          type: string
        column:
          description: The 0-indexed column index of the position
          type: integer
        index:
          description: 'The 1-indexed position determined by counting across rows.

            For example, for a six-well plate:

            +---+---+---+

            | 1 | 2 | 3 |

            +---+---+---+

            | 4 | 5 | 6 |

            +---+---+---+'
          type: integer
        position:
          description: 'The alphanumeric position, where rows are indexed alphabetically and columns are indexed numerically,

            starting from "A1"'
          type: string
        row:
          description: The 0-indexed row index of the position
          type: integer
      type: object
    Container:
      allOf:
      - $ref: '#/components/schemas/IContainer'
      - description: 'A Container is a physical vessel (such as a tube, vial, or cryotube) that holds

          biological or chemical samples in Benchling''s inventory system. Containers track

          their contents (see ContainerContent), quantity, location within storage (via

          parentStorage which can be a Box, WellPlate, MatrixPlate, or Location), and lifecycle information

          including expiration and freeze-thaw cycles. Each container has a barcode for

          physical identification and conforms to a ContainerSchema that defines its type

          and schema fields. Containers support checkout tracking (see CheckoutRecord) and

          can be associated with Studies. Also known as "tubes" or "sample containers" in

          laboratory contexts.'
        properties:
          __typename:
            type: string
          creator:
            $ref: '#/components/schemas/PrincipalRef'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    ConnectionSide:
      description: 'Represents one endpoint of a connection between polymers in a complex polymer structure.

        Identifies the specific attachment point including the polymer reference, residue position

        (for sequences), modification type (for nucleotides), and R-group number (for specific

        attachment sites on monomers). Each MolecularConnection has a source and target

        ConnectionSide defining the two endpoints of the bond.'
      properties:
        __typename:
          type: string
        modificationType:
          description: 'Benchling has no concept of monomer index like HELM does, so specifying the modification type is our way

            of telling the particular monomer for an attachment on a nucleotide polymer.


            For non-nucleotide polymers, this is always null since we would only have one monomer at a particular

            index.'
          enum:
          - SUGAR
          - BASE
          - PHOSPHATE
          - null
          type:
          - 'null'
          - string
        polymerRef:
          description: The ref of the simple polymer connected at this attachment point.
          type: string
        rGroup:
          description: 'The r-group number designates the specific attachment site on the monomer used by this connection.

            If not null, always >= 1.'
          type:
          - 'null'
          - integer
        residueIndex:
          description: 'For sequence types, the index of the residue at this attachment point.


            residueIndex is always 0 or null for CHEM polymers since we never have more than one "residue".'
          type:
          - 'null'
          - integer
      type: object
    MatrixPlate:
      allOf:
      - $ref: '#/components/schemas/IMatrixPlate'
      - description: 'A MatrixPlate is a rack-style storage plate in Benchling''s inventory system.

          Each position in a MatrixPlate can be empty or can hold a movable Container object.

          Note that this behavior differs from that of WellPlates, in which each well is

          a permanent part of the plate.

          MatrixPlates are ideal for modeling tube racks,

          sample storage boxes with removable tubes, and other flexible storage formats. Each

          plate tracks its capacity (totalCapacity, availableCapacity, occupiedCapacity) and

          conforms to a MatrixPlateSchema that defines the grid dimensions and optionally

          restricts which ContainerSchema types can be stored. MatrixPlates can be stored in

          Locations, associated with Studies, and identified by barcode.'
        properties:
          __typename:
            type: string
          creator:
            $ref: '#/components/schemas/PrincipalRef'
            description: The user who created the plate
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    ProteinVersionRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    MoleculeRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    IDnaOligo:
      properties:
        __typename:
          type: string
        aliases:
          description: Array of aliases
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        annotations:
          description: Annotations on the Oligo.
          format: uri
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        bases:
          description: Bases of the Oligo.
          type: string
        canonicalHelm:
          description: Normalized HELM notation for this oligo.
          type: string
        createdAt:
          description: DateTime the Oligo was created.
          format: datetime
          type:
          - 'null'
          - string
        customFields:
          description: Custom fields set on the Oligo.
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityRegistryId:
          description: 'The registry-assigned identifier for this item (e.g. its registry ID shown in the UI),

            present only once the item has been registered. Null if the item is not registered.'
          type:
          - 'null'
