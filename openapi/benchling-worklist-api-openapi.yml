          description: Starting index for the sequence residues of linear DNA sequences. Implicitly 1 for other sequence types.
          type: integer
        translations:
          description: 'Translation annotations present on the DNA sequence. Translations may be one region or split

            across multiple regions. Translations on parts are not included.'
          format: uri
          type: string
        typedSchema:
          oneOf:
          - $ref: '#/components/schemas/DnaSequenceSchemaRef'
          - type: 'null'
      type: object
    MolecularConjugate:
      description: 'Detailed information about a molecular conjugate formed by a group of contiguous connections in a complex polymer.


        The entire chemical structure of the molecular conjugate, and any components inside it, is represented by a molfile.

        This allows for the representation of any bond chemistry, beyond the simple leaving group style supported by HELM.


        For example, suppose we have two involved connections, one between a backbone oligo and a linker molecule,

        and another between the linker molecule and a payload molecule.

        Then the molfile would represent the entire complex of:

        - the monomer on the backbone where the linker attaches

        - the connection between monomer and linker

        - the linker molecule

        - the connection between linker and payload

        - the payload molecule


        Currently, this structure will only represent user-drawn attachments. However, in the future,

        this object may also contain leaving group style connections as well.'
      properties:
        __typename:
          type: string
        connectionsInvolved:
          description: 'The molecular connections that comprise this conjugate. Together these connections define the bonded

            region represented by the molfile.'
          items:
            $ref: '#/components/schemas/MolecularConnection'
          type: array
        molfile:
          description: 'The molfile representation of the molecular conjugate''s chemical structure, including all bonded

            components represented by this conjugate.'
          type: string
      type: object
    DnaOligo:
      allOf:
      - $ref: '#/components/schemas/IDnaOligo'
      - description: 'Represents a short single-stranded DNA oligonucleotide in Benchling''s molecular biology

          platform. DNA oligos are typically synthetic sequences used as primers for PCR, probes

          for hybridization assays, or components in cloning workflows. Each oligo stores its

          nucleotide base sequence, annotations for features of interest, and any chemical

          modifications (see ModifiedNucleotide) such as phosphorothioate backbones or fluorescent

          labels. Oligos can be registered in the Registry with unique identifiers, organized in

          folders, and linked to other entities via schema fields. Unlike DnaSequence, oligos are

          specifically designed for shorter, synthesizable sequences. Also referred to as primers

          or probes depending on their application.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    IntegerValue:
      description: A type that represents integer values.
      properties:
