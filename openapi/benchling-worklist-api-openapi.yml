        itemType:
          enum:
          - CONTAINER
          - ENTITY
          - PLATE
          type: string
        name:
          type: string
      required:
      - name
      - itemType
      type: object
    BulkImport:
      example:
        fileId: scrfile_jdf8BV24kLmN
      properties:
        fileId:
          description: The API ID of the scratch file (`scrfile_XXXXXXXX`) containing the items to import. The referenced file must be a scratch file whose upload has completed successfully.
          type: string
      required:
      - fileId
      type: object
    PeptideSimplePolymer:
      description: 'Represents a peptide or protein chain within a complex polymer structure. Contains the amino acid residue

        sequence and connections to other polymers. The entity field links to a corresponding `AaSequence`. Used when

        protein/aa-sequence components are part of larger bioconjugate structures.'
      properties:
        __typename:
          type: string
        connections:
          description: This polymer's connections to other polymers in the complex polymer.
          items:
            $ref: '#/components/schemas/MolecularConnection'
          type: array
        entity:
          $ref: '#/components/schemas/AaSequenceRef'
          description: The Benchling entity information for this simple polymer.
        helmReference:
          description: 'The HELM reference of this polymer (e.g. PEPTIDE1). Uniquely identifies this simple polymer in the context

            of a single complex polymer.'
          type: string
        polymerType:
          description: 'The HELM polymer type for this peptide or protein chain. This is always `PEPTIDE` for peptide simple

            polymers.'
          type: string
        residues:
          description: The amino acid residue sequence of this peptide or protein chain.
          type: string
      type: object
    IMatrixPlate:
      properties:
        __typename:
          type: string
        archiveReason:
          description: Why the plate is archived
          type:
          - 'null'
          - string
        archived:
          description: Whether the plate is archived
          type: boolean
        availableCapacity:
          description: The number of available positions in a matrix plate.
          type: integer
        barcode:
          description: Barcode of the plate
          type:
          - 'null'
          - string
        createdAt:
          description: DateTime the plate was created
          format: datetime
          type: string
        id:
          description: The ID of the plate.
          type: string
        modifiedAt:
          description: DateTime the plate was last modified
          format: datetime
          type: string
        name:
          description: Name of the plate; defaults to barcode if name is not provided
          type: string
        occupiedCapacity:
          description: The number of containers currently in a matrix plate.
          type: integer
        parentStorage:
          description: Containing parent storage
          oneOf:
          - $ref: '#/components/schemas/LocationRef'
          - type: 'null'
        positions:
          description: The wells of the plate
          items:
            $ref: '#/components/schemas/MatrixPlatePosition'
          type: array
        project:
          description: The project the plate is associated with
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        schema:
          $ref: '#/components/schemas/MatrixPlateSchemaRef'
          description: The schema of the plate
        totalCapacity:
          description: The total capacity of a matrix plate (i.e. how many containers it can store).
          type: integer
      type: object
    Ingredient:
      description: 'Represents a single component within a Mixture, specifying the substance and its

        amount. Each Ingredient references a componentEntity (the substance being added),

        an amount with units (see IngredientMeasurementUnits), and optional lot tracking

        information. The amount can be a numeric value or "QS" (quantum satis, meaning

        "as much as is needed") for one ingredient per mixture. Ingredients may optionally

        track component lots either as Container references (for physical inventory tracking)

        or as text. The targetAmount field is used when a mixture is derived from a parent

        mixture and indicates the proportional amount needed.'
      properties:
        __typename:
          type: string
        amount:
          description: 'The amount value of this ingredient in its mixture, in string format

            (to preserve full precision). Pair with `units`. Supports scientific

            notation (1.23e4). One ingredient on this mixture can have an amount

            value of `"QS"`.'
          type:
          - 'null'
          - string
        catalogIdentifier:
          type:
          - 'null'
          - string
        componentEntity:
          oneOf:
          - $ref: '#/components/schemas/EntityRef'
          - type: 'null'
        componentLotContainer:
          description: 'The container representing the component lot for this ingredient. This

            is only present if the mixture schema supports component lots in

            "storage" format.'
          oneOf:
          - $ref: '#/components/schemas/ContainerRef'
          - type: 'null'
        componentLotEntity:
          description: 'The entity representing the component lot for this ingredient. This is

            only present if the mixture schema supports component lots in

            "storage" format.'
          oneOf:
          - $ref: '#/components/schemas/EntityRef'
          - type: 'null'
        componentLotText:
          description: 'Text representing the component lot for this ingredient. This is only

            present if the mixture schema supports component lots in "text"

            format.'
          type:
          - 'null'
          - string
        hasParent:
          type:
          - 'null'
          - boolean
        notes:
          type:
          - 'null'
          - string
        targetAmount:
          description: 'The target amount for this ingredient such that this ingredient''s

            proportion in its mixture would preserve the equivalent ingredient''s

            proportion in the parent mixture. Pair with `units`.'
          type:
          - 'null'
          - string
        units:
          enum:
          - NL
          - UL
          - ML
          - L
          - MG
          - G
          - UNITS
          - CELLS
          - KG
          - MOL
          - UMOL
          - MMOL
          - UG
          - null
          type:
          - 'null'
          - string
      type: object
    MolecularConnection:
      description: 'Represents a chemical bond between two polymers within a complex polymer structure.

        Connections can be covalent bonds (including disulfide bonds) or hydrogen bonds

        (for base pairing in duplexes). Each connection has source and target ConnectionSide

        endpoints defining which polymers and residues are bonded. The attachmentStyle

        indicates whether the connection was drawn graphically or specified via leaving groups.'
      properties:
        __typename:
          type: string
        attachmentStyle:
          description: 'The format in which the user has defined the connection (i.e. drawn vs leaving group style).

            Only applicable to covalent bond type connections.'
          enum:
          - LEAVING_GROUP
          - DRAWN
          - null
          type:
          - 'null'
          - string
        connectionType:
          description: The kind of chemical bond this connection represents.
          enum:
          - COVALENT_BOND
          - HYDROGEN_BOND
          type: string
        covalentBondType:
          description: 'The type of covalent bond represented by the connection (i.e. disulfide bond or not).

            Only applicable to covalent bond type connections.'
          enum:
          - DISULFIDE_BOND
          - null
          type:
          - 'null'
          - string
        source:
          $ref: '#/components/schemas/ConnectionSide'
          description: '''source'' and ''target'' are interchangeable - connections are bidirectional.'
        target:
          $ref: '#/components/schemas/ConnectionSide'
      type: object
    BooleanValue:
      description: A type that represents boolean values.
      properties:
        __typename:
          type: string
        value:
          description: The boolean value.
          type: boolean
      type: object
    DecimalValue:
      description: A type that represents decimal value as strings.
      properties:
        __typename:
          type: string
        numericValue:
          deprecated: true
          description: Deprecated. The float representation of the decimal value.
          type:
          - 'null'
          - number
        value:
          description: The decimal value in a string representation
          type:
          - 'null'
          - string
      type: object
    ProteinFormatChainPosition:
      description: 'Defines each instance of a polypeptide chain within a `ProteinFormat`, specifying the chain type and

        its constituent domains. Each chain position has a unique ref identifier and lists the domain positions

        (see `ProteinFormatDomainPosition`) that compose it in order from N-terminus to C-terminus.

        For example, a heavy chain position might reference domain positions [VH, CH1, Hinge, CH2, CH3].'
      properties:
        __typename:
          type: string
        domainPositions:
          description: A list of all the domain positions that make up the chain position, in order
          items:
            $ref: '#/components/schemas/ProteinFormatDomainPosition'
          type: array
        ref:
          description: 'A unique identifier for a physical component (chain or domain) in a protein format.

            This is used to form a HELM reference that is used in the protein''s complex polymer structure.'
          type: integer
        type:
          description: Type of the chain.
          enum:
          - HEAVY
          - LIGHT
          - NONE
          - ALPHA
          - BETA
          - JOINING
          type: string
      type: object
    MatrixPlatePosition:
      description: A well position within a MatrixPlate.
      properties:
        __typename:
          type: string
        container:
          description: Container at the current position within the matrix plate.
          oneOf:
          - $ref: '#/components/schemas/ContainerRef'
          - type: 'null'
        coordinates:
          $ref: '#/components/schemas/GridCoordinates'
          description: Coordinates of the current position within the matrix plate.
      type: object
    CheckoutRecord:
      description: 'Tracks the checkout status of an inventory item such as a Container. When laboratory

        samples need to be temporarily removed from storage (e.g., for an experiment), users

        can check them out, optionally adding a comment and assigning responsibility to a

        user or team (see Assignee). The record captures when the status was last modified.

        This enables sample tracking workflows and prevents conflicts when multiple users

        need access to the same samples.'
      properties:
        __typename:
          type: string
        assignee:
          description: Union of User, Team
          oneOf:
          - $ref: '#/components/schemas/ObjectRef'
          - type: 'null'
        comment:
          type:
          - 'null'
          - string
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        status:
          enum:
          - AVAILABLE
          - RESERVED
          - CHECKED_OUT
          - null
          type:
          - 'null'
          - string
      type: object
    ProteinChain:
      description: 'Represents a polypeptide chain within an `Protein`, containing the domain composition. Each chain has a

        computed label derived from the format.'
      properties:
        __typename:
          type: string
        chainPositions:
          description: 'Each chain position of this chain in the protein. If a chain has multiplicity > 1, each chain position

            will be listed here.'
          items:
            $ref: '#/components/schemas/ProteinFormatChainPosition'
          type: array
        domains:
          description: Each domain on the chain, ordered according to the format.
          items:
            $ref: '#/components/schemas/ProteinDomain'
          type: array
        entity:
          $ref: '#/components/schemas/AaSequenceRef'
          description: The amino acid sequence entity associated with the chain.
        label:
          description: Unique label for the chain, computed from the format.
          type: string
        type:
          description: The type of the chain.
          enum:
          - HEAVY
          - LIGHT
          - NONE
          - ALPHA
          - BETA
          - JOINING
          type: string
      type: object
    DeleteWorklistInputWithPathParams:
      additionalProperties: false
      properties:
        id:
          type: string
      required:
      - id
      type: object
    DateTimeValue:
      description: A type that represents datetime values.
      properties:
        __typename:
          type: string
        value:
          description: The datetime value with UTC as the timezone.
          format: datetime
          type: string
      type: object
    MatrixPlateSchemaRef:
      properties:
