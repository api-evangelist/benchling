openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Worklist API
  version: 2.0.0
  description: 'A typed collection of items used to group related objects for batch operations. Unlike

    folders, items can belong to multiple worklists simultaneously, making worklists useful

    as temporary holding grounds for arbitrary groups of items. Each worklist has an `itemType`

    that restricts what kinds of objects it can contain (containers, entities, or plates).

    Common use cases include scanning containers into a worklist before adding them to a

    transfer table, or grouping entities for bulk export. Worklists have an `owner` and support

    `collaborations` for access control (see `Collaboratable` interface). The `items` field

    returns the collection of `Worklistable` objects currently in the worklist.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'A typed collection of items used to group related objects for batch operations. Unlike

    folders, items can belong to multiple worklists simultaneously, making worklists useful

    as temporary holding grounds for arbitrary groups of items. Each worklist has an `itemType`

    that restricts what kinds of objects it can contain (containers, entities, or plates).

    Common use cases include scanning containers into a worklist before adding them to a

    transfer table, or grouping entities for bulk export. Worklists have an `owner` and support

    `collaborations` for access control (see `Collaboratable` interface). The `items` field

    returns the collection of `Worklistable` objects currently in the worklist.'
  name: Worklist
  x-bnch-organization: Benchling
  x-displayName: Worklist
paths:
  /worklist:
    post:
      description: Create Worklist.
      operationId: Worklist.Create
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorklistInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worklist'
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create Worklist
      tags:
      - Worklist
  /worklist/items:
    get:
      description: List Worklist items.
      operationId: Worklist.List
      parameters:
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/modifiedAt.gt'
      - $ref: '#/components/parameters/modifiedAt.gte'
      - $ref: '#/components/parameters/modifiedAt.lt'
      - $ref: '#/components/parameters/modifiedAt.lte'
      - $ref: '#/components/parameters/name.anyOf'
      - $ref: '#/components/parameters/name.anyOf.caseSensitive'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/returning'
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first) and modifiedAt (modified time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is modifiedAt:desc.'
        in: query
        name: sort
        schema:
          default: modifiedAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          - modifiedAt:asc
          - modifiedAt:desc
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorklistPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List Worklist items
      tags:
      - Worklist
  /worklist/{worklist_id}:
    delete:
      description: Delete Worklist.
      operationId: Worklist.Delete
      parameters:
      - description: ID of the Worklist.
        in: path
        name: worklist_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Delete Worklist
      tags:
      - Worklist
    get:
      description: Get a single Worklist by ID.
      operationId: Worklist.Get
      parameters:
      - description: ID of the Worklist.
        in: path
        name: worklist_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worklist'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get Worklist by ID
      tags:
      - Worklist
    patch:
      description: Update Worklist.
      operationId: Worklist.Update
      parameters:
      - description: ID of the Worklist.
        in: path
        name: worklist_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorklistInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Worklist'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Update Worklist
      tags:
      - Worklist
  /worklist/{worklist_id}/items/items:
    get:
      description: List Worklistable items.
      operationId: Worklist.items.List
      parameters:
      - description: ID of the Worklist.
        in: path
        name: worklist_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorklistableUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List Worklistable items
      tags:
      - Worklist
  /worklist:batch-create:
    post:
      description: Batch create Worklist synchronously in one transaction. Maximum 25 items per request.
      operationId: Worklist.BatchCreate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/CreateWorklistInput'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/Worklist'
                    type: array
                required:
                - items
                type: object
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch create Worklist
      tags:
      - Worklist
  /worklist:batch-delete:
    post:
      description: Batch delete Worklist synchronously in one transaction. Maximum 25 items per request.
      operationId: Worklist.BatchDelete
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/DeleteWorklistInputWithPathParams'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      additionalProperties: false
                      properties:
                        id:
                          type: string
                      required:
                      - id
                      type: object
                    type: array
                required:
                - items
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch delete Worklist
      tags:
      - Worklist
  /worklist:batch-update:
    patch:
      description: Batch update Worklist synchronously in one transaction. Maximum 25 items per request.
      operationId: Worklist.BatchUpdate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/UpdateWorklistInputWithPathParams'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/Worklist'
                    type: array
                required:
                - items
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch update Worklist
      tags:
      - Worklist
  /worklist:bulk-create:
    post:
      description: Bulk create Worklist.
      operationId: Worklist.BulkCreate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk create Worklist
      tags:
      - Worklist
  /worklist:bulk-update:
    patch:
      description: Bulk update Worklist.
      operationId: Worklist.BulkUpdate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk update Worklist
      tags:
      - Worklist
components:
  schemas:
    ChemSimplePolymer:
      description: 'Represents a small molecule within a complex polymer structure. Contains SMILES and molfile representations of

        the chemical structure, along with connections to other polymers. The entity field links to a corresponding

        `Molecule`. Commonly used as conjugate payloads attached to oligonucleotide backbones, such as lipid

        nanoparticles, fluorescent labels, or therapeutic molecules.'
      properties:
        __typename:
          type: string
        connections:
          description: This polymer's connections to other polymers in the complex polymer.
          items:
            $ref: '#/components/schemas/MolecularConnection'
          type: array
        entity:
          $ref: '#/components/schemas/MoleculeRef'
          description: The Benchling entity information for this simple polymer.
        helmReference:
          description: 'The HELM reference of this polymer (e.g. CHEM1). Uniquely identifies this simple polymer in the context

            of a single complex polymer.'
          type: string
        molfile:
          description: The molfile representation of this small molecule's chemical structure.
          type: string
        polymerType:
          description: The HELM polymer type for this small molecule. This is always `CHEM` for chem simple polymers.
          type: string
        smiles:
          description: The chemical structure of this small molecule in SMILES format.
          type: string
      type: object
    RnaOligo:
      allOf:
      - $ref: '#/components/schemas/IRnaOligo'
      - description: 'Represents a short single-stranded RNA oligonucleotide in Benchling''s molecular biology

          platform. RNA oligos are synthetic sequences used in applications such as RNA interference

          (siRNA, shRNA), antisense oligonucleotides (ASOs), mRNA therapeutics, or CRISPR guide RNAs.

          Each oligo stores its nucleotide base sequence, annotations for features of interest, and

          chemical modifications (see ModifiedNucleotide) such as 2''-O-methyl sugars or phosphorothioate

          backbones that enhance stability and efficacy. RNA oligos can be registered in the Registry

          with unique identifiers, organized in folders, and linked to other entities via schema

          fields. Unlike RnaSequence, oligos are specifically designed for shorter, synthesizable

          sequences. Also referred to as RNA probes or therapeutic oligonucleotides depending on

          their application.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            oneOf:
            - $ref: '#/components/schemas/PrincipalRef'
            - type: 'null'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    EntityRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    UpdateWorklistInput:
      additionalProperties: false
      properties:
        addItemIds:
          description: Add items to the worklist (incremental)
          items:
            type: string
          type: array
        itemIds:
          description: Set/replace all items in the worklist
          items:
            type: string
          type: array
        name:
          type: string
        removeItemIds:
          description: Remove items from the worklist by API ID (incremental)
          items:
            type: string
          type: array
      type: object
    RnaSequenceSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    UnitRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    InternalServerError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        errorId:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    DnaOligoSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    CustomField:
      description: 'A name-value pair for storing additional metadata on objects that support custom fields.

        CustomFields provide a flexible way to attach arbitrary string data to entities, containers,

        datasets, and other Benchling objects without modifying their schemas. Objects that can

        have custom fields implement the HasCustomFields interface. Unlike schema-defined fields,

        custom fields are not validated against a schema and can be freely added or modified.'
      properties:
        __typename:
          type: string
        name:
          type:
          - 'null'
          - string
        value:
          type:
          - 'null'
          - string
      type: object
    ArrayValue:
      description: A type that represents a list of BenchlingValues, used for multi-value cells (e.g. alias columns).
      properties:
        __typename:
          type: string
        value:
          items:
            anyOf:
            - $ref: '#/components/schemas/BooleanValue'
            - $ref: '#/components/schemas/DateTimeValue'
            - $ref: '#/components/schemas/DateValue'
            - $ref: '#/components/schemas/DecimalValue'
            - $ref: '#/components/schemas/IntegerValue'
            - $ref: '#/components/schemas/JsonValue'
            - $ref: '#/components/schemas/ObjectLinkValue'
            - $ref: '#/components/schemas/ObjectLinkListValue'
            - $ref: '#/components/schemas/TextAndUrlValue'
            - $ref: '#/components/schemas/TextValue'
            description: Union of BooleanValue, DateTimeValue, DateValue, DecimalValue, IntegerValue, JsonValue, ObjectLinkValue, ObjectLinkListValue, TextAndUrlValue, TextValue
            discriminator:
              mapping:
                BooleanValue: '#/components/schemas/BooleanValue'
                DateTimeValue: '#/components/schemas/DateTimeValue'
                DateValue: '#/components/schemas/DateValue'
                DecimalValue: '#/components/schemas/DecimalValue'
                IntegerValue: '#/components/schemas/IntegerValue'
                JsonValue: '#/components/schemas/JsonValue'
                ObjectLinkListValue: '#/components/schemas/ObjectLinkListValue'
                ObjectLinkValue: '#/components/schemas/ObjectLinkValue'
                TextAndUrlValue: '#/components/schemas/TextAndUrlValue'
                TextValue: '#/components/schemas/TextValue'
              propertyName: __typename
          type: array
      type: object
    DocumentLikeRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    LocationRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    OligoDuplex:
      allOf:
      - $ref: '#/components/schemas/IOligoDuplex'
      - description: 'An oligo duplex is a therapeutic modality consisting of two complementary

          oligonucleotide strands (forward and reverse) with optional conjugate molecules

          attached to either strand. The classic example is siRNA (small interfering RNA),

          which uses double-stranded RNA for gene silencing. The forwardStrand and reverseStrand

          reference the underlying oligo entities, with hydrogen bonds automatically computed

          for base pairing. Structure is defined using HELM notation and can be edited via

          the visual structure editor. Supports versioning (see OligoDuplexVersion) to track

          changes over time.


          Permissions: When a linked component entity is not readable, `entity` in `forwardStrand`, `reverseStrand`,

          `conjugates`, and `structure.simplePolymers` includes only the `id` field. `structure`, `canonicalHelm`, and polymer

          fields such as `residues` and `smiles` still reflect the structure of this oligo duplex as returned by the API.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            $ref: '#/components/schemas/PrincipalRef'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    IRnaSequence:
      properties:
        __typename:
          type: string
        aliases:
          description: Array of aliases
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        annotations:
          description: 'Annotations on the RNA sequence, not including translations or primers. Annotations on parts are

            not included.'
          format: uri
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        bases:
          description: Bases of the RNA sequence.
          type: string
        canonicalHelm:
          description: Normalized HELM notation for this RNA sequence.
          type: string
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        customFields:
          description: Custom fields set on the RNA sequence.
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityRegistryId:
          description: 'The registry-assigned identifier for this item (e.g. its registry ID shown in the UI),

            present only once the item has been registered. Null if the item is not registered.'
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        id:
          type: string
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        modifiedNucleotides:
          description: Modifications applied to this RNA sequence.
          format: uri
          type: string
        name:
          description: Name of the item.
          type: string
        nucleotideAlignments:
          description: 'Nucleotide alignments that use this sequence as the reference sequence. For template

            alignments, this is the template sequence; for consensus alignments, this is the derived

            consensus sequence.'
          format: uri
          type: string
        parts:
          description: Part features linking regions of this sequence to other RNA sequences.
          format: uri
          type: string
        primers:
          description: Primer bind features on the RNA sequence. Primers on parts are not included.
          format: uri
          type: string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          description: Provenance of this item's registration — where and when it was registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          description: The Registry this item belongs to, if registered. Null if unregistered.
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        schema:
          deprecated: true
          description: Use typedSchema instead, which returns the per-type schema.
          oneOf:
          - $ref: '#/components/schemas/EntitySchemaRef'
          - type: 'null'
        translations:
          description: 'Translation annotations present on the RNA sequence. Translations may be one region or split

            across multiple regions. Translations on parts are not included.'
          format: uri
