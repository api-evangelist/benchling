    Fieldset:
      description: 'A tenant-defined schema interface that groups related fields to be shared across multiple schemas.

        Fieldsets are created and managed by tenant administrators and belong to an `Organization`.

        Schemas can implement an interface to inherit its `fieldDefinitions`, ensuring consistent field definitions

        across entity types. Unlike `SystemCategory` (which is Benchling-defined and read-only), Fieldsets

        can be modified by users. May include a `constraint` for uniqueness validation and a `prefix`

        for ID generation on implementing entities. Can be archived when no longer needed.'
