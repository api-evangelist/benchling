          description: DateTime the Fieldset was created
          format: datetime
          type: string
        description:
          description: The description of this Fieldset.
          type: string
        displayName:
          description: The user-facing name of this fieldset.
          type: string
        fieldDefinitions:
          description: The field definitions that all schemas implementing this fieldset are required to include.
          format: uri
          type: string
        id:
