    FreezeThawTrackingConfiguration:
      description: 'Configuration that can be set on entity schemas, which enables enabling freeze/thaw

        cycle tracking. When enabled, containers holding entities of the schema automatically

        display a "Freeze/thaw count" system field that tracks how many times the sample has been

        frozen and thawed. The optional limit field specifies the maximum number of freeze/thaw

        cycles permitted before the sample is considered unfit for use; exceeding this limit can trigger

        warnings in inventory workflows. Once enabled on a schema, freeze/thaw tracking cannot be

        disabled. This feature is commonly used for biologics, enzymes, and other temperature-sensitive

        samples where repeated freeze/thaw cycles can degrade sample quality.'
      properties:
        __typename:
          type: string
        limit:
          description: 'Max number of freeze/thaw cycles a container containing an entity of this schema is permitted to undergo

            while still being considered fit for use.'
          type:
          - 'null'
          - integer
        systemCategory:
          $ref: '#/components/schemas/SystemCategoryRef'
      type: object
