    OligoDuplex:
      allOf:
      - $ref: '#/components/schemas/IOligoDuplex'
      - description: 'An oligo duplex is a therapeutic modality consisting of two complementary

          oligonucleotide strands (forward and reverse) with optional conjugate molecules

          attached to either strand. The classic example is siRNA (small interfering RNA),

          which uses double-stranded RNA for gene silencing. The forwardStrand and reverseStrand

          reference the underlying oligo entities, with hydrogen bonds automatically computed

          for base pairing. Structure is defined using HELM notation and can be edited via

          the visual structure editor. Supports versioning (see OligoDuplexVersion) to track

          changes over time.'
        properties:
          __typename:
            type: string
          authors:
            oneOf:
            - format: uri
              type: string
            - type: 'null'
          creator:
            $ref: '#/components/schemas/PrincipalRef'
          schemaFields:
            oneOf:
            - items:
                $ref: '#/components/schemas/SchemaFieldValue'
              type: array
            - type: 'null'
        type: object
    NucleotideSimplePolymer:
      description: 'Represents a nucleic acid strand (DNA or RNA) within a complex polymer structure. Contains the sequence

        residues, any chemical modifications (see ModifiedNucleotide), and connections to other polymers. The entity

        field links to a corresponding DnaSequence, RnaSequence, DnaOligo, or RnaOligo. Used as the backbone component

        in OligoConjugate and as forward/reverse strands in OligoDuplex.'
      properties:
        __typename:
          type: string
        connections:
          items:
            $ref: '#/components/schemas/ComplexPolymerConnection'
          type: array
        entity:
          $ref: '#/components/schemas/NucleotideSequenceRef'
        helmReference:
          type: string
        modifications:
          description: Chemical modifications applied at specific positions on this strand.
          items:
            $ref: '#/components/schemas/ModifiedNucleotide'
          type: array
        nucleotideType:
          description: Whether this strand is DNA or RNA.
          enum:
          - DNA
          - RNA
          type: string
        polymerType:
          type: string
        residues:
          description: The nucleotide base sequence of this strand.
          type: string
      type: object
    AsyncTaskLink:
      properties:
        pollingUri:
          format: uri
          type: string
        taskId:
          type: string
      type: object
    ArrayValue:
      description: A type that represents a list of BenchlingValues, used for multi-value cells (e.g. alias columns).
      properties:
        __typename:
          type: string
        value:
          items:
            anyOf:
            - $ref: '#/components/schemas/BooleanValue'
            - $ref: '#/components/schemas/DateTimeValue'
            - $ref: '#/components/schemas/DateValue'
            - $ref: '#/components/schemas/DecimalValue'
            - $ref: '#/components/schemas/IntegerValue'
            - $ref: '#/components/schemas/JsonValue'
            - $ref: '#/components/schemas/ObjectLinkValue'
            - $ref: '#/components/schemas/ObjectLinkListValue'
            - $ref: '#/components/schemas/TextAndUrlValue'
            - $ref: '#/components/schemas/TextValue'
            description: Union of BooleanValue, DateTimeValue, DateValue, DecimalValue, IntegerValue, JsonValue, ObjectLinkValue, ObjectLinkListValue, TextAndUrlValue, TextValue
            discriminator:
              propertyName: __typename
          type: array
      type: object
    IntegerAppConfigSpec:
      description: Specifies that an app configuration field should accept an integer value.
      properties:
        __typename:
          type: string
        enum:
          description: Optional enum constraint — if present, the value must be one of these integers.
          oneOf:
          - items:
              type: integer
            type: array
          - type: 'null'
        requiredConfig:
          type:
          - 'null'
          - boolean
      type: object
    OligoDuplexUpdateWithPathParams:
      additionalProperties: false
      properties:
        aliases:
          items:
            type: string
          type: array
        authorIds:
          items:
            type: string
          type: array
        componentMapping:
          additionalProperties:
            type: string
          description: Mapping from schema component names to entity names. To update the duplex structure, provide componentMapping, connections, and forwardOffset together.
          type: object
        connections:
          description: Connection definitions for the duplex structure. To update the duplex structure, provide componentMapping, connections, and forwardOffset together.
          type: string
        customFields:
          additionalProperties:
            $ref: '#/components/schemas/FieldValueInput'
          type: object
        entityRegistryId:
          type: string
        folderId:
          type: string
        forwardOffset:
          description: Offset of the forward strand relative to the reverse strand, in residues. For example, -2 means the forward strand begins 2 positions before the reverse strand. To update the duplex structure, provide componentMapping, connections, and forwardOffset together.
          type: integer
        id:
          type: string
        name:
          type: string
        namingStrategy:
          enum:
          - NEW_IDS
          - IDS_FROM_NAMES
          - DELETE_NAMES
          - SET_FROM_NAME_PARTS
          - REPLACE_NAMES_FROM_PARTS
          - KEEP_NAMES
          - REPLACE_ID_AND_NAME_FROM_PARTS
          type: string
        registryId:
          type:
          - 'null'
          - string
        schemaFields:
          additionalProperties:
            $ref: '#/components/schemas/FieldValueInput'
          type: object
        schemaId:
          type: string
      required:
      - id
      type: object
    MoleculeRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    AppConfigOption:
      description: 'Defines a configuration option in an app''s configuration schema. Each option has a name,

        optional description, and a configSpec defining the expected value type and validation.'
      properties:
        __typename:
          type: string
        configSpec:
          anyOf:
          - $ref: '#/components/schemas/BooleanAppConfigSpec'
          - $ref: '#/components/schemas/IntegerAppConfigSpec'
          - $ref: '#/components/schemas/FloatAppConfigSpec'
          - $ref: '#/components/schemas/TextAppConfigSpec'
          - $ref: '#/components/schemas/SecureTextAppConfigSpec'
          - $ref: '#/components/schemas/DateAppConfigSpec'
          - $ref: '#/components/schemas/DateTimeAppConfigSpec'
          - $ref: '#/components/schemas/JsonAppConfigSpec'
          - $ref: '#/components/schemas/ArrayAppConfigSpec'
          - $ref: '#/components/schemas/DropdownAppConfigSpec'
          - $ref: '#/components/schemas/EntitySchemaAppConfigSpec'
          - $ref: '#/components/schemas/WorkflowTaskSchemaAppConfigSpec'
          - $ref: '#/components/schemas/SchemaAppConfigSpec'
          - $ref: '#/components/schemas/ResourceAppConfigSpec'
          description: Union of BooleanAppConfigSpec, IntegerAppConfigSpec, FloatAppConfigSpec, TextAppConfigSpec, SecureTextAppConfigSpec, DateAppConfigSpec, DateTimeAppConfigSpec, JsonAppConfigSpec, ArrayAppConfigSpec, DropdownAppConfigSpec, EntitySchemaAppConfigSpec, WorkflowTaskSchemaAppConfigSpec, SchemaAppConfigSpec, ResourceAppConfigSpec
          discriminator:
            propertyName: __typename
        description:
          type:
          - 'null'
          - string
        name:
          type: string
      type: object
    ConnectionSide:
      description: 'Represents one endpoint of a connection between polymers in a complex polymer structure.

        Identifies the specific attachment point including the polymer reference, residue position

        (for sequences), modification type (for nucleotides), and R-group number (for specific

        attachment sites on monomers). Each ComplexPolymerConnection has a source and target

        ConnectionSide defining the two endpoints of the bond.'
      properties:
        __typename:
          type: string
        modificationType:
          description: 'Benchling has no concept of monomer index like HELM does, so specifying the modification type is our way

            of telling the particular monomer for an attachment on a nucleotide polymer.


            For non-nucleotide polymers, this is always null since we would only have one monomer at a particular

            index.'
          enum:
          - SUGAR
          - BASE
          - PHOSPHATE
          - null
          type:
          - 'null'
          - string
        polymerRef:
          description: The ref of the simple polymer connected at this attachment point.
          type: string
        rGroup:
          description: 'The r-group number designates the specific attachment site on the monomer used by this connection.

            If not null, always >= 1.'
          type:
          - 'null'
          - integer
        residueIndex:
          description: 'For sequence types, the index of the residue at this attachment point.


            residueIndex is always 0 or null for CHEM polymers since we never have more than one "residue".'
          type:
          - 'null'
          - integer
      type: object
    ModifiedNucleotide:
      description: 'Represents a chemically modified nucleotide at a specific position in an oligonucleotide

        sequence. Each modification specifies the sugar, base, and phosphate monomers (see NucleotideMonomer)

        that replace or modify the natural nucleotide at that position. Common modifications include

        2''-O-methyl sugars for stability, phosphorothioate backbones for nuclease resistance, or

        modified bases for binding affinity. Used in NucleotideSimplePolymer to capture the

        modification pattern of therapeutic oligonucleotides.'
      properties:
        __typename:
          type: string
        baseMonomer:
          $ref: '#/components/schemas/NucleotideMonomerRef'
          description: The base monomer for the modification.
        createdAt:
          description: DateTime the modification was created.
          format: datetime
          type: string
        id:
          description: The ID of the modified nucleotide.
          type: string
        nucleotideSequence:
          $ref: '#/components/schemas/NucleotideSequenceRef'
          description: The nucleotide sequence that this modification belongs to.
        phosphateMonomer:
          description: The phosphate monomer for the modification. If empty, it represents a null phosphate at the 5' end of the sequence.
          oneOf:
          - $ref: '#/components/schemas/NucleotideMonomerRef'
          - type: 'null'
        position:
          description: 0-based index of the modification.
          type: integer
        sugarMonomer:
          $ref: '#/components/schemas/NucleotideMonomerRef'
          description: The sugar monomer for the modification.
      type: object
    AppConfigDropdownOption:
      description: Defines an option within a dropdown-type app configuration field.
      properties:
        __typename:
          type: string
        description:
          type:
          - 'null'
          - string
        name:
          type: string
        requiredConfig:
          type:
          - 'null'
          - boolean
      type: object
    ObjectRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    TextValue:
      description: A type that represents text (string) values.
      properties:
        __typename:
          type: string
        value:
          description: The text value. It may or may not be an empty string.
          type: string
      type: object
    IOligoDuplex:
      description: 'An oligo duplex is a specific type of complex polymer that consists of two complementary DNA/RNA strands, with

        multiple attached molecules on either strand (aka conjugates).'
      properties:
        __typename:
          type: string
        aliases:
          oneOf:
          - items:
              type: string
            type: array
          - type: 'null'
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        canonicalHelm:
          type: string
        conjugates:
          oneOf:
          - items:
              anyOf:
              - $ref: '#/components/schemas/NucleotideSimplePolymer'
              - $ref: '#/components/schemas/ChemSimplePolymer'
              description: Union of NucleotideSimplePolymer, ChemSimplePolymer
              discriminator:
                propertyName: __typename
            type: array
          - type: 'null'
        createdAt:
          format: datetime
          type: string
        customFields:
          oneOf:
          - items:
              $ref: '#/components/schemas/CustomField'
            type: array
          - type: 'null'
        entityAssociations:
          items:
            $ref: '#/components/schemas/EntityAssociation'
          type: array
        entityRegistryId:
          type:
          - 'null'
          - string
        folder:
          oneOf:
          - $ref: '#/components/schemas/FolderRef'
          - type: 'null'
        forwardOffset:
          type:
          - 'null'
          - integer
        forwardStrand:
          oneOf:
          - $ref: '#/components/schemas/NucleotideSimplePolymer'
          - type: 'null'
        id:
          type: string
        modifiedAt:
          format: datetime
          type: string
        name:
          type: string
        originalHelm:
          type:
          - 'null'
          - string
        outOfSync:
          type: boolean
        outOfSyncReason:
          type:
          - 'null'
          - string
        project:
          oneOf:
          - $ref: '#/components/schemas/ProjectRef'
          - type: 'null'
        registrationOrigin:
          oneOf:
          - $ref: '#/components/schemas/RegistrationOrigin'
          - type: 'null'
        registry:
          oneOf:
          - $ref: '#/components/schemas/RegistryRef'
          - type: 'null'
        reverseStrand:
          oneOf:
          - $ref: '#/components/schemas/NucleotideSimplePolymer'
          - type: 'null'
        schema:
          $ref: '#/components/schemas/EntitySchemaRef'
        structure:
          $ref: '#/components/schemas/ComplexPolymerStructure'
      type: object
    DateTimeAppConfigSpec:
      description: Specifies that an app configuration field should accept a datetime value.
      properties:
        __typename:
          type: string
        requiredConfig:
          type:
          - 'null'
          - boolean
      type: object
    SecureTextAppConfigSpec:
      description: 'Specifies that an app configuration field should accept secure (encrypted) text.

        Used for sensitive data like API keys or credentials.'
      properties:
        __typename:
          type: string
        requiredConfig:
          type:
          - 'null'
          - boolean
      type: object
  parameters:
    modifiedAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified after the specified time. e.g. > 2017-04-30.
      in: query
      name: modifiedAt.gt
      schema:
        format: datetime
        type: string
    id.anyOf:
      description: Restricts results to those matching any of the specified IDs. Comma-separated list.
      explode: false
      in: query
