openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Procedure Run Plan API
  version: 2.0.0
  description: 'A draft experiment plan that can be promoted to a `ProcedureRun` for execution. Scientists use

    run plans to configure experimental conditions, parameter values, and replicates before

    starting an actual experiment. Belongs to a `Study` and exposes its Workflows-backed procedure

    template through `procedureFlowchartConfigVersion`. Contains `ProcedureRunPlanCondition`

    objects that define the different experimental configurations to test. The `dataEntryMode` (see

    `ProcedureRunDataEntryMode`) specifies whether each condition-replicate will have its own data

    entry worksheet or share a single worksheet. The

    `confirmationMethodByParamVersionId` allows overriding default confirmation methods for

    specific parameters. Upon promotion, the run plan becomes a `ProcedureRun` with corresponding

    `ProcedureRunCondition` and `ProcedureRunConditionReplicate` objects. Also known as a "draft

    experiment" in the Benchling UI.


    ## Product mapping


    - `ProcedureRunPlan` is the API model for the **draft procedure run** setup object in the UI.

    - Promoting a run plan creates the executable `ProcedureRun` and carries forward its

    condition/replicate setup.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'A draft experiment plan that can be promoted to a `ProcedureRun` for execution. Scientists use

    run plans to configure experimental conditions, parameter values, and replicates before

    starting an actual experiment. Belongs to a `Study` and exposes its Workflows-backed procedure

    template through `procedureFlowchartConfigVersion`. Contains `ProcedureRunPlanCondition`

    objects that define the different experimental configurations to test. The `dataEntryMode` (see

    `ProcedureRunDataEntryMode`) specifies whether each condition-replicate will have its own data

    entry worksheet or share a single worksheet. The

    `confirmationMethodByParamVersionId` allows overriding default confirmation methods for

    specific parameters. Upon promotion, the run plan becomes a `ProcedureRun` with corresponding

    `ProcedureRunCondition` and `ProcedureRunConditionReplicate` objects. Also known as a "draft

    experiment" in the Benchling UI.


    ## Product mapping


    - `ProcedureRunPlan` is the API model for the **draft procedure run** setup object in the UI.

    - Promoting a run plan creates the executable `ProcedureRun` and carries forward its

    condition/replicate setup.'
  name: ProcedureRunPlan
  x-bnch-organization: Benchling
  x-displayName: Procedure Run Plan
paths:
  /procedure-run-plan:
    post:
      description: 'Create a draft recipe or assay run plan (procedure run plan) within a study.

        ## Required fields

        | Field | Description |

        | --- | --- |

        | `description` | Human-readable description of the plan |

        | `studyId` | ID of the parent study (`stdy_XXXXXXXX`). Use `GET /benchling/study/items` to list studies. |

        ## Optional fields

        | Field | Default | Description |

        | --- | --- | --- |

        | `dataEntryMode` | `INDIVIDUAL_CONDITION_REPLICATES` | Controls worksheet creation upon promotion |

        | `workflowFlowchartConfigVersionId` | `null` | Optional ID of the workflow flowchart config version (`wffccv_XXXXXXXX`) defining the procedure structure |

        | `confirmationMethodByParamVersionId` | Confirmation method overrides per parameter (omit or pass `[]` for no overrides) |

        ## Notes

        - The **creator** is automatically set to the authenticated user.

        - `description` must not exceed 255 characters.

        - The study must be of a type that supports run plans (e.g., recipe or assay run studies). Assay development studies reject `ALL_CONDITION_REPLICATES_TOGETHER` mode.

        - After creating the plan, add conditions using the Create ProcedureRunPlanCondition endpoint.

        - When the plan is ready, promote it to an active run using the Promote endpoint.'
      operationId: ProcedureRunPlan.Create
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProcedureRunPlanInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureRunPlan'
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create ProcedureRunPlan
      tags:
      - ProcedureRunPlan
  /procedure-run-plan/items:
    get:
      description: List ProcedureRunPlan items.
      operationId: ProcedureRunPlan.List
      parameters:
      - $ref: '#/components/parameters/archiveReason.anyOf'
      - $ref: '#/components/parameters/archived.anyOf'
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/creator.anyOf'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/modifiedAt.gt'
      - $ref: '#/components/parameters/modifiedAt.gte'
      - $ref: '#/components/parameters/modifiedAt.lt'
      - $ref: '#/components/parameters/modifiedAt.lte'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/returning'
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first) and modifiedAt (modified time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is modifiedAt:desc.'
        in: query
        name: sort
        schema:
          default: modifiedAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          - modifiedAt:asc
          - modifiedAt:desc
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureRunPlanPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List ProcedureRunPlan items
      tags:
      - ProcedureRunPlan
  /procedure-run-plan/{procedure_run_plan_id}:
    get:
      description: Get a single ProcedureRunPlan by ID.
      operationId: ProcedureRunPlan.Get
      parameters:
      - description: ID of the ProcedureRunPlan.
        in: path
        name: procedure_run_plan_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureRunPlan'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get ProcedureRunPlan by ID
      tags:
      - ProcedureRunPlan
    patch:
      description: 'Update a run plan.

        ## Constraints

        - **Cannot update a plan that has been turned into a run.** Once a plan has been turned into a run, it is immutable.

        - `dataEntryMode` set to `ALL_CONDITION_REPLICATES_TOGETHER` is rejected for assay development study plans.


        ## Reordering conditions

        Use `conditionOrder` to reorder existing conditions within a procedure method definition version (PMDV). Each entry specifies a `templateMethodVersionId` and an ordered list of `conditionIds`. The list must include **every** existing condition ID for that PMDV — no duplicates, no omissions, and no IDs from other PMDVs or plans.'
      operationId: ProcedureRunPlan.Update
      parameters:
      - description: ID of the ProcedureRunPlan.
        in: path
        name: procedure_run_plan_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProcedureRunPlanInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureRunPlan'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Update ProcedureRunPlan
      tags:
      - ProcedureRunPlan
  /procedure-run-plan/{procedure_run_plan_id}/procedure-run-plan-conditions/items:
    get:
      description: List ProcedureRunPlanCondition items.
      operationId: ProcedureRunPlan.procedureRunPlanConditions.List
      parameters:
      - description: ID of the ProcedureRunPlan.
        in: path
        name: procedure_run_plan_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureRunPlanConditionUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List ProcedureRunPlanCondition items
      tags:
      - ProcedureRunPlan
  /procedure-run-plan/{procedure_run_plan_id}:promote:
    post:
      description: Turn a procedure run plan into an active procedure run. The plan must not already be converted. Returns an async task — poll the task endpoint for completion and the created procedure run ID
      operationId: ProcedureRunPlan.Promote
      parameters:
      - description: ID of the ProcedureRunPlan.
        in: path
        name: procedure_run_plan_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Turn a ProcedureRunPlan into an active ProcedureRun
      tags:
      - ProcedureRunPlan
  /procedure-run-plan:batch-create:
    post:
      description: Batch create ProcedureRunPlan synchronously in one transaction. Maximum 25 items per request.
      operationId: ProcedureRunPlan.BatchCreate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/CreateProcedureRunPlanInput'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/ProcedureRunPlan'
                    type: array
                required:
                - items
                type: object
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch create ProcedureRunPlan
      tags:
      - ProcedureRunPlan
  /procedure-run-plan:batch-update:
    patch:
      description: Batch update ProcedureRunPlan synchronously in one transaction. Maximum 25 items per request.
      operationId: ProcedureRunPlan.BatchUpdate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/UpdateProcedureRunPlanInputWithPathParams'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/ProcedureRunPlan'
                    type: array
                required:
                - items
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch update ProcedureRunPlan
      tags:
      - ProcedureRunPlan
  /procedure-run-plan:bulk-create:
    post:
      description: Bulk create up to 25 run plans. Returns an async task link — poll the task to retrieve created object IDs. Each item follows the same field requirements as the single-create endpoint.
      operationId: ProcedureRunPlan.BulkCreate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk create ProcedureRunPlan
      tags:
      - ProcedureRunPlan
  /procedure-run-plan:bulk-update:
    patch:
      description: Bulk update up to 25 run plans. Returns an async task link — poll the task to retrieve results. Each item follows the same constraints as the single-update endpoint.
      operationId: ProcedureRunPlan.BulkUpdate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk update ProcedureRunPlan
      tags:
      - ProcedureRunPlan
  /tasks/procedure-run-plan/promote/{task_id}:
    get:
      description: Poll status for Turn a procedure run plan into an active procedure run. The plan must not already be converted. Returns an async task — poll the task endpoint for completion and the created procedure run ID.
      operationId: ProcedureRunPlan.Promote.Get
      parameters:
      - description: ID of the asynchronous task to poll.
        in: path
        name: task_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  result:
                    oneOf:
                    - $ref: '#/components/schemas/PromoteProcedureRunPlanOutput'
                    - type: 'null'
                  status:
                    enum:
                    - NOT_STARTED
                    - IN_PROGRESS
                    - COMPLETED
                    - FAILED
                    type: string
                required:
                - status
                - message
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Poll async task status
      tags:
      - ProcedureRunPlan
components:
  parameters:
    modifiedAt.lt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified before the specified time. e.g. < 2017-04-30.
      in: query
      name: modifiedAt.lt
      schema:
        format: datetime
        type: string
    archived.anyOf:
      description: If true, returns archived items. If false, returns unarchived items. If both true and false, returns archived and unarchived items. Comma-separated list.
      explode: false
      in: query
      name: archived.anyOf
      schema:
        items:
          type: boolean
        maxItems: 2
        type: array
    pageSize:
      description: Number of results to return. Defaults to 50, maximum of 100.
      in: query
      name: pageSize
      schema:
        type: integer
    modifiedAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified after the specified time. e.g. > 2017-04-30.
      in: query
      name: modifiedAt.gt
      schema:
        format: datetime
        type: string
    modifiedAt.gte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified at or after the specified time. e.g. >= 2017-04-30.
      in: query
      name: modifiedAt.gte
      schema:
        format: datetime
        type: string
    nextToken:
      description: Token for pagination
      in: query
      name: nextToken
      schema:
        type: string
    archiveReason.anyOf:
      description: Restricts items to those with any of the specified archive reasons. Use "NOT_ARCHIVED" to filter for unarchived items. Use "ANY_ARCHIVED" to filter for archived items regardless of reason. Use "ANY_ARCHIVED_OR_NOT_ARCHIVED" to return items for both archived and unarchived. Comma-separated list.
      explode: false
      in: query
      name: archiveReason.anyOf
      schema:
        items:
          type: string
        maxItems: 10
        type: array
    createdAt.lte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or before the specified time. e.g. <= 2017-04-30.
      in: query
      name: createdAt.lte
      schema:
        format: datetime
        type: string
    createdAt.gte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or after the specified time. e.g. >= 2017-04-30.
      in: query
      name: createdAt.gte
      schema:
        format: datetime
        type: string
    returning:
      description: Comma-separated list of top-level fields to include in each returned item. Cannot overlap with omit.
      explode: false
      in: query
      name: returning
      schema:
        items:
          type: string
        type: array
    omit:
      description: Comma-separated list of top-level fields to omit from each returned item. Cannot overlap with returning.
      explode: false
      in: query
      name: omit
      schema:
        items:
          type: string
        type: array
    id.anyOf:
      description: Restricts results to those matching any of the specified IDs. Comma-separated list.
      explode: false
      in: query
      name: id.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    modifiedAt.lte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified at or before the specified time. e.g. <= 2017-04-30.
      in: query
      name: modifiedAt.lte
      schema:
        format: datetime
        type: string
    createdAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created after the specified time. e.g. > 2017-04-30.
      in: query
      name: createdAt.gt
      schema:
        format: datetime
        type: string
    creator.anyOf:
      description: Restricts results to those created by any of the specified user IDs. Comma-separated list.
      explode: false
      in: query
      name: creator.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    createdAt.lt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created before the specified time. e.g. < 2017-04-30.
      in: query
      name: createdAt.lt
      schema:
        format: datetime
        type: string
  schemas:
    ConfirmationMethodByParamVersionId:
      description: 'Associates a procedure parameter version with its confirmation method, keyed by the parameter

        version ID. Used in `ProcedureRunPlan` to look up how a specific version of a parameter''s

        values should be confirmed—either via TABLE (structured table entry) or PLATE_MAP (plate-based

        layout).'
      properties:
        __typename:
          type: string
        confirmationMethod:
          enum:
          - TABLE
          - PLATE_MAP
          type: string
        paramVersionId:
          type: string
      type: object
    UpdateProcedureRunPlanInput:
      additionalProperties: false
      example:
        conditionOrder:
        - conditionIds:
          - prpc_Bm7nWsKt
          - prpc_Zq2rPvJx
          templateMethodVersionId: pcmdv_Hn5kRtYw
        confirmationMethodByParamVersionId:
        - confirmationMethod: TABLE
          paramVersionId: schver_Rm4nTvWz
        dataEntryMode: INDIVIDUAL_CONDITION_REPLICATES
        description: Updated dose-response plan
        workflowFlowchartConfigVersionId: wffccv_Lk3mQpXn
      properties:
        conditionOrder:
          description: Reorder existing conditions per procedure method definition version (PMDV). For each PMDV included, **all** existing condition IDs for that PMDV in the plan must be present exactly once. The order of IDs in `conditionIds` determines the new display positions (0-indexed).
          items:
            $ref: '#/components/schemas/ConditionOrderForPmdvInput'
          type: array
        confirmationMethodByParamVersionId:
          description: Replace the confirmation method overrides for specific procedure parameters. Pass an empty array to clear all overrides. When `workflowFlowchartConfigVersionId` changes to a different version, omitting this field clears all existing overrides automatically, since parameter version IDs are specific to a procedure version and may be invalid for the new one.
          items:
            $ref: '#/components/schemas/ConfirmationMethodByParamVersionIdInput'
          type: array
        dataEntryMode:
          description: Controls how data entry worksheets are created upon promotion. `INDIVIDUAL_CONDITION_REPLICATES` creates one worksheet per condition-replicate. `ALL_CONDITION_REPLICATES_TOGETHER` creates a single shared worksheet (not supported for assay run plans).
          enum:
          - INDIVIDUAL_CONDITION_REPLICATES
          - ALL_CONDITION_REPLICATES_TOGETHER
          type: string
        description:
          description: A human-readable description of the run plan. Must not exceed 255 characters.
          type: string
        workflowFlowchartConfigVersionId:
          description: 'The ID of the workflow flowchart config version to switch to. Format: `wffccv_XXXXXXXX`. When changed and planning-time split-pool isn''t enabled, the plan''s whole condition set is rebuilt from scratch to keep uniform per-method coverage: every existing condition is deleted, and a fresh condition is created for each method of the new flowchart, one per prior canonical position (matching name, description, and replicate count). When planning-time split-pool is enabled, an existing condition whose method isn''t a node of the new flowchart is instead reassociated with the new flowchart''s method version for the same underlying method, if one exists, or deleted if no matching method exists. In both cases, planned parameter, material input, and equipment values, as well as planned unit operation links, are cleared, since they can''t be preserved across the change. Set to null to clear the linked procedure flowchart version. When switching to a genuinely different procedure version (one with a different ID than the currently linked version), any existing `confirmationMethodByParamVersionId` overrides are automatically cleared unless `confirmationMethodByParamVersionId` is also provided in the same request.'
