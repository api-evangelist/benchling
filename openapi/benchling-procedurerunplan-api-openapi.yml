      - id
      type: object
    ProcedureRunPlan:
      description: "A draft experiment plan that can be promoted to a `ProcedureRun` for execution. Scientists use\nrun plans to configure experimental conditions, parameter values, and replicates before\nstarting an actual experiment. Belongs to a `Study` and exposes its Workflows-backed procedure\ntemplate through `procedureFlowchartConfigVersion`. Contains `ProcedureRunPlanCondition`\nobjects that define the different experimental configurations to test. The `dataEntryMode` (see\n`ProcedureRunDataEntryMode`) specifies whether each condition-replicate will have its own data\nentry worksheet or share a single worksheet. The\n`confirmationMethodByParamVersionId` allows overriding default confirmation methods for\nspecific parameters. Upon promotion, the run plan becomes a `ProcedureRun` with corresponding\n`ProcedureRunCondition` and `ProcedureRunConditionReplicate` objects. Also known as a \"draft\nexperiment\" in the Benchling UI.\n\n## Product mapping\n\n- `ProcedureRunPlan` is the API model for the **draft procedure run** setup object in the UI.\n- Promoting a run plan creates the executable `ProcedureRun` and carries forward its\n  condition/replicate setup."
      properties:
        __typename:
          type: string
        confirmationMethodByParamVersionId:
          items:
            $ref: '#/components/schemas/ConfirmationMethodByParamVersionId'
          type: array
        createdAt:
          format: datetime
          type: string
        creator:
          $ref: '#/components/schemas/PrincipalRef'
        dataEntryMode:
          enum:
          - INDIVIDUAL_CONDITION_REPLICATES
          - ALL_CONDITION_REPLICATES_TOGETHER
          type: string
        description:
          type: string
        id:
          type: string
        modifiedAt:
          format: datetime
          type: string
        procedureFlowchartConfigVersion:
          oneOf:
          - $ref: '#/components/schemas/ProcedureFlowchartConfigVersionRef'
          - type: 'null'
        procedureRun:
          oneOf:
          - $ref: '#/components/schemas/ProcedureRunRef'
          - type: 'null'
        procedureRunPlanConditions:
          format: uri
          type: string
        study:
          $ref: '#/components/schemas/StudyRef'
      type: object
    MethodParametersPlan:
      description: 'Contains the planned parameter values for a single unit operation (method) within a

        `ProcedureRunPlanCondition`. Links to a `ProcedureMethodDefinitionVersion` via

        `templateMethodVersion` to identify which method these values apply to. Parameter values are

        organized by category: `dataParameterValues` for data fields like numbers or text,

        `materialInputValues` for sample or reagent inputs, and `equipmentValues` for equipment

        assignments. When the parent `ProcedureRunPlan` is promoted to a `ProcedureRun`, these planned

        values become the starting values in the resulting `ProcedureMethodExecutionInstance`.'
      properties:
        __typename:
          type: string
        dataParameterValues:
          description: Planned values for data parameters keyed by parameter identifiers.
          items:
            $ref: '#/components/schemas/DataParameterValuePlan'
          type: array
        equipmentValues:
          description: Planned values for equipment keyed by equipment identifiers.
          items:
            $ref: '#/components/schemas/EquipmentValuePlan'
          type: array
        materialInputValues:
          description: Planned values for material inputs keyed by input identifiers.
          items:
            $ref: '#/components/schemas/MaterialInputValuePlan'
          type: array
      type: object
    ConfirmationMethodByParamVersionIdInput:
      additionalProperties: false
      properties:
        confirmationMethod:
          enum:
          - TABLE
          - PLATE_MAP
          type: string
        paramVersionId:
          type: string
      required:
      - paramVersionId
      - confirmationMethod
      type: object
    ProcedureRunPlanCondition:
      description: 'A planned experimental condition within a `ProcedureRunPlan`, representing how a procedure''s

        methods will be configured when the plan is promoted to an actual `ProcedureRun`. Each

        condition contains pre-filled parameter values (via `MethodParametersPlan`) for the procedure''s

        unit operations, and specifies how many replicates will be run (via

        `ProcedureRunPlanConditionReplicate`). Scientists use conditions to plan different experimental

        configurations before execution—for example, testing multiple temperatures or reagent

        concentrations. The `position` field determines display order within the parent run plan. Upon

        promotion, each ProcedureRunPlanCondition becomes a `ProcedureRunCondition` in the resulting

        experiment. Also known as an "experiment condition" in the Benchling UI''s experiment planning

        workflow.'
      properties:
        __typename:
          type: string
        createdAt:
          format: datetime
          type: string
        description:
          description: The user-defined description of the condition.
          type: string
        id:
          type: string
        methodParametersPlan:
          description: 'Method plan containing parameter values for this condition''s unit operation. If this value is null upon

            promotion to a procedure run, default values from the procedure will be used.'
          oneOf:
          - $ref: '#/components/schemas/MethodParametersPlan'
          - type: 'null'
        modifiedAt:
          format: datetime
          type: string
        name:
          description: The user-defined name of the condition.
          type: string
        position:
          description: The display order of the condition within the run.
          type: integer
        procedureRunPlan:
          $ref: '#/components/schemas/ProcedureRunPlanRef'
          description: The ProcedureRunPlan that this condition is a part of.
        replicates:
          description: Replicate information for this condition.
          items:
            $ref: '#/components/schemas/ProcedureRunPlanConditionReplicate'
          type: array
        templateMethodVersion:
          $ref: '#/components/schemas/ProcedureMethodDefinitionVersionRef'
          description: The procedure method definition version (PMDV) this condition belongs to.
      type: object
    EquipmentValuePlan:
      description: 'A pre-filled value for an equipment parameter within a `MethodParametersPlan`. The

        `equipmentId` references the `ProcedureParameterVersion` for the equipment parameter this

        value applies to. The `value` field contains the planned equipment assignment in JSON format,

        typically specifying which piece of lab equipment will be used. Used during experiment planning

        to pre-assign instruments or devices that will be used when the procedure run is executed.'
      properties:
        __typename:
          type: string
        equipmentId:
          type: string
        value:
          type: object
      type: object
    MaterialInputValuePlan:
      description: 'A pre-filled value for a material input within a `MethodParametersPlan`. The `materialInputId`

        references the `ProcedureParameterVersion` for the material input this value applies to. The

        `value` field contains the planned material specification in JSON format, typically including

        sample references and quantities. Used during experiment planning to pre-assign samples,

        reagents, or other materials that will be used when the procedure run is executed.'
      properties:
        __typename:
          type: string
        materialInputId:
          type: string
        value:
          type: object
      type: object
