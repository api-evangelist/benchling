          - string
        displayPrecision:
          type:
          - 'null'
          - integer
        id:
          type: string
        isRequired:
          type: boolean
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          type: string
        numericMax:
          type:
          - 'null'
          - number
        numericMin:
          type:
          - 'null'
          - number
        systemName:
