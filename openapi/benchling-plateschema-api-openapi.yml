openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Plate Schema API
  version: 2.0.0
  description: 'Defines the structure and constraints for a category of Plates in Benchling''s inventory

    system. A PlateSchema specifies the grid dimensions (height and width), the plate type

    (see PlateType), and optionally links to a ContainerSchema that constrains what container

    types can occupy positions. Schema field definitions allow capturing plate-specific

    metadata. PlateSchema is the legacy unified schema type; for new configurations, prefer

    using the specific WellPlateSchema (for fixed plates) or MatrixPlateSchema (for tube

    racks). Each schema is associated with a Registry and given a prefix for generating

    display IDs and barcodes.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'Defines the structure and constraints for a category of Plates in Benchling''s inventory

    system. A PlateSchema specifies the grid dimensions (height and width), the plate type

    (see PlateType), and optionally links to a ContainerSchema that constrains what container

    types can occupy positions. Schema field definitions allow capturing plate-specific

    metadata. PlateSchema is the legacy unified schema type; for new configurations, prefer

    using the specific WellPlateSchema (for fixed plates) or MatrixPlateSchema (for tube

    racks). Each schema is associated with a Registry and given a prefix for generating

    display IDs and barcodes.'
  name: PlateSchema
  x-bnch-organization: Benchling
paths:
  /plate-schema/items:
    get:
      description: List PlateSchema items.
      operationId: PlateSchema.List
      parameters:
      - $ref: '#/components/parameters/archiveReason.anyOf'
      - $ref: '#/components/parameters/archived.anyOf'
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/modifiedAt.gt'
      - $ref: '#/components/parameters/modifiedAt.gte'
      - $ref: '#/components/parameters/modifiedAt.lt'
      - $ref: '#/components/parameters/modifiedAt.lte'
      - $ref: '#/components/parameters/name.anyOf'
      - $ref: '#/components/parameters/name.anyOf.caseSensitive'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/returning'
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first) and modifiedAt (modified time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is modifiedAt:desc.'
        in: query
        name: sort
        schema:
          default: modifiedAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          - modifiedAt:asc
          - modifiedAt:desc
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlateSchemaPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List PlateSchema items
      tags:
      - PlateSchema
      x-bnch-rate-limit-tier: 4
  /plate-schema/{plate_schema_id}:
    get:
      description: Get a single PlateSchema by ID.
      operationId: PlateSchema.Get
      parameters:
      - description: ID of the PlateSchema.
        in: path
        name: plate_schema_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlateSchema'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get PlateSchema by ID
      tags:
      - PlateSchema
      x-bnch-rate-limit-tier: 5
  /plate-schema/{plate_schema_id}/field-definitions/items:
    get:
      description: List SchemaFieldDefinition items.
      operationId: PlateSchema.fieldDefinitions.List
      parameters:
      - description: ID of the PlateSchema.
        in: path
        name: plate_schema_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaFieldDefinitionUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List SchemaFieldDefinition items
      tags:
      - PlateSchema
      x-bnch-rate-limit-tier: 4
components:
  schemas:
    CustomEntitySchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    AssayRequestLinkFieldDefinition:
      description: A schema field definition for linking to assay requests.
      properties:
        __typename:
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        derivationType:
          enum:
          - DIRECT
          - COMPUTED
          - SNAPSHOT
          type: string
        description:
          type:
          - 'null'
          - string
        id:
          type: string
        isMulti:
          type: boolean
        isRequired:
          type: boolean
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          type: string
        systemName:
          type: string
      type: object
    PlateSchema:
      description: 'Defines the structure and constraints for a category of Plates in Benchling''s inventory

        system. A PlateSchema specifies the grid dimensions (height and width), the plate type

        (see PlateType), and optionally links to a ContainerSchema that constrains what container

        types can occupy positions. Schema field definitions allow capturing plate-specific

        metadata. PlateSchema is the legacy unified schema type; for new configurations, prefer

        using the specific WellPlateSchema (for fixed plates) or MatrixPlateSchema (for tube

        racks). Each schema is associated with a Registry and given a prefix for generating

        display IDs and barcodes.'
      properties:
        __typename:
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        containerSchema:
          oneOf:
          - $ref: '#/components/schemas/ContainerSchemaRef'
          - type: 'null'
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        fieldDefinitions:
          format: uri
          type: string
        height:
          type:
          - 'null'
          - integer
        id:
          type: string
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          type: string
        plateType:
          enum:
          - MATRIX_PLATE
          - FIXED_PLATE
          - null
          type:
          - 'null'
          - string
        prefix:
          type:
          - 'null'
          - string
        registryId:
          type:
          - 'null'
          - string
        type:
          type:
          - 'null'
          - string
        width:
          type:
          - 'null'
          - integer
      type: object
    RunSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    LongTextFieldDefinition:
      description: A long text field definition for multi-line text values with no length restrictions.
      properties:
        __typename:
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        derivationType:
          enum:
          - DIRECT
          - COMPUTED
          - SNAPSHOT
          type: string
        description:
          type:
          - 'null'
          - string
        id:
          type: string
        isRequired:
          type: boolean
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          type: string
        systemName:
          type: string
      type: object
    ResultSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    CustomEntityLinkFieldDefinition:
      description: A schema field definition for linking to custom entities.
      properties:
        __typename:
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        derivationType:
          enum:
          - DIRECT
          - COMPUTED
          - SNAPSHOT
          type: string
        description:
          type:
          - 'null'
          - string
        id:
          type: string
        isMulti:
          type: boolean
        isParent:
          description: 'Means the link is from a child to a parent custom entity. Important for the registry''s lot-numbering

            functionality.'
          type: boolean
        isRequired:
          type: boolean
        linkDefinition:
          oneOf:
          - $ref: '#/components/schemas/CustomEntitySchemaRef'
