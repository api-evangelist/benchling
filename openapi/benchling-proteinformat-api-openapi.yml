openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Protein Format API
  version: 2.0.0
  description: 'A ProteinFormat defines the structural template for a class of proteins, specifying the

    arrangement of chains and domains. Formats can be built-in (e.g., IgG1, Fab, scFv) or

    custom-defined by users.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'A ProteinFormat defines the structural template for a class of proteins, specifying the

    arrangement of chains and domains. Formats can be built-in (e.g., IgG1, Fab, scFv) or

    custom-defined by users.'
  name: ProteinFormat
  x-bnch-organization: Benchling
  x-displayName: Protein Format
paths:
  /protein-format:
    post:
      description: Create ProteinFormat.
      operationId: ProteinFormat.Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProteinFormatInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProteinFormat'
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create ProteinFormat
      tags:
      - ProteinFormat
  /protein-format/items:
    get:
      description: List ProteinFormat items.
      operationId: ProteinFormat.List
      parameters:
      - $ref: '#/components/parameters/archiveReason.anyOf'
      - $ref: '#/components/parameters/archived.anyOf'
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/modifiedAt.gt'
      - $ref: '#/components/parameters/modifiedAt.gte'
      - $ref: '#/components/parameters/modifiedAt.lt'
      - $ref: '#/components/parameters/modifiedAt.lte'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/returning'
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first) and modifiedAt (modified time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is modifiedAt:desc.'
        in: query
        name: sort
        schema:
          default: modifiedAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          - modifiedAt:asc
          - modifiedAt:desc
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProteinFormatPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List ProteinFormat items
      tags:
      - ProteinFormat
  /protein-format/{protein_format_id}:
    get:
      description: Get a single ProteinFormat by ID.
      operationId: ProteinFormat.Get
      parameters:
      - description: ID of the ProteinFormat.
        in: path
        name: protein_format_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProteinFormat'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get ProteinFormat by ID
      tags:
      - ProteinFormat
    patch:
      description: Update ProteinFormat.
      operationId: ProteinFormat.Update
      parameters:
      - description: ID of the ProteinFormat.
        in: path
        name: protein_format_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProteinFormatInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProteinFormat'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Update ProteinFormat
      tags:
      - ProteinFormat
  /protein-format:batch-create:
    post:
      description: Batch create ProteinFormat synchronously in one transaction. Maximum 25 items per request.
      operationId: ProteinFormat.BatchCreate
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/CreateProteinFormatInput'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/ProteinFormat'
                    type: array
                required:
                - items
                type: object
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch create ProteinFormat
      tags:
      - ProteinFormat
  /protein-format:batch-update:
    patch:
      description: Batch update ProteinFormat synchronously in one transaction. Maximum 25 items per request.
      operationId: ProteinFormat.BatchUpdate
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/UpdateProteinFormatInputWithPathParams'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/ProteinFormat'
                    type: array
                required:
                - items
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch update ProteinFormat
      tags:
      - ProteinFormat
  /protein-format:bulk-create:
    post:
      description: Bulk create ProteinFormat.
      operationId: ProteinFormat.BulkCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk create ProteinFormat
      tags:
      - ProteinFormat
  /protein-format:bulk-update:
    patch:
      description: Bulk update ProteinFormat.
      operationId: ProteinFormat.BulkUpdate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk update ProteinFormat
      tags:
      - ProteinFormat
components:
  parameters:
    modifiedAt.lt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified before the specified time. e.g. < 2017-04-30.
      in: query
      name: modifiedAt.lt
      schema:
        format: datetime
        type: string
    archived.anyOf:
      description: If true, returns archived items. If false, returns unarchived items. If both true and false, returns archived and unarchived items. Comma-separated list.
      explode: false
      in: query
      name: archived.anyOf
      schema:
        items:
          type: boolean
        maxItems: 2
        type: array
    pageSize:
      description: Number of results to return. Defaults to 50, maximum of 100.
      in: query
      name: pageSize
      schema:
        type: integer
    modifiedAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified after the specified time. e.g. > 2017-04-30.
      in: query
      name: modifiedAt.gt
      schema:
        format: datetime
        type: string
    modifiedAt.gte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified at or after the specified time. e.g. >= 2017-04-30.
      in: query
      name: modifiedAt.gte
      schema:
        format: datetime
        type: string
    nextToken:
      description: Token for pagination
      in: query
      name: nextToken
      schema:
        type: string
    archiveReason.anyOf:
      description: Restricts items to those with any of the specified archive reasons. Use "NOT_ARCHIVED" to filter for unarchived items. Use "ANY_ARCHIVED" to filter for archived items regardless of reason. Use "ANY_ARCHIVED_OR_NOT_ARCHIVED" to return items for both archived and unarchived. Comma-separated list.
      explode: false
      in: query
      name: archiveReason.anyOf
      schema:
        items:
          type: string
        maxItems: 10
        type: array
    createdAt.lte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or before the specified time. e.g. <= 2017-04-30.
      in: query
      name: createdAt.lte
      schema:
        format: datetime
        type: string
    createdAt.gte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or after the specified time. e.g. >= 2017-04-30.
      in: query
      name: createdAt.gte
      schema:
        format: datetime
        type: string
    returning:
      description: Comma-separated list of top-level fields to include in each returned item. Cannot overlap with omit.
      explode: false
      in: query
      name: returning
      schema:
        items:
          type: string
        type: array
    omit:
      description: Comma-separated list of top-level fields to omit from each returned item. Cannot overlap with returning.
      explode: false
      in: query
      name: omit
      schema:
        items:
          type: string
        type: array
    id.anyOf:
      description: Restricts results to those matching any of the specified IDs. Comma-separated list.
      explode: false
      in: query
      name: id.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    modifiedAt.lte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified at or before the specified time. e.g. <= 2017-04-30.
      in: query
      name: modifiedAt.lte
      schema:
        format: datetime
        type: string
    createdAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created after the specified time. e.g. > 2017-04-30.
      in: query
      name: createdAt.gt
      schema:
        format: datetime
        type: string
    createdAt.lt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created before the specified time. e.g. < 2017-04-30.
      in: query
      name: createdAt.lt
      schema:
        format: datetime
        type: string
  responses:
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsError'
      description: Too Many Requests
      headers:
        Retry-After:
          description: Minimum number of seconds to wait before retrying. Only included when the request exceeded a rate limit specific to the caller. Limits shared with other callers, such as tenant-wide limits, omit this header because the wait depends on their traffic.
          required: false
          schema:
            minimum: 1
            type: integer
    InternalServerError:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
      description: Internal Server Error
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Not Found
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Conflict
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Bad Request
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Forbidden
  schemas:
    InternalServerError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        errorId:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    AsyncTaskLink:
      properties:
        pollingUri:
          format: uri
          type: string
        taskId:
          type: string
      type: object
    ProteinFormatPaginatedList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/ProteinFormat'
          type: array
        nextToken:
          type:
          - string
          - 'null'
      type: object
    ProteinFormatDomainPosition:
      description: 'Defines a domain position within a `ProteinFormat`, specifying the domain type and identity of each

        physical domain in the protein format. Each domain position has a unique ref identifier used

        to construct HELM notation for complex polymer structures. Domain positions are grouped into ProteinFormatDomains,

        and each group can be uniquely identified by its label, and will be a single amino acid sequence entity in proteins

        of this format.'
      properties:
        __typename:
          type: string
        optional:
          description: Whether this domain is optional in the format. If true, entities of this format may not have this domain.
          type: boolean
        ref:
          description: 'A unique identifier for a physical component (chain or domain) in a protein format.

            This is used to form a HELM reference that is used in the protein''s complex polymer structure.'
          type: integer
        type:
          description: Type of the domain
          enum:
          - VL
          - CL
          - VH
          - VHH
          - CH1
          - CH2
          - CH3
          - CH4
          - J
          - H
          - L
          - VA
          - CA
          - VB
          - CB
          - VG
          - CG
          - VD
          - CD
          - F
          - ELEMENT
          type: string
      type: object
    TooManyRequestsError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    GeneralError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    ProteinFormatDomain:
      description: 'A domain in a protein format, representing the slot where an amino acid sequence can be used in an entity

        of this format. Domains are uniquely identified by their label in the format.'
      properties:
        __typename:
          type: string
        domainPositions:
          description: A list of all the domain positions of this domain in the format.
          items:
            $ref: '#/components/schemas/ProteinFormatDomainPosition'
          type: array
        label:
          description: A human-readable label for the domain, uniquely identifying the domain within the format.
          type: string
        optional:
          description: Whether this domain is optional in the format. If true, entities of this format may not have this domain.
          type: boolean
        type:
          description: The type of the domain (e.g., VH, VL, CH1).
          enum:
          - VL
          - CL
          - VH
          - VHH
          - CH1
          - CH2
          - CH3
          - CH4
          - J
          - H
          - L
          - VA
          - CA
          - VB
          - CB
          - VG
          - CG
          - VD
          - CD
          - F
          - ELEMENT
          type: string
      type: object
    CreateProteinFormatInput:
      additionalProperties: false
      example:
        name: IgG-Fab format
        veritasName: IgG-Fab
      properties:
        name:
          description: Display name of the protein format. When omitted, the VERITAS name is used. When provided, the name must be non-empty after stripping whitespace, at most 255 characters, and unique among all protein format names in the organization (including built-in format names).
          type: string
        veritasName:
          description: VERITAS name that defines the protein format structure and visualization. Must be a supported VERITAS format name; invalid or unsupported values are rejected. The structure implied by this name cannot be changed after the format is created. Creating a custom protein format requires Biologics create access for the authenticated user or app.
          type: string
      required:
      - veritasName
      type: object
    UpdateProteinFormatInput:
      additionalProperties: false
      example:
        name: My custom IgG-Fab format
      properties:
        archiveReason:
          type: string
        archived:
          type: boolean
        name:
          description: Updated display name of the protein format. When provided, the name must be non-empty after stripping whitespace, at most 255 characters, and unique among all protein format names in the organization (including built-in format names). Built-in protein formats cannot be renamed.
          type: string
      type: object
    UpdateProteinFormatInputWithPathParams:
      additionalProperties: false
      example:
        id: abfmt_o2thOLlq
        name: My custom IgG-Fab format
      properties:
        archiveReason:
          type: string
        archived:
          type: boolean
        id:
          description: API identifier of the protein format to update. Use GET /protein-format/items to list formats or GET /protein-format/{proteinFormatId} to retrieve one. Updating a protein format requires Biologics edit access for the authenticated user or app.
          type: string
        name:
          description: Updated display name of the protein format. When provided, the name must be non-empty after stripping whitespace, at most 255 characters, and unique among all protein format names in the organization (including built-in format names). Built-in protein formats cannot be renamed.
          type: string
      required:
      - id
      type: object
    ProteinFormat:
      description: 'A ProteinFormat defines the structural template for a class of proteins, specifying the

        arrangement of chains and domains. Formats can be built-in (e.g., IgG1, Fab, scFv) or

        custom-defined by users.'
      properties:
        __typename:
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        builtIn:
          description: 'Whether this is an out-of-the-box Benchling-provided format. These formats come pre-loaded and cannot be

            modified or deleted by users.'
          type: boolean
        chainPositions:
          description: Format chain positions include all physical instances of each chain in a protein of this format.
          items:
            $ref: '#/components/schemas/ProteinFormatChainPosition'
          type: array
        chains:
          description: 'The chains of protein entities of this format. Each chain can have multiple chain sites, representing

            multiple physical instances of the same chain.'
          items:
            $ref: '#/components/schemas/ProteinFormatChain'
          type: array
        createdAt:
          description: When the protein format was created.
          format: datetime
          type: string
        domainPositions:
          description: 'Format domain positions include all physical instances of each domain in a protein of this

            format.'
          items:
            $ref: '#/components/schemas/ProteinFormatDomainPosition'
          type: array
        domains:
          description: 'The domains of protein entities of this format. Each domain can have multiple domain sites, representing

            multiple physical instances of the same domain.'
          items:
            $ref: '#/components/schemas/ProteinFormatDomain'
          type: array
        id:
          description: 'API identifier of the protein format. Custom formats use the `abfmt_` prefix; built-in formats use

            `builtinabfmt_`.'
          type: string
        modifiedAt:
          description: When the protein format was last modified.
          format: datetime
          type: string
        name:
          description: The display name of the protein format.
          type: string
        originalVeritas:
          description: The VERITAS string used to create the format.
          type:
          - 'null'
          - string
        variablePairs:
          description: 'Variable domain pairs defined on this format (e.g., VH/VL for antibodies). Each pair

            identifies two variable domains that together form an antigen-binding site.'
          items:
            $ref: '#/components/schemas/VariablePair'
          type: array
      type: object
    BulkImport:
      example:
        fileId: scrfile_jdf8BV24kLmN
      properties:
        fileId:
          description: The API ID of the scratch file (`scrfile_XXXXXXXX`) containing the items to import. The referenced file must be a scratch file whose upload has completed successfully.
          type: string
      required:
      - fileId
      type: object
    VariablePair:
      description: "Represents a variable domain pair in a protein format.\n\nA variable pair represents the two variable domains that together form\nan antigen-binding site. The domain types depend on the receptor:\n    - Antibodies: VH + VL\n    - TCR alpha/beta: VA + VB\n    - TCR gamma/delta: VG + VD\n\nThe label is a human-readable identifier for display purposes."
      properties:
        __typename:
          type: string
        label:
          description: A human-readable label identifying this variable pair within the format.
          type: string
        vhVaVg:
          $ref: '#/components/schemas/ProteinFormatDomain'
          description: The first variable domain in the pair (VH, VA, or VG depending on receptor type).
        vlVbVd:
          $ref: '#/components/schemas/ProteinFormatDomain'
          description: The second variable domain in the pair (VL, VB, or VD depending on receptor type).
      type: object
    ProteinFormatChain:
      description: 'A chain in a protein format, representing the slot where a polypeptide chain can be used in an entity of

        this format. Chains are uniquely identified by their label in the format.

        Chains can have multiplicity, meaning there are multiple physical instances of the same chain in a protein of

        this format.'
      properties:
        __typename:
          type: string
        chainPositions:
          description: A list of all the chain positions of this chain in the format.
          items:
            $ref: '#/components/schemas/ProteinFormatChainPosition'
          type: array
        domains:
          description: The domains that compose this chain.
          items:
            $ref: '#/components/schemas/ProteinFormatDomain'
          type: array
        label:
          description: 'A human-readable label for the chain, such as ''Heavy'' or ''Light 1''.

            Chains are labeled with an index only when multiple distinct chains of the same type exist.

            These labels are unique among distinct chains in a format.'
          type: string
        type:
          description: The type of the chain.
          enum:
          - HEAVY
          - LIGHT
          - NONE
          - ALPHA
          - BETA
          - JOINING
          type: string
      type: object
    ProteinFormatChainPosition:
      description: 'Defines each instance of a polypeptide chain within a `ProteinFormat`, specifying the chain type and

        its constituent domains. Each chain position has a unique ref identifier and lists the domain positions

        (see `ProteinFormatDomainPosition`) that compose it in order from N-terminus to C-terminus.

        For example, a heavy chain position might reference domain positions [VH, CH1, Hinge, CH2, CH3].'
      properties:
        __typename:
          type: string
        domainPositions:
          description: A list of all the domain positions that make up the chain position, in order
          items:
            $ref: '#/components/schemas/ProteinFormatDomainPosition'
          type: array
        ref:
          description: 'A unique identifier for a physical component (chain or domain) in a protein format.

            This is used to form a HELM reference that is used in the protein''s complex polymer structure.'
          type: integer
        type:
          description: Type of the chain.
          enum:
          - HEAVY
          - LIGHT
          - NONE
          - ALPHA
          - BETA
          - JOINING
          type: string
      type: object
