openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Entry Schema API
  version: 2.0.0
  description: 'Defines a schema that can be applied to Entries to add structured metadata through custom fields.

    Entry schemas allow organizations to standardize the information captured in notebook entries by defining

    required or optional fields with specific data types.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'Defines a schema that can be applied to Entries to add structured metadata through custom fields.

    Entry schemas allow organizations to standardize the information captured in notebook entries by defining

    required or optional fields with specific data types.'
  name: EntrySchema
  x-bnch-organization: Benchling
  x-displayName: Entry Schema
paths:
  /entry-schema:
    post:
      description: Create EntrySchema.
      operationId: EntrySchema.Create
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntrySchemaInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntrySchema'
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create EntrySchema
      tags:
      - EntrySchema
  /entry-schema/items:
    get:
      description: List EntrySchema items.
      operationId: EntrySchema.List
      parameters:
      - $ref: '#/components/parameters/archiveReason.anyOf'
      - $ref: '#/components/parameters/archived.anyOf'
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/modifiedAt.gt'
      - $ref: '#/components/parameters/modifiedAt.gte'
      - $ref: '#/components/parameters/modifiedAt.lt'
      - $ref: '#/components/parameters/modifiedAt.lte'
      - $ref: '#/components/parameters/name.anyOf'
      - $ref: '#/components/parameters/name.anyOf.caseSensitive'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/returning'
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first) and modifiedAt (modified time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is modifiedAt:desc.'
        in: query
        name: sort
        schema:
          default: modifiedAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          - modifiedAt:asc
          - modifiedAt:desc
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntrySchemaPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List EntrySchema items
      tags:
      - EntrySchema
  /entry-schema/{entry_schema_id}:
    get:
      description: Get a single EntrySchema by ID.
      operationId: EntrySchema.Get
      parameters:
      - description: ID of the EntrySchema.
        in: path
        name: entry_schema_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntrySchema'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get EntrySchema by ID
      tags:
      - EntrySchema
    patch:
      description: Update EntrySchema.
      operationId: EntrySchema.Update
      parameters:
      - description: ID of the EntrySchema.
        in: path
        name: entry_schema_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEntrySchemaInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntrySchema'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Update EntrySchema
      tags:
      - EntrySchema
  /entry-schema/{entry_schema_id}/field-definitions/items:
    get:
      description: List SchemaFieldDefinition items.
      operationId: EntrySchema.fieldDefinitions.List
      parameters:
      - description: ID of the EntrySchema.
        in: path
        name: entry_schema_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/archived.anyOf'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaFieldDefinitionUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List SchemaFieldDefinition items
      tags:
      - EntrySchema
  /entry-schema/{entry_schema_id}:set-field-definitions:
    post:
      operationId: EntrySchema.SetFieldDefinitions
      parameters:
      - description: ID of the EntrySchema.
        in: path
        name: entry_schema_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntrySchemaSetFieldDefinitionsInput'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Set field definitions on the schema
      tags:
      - EntrySchema
  /entry-schema:batch-create:
    post:
      description: Batch create EntrySchema synchronously in one transaction. Maximum 25 items per request.
      operationId: EntrySchema.BatchCreate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/CreateEntrySchemaInput'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/EntrySchema'
                    type: array
                required:
                - items
                type: object
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch create EntrySchema
      tags:
      - EntrySchema
  /entry-schema:batch-update:
    patch:
      description: Batch update EntrySchema synchronously in one transaction. Maximum 25 items per request.
      operationId: EntrySchema.BatchUpdate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/UpdateEntrySchemaInputWithPathParams'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/EntrySchema'
                    type: array
                required:
                - items
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch update EntrySchema
      tags:
      - EntrySchema
  /entry-schema:bulk-create:
    post:
      description: Bulk create EntrySchema.
      operationId: EntrySchema.BulkCreate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk create EntrySchema
      tags:
      - EntrySchema
  /entry-schema:bulk-update:
    patch:
      description: Bulk update EntrySchema.
      operationId: EntrySchema.BulkUpdate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk update EntrySchema
      tags:
      - EntrySchema
  /tasks/entry-schema/set-field-definitions/{task_id}:
    get:
      description: Poll status for Set field definitions on the schema.
      operationId: EntrySchema.SetFieldDefinitions.Get
      parameters:
      - description: ID of the asynchronous task to poll.
        in: path
        name: task_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                  result:
                    oneOf:
                    - $ref: '#/components/schemas/SchemaSetFieldDefinitionsOutput'
                    - type: 'null'
                  status:
                    enum:
                    - NOT_STARTED
                    - IN_PROGRESS
                    - COMPLETED
                    - FAILED
                    type: string
                required:
                - status
                - message
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Poll async task status
      tags:
      - EntrySchema
components:
  schemas:
    DateFieldDefinition:
      description: 'A field definition for date-only values, without a time component. Each field has a user-facing

        `name` and a `systemName` for warehouse and API access. For values that also capture a time and

        timezone, see `DateTimeFieldDefinition`.'
      properties:
        __typename:
          type: string
        archiveReason:
          description: The reason this field definition was archived, if applicable.
          type:
          - 'null'
          - string
        archived:
          description: Whether this field definition has been archived.
          type: boolean
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        derivationType:
          description: 'How this field''s value is determined: DIRECT (user-entered), COMPUTED (auto-calculated), or

            SNAPSHOT (frozen at creation).'
          enum:
          - DIRECT
          - COMPUTED
          - SNAPSHOT
          type: string
        description:
          description: An optional user-provided description of this field definition.
          type:
          - 'null'
          - string
        id:
          type: string
        isRequired:
          description: When true, a value must be provided for this field when creating or updating an entity.
          type: boolean
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          description: The user-facing display name of this field definition.
          type: string
        systemName:
          description: The machine-readable identifier used as the warehouse column name and for API access.
          type: string
      type: object
    AnyEntityLinkFieldDefinition:
      description: A schema field definition for linking to any entity type without schema or type constraints.
      properties:
        __typename:
          type: string
        archiveReason:
          description: The reason this field definition was archived, if applicable.
          type:
          - 'null'
          - string
        archived:
          description: Whether this field definition has been archived.
          type: boolean
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        derivationType:
          description: 'How this field''s value is determined: DIRECT (user-entered), COMPUTED (auto-calculated), or

            SNAPSHOT (frozen at creation).'
          enum:
          - DIRECT
          - COMPUTED
          - SNAPSHOT
          type: string
        description:
          description: An optional user-provided description of this field definition.
          type:
          - 'null'
          - string
        id:
          type: string
        isMulti:
          type: boolean
        isRequired:
          description: When true, a value must be provided for this field when creating or updating an entity.
          type: boolean
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          description: The user-facing display name of this field definition.
          type: string
        systemName:
          description: The machine-readable identifier used as the warehouse column name and for API access.
          type: string
      type: object
    SchemaSetFieldDefinitionsOutput:
      description: Return shape for the set_field_definitions API on schemas.
      properties:
        fieldDefinitions:
          items:
            $ref: '#/components/schemas/SchemaFieldDefinitionRef'
          type: array
        schemaId:
          type: string
      type: object
    TranscriptionLinkFieldDefinition:
      description: A schema field definition for linking to transcriptions (RNA sequences created from DNA).
      properties:
        __typename:
          type: string
        archiveReason:
          description: The reason this field definition was archived, if applicable.
          type:
          - 'null'
          - string
        archived:
          description: Whether this field definition has been archived.
          type: boolean
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        derivationType:
          description: 'How this field''s value is determined: DIRECT (user-entered), COMPUTED (auto-calculated), or

            SNAPSHOT (frozen at creation).'
          enum:
          - DIRECT
          - COMPUTED
          - SNAPSHOT
          type: string
        description:
          description: An optional user-provided description of this field definition.
          type:
          - 'null'
          - string
        id:
          type: string
        isMulti:
          type: boolean
        isParent:
          description: 'Means the link is from a child to a parent RNA sequence. Important for the registry''s lot-numbering

            functionality.'
          type: boolean
        isRequired:
          description: When true, a value must be provided for this field when creating or updating an entity.
          type: boolean
        linkDefinition:
          $ref: '#/components/schemas/RnaSequenceSchemaRef'
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          description: The user-facing display name of this field definition.
          type: string
        systemName:
          description: The machine-readable identifier used as the warehouse column name and for API access.
          type: string
      type: object
    UpdateDnaSequenceLinkFieldDefinitionInput:
      additionalProperties: false
      properties:
        archiveReason:
          description: The reason this field definition was archived, if applicable.
          type: string
        archived:
          description: Whether this field definition has been archived.
          type: boolean
        description:
          description: An optional user-provided description of this field definition.
          type: string
        id:
          description: The API ID of the field definition to update.
          type: string
        isMulti:
          description: When true, multiple linked values are allowed.
          type: boolean
        isParent:
          description: When true, indicates a parent-child relationship used in the registry's lot-numbering functionality.
          type: boolean
        isRequired:
          description: When true, a value must be provided for this field.
          type: boolean
        linkDefinitionId:
          description: The API ID of the schema to constrain links to, or null to allow links to any item of the linked type.
          type:
          - 'null'
          - string
        name:
          description: The user-facing display name of this field definition. Must be unique within the schema.
          type: string
        systemName:
          description: The machine-readable identifier used as the warehouse column name. Must be unique within the schema.
          type: string
        type:
          enum:
          - DNA_SEQUENCE_LINK
          type: string
      required:
      - id
      - type
      type: object
    CreateMoleculeLinkFieldDefinitionInput:
      additionalProperties: false
      properties:
        description:
          description: An optional user-provided description of this field definition.
          type: string
        isMulti:
          description: When true, multiple linked values are allowed.
          type: boolean
        isParent:
          description: When true, indicates a parent-child relationship used in the registry's lot-numbering functionality.
          type: boolean
        isRequired:
          description: When true, a value must be provided for this field.
          type: boolean
        linkDefinitionId:
          description: The API ID of the schema to constrain links to, or null to allow links to any item of the linked type.
          type:
          - 'null'
          - string
        name:
          description: The user-facing display name of this field definition. Must be unique within the schema.
          type: string
        systemName:
          description: The machine-readable identifier used as the warehouse column name. Must be unique within the schema.
          type: string
        type:
          enum:
          - MOLECULE_LINK
          type: string
      required:
      - name
      - systemName
      - isRequired
      - type
      - isMulti
      - linkDefinitionId
      type: object
    RnaSequenceSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    CreateDropdownLinkFieldDefinitionInput:
      additionalProperties: false
      properties:
        description:
          description: An optional user-provided description of this field definition.
          type: string
        dropdownId:
          description: The API ID of the Dropdown that defines the available options.
          type: string
        isMulti:
          description: When true, multiple linked values are allowed.
          type: boolean
        isRequired:
          description: When true, a value must be provided for this field.
          type: boolean
        name:
          description: The user-facing display name of this field definition. Must be unique within the schema.
          type: string
        systemName:
          description: The machine-readable identifier used as the warehouse column name. Must be unique within the schema.
          type: string
        type:
          enum:
          - DROPDOWN
          type: string
      required:
      - name
      - systemName
      - isRequired
      - type
      - isMulti
      - dropdownId
      type: object
    UnitRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    InternalServerError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        errorId:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    DnaOligoSchemaRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    RnaPartLinkFieldDefinition:
      description: A schema field definition for linking to RNA parts.
      properties:
        __typename:
          type: string
        archiveReason:
          description: The reason this field definition was archived, if applicable.
          type:
          - 'null'
          - string
        archived:
          description: Whether this field definition has been archived.
          type: boolean
        createdAt:
          format: datetime
          type:
          - 'null'
          - string
        derivationType:
          description: 'How this field''s value is determined: DIRECT (user-entered), COMPUTED (auto-calculated), or

            SNAPSHOT (frozen at creation).'
          enum:
          - DIRECT
          - COMPUTED
          - SNAPSHOT
          type: string
        description:
          description: An optional user-provided description of this field definition.
          type:
          - 'null'
          - string
        id:
          type: string
        isMulti:
          type: boolean
        isParent:
          description: 'Means the link is from a child to a parent RNA sequence. Important for the registry''s lot-numbering

            functionality.'
          type: boolean
        isRequired:
          description: When true, a value must be provided for this field when creating or updating an entity.
          type: boolean
        linkDefinition:
          $ref: '#/components/schemas/ObjectRef'
          description: Union of RnaSequenceSchema, SystemCategory
        modifiedAt:
          format: datetime
          type:
          - 'null'
          - string
        name:
          description: The user-facing display name of this field definition.
          type: string
        systemName:
          description: The machine-readable identifier used as the warehouse column name and for API access.
          type: string
      type: object
    MixtureLinkFieldDefinition:
      description: A schema field definition for linking to mixtures.
      properties:
        __typename:
          type: string
        archiveReason:
          description: The reason this field definition was archived, if applicable.
          type:
          - 'null'
