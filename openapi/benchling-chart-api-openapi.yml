openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Chart API
  version: 2.0.0
  description: A Chart is a data visualization within Benchling. Charts store their configuration as a JSON object (see `libraryConfig`) compatible with a specific charting library (currently Plotly). A rasterized image is stored for archival purposes. Charts can optionally reference the automation step or AI chat session they originated from as provenance links.
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: A Chart is a data visualization within Benchling. Charts store their configuration as a JSON object (see `libraryConfig`) compatible with a specific charting library (currently Plotly). A rasterized image is stored for archival purposes. Charts can optionally reference the automation step or AI chat session they originated from as provenance links.
  name: Chart
  x-bnch-organization: Benchling
  x-displayName: Chart
paths:
  /chart/{chart_id}:
    get:
      description: Get a single Chart by ID.
      operationId: Chart.Get
      parameters:
      - description: ID of the Chart.
        in: path
        name: chart_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chart'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get Chart by ID
      tags:
      - Chart
components:
  schemas:
    TooManyRequestsError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    GeneralError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    Chart:
      description: A Chart is a data visualization within Benchling. Charts store their configuration as a JSON object (see `libraryConfig`) compatible with a specific charting library (currently Plotly). A rasterized image is stored for archival purposes. Charts can optionally reference the automation step or AI chat session they originated from as provenance links.
      properties:
        __typename:
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        createdAt:
          format: datetime
          type: string
        creator:
          $ref: '#/components/schemas/PrincipalRef'
        id:
          type: string
        library:
          enum:
          - PLOTLY
          type: string
        libraryConfig:
          description: JSON object representing the direct input to a chart library on the front-end.
          type: object
        libraryVersion:
          description: 'Version of the library that the config corresponds to.


            For example, if the library uses semver, we might store "1.2.3", "1.2.3-alpha.1", ect.'
          type: string
        modifiedAt:
          format: datetime
          type: string
        name:
          type: string
        originAutomationStep:
          description: The automation step that this chart was created from.
          oneOf:
          - $ref: '#/components/schemas/AutomationStepRef'
          - type: 'null'
        originAutomationStepDataName:
          description: The name of the data in originAutomationStep that this chart was created from.
          type:
          - 'null'
          - string
        originPipelineStep:
          deprecated: true
          description: The pipeline step that this chart was created from.
          oneOf:
          - $ref: '#/components/schemas/AutomationStepRef'
          - type: 'null'
        originPipelineStepDataName:
          deprecated: true
          description: The name of the data in originAutomationStep that this chart was created from.
          type:
          - 'null'
          - string
        rasterConfig:
          description: "Config used to generate the rasterized image of the chart in relation to th library that we're using.\n\nFor example, in Plotly, this could be:\n```\n  {\n    width: 600\n    height: 400\n    scale: 0.5\n    format: \"png\"\n    engine: \"kaleido\"\n  }\n```"
          type: object
        rasterDownloadUrl:
          description: 'URL to download a rasterized image of the chart.


            We store these images in perpetuity in case the library and libraryConfig version of the chart can no longer be rendered.'
          type: string
        rasterExternalFileId:
          type: string
      type: object
    PrincipalRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    InternalServerError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        errorId:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    AutomationStepRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
  responses:
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsError'
      description: Too Many Requests
      headers:
        Retry-After:
          description: Minimum number of seconds to wait before retrying. Only included when the request exceeded a rate limit specific to the caller. Limits shared with other callers, such as tenant-wide limits, omit this header because the wait depends on their traffic.
          required: false
          schema:
            minimum: 1
            type: integer
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Bad Request
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Forbidden
    InternalServerError:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
      description: Internal Server Error
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Not Found
  parameters:
    returning:
      description: Comma-separated list of top-level fields to include in each returned item. Cannot overlap with omit.
      explode: false
      in: query
      name: returning
      schema:
        items:
          type: string
        type: array
    omit:
      description: Comma-separated list of top-level fields to omit from each returned item. Cannot overlap with returning.
      explode: false
      in: query
      name: omit
      schema:
        items:
          type: string
        type: array
  securitySchemes:
    BearerAuth:
      description: Use a short-lived V3 API Explorer token.
      scheme: bearer
      type: http
      x-fern-playground-description: Copy a short-lived V3 API Explorer token from the user's settings page
    basicApiKeyAuth:
      description: Use issued API key for standard access to the API
      scheme: basic
      type: http
    basicClientIdSecretAuth:
      description: Auth used as part of client credentials OAuth flow prior to receiving a bearer token.
      scheme: basic
      type: http
    oAuth:
      description: OAuth2 Client Credentials flow intended for service access
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: /oauth/token
      type: oauth2
x-provenance:
  method: harvested
  publisher: Benchling
  source: https://benchling.com/api/v3/openapi.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
