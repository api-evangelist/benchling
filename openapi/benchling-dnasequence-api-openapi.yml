    DnaPart:
      description: 'Represents a region on a DNA sequence that matches or is derived from another registered

        DNA sequence. DnaPart features enable tracking the provenance of sequence regions, such

        as identifying that a particular gene in a construct originates from a specific source

        sequence. Each part specifies the referenced DnaSequence, the strand orientation (forward

        or reverse), and the position range using 0-based coordinates with an exclusive end index.

        Parts appear as visual features on the sequence viewer and support traceability from

        assembled constructs back to their component sequences.'
      properties:
        __typename:
          type: string
        containerSequence:
          $ref: '#/components/schemas/DnaSequenceRef'
          description: The DNA sequence that contains this part.
        end:
          description: '0-based exclusive end index. For ranges ending at the end of a circular sequence, this value is

            always the length of the sequence, never 0.'
          type: integer
        id:
          description: The ID of the DNA Part.
          type: string
        sequence:
          $ref: '#/components/schemas/DnaSequenceRef'
          description: DNA sequence this part refers to.
        start:
          description: 0-based inclusive start index.
          type: integer
        strand:
          description: Strand for this part; 1 for forward strand, -1 for reverse strand.
          type: integer
      type: object
