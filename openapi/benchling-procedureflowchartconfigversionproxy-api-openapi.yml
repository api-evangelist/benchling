openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Procedure Flowchart Config Version Proxy API
  version: 2.0.0
  description: 'Represents a snapshot of a procedure''s flowchart configuration at a specific point in time. The

    flowchart defines the structure of a procedure as a directed graph, where nodes represent method

    steps (see `nodes` and `ProcedureMethodDefinitionVersion`) and edges define the execution order

    and dependencies between them (see `edges` and `ProcedureEdge`). This type is accessible from

    `Procedure` (via `latestProcedureFlowchartConfigVersionProxy` and

    `publishedProcedureFlowchartConfigVersionProxy`), `ProcedureRun`, and `ProcedureRunPlan` (not yet in alpha) to

    provide a read-only view of the flowchart structure for execution and planning purposes.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: 'Represents a snapshot of a procedure''s flowchart configuration at a specific point in time. The

    flowchart defines the structure of a procedure as a directed graph, where nodes represent method

    steps (see `nodes` and `ProcedureMethodDefinitionVersion`) and edges define the execution order

    and dependencies between them (see `edges` and `ProcedureEdge`). This type is accessible from

    `Procedure` (via `latestProcedureFlowchartConfigVersionProxy` and

    `publishedProcedureFlowchartConfigVersionProxy`), `ProcedureRun`, and `ProcedureRunPlan` (not yet in alpha) to

    provide a read-only view of the flowchart structure for execution and planning purposes.'
  name: ProcedureFlowchartConfigVersionProxy
  x-bnch-organization: Benchling
paths:
  /procedure-flowchart-config-version-proxy/items:
    get:
      description: List ProcedureFlowchartConfigVersionProxy items.
      operationId: ProcedureFlowchartConfigVersionProxy.List
      parameters:
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/returning'
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is createdAt:desc.'
        in: query
        name: sort
        schema:
          default: createdAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureFlowchartConfigVersionProxyPaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List ProcedureFlowchartConfigVersionProxy items
      tags:
      - ProcedureFlowchartConfigVersionProxy
      x-bnch-rate-limit-tier: 4
  /procedure-flowchart-config-version-proxy/{procedure_flowchart_config_version_proxy_id}:
    get:
      description: Get a single ProcedureFlowchartConfigVersionProxy by ID.
      operationId: ProcedureFlowchartConfigVersionProxy.Get
      parameters:
      - description: ID of the ProcedureFlowchartConfigVersionProxy.
        in: path
        name: procedure_flowchart_config_version_proxy_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureFlowchartConfigVersionProxy'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get ProcedureFlowchartConfigVersionProxy by ID
      tags:
      - ProcedureFlowchartConfigVersionProxy
      x-bnch-rate-limit-tier: 5
  /procedure-flowchart-config-version-proxy/{procedure_flowchart_config_version_proxy_id}/nodes/items:
    get:
      description: List ProcedureMethodDefinitionVersion items.
      operationId: ProcedureFlowchartConfigVersionProxy.nodes.List
      parameters:
      - description: ID of the ProcedureFlowchartConfigVersionProxy.
        in: path
        name: procedure_flowchart_config_version_proxy_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcedureMethodDefinitionVersionUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List ProcedureMethodDefinitionVersion items
      tags:
      - ProcedureFlowchartConfigVersionProxy
      x-bnch-rate-limit-tier: 4
components:
  parameters:
    pageSize:
      description: Number of results to return. Defaults to 50, maximum of 100.
      in: query
      name: pageSize
      schema:
        type: integer
    createdAt.gte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or after the specified time. e.g. >= 2017-04-30.
      in: query
      name: createdAt.gte
      schema:
        format: datetime
        type: string
    id.anyOf:
      description: Restricts results to those matching any of the specified IDs. Comma-separated list.
      explode: false
      in: query
      name: id.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    createdAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created after the specified time. e.g. > 2017-04-30.
      in: query
      name: createdAt.gt
      schema:
        format: datetime
        type: string
    createdAt.lt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created before the specified time. e.g. < 2017-04-30.
      in: query
      name: createdAt.lt
      schema:
        format: datetime
        type: string
    returning:
      description: Comma-separated list of top-level fields to include in each returned item. Cannot overlap with omit.
      explode: false
      in: query
      name: returning
      schema:
        items:
          type: string
        type: array
    nextToken:
      description: Token for pagination
      in: query
      name: nextToken
      schema:
        type: string
    omit:
      description: Comma-separated list of top-level fields to omit from each returned item. Cannot overlap with returning.
      explode: false
      in: query
      name: omit
      schema:
        items:
          type: string
        type: array
    createdAt.lte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or before the specified time. e.g. <= 2017-04-30.
      in: query
      name: createdAt.lte
      schema:
        format: datetime
        type: string
  responses:
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Not Found
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Too Many Requests
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Bad Request
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Forbidden
    InternalServerError:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
      description: Internal Server Error
  schemas:
    ProcedureEquipmentSetting:
      description: 'Configures equipment usage within a method, linking a parameter definition

        (`ProcedureParameterVersion`) with its planned values. Equipment settings specify

        instruments or devices required to perform the method step.'
      properties:
        __typename:
          type: string
        values:
          items:
            $ref: '#/components/schemas/ProcedureParameterPlannedValueRef'
          type: array
        version:
          $ref: '#/components/schemas/ProcedureParameterVersionRef'
      type: object
    ProcedureMethodDefinitionVersionUnpaginatedList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/ProcedureMethodDefinitionVersion'
          type: array
      type: object
    ProcedureMaterialInputSetting:
      description: 'Configures a material input within a method, linking a parameter definition

        (`ProcedureParameterVersion`) with its planned values. Material inputs specify reagents,

        samples, or other substances consumed by the method step.'
      properties:
        __typename:
          type: string
        values:
          items:
            $ref: '#/components/schemas/ProcedureParameterPlannedValueRef'
          type: array
        version:
          $ref: '#/components/schemas/ProcedureParameterVersionRef'
      type: object
    ProcedureRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ProcedureDataParameterSetting:
      description: 'Configures a data parameter within a method, linking a parameter definition

        (`ProcedureParameterVersion`) with its planned values. Data parameters capture experimental

        measurements or observations during procedure execution.'
      properties:
        __typename:
          type: string
        values:
          items:
            $ref: '#/components/schemas/ProcedureParameterPlannedValueRef'
          type: array
        version:
          $ref: '#/components/schemas/ProcedureParameterVersionRef'
      type: object
    InternalServerError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        errorId:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    ProcedureParameterPlannedValueRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ProcedureStepGroup:
      description: 'Groups procedure steps by their execution phase within a method. Each method contains

        multiple step groups (see `ProcedureStepGroupType`), and each group contains an ordered

        list of steps (see `steps` and `ProcedureStepDefinitionVersion`) to be executed in sequence.'
      properties:
        __typename:
          type: string
        group:
          enum:
          - PRE_RUN
          - RUN
          - POST_RUN
          type: string
        steps:
          items:
            $ref: '#/components/schemas/ProcedureStepDefinitionVersionRef'
          type: array
      type: object
    ProcedureMaterialOutputSetting:
      description: 'Configures a material output within a method, linking to a parameter definition

        (`ProcedureParameterVersion`). Material outputs specify products or intermediates

        produced by the method step that can flow to subsequent methods via material edges.'
      properties:
        __typename:
          type: string
        version:
          $ref: '#/components/schemas/ProcedureParameterVersionRef'
      type: object
    ProcedureFlowchartConfigVersionProxy:
      description: 'Represents a snapshot of a procedure''s flowchart configuration at a specific point in time. The

        flowchart defines the structure of a procedure as a directed graph, where nodes represent method

        steps (see `nodes` and `ProcedureMethodDefinitionVersion`) and edges define the execution order

        and dependencies between them (see `edges` and `ProcedureEdge`). This type is accessible from

        `Procedure` (via `latestProcedureFlowchartConfigVersionProxy` and

        `publishedProcedureFlowchartConfigVersionProxy`), `ProcedureRun`, and `ProcedureRunPlan` (not yet in alpha) to

        provide a read-only view of the flowchart structure for execution and planning purposes.'
      properties:
        __typename:
          type: string
        createdAt:
          format: datetime
          type: string
        edges:
          items:
            $ref: '#/components/schemas/ProcedureEdge'
          type: array
        id:
          type: string
        nodes:
          format: uri
          type: string
        procedure:
          $ref: '#/components/schemas/ProcedureRef'
      type: object
    ProcedureStepDefinitionVersionRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    ProcedureFlowchartConfigVersionProxyPaginatedList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/ProcedureFlowchartConfigVersionProxy'
          type: array
        nextToken:
          type: string
      type: object
    ProcedureMethodDefinitionVersion:
      description: 'A versioned method within a procedure flowchart. Methods are the building blocks of

        procedures, representing discrete experimental operations that scientists perform. Each

        method contains step groups (see `stepGroups` and `ProcedureStepGroup`) organized by

        execution phase, along with parameter settings for data collection (`dataParameterSettings`),

        material inputs (`materialInputSettings`), material outputs (`materialOutputSettings`), and

        equipment (`equipmentSettings`). Methods appear as nodes in the procedure flowchart (see

        `ProcedureFlowchartVersion`) and are connected by edges that define execution

        order and material flow.'
      properties:
        __typename:
          type: string
        createdAt:
          format: datetime
          type: string
        dataParameterSettings:
          items:
            $ref: '#/components/schemas/ProcedureDataParameterSetting'
          type: array
        description:
          type: string
        equipmentSettings:
          items:
            $ref: '#/components/schemas/ProcedureEquipmentSetting'
          type: array
        id:
          type: string
        materialInputSettings:
          items:
            $ref: '#/components/schemas/ProcedureMaterialInputSetting'
          type: array
        materialOutputSettings:
          items:
            $ref: '#/components/schemas/ProcedureMaterialOutputSetting'
          type: array
        name:
          type: string
        nodeId:
          type: string
        stepGroups:
          items:
            $ref: '#/components/schemas/ProcedureStepGroup'
          type: array
      type: object
    ProcedureParameterVersionRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    GeneralError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    ProcedureEdge:
      description: 'A directed connection between two nodes in a procedure flowchart. The edge''s type (see

        `ProcedureEdgeType`) determines what `sourceId` and `targetId` reference: for METHOD_EDGE,

        they are method definition version IDs; for MATERIAL_EDGE, they are material version IDs.

        Edges define the structure and flow of a procedure''s execution graph.'
      properties:
        __typename:
          type: string
        sourceId:
          type: string
        targetId:
          type: string
        type:
          enum:
          - METHOD_EDGE
          - MATERIAL_EDGE
          type: string
      type: object
  securitySchemes:
    basicApiKeyAuth:
      description: Use issued API key for standard access to the API
      scheme: basic
      type: http
    basicClientIdSecretAuth:
      description: Auth used as part of client credentials OAuth flow prior to receiving a bearer token.
      scheme: basic
      type: http
    oAuth:
      description: OAuth2 Client Credentials flow intended for service access
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: /oauth/token
      type: oauth2
