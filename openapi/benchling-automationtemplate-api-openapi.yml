openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Automation Template API
  version: 2.0.0
  description: A reusable pipeline configuration that can be instantiated to create new Analysis objects. AutomationTemplates define a data processing workflow with AutomationSteps (see `steps`) that can be parameterized through config variables (see `AutomationTemplateVariable`) and data frame variables (see `AutomationTemplateDataFrameVariable`). When users apply a template to an Analysis, they provide values for these variables, generating a pipeline populated with actual data. Templates are organized within TemplateCollections and must be published before they can be applied.
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: A reusable pipeline configuration that can be instantiated to create new Analysis objects. AutomationTemplates define a data processing workflow with AutomationSteps (see `steps`) that can be parameterized through config variables (see `AutomationTemplateVariable`) and data frame variables (see `AutomationTemplateDataFrameVariable`). When users apply a template to an Analysis, they provide values for these variables, generating a pipeline populated with actual data. Templates are organized within TemplateCollections and must be published before they can be applied.
  name: AutomationTemplate
  x-bnch-organization: Benchling
  x-displayName: Automation Template
paths:
  /automation-template:
    post:
      description: Create an automation template within a template collection.
      operationId: AutomationTemplate.Create
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAutomationTemplateInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationTemplate'
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create AutomationTemplate
      tags:
      - AutomationTemplate
  /automation-template/items:
    get:
      description: List AutomationTemplate items.
      operationId: AutomationTemplate.List
      parameters:
      - $ref: '#/components/parameters/archiveReason.anyOf'
      - $ref: '#/components/parameters/archived.anyOf'
      - $ref: '#/components/parameters/createdAt.gt'
      - $ref: '#/components/parameters/createdAt.gte'
      - $ref: '#/components/parameters/createdAt.lt'
      - $ref: '#/components/parameters/createdAt.lte'
      - $ref: '#/components/parameters/creator.anyOf'
      - $ref: '#/components/parameters/id.anyOf'
      - $ref: '#/components/parameters/modifiedAt.gt'
      - $ref: '#/components/parameters/modifiedAt.gte'
      - $ref: '#/components/parameters/modifiedAt.lt'
      - $ref: '#/components/parameters/modifiedAt.lte'
      - $ref: '#/components/parameters/name.anyOf'
      - $ref: '#/components/parameters/name.anyOf.caseSensitive'
      - $ref: '#/components/parameters/nextToken'
      - $ref: '#/components/parameters/omit'
      - $ref: '#/components/parameters/pageSize'
      - $ref: '#/components/parameters/returning'
      - description: 'Method by which to order results. Valid sorts are: createdAt (created time, oldest first) and modifiedAt (modified time, oldest first). Use :asc or :desc to specify ascending or descending order. Default is modifiedAt:desc.'
        in: query
        name: sort
        schema:
          default: modifiedAt:desc
          enum:
          - createdAt:asc
          - createdAt:desc
          - modifiedAt:asc
          - modifiedAt:desc
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationTemplatePaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List AutomationTemplate items
      tags:
      - AutomationTemplate
  /automation-template/{automation_template_id}:
    get:
      description: Get a single AutomationTemplate by ID.
      operationId: AutomationTemplate.Get
      parameters:
      - description: ID of the AutomationTemplate.
        in: path
        name: automation_template_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationTemplate'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get AutomationTemplate by ID
      tags:
      - AutomationTemplate
    patch:
      description: Update AutomationTemplate.
      operationId: AutomationTemplate.Update
      parameters:
      - description: ID of the AutomationTemplate.
        in: path
        name: automation_template_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAutomationTemplateInput'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationTemplate'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Update AutomationTemplate
      tags:
      - AutomationTemplate
  /automation-template/{automation_template_id}/config-variables/items:
    get:
      description: List AutomationTemplateVariable items.
      operationId: AutomationTemplate.configVariables.List
      parameters:
      - description: ID of the AutomationTemplate.
        in: path
        name: automation_template_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/archived.anyOf'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationTemplateVariableUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List AutomationTemplateVariable items
      tags:
      - AutomationTemplate
  /automation-template/{automation_template_id}/data-frame-variables/items:
    get:
      description: List AutomationTemplateDataFrameVariable items.
      operationId: AutomationTemplate.dataFrameVariables.List
      parameters:
      - description: ID of the AutomationTemplate.
        in: path
        name: automation_template_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/archived.anyOf'
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationTemplateDataFrameVariableUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List AutomationTemplateDataFrameVariable items
      tags:
      - AutomationTemplate
  /automation-template/{automation_template_id}/steps/items:
    get:
      description: List AutomationStep items.
      operationId: AutomationTemplate.steps.List
      parameters:
      - description: ID of the AutomationTemplate.
        in: path
        name: automation_template_id
        required: true
        schema:
          type: string
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationStepUnpaginatedList'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: List AutomationStep items
      tags:
      - AutomationTemplate
  /automation-template:batch-create:
    post:
      description: Batch create AutomationTemplate synchronously in one transaction. Maximum 25 items per request.
      operationId: AutomationTemplate.BatchCreate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/CreateAutomationTemplateInput'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/AutomationTemplate'
                    type: array
                required:
                - items
                type: object
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch create AutomationTemplate
      tags:
      - AutomationTemplate
  /automation-template:batch-update:
    patch:
      description: Batch update AutomationTemplate synchronously in one transaction. Maximum 25 items per request.
      operationId: AutomationTemplate.BatchUpdate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/UpdateAutomationTemplateInputWithPathParams'
                  maxItems: 25
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/AutomationTemplate'
                    type: array
                required:
                - items
                type: object
          description: OK
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch update AutomationTemplate
      tags:
      - AutomationTemplate
  /automation-template:bulk-create:
    post:
      description: Bulk create AutomationTemplate.
      operationId: AutomationTemplate.BulkCreate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk create AutomationTemplate
      tags:
      - AutomationTemplate
  /automation-template:bulk-update:
    patch:
      description: Bulk update AutomationTemplate.
      operationId: AutomationTemplate.BulkUpdate
      parameters:
      - description: Set to true to access beta operations via /api/v3.
        in: header
        name: EARLY-ACCESS
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk update AutomationTemplate
      tags:
      - AutomationTemplate
components:
  parameters:
    modifiedAt.lt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified before the specified time. e.g. < 2017-04-30.
      in: query
      name: modifiedAt.lt
      schema:
        format: datetime
        type: string
    archived.anyOf:
      description: If true, returns archived items. If false, returns unarchived items. If both true and false, returns archived and unarchived items. Comma-separated list.
      explode: false
      in: query
      name: archived.anyOf
      schema:
        items:
          type: boolean
        maxItems: 2
        type: array
    pageSize:
      description: Number of results to return. Defaults to 50, maximum of 100.
      in: query
      name: pageSize
      schema:
        type: integer
    modifiedAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified after the specified time. e.g. > 2017-04-30.
      in: query
      name: modifiedAt.gt
      schema:
        format: datetime
        type: string
    modifiedAt.gte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified at or after the specified time. e.g. >= 2017-04-30.
      in: query
      name: modifiedAt.gte
      schema:
        format: datetime
        type: string
    nextToken:
      description: Token for pagination
      in: query
      name: nextToken
      schema:
        type: string
    archiveReason.anyOf:
      description: Restricts items to those with any of the specified archive reasons. Use "NOT_ARCHIVED" to filter for unarchived items. Use "ANY_ARCHIVED" to filter for archived items regardless of reason. Use "ANY_ARCHIVED_OR_NOT_ARCHIVED" to return items for both archived and unarchived. Comma-separated list.
      explode: false
      in: query
      name: archiveReason.anyOf
      schema:
        items:
          type: string
        maxItems: 10
        type: array
    createdAt.lte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or before the specified time. e.g. <= 2017-04-30.
      in: query
      name: createdAt.lte
      schema:
        format: datetime
        type: string
    createdAt.gte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created at or after the specified time. e.g. >= 2017-04-30.
      in: query
      name: createdAt.gte
      schema:
        format: datetime
        type: string
    returning:
      description: Comma-separated list of top-level fields to include in each returned item. Cannot overlap with omit.
      explode: false
      in: query
      name: returning
      schema:
        items:
          type: string
        type: array
    omit:
      description: Comma-separated list of top-level fields to omit from each returned item. Cannot overlap with returning.
      explode: false
      in: query
      name: omit
      schema:
        items:
          type: string
        type: array
    name.anyOf.caseSensitive:
      description: Restricts results to those that match any of the specified names. Case sensitive. Ensure only one name filter is used at a time. Comma-separated list.
      explode: false
      in: query
      name: name.anyOf.caseSensitive
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    id.anyOf:
      description: Restricts results to those matching any of the specified IDs. Comma-separated list.
      explode: false
      in: query
      name: id.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    modifiedAt.lte:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those modified at or before the specified time. e.g. <= 2017-04-30.
      in: query
      name: modifiedAt.lte
      schema:
        format: datetime
        type: string
    createdAt.gt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created after the specified time. e.g. > 2017-04-30.
      in: query
      name: createdAt.gt
      schema:
        format: datetime
        type: string
    creator.anyOf:
      description: Restricts results to those created by any of the specified user IDs. Comma-separated list.
      explode: false
      in: query
      name: creator.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    name.anyOf:
      description: Restricts results to those that match any of the specified names. Case insensitive. Warning - this filter can be non-performant due to case insensitivity. Ensure only one name filter is used at a time. Comma-separated list.
      explode: false
      in: query
      name: name.anyOf
      schema:
        items:
          type: string
        maxItems: 100
        type: array
    createdAt.lt:
      description: Datetime, in RFC 3339 format. Time zone defaults to UTC. Restricts results to those created before the specified time. e.g. < 2017-04-30.
      in: query
      name: createdAt.lt
      schema:
        format: datetime
        type: string
  schemas:
    AutomationTemplateDataFrameVariableUnpaginatedList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/AutomationTemplateDataFrameVariable'
          type: array
      type: object
    DataFrameColumn:
      description: 'Defines a column within a DataFrame, including its internal system name, user-facing

        display name, and data type specification.'
      properties:
        __typename:
          type: string
        displayName:
          type: string
        systemName:
          type: string
        type:
          type: object
      type: object
    AutomationTemplateVariable:
      description: 'Defines a configuration parameter within an AutomationTemplate that users can customize when

        applying the template. Unlike AutomationTemplateDataFrameVariable which handles data frame

        inputs, this type represents scalar configuration values such as thresholds, filter criteria,

        or algorithm parameters. The configVariableKey identifies which step configuration field

        this variable controls, and variableTypeConfigSpec defines the allowed value types. When

        users apply a template, they provide values for these variables that configure the behavior

        of the corresponding AutomationStep. Note: These are surfaced as "config variables" on the AutomationTemplate object.'
      properties:
        __typename:
          type: string
        archiveReason:
          type:
          - 'null'
          - string
        archived:
          type: boolean
        automationStep:
          $ref: '#/components/schemas/AutomationStepRef'
        configVariableKey:
          type: string
        createdAt:
          format: datetime
          type: string
        id:
          type: string
        modifiedAt:
          format: datetime
          type: string
        name:
          type: string
        pipelineStep:
          $ref: '#/components/schemas/AutomationStepRef'
          deprecated: true
          description: Use automationStep instead.
        template:
          $ref: '#/components/schemas/AutomationTemplateRef'
        variableTypeConfigSpec:
          description: Defines the allowed value type and validation constraints for this variable. The structure depends on the variable's data type.
          type: object
      type: object
    TemplateCollectionRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    InternalServerError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        errorId:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    AutomationStep:
      description: Represents a single operation node within a Pipeline's directed acyclic graph (DAG). Each step performs a specific transformation determined by its stepType, with configuration stored in the config field. Steps receive data through inputStepDatas and produce results via outputStepDatas (see `AutomationStepData`). The incomingEdges and outgoingEdges (see `AutomationStepEdge`) define data flow connections to other steps. Execution state is tracked through statusCode and statusMessage.
      properties:
        __typename:
          type: string
        config:
          type:
          - 'null'
          - object
        createdAt:
          format: datetime
          type: string
        id:
          type: string
        inputStepDatas:
          format: uri
          type: string
        modifiedAt:
          format: datetime
          type: string
        outputStepDatas:
          format: uri
          type: string
        pipeline:
          $ref: '#/components/schemas/PipelineRef'
        statusCode:
          enum:
          - AI_PROPOSED
          - BLOCKED
          - FAILED
          - HALTED
          - RUNNING
          - SUCCEEDED
          - WAITING
          type: string
        statusMessage:
          type:
          - 'null'
          - string
        stepType:
          enum:
          - AGGREGATE_DATASET
          - AUTOFILL_ANTIBODY_ELEMENT_SUBELEMENTS
          - ANNOTATE_ANTIBODY_INPUTS
          - ANOVA
          - APPLY_COLUMN_MAPPING
          - BIN_DATA
          - BOLTZ2
          - BOLTZGEN
          - BOLTZGEN_SUCCESS
          - BULK_IMPORT
          - CHAI1
          - CHART_VIEW
          - COMPUTED_COLUMN
          - CONCATENATE_ANTIBODY_COMPONENT_DOMAINS_TO_CHAINS
          - CONNECTION_DATA_DATASET
          - CONVERT_ASM_TO_CSV
          - CONVERT_FILE_TO_DATASET_WITH_DATA_ENTRY_ASSISTANT
          - CONVERT_JSON_TO_DATASET
          - CONVERT_OPENFOLD2_OUTPUT
          - CONVERT_OPENFOLD3_OUTPUT
          - CONVERT_TO_ASM
          - CREATE_DATASET_FROM_FILE
          - CREATE_ENTITIES
          - CREATE_METERING_USAGE_CHART
          - CREATE_PROCEDURE_DATASET
          - DATA_CATALOG_DATASET
          - DATA_CATALOG_FILE
          - DATA_CATALOG_FILES
          - DATASETS_TO_PLATES
          - DATASET_VIEW
          - DEFINE_TEMPLATE_VARIABLES
          - EXPERIMENT_OPTIMIZATION_BOOTSTRAP
          - EXPERIMENT_OPTIMIZATION_CLEAN_DATA
          - EXPERIMENT_OPTIMIZATION_EXPLANATION
          - EXPERIMENT_OPTIMIZATION_GENERATE_SEARCH_SPACE
          - EXPERIMENT_OPTIMIZATION_POSTERIOR_SUMMARY
          - EXPERIMENT_OPTIMIZATION_RECOMMENDATION
          - EXPERIMENT_OPTIMIZATION_TRAINING
          - EXPLORATORY_DATA_ANALYSIS
          - EXPORT_DATA_CATALOG_DATASET
