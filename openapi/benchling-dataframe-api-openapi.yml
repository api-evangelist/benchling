openapi: 3.2.0
info:
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Benchling Data Frame API
  version: 2.0.0
  description: '`DataFrame` stores non-schematized tabular data, with Benchling-aware column types (see `DataFrameColumn`).

    Data frames are not searchable and lack their own permissions; rather, they are child objects of pipelines

    (via `AutomationStepData`), datasets (see `Dataset`), and app canvases. Row data is stored in S3. Data frames

    are immutable; if data is updated, a new `DataFrame` is created.'
servers:
- url: /api/v3
security:
- oAuth: []
- basicApiKeyAuth: []
tags:
- description: '`DataFrame` stores non-schematized tabular data, with Benchling-aware column types (see `DataFrameColumn`).

    Data frames are not searchable and lack their own permissions; rather, they are child objects of pipelines

    (via `AutomationStepData`), datasets (see `Dataset`), and app canvases. Row data is stored in S3. Data frames

    are immutable; if data is updated, a new `DataFrame` is created.'
  name: DataFrame
  x-bnch-organization: Benchling
  x-displayName: Data Frame
paths:
  /data-frame:
    post:
      description: Create DataFrame.
      operationId: DataFrame.Create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataFrameInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataFrame'
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Create DataFrame
      tags:
      - DataFrame
  /data-frame/{data_frame_id}:
    get:
      description: Get a single DataFrame by ID.
      operationId: DataFrame.Get
      parameters:
      - description: ID of the DataFrame.
        in: path
        name: data_frame_id
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/returning'
      - $ref: '#/components/parameters/omit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataFrame'
          description: OK
          headers: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get DataFrame by ID
      tags:
      - DataFrame
  /data-frame:batch-create:
    post:
      description: Batch create DataFrame synchronously in one transaction. Maximum 20 items per request.
      operationId: DataFrame.BatchCreate
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/CreateDataFrameInput'
                  maxItems: 20
                  minItems: 1
                  type: array
              required:
              - items
              type: object
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/DataFrame'
                    type: array
                required:
                - items
                type: object
          description: Created
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Batch create DataFrame
      tags:
      - DataFrame
  /data-frame:bulk-create:
    post:
      description: Bulk create DataFrame.
      operationId: DataFrame.BulkCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkImport'
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncTaskLink'
          description: Task started
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Bulk create DataFrame
      tags:
      - DataFrame
components:
  schemas:
    DataFrameColumn:
      description: 'Defines a column within a DataFrame, including its internal system name, user-facing

        display name, and data type specification.'
      properties:
        __typename:
          type: string
        displayName:
          type: string
        systemName:
          type: string
        type:
          type: object
      type: object
    InternalServerError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        errorId:
          type: string
        instance:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    AsyncTaskLink:
      properties:
        pollingUri:
          format: uri
          type: string
        taskId:
          type: string
      type: object
    TooManyRequestsError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    GeneralError:
      properties:
        detail:
          type:
          - 'null'
          - string
          - object
        instance:
          type: string
        invalidId:
          type: string
        status:
          type: integer
        title:
          type:
          - 'null'
          - string
        type:
          type: string
      required:
      - type
      - title
      - detail
      - status
      - instance
      type: object
    CreateDataFrameInput:
      additionalProperties: false
      properties:
        delimiter:
          description: Single-character delimiter used when parsing the file. Defaults to a tab for .tsv files and ',' otherwise.
          maxLength: 1
          minLength: 1
          type: string
        locale:
          description: Locale used for number parsing, such as decimal and thousands separators (e.g. 'en-US'). Defaults to 'en-US' if not specified.
          type: string
        name:
          type: string
        scratchFileId:
          description: ID of ScratchFile containing the raw file from which to create the DataFrame. Only files with a .csv or .tsv extension are supported.
          type:
          - 'null'
          - string
      required:
      - name
      - scratchFileId
      type: object
    BulkImport:
      example:
        fileId: scrfile_jdf8BV24kLmN
      properties:
        fileId:
          description: The API ID of the scratch file (`scrfile_XXXXXXXX`) containing the items to import. The referenced file must be a scratch file whose upload has completed successfully.
          type: string
      required:
      - fileId
      type: object
    PrincipalRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
    DataFrame:
      description: '`DataFrame` stores non-schematized tabular data, with Benchling-aware column types (see `DataFrameColumn`).

        Data frames are not searchable and lack their own permissions; rather, they are child objects of pipelines

        (via `AutomationStepData`), datasets (see `Dataset`), and app canvases. Row data is stored in S3. Data frames

        are immutable; if data is updated, a new `DataFrame` is created.'
      properties:
        __typename:
          type: string
        columns:
          items:
            $ref: '#/components/schemas/DataFrameColumn'
          type: array
        createdAt:
          format: datetime
          type: string
        creator:
          $ref: '#/components/schemas/PrincipalRef'
        dataset:
          oneOf:
          - $ref: '#/components/schemas/DatasetRef'
          - type: 'null'
        errorMessage:
          type:
          - 'null'
          - string
        id:
          type: string
        manifest:
          items:
            $ref: '#/components/schemas/DataFrameManifestItem'
          type: array
        modifiedAt:
          format: datetime
          type: string
        name:
          type: string
        size:
          type: integer
        uploadStatus:
          enum:
          - SUCCEEDED
          - FAILED_VALIDATION
          - IN_PROGRESS
          - NOT_UPLOADED
          type: string
      type: object
    DataFrameManifestItem:
      description: 'Represents one part of a DataFrame''s downloadable row data. Currently, the manifest

        always contains exactly one item. The array structure is forward-compatible with future

        multi-part download support for large data frames.'
      properties:
        __typename:
          type: string
        fileName:
          type: string
        url:
          type: string
      type: object
    DatasetRef:
      properties:
        __typename:
          type: string
        id:
          format: api_id
          type: string
      type: object
  responses:
    TooManyRequests:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsError'
      description: Too Many Requests
      headers:
        Retry-After:
          description: Minimum number of seconds to wait before retrying. Only included when the request exceeded a rate limit specific to the caller. Limits shared with other callers, such as tenant-wide limits, omit this header because the wait depends on their traffic.
          required: false
          schema:
            minimum: 1
            type: integer
    InternalServerError:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InternalServerError'
      description: Internal Server Error
    NotFound:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Not Found
    Conflict:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Conflict
    BadRequest:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Bad Request
    Forbidden:
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/GeneralError'
      description: Forbidden
  parameters:
    returning:
      description: Comma-separated list of top-level fields to include in each returned item. Cannot overlap with omit.
      explode: false
      in: query
      name: returning
      schema:
        items:
          type: string
        type: array
    omit:
      description: Comma-separated list of top-level fields to omit from each returned item. Cannot overlap with returning.
      explode: false
      in: query
      name: omit
      schema:
        items:
          type: string
        type: array
  securitySchemes:
    BearerAuth:
      description: Use a short-lived V3 API Explorer token.
      scheme: bearer
      type: http
      x-fern-playground-description: Copy a short-lived V3 API Explorer token from the user's settings page
    basicApiKeyAuth:
      description: Use issued API key for standard access to the API
      scheme: basic
      type: http
    basicClientIdSecretAuth:
      description: Auth used as part of client credentials OAuth flow prior to receiving a bearer token.
      scheme: basic
      type: http
    oAuth:
      description: OAuth2 Client Credentials flow intended for service access
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: /oauth/token
      type: oauth2
