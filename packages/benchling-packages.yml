method: searched
source: >-
  https://docs.benchling.com/docs/getting-started-with-the-sdk plus the public
  package registries (pypi.org/pypi/<name>/json, registry.npmjs.org). Versions
  and publish dates read from the registry metadata endpoints at fetch time.
description: >-
  First-party Benchling client libraries. Benchling ships a Python SDK only —
  benchling-sdk (the hand-maintained ergonomic layer) sits on top of
  benchling-api-client (the generated OpenAPI client). No first-party
  JavaScript/TypeScript, Java, Go, Ruby, PHP or .NET SDK is published; the
  `benchling` npm name is a 2014 placeholder at 0.0.0 and every other
  language binding found in the registries is community-maintained.
packages:
  - language: python
    registry: pypi
    name: benchling-sdk
    url: https://pypi.org/project/benchling-sdk/
    install: pip install benchling-sdk
    official: true
    version: 1.25.0
    published: '2026-05-14'
    license: Apache-2.0
    author: Benchling Support <support@benchling.com>
    docs: https://docs.benchling.com/docs/getting-started-with-the-sdk
    note: >-
      Official, hand-maintained Python SDK. Follows SemVer per
      https://docs.benchling.com/docs/stability. Requires Python >=3.9,<4.0.
  - language: python
    registry: pypi
    name: benchling-api-client
    url: https://pypi.org/project/benchling-api-client/
    install: pip install benchling-api-client
    official: true
    version: 2.0.440
    published: '2026-07-30'
    license: Apache-2.0
    author: Benchling Support <support@benchling.com>
    note: >-
      Autogenerated Python client produced from the Benchling OpenAPI with
      Benchling's own fork of openapi-python-client
      (github.com/benchling/openapi-python-client). It is the transport layer
      benchling-sdk depends on rather than a product surface of its own; its
      release cadence tracks the API more closely than the SDK does.
  - language: javascript
    registry: npm
    name: benchling
    url: https://www.npmjs.com/package/benchling
