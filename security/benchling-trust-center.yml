description: >-
  Benchling runs a real trust center with named third-party attestations, which
  matters for this provider more than for most: its customers are pharma and
  biotech companies whose lab records fall under FDA 21 CFR Part 11 and GxP, so
  the compliance page is part of the product, not marketing. Certifications are
  named on the public page; the underlying reports sit behind a gated Trust
  Portal. Note what is NOT here — no security.txt, no published vulnerability
  disclosure policy and no bug bounty, so a researcher who finds a flaw has no
  documented route in beyond trust@benchling.com.
