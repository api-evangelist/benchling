  description: >-
    A Molecule represents a small molecule chemical compound in Benchling that is imported either as a
    MolFile or

    using SMILES (Simplified Molecular Input Line Entry System) notation. Molecules are registry entities
    that can

    be registered, searched, and linked to other items. When present, the `canonicalSmiles` field provides
    a

    standardized SMILES representation for comparison, while originalSmiles preserves the user-provided
    SMILES and

    may be null if SMILES was not provided at creation. Molecules support custom fields via schemas and
    can be

    organized in folders and projects.
