- aid: benchling:benchling-boxes-api
  name: Benchling Boxes API
  description: >-
    Boxes are a structured inventory type, consisting of a grid of positions that can each hold one container.
    Unlike locations, there are a maximum number of containers that a box can hold (one per position).


    Boxes are all associated with schemas, which define the type of the box (e.g. "10x10 Cryo Box") along
    with the fields that are tracked and the dimensions of the box.


    Like all inventory, every Box has a barcode that is unique across the registry.
  humanURL: https://docs.benchling.com/docs/developer-platform-overview
  baseURL: https://{tenant}.benchling.com/api/v2
  tags:
  - Boxes
