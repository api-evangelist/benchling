- aid: benchling:benchling-v3-api
  name: Benchling API v3
  description: Benchling's unified v3 REST API — a single contract of 805 paths and 874 operations
    spanning the electronic lab notebook, entity registry, inventory, assay results and runs, and
    workflow and procedure execution. Released as the successor to the v2 surface, it returns RFC
    9457 problem details (application/problem+json), tags every operation with a rate-limit tier
    (x-bnch-rate-limit-tier 1-5), adds `returning`/`omit` field selection and batch write endpoints,
    and folds the former v3-alpha and v3-beta routes into one base path gated by an EARLY-ACCESS
    request header. The spec also declares 14 outbound webhooks. Published unauthenticated by
    Benchling at https://benchling.com/api/v3/openapi.yaml.
  baseURL: https://{tenant}.benchling.com/api/v3
  humanURL: https://docs.benchling.com/docs/developer-platform-overview
