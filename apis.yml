  name: Benchling Nucleotide Alignment API
  description: >-
    Represents a multiple sequence alignment of nucleotide sequences (DNA or RNA). Nucleotide

    alignments are used to compare sequence reads against a reference template for verification

    (see AlignmentType TEMPLATE) or to align multiple sequences for consensus building (see

    AlignmentType CONSENSUS). Each alignment contains a referenceSequence (the template or

    consensus) and a collection of AlignedNucleotideSequence entries representing the individual sequences

    being compared. Alignments are commonly used in Sanger sequencing verification workflows

    to confirm that a cloned construct matches the expected design.
