  name: Benchling Nucleotide Monomer API
  description: >-
    A building block component of modified oligonucleotides, representing a sugar, phosphate,

    or base subunit. Monomers are the chemical units that assemble to form nucleotides in

    therapeutic oligonucleotide design. Each monomer has a symbol identifier, chemical structure

    (SMILES), molecular weight, and attachment points defining where it bonds to other monomers.

    The naturalAnalog field links modified monomers to their natural counterparts (e.g., a

    2'-O-methyl ribose analog links to natural ribose 'r'). Monomers are referenced in

    ModifiedNucleotide and CustomNotationAlias to specify the exact chemistry of modified

    sequences. Also known as building blocks in oligonucleotide synthesis contexts.
