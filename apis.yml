- aid: benchling:benchling-location-api
  name: Benchling Location API
  description: >-
    A Location represents a physical storage area in Benchling's inventory system, such as

    a freezer, refrigerator, shelf, room, or building. Locations form a hierarchy where

    each location can contain child locations (e.g., a freezer contains shelves) as well

    as inventory items like Boxes, Plates, and Containers when allowNonLocationChildren is

    true. Each location tracks its capacity (totalCapacity, availableCapacity, occupiedCapacity)

    and can restrict what types of items it accepts via allowedInventorySchemas. Locations

    conform to a LocationSchema that defines custom fields for the location type. Locations

    are identified by barcode for physical tracking and can be archived when no longer in use.
