- aid: benchling:benchling-containers-api
  name: Benchling Containers API
  description: >-
    Containers are the backbone of sample management in Benchling. They represent physical containers,
    such as tubes or wells, that hold quantities of biological samples (represented by the entities inside
    the container). The container itself tracks its total volume, and the concentration of every entity
    inside of it.


    Containers are all associated with schemas, which define the type of the container (e.g. "Tube") along
    with the fields that are tracked.


    Like all inventory, every container has a barcode that is unique across the registry.
  humanURL: https://docs.benchling.com/docs/developer-platform-overview
  baseURL: https://{tenant}.benchling.com/api/v2
  tags:
  - Containers
  properties:
  - type: OpenAPI
