  description: >-
    A replicate of a `ProcedureRunCondition`, representing one execution of a condition's configuration.

    Scientists often run the same experimental condition multiple times to obtain statistically

    significant results—each repetition is a replicate. The `replicateNumber` provides a one-indexed

    identifier within the parent condition (e.g., replicate 1, 2, 3). Each replicate contains its own

    set of `ProcedureMethodExecutionInstance` objects that track actual execution data. Links to a

    `WorkflowTask` that serves as the root task for workflow orchestration. The archivable fields

    support marking replicates as archived when no longer needed, with lineage tracking through

    `archivableParent` and `archivableChildren`.
