  name: Benchling Feature Library Item API
  description: >-
    Represents a single feature definition within a FeatureLibrary used for auto-annotation.

    Each item defines a searchable pattern (nucleotide or amino acid sequence), a feature type

    classification (such as 'gene', 'promoter', or 'domain'), a display name, and a color for

    visualization. When auto-annotate runs against a sequence, the pattern is matched according

    to the matchType (see FeatureLibraryMatchType), and matching regions are annotated with the

    item's name, type, and color. Patterns can include special characters for flexible matching,

    such as wildcards for arbitrary bases or optional flanking regions.
