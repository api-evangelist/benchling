generated: '2026-08-15'
method: searched
source: https://docs.benchling.com/docs/rate-limiting (HTTP 200, fetched 2026-08-15) plus x-bnch-rate-limit-tier
  / "Tier N Rate Limit" tags read from openapi/benchling-v3-openapi.yaml.
name: Benchling Rate Limits
description: Benchling enforces both request-rate limits (requests per 30 seconds) and throughput limits
  (objects created or updated per hour) to ensure platform stability. Limits vary by key type. Apps have
  independent per-app limits so they do not consume a shared tenant budget.
url: https://docs.benchling.com/docs/rate-limiting
rate_limits:
- name: User API Key Limit
  description: Aggregate limit across all personal/user API keys within a single tenant.
  limit: 60
  window: 30 seconds
  scope: per-tenant (all user keys combined)
  key_type: user_api_key
- name: App API Key Limit
  description: Per-app limit for individual Benchling App keys. Apps have independent budgets so one heavy
    app does not throttle others.
  limit: 300
  window: 30 seconds
  scope: per-app-key
  key_type: app_client_credentials
- name: Combined App Tenant Limit
  description: Aggregate ceiling for all Benchling Apps operating within a single tenant. This limit is
    not reflected in response headers.
  limit: 1000
  window: 30 seconds
  scope: per-tenant (all apps combined)
  key_type: app_client_credentials
  note: Not exposed via rate-limit response headers.
- name: Platform-Wide Throughput Limit
  description: Limits the total number of objects (entities, containers, results, etc.) created or updated
    across all API calls over a rolling hour window. Applies to entire tenant and adjusts dynamically
    under system load.
  limit: tens of thousands of objects
  window: 1 hour
  scope: per-tenant (all keys combined)
  dynamic: true
  note: Exact threshold may change in response to system load. Most tenants operate well below this ceiling.
response_headers:
- name: x-rate-limit-limit
  description: Total requests allowed in the current window period.
- name: x-rate-limit-remaining
  description: Remaining requests available in the current window.
- name: x-rate-limit-reset
  description: Seconds until the current rate-limit window resets.
error_handling:
  http_status: 429
  error_type: invalid_request_error
  message: Rate limit exceeded.
  recommended_strategy: Exponential backoff with randomized jitter; maximum recommended delay of ~15 seconds.
escalation:
  description: Rate limits can be increased upon request to Benchling support for tenants with legitimate
    high-volume use cases.
  contact: https://benchling.com/contact
limit_count: 4
operation_tiering:
  extension: x-bnch-rate-limit-tier
  tag_form: Tier N Rate Limit
  range: 1-5
  spec: openapi/benchling-v3-openapi.yaml
  distribution:
    tier_2: 130
    tier_3: 132
    tier_4: 427
    tier_5: 184
    untiered: 1
  note: v3 assigns every operation a cost class and exposes it in the spec, so a client can tell which
    calls are expensive BEFORE issuing them — unusual and genuinely useful. Benchling does not publish
    what each tier costs against the 60/300/1000 budgets, so the tier is ordinal rather than quantitative.
data_limits:
  pagination:
    param: pageSize
    default: 50
    max: 100
  bulk_create_default: 1000
  bulk_create_custom_entities: 2500
  register_entities: 2500
  transfer_into_containers: 5000
  batch_write: 25
  assay_results:
    per_request: 100
    requests_per_hour: 10000
  max_payload: 100MB per POST/PATCH/PUT; 413 Request Entity Too Large above it
warehouse_limits:
  user_concurrent_connections: 100
  user_limit_error: 'FATAL: too many connections for role'
  warehouse_concurrent_connections: dynamic, based on system load
  warehouse_limit_error: 'FATAL: remaining connection slots are reserved for non-replication superuser
    and rds_superuser connections'
  recommended_poll_frequency: no more than 4-5 times per minute (guidance, not enforced)
  docs: https://docs.benchling.com/docs/getting-started
gaps:
  retry_after: false
  ietf_ratelimit_headers: false
  note: Headers are the vendor-prefixed x-rate-limit-* set, not the IETF RateLimit-* draft fields, and
    no Retry-After accompanies a 429 — so a client must compute the wait from x-rate-limit-reset. The
    1000 req/30s all-apps tenant ceiling is not reflected in headers at all, which means an app can be
    throttled by a limit it cannot observe.
