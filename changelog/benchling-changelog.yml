  - date: '2026-06-16'
    title: Webhook Stable Routing
    url: https://docs.benchling.com/changelog/webhook-stable-routing
    type: addition
    breaking: false
    surface: webhooks
    highlight: >-
      New webhookUrlRouting setting in the Developer Console. SUFFIXED (default)
      appends /event, /canvas or /lifecycle to the configured webhook URL;
      STABLE delivers every webhook to the URL unchanged, so customers on fixed
      static endpoints (Zapier, Slack, Workato) can receive webhooks without
      path-based routing. Lambda-style consumers keep the suffixed behaviour.
  - date: '2026-05-31'
    title: '[V3 REST API] Unified API, New Stability Guidelines, and Breaking Changes'
    url: https://docs.benchling.com/changelog/v3-rest-api-unified-api-new-stability-guidelines-and-breaking-changes
    type: breaking
    breaking: true
    surface: v3
    migration_deadline: 90 days from June 15
    highlight: >-
      The v3-alpha and v3-beta routes are deprecated and the whole spec unifies
      under /v3/. Object names drop the "benchling." prefix and URLs drop the
      "/benchling" prefix. Beta endpoints move to the same /v3/ base path behind
      an "EARLY-ACCESS: true" request header. New stability guidelines: stable
      gets >=90 days notice, beta gets none. New beta APIs for Entity Schemas,
      results bulk write and Audit Logs.
  - date: '2026-05-22'
    title: '[V3 REST API] Batch Write Endpoints'
    url: https://docs.benchling.com/changelog/v3-rest-api-batch-write-endpoints
    type: addition
    breaking: false
    surface: v3
    highlight: >-
      Batch create and update on every type — up to 25 objects per synchronous
      request, without the file-based approach the Bulk APIs require.
  - date: '2026-05-21'
    title: '[V3 REST API] Returning and Omit Parameters'
    url: https://docs.benchling.com/changelog/v3-rest-api-returning-and-omit-parameters
    type: addition
    breaking: false
    surface: v3
    highlight: >-
      `returning` and `omit` query parameters on all list and get-by-id
      endpoints control which top-level properties come back. The two lists must
      be mutually exclusive.
