  Direct HTTPS probes of every /.well-known/ path against the apis.yml base host
  (benchling.com — the tenant-templated {tenant}.benchling.com resolves to the
  same application), the marketing host (www.benchling.com) and the docs host
  (docs.benchling.com). Status is the HTTP code observed at fetch time.
description: >-
  Benchling serves NO /.well-known/ discovery documents. Every path probed
  either 404s or returns an HTML shell. IMPORTANT: benchling.com answers HTTP
  200 with the ~55KB "Sign In · Benchling" HTML application shell for EVERY
  unknown path, including /.well-known/security.txt, /.well-known/agent-card.json
  and /openapi.json — those 200s are the SPA catch-all, not documents, and are
  recorded here as misses so nothing downstream credits Benchling with a
  discovery surface it does not publish. No WellKnown or SecurityTxt pointer is
  emitted in apis.yml as a result.
