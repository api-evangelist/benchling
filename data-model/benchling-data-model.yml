description: 'The Benchling v3 entity-relationship graph, derived from the published OpenAPI. Benchling''s
  data model is unusually large for one contract — 142 tagged resource families across 805 paths and 874
  operations — because it spans four product domains that share a single API: molecular biology (sequences,
  oligos, proteins, mixtures, reactions), the electronic lab notebook (entries, templates, review processes),
  inventory (containers, boxes, plates, locations, worklists) and workflow/procedure execution. Nearly
  every family is schema-driven: an instance (CustomEntity) points at a customer-configured definition
  (CustomEntitySchema) that declares the fields, which is why the *Schema resources are first-class. The
  concrete properties live on `I<Entity>` interface schemas that the public `<Entity>` schema composes
  via allOf; this derivation resolves those chains before reading relationships.'
