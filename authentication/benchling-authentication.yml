docs: https://docs.benchling.com/docs/authentication
documented_methods:
- name: Basic authentication (user API key)
  scheme: http basic
  openapi_scheme: basicApiKeyAuth
  detail: API key as the HTTP Basic USERNAME with an EMPTY password — note the trailing colon in `curl
    -u KEY:`. Failed auth returns 401. Keys are generated and rotated in Profile settings.
  identity: acts as the user who owns the key
  recommended_for: quick tests and one-off scripts
- name: OAuth 2.0 client credentials (Benchling Apps)
  scheme: oauth2 clientCredentials
  openapi_scheme: oAuth
  token_url: https://{tenant}.benchling.com/api/v2/token
  exchange_auth: basicClientIdSecretAuth (client_id / client_secret) or form-encoded body
  detail: 'POST client_id + client_secret + grant_type=client_credentials to /token, receive a short-lived
    access_token, send Authorization: Bearer, re-fetch on expiry.'
  identity: acts as the app (a service principal)
  recommended_for: dedicated integrations and automation — the recommended default
- name: OpenID Connect id token
  scheme: bearer id_token
  openapi_scheme: null
  detail: Enterprise only, and NOT declared in the OpenAPI. A trusted IdP issues an id token containing
    an `email` claim; Benchling verifies the signature against the customer's own /.well-known/openid-configuration
    and authenticates as the matching user, who must already exist in the tenant. Confirmed working with
    Okta and Azure AD / Entra ID. Requires setup through support@benchling.com.
  identity: acts as any user resolvable in the IdP
  recommended_for: integrations that must act as many different users
spec_gap: The OpenAPI declares only the two HTTP Basic schemes and the OAuth2 client-credentials flow.
  The OIDC id-token path is documented but absent from both specs, so a client generated purely from the
  contract cannot discover it.
secrets_handling:
  api_key_rotation: Profile settings
  client_secret_rotation: Apps page in the Developer Console
  guidance: Benchling advises storing credentials in a password manager or secrets store and using environment
    variables rather than embedding them in scripts.
warehouse: The Benchling Data Warehouse does not use any of these methods — it is a direct Postgres connection
  with its own credentials. See https://docs.benchling.com/docs/getting-started.
scopes: scopes/benchling-scopes.yml
